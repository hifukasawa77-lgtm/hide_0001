<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITY BUILDER</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#a8d8ea;--panel:#f5f5f5;--border:#d0d0d0;--txt:#333;--txt2:#777;
  --blue:#2979ff;--red:#e53935;--green:#43a047;--amber:#f9a825;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sky);color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;user-select:none}
#app{display:grid;grid-template-rows:46px 1fr;grid-template-columns:186px 1fr;height:100vh}

/* HUD */
#hud{
  grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:0;
  background:#fff;border-bottom:2px solid var(--border);padding:0 14px;
  font-size:.76rem;box-shadow:0 2px 6px rgba(0,0,0,.08);flex-shrink:0;
}
.hud-title{font-size:.94rem;font-weight:800;color:var(--blue);letter-spacing:.5px;margin-right:20px}
.stat{display:flex;align-items:center;gap:4px;margin-right:16px}
.stat-lbl{color:var(--txt2);font-size:.68rem}
.stat-val{font-weight:700;color:var(--txt)}
.stat-val.neg{color:var(--red)}.stat-val.pos{color:var(--green)}
#hud-yr{margin-left:auto;font-weight:700;color:var(--blue);font-size:.76rem}

/* Sidebar */
#sidebar{
  grid-column:1;grid-row:2;background:var(--panel);border-right:1px solid var(--border);
  padding:8px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
}
.tg-label{font-size:.58rem;font-weight:700;letter-spacing:1.5px;color:var(--txt2);text-transform:uppercase;padding:0 3px;margin-bottom:3px}
.tool-btn{
  display:flex;align-items:center;gap:7px;width:100%;
  padding:6px 8px;background:#fff;border:1.5px solid var(--border);
  border-radius:6px;color:var(--txt);font-family:inherit;font-size:.74rem;
  cursor:pointer;text-align:left;transition:all .1s;margin-bottom:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.tool-btn:hover{border-color:#aaa;background:#fafafa}
.tool-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(41,121,255,.3)}
.tool-icon{width:22px;height:22px;border-radius:3px;flex-shrink:0;image-rendering:pixelated}
.tool-cost{margin-left:auto;font-size:.66rem;color:var(--txt2);font-weight:600;white-space:nowrap}
.tool-btn.active .tool-cost{color:rgba(255,255,255,.85)}
.map-type-btn,#btn-newmap{display:inline-block;margin:2px 2px;padding:3px 6px;font-size:.6rem;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--txt2);cursor:pointer;}
.map-type-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.map-type-btn:hover,#btn-newmap:hover{border-color:#aaa;background:#fafafa;color:#333;}
#tips{margin-top:auto;border-top:1px solid var(--border);padding:8px 3px 0;font-size:.6rem;color:var(--txt2);line-height:1.8}

/* Canvas */
#canvas-wrap{grid-column:2;grid-row:2;position:relative;overflow:hidden;cursor:crosshair}
#city-canvas{display:block}

/* Toast */
#toast{
  position:absolute;bottom:62px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,30,.88);color:#fff;border-radius:22px;
  padding:7px 20px;font-size:.78rem;pointer-events:none;
  opacity:0;transition:opacity .3s;white-space:nowrap;
}
#toast.show{opacity:1}
#toast.err{background:rgba(229,57,53,.92)}
#toast.ok{background:rgba(67,160,71,.92)}

/* Event Panel */
#event-panel{
  position:absolute;right:8px;top:118px;
  width:158px;max-height:260px;overflow-y:auto;
  z-index:30;pointer-events:none;
}
.ev-item{
  background:rgba(0,0,20,.84);
  border-left:3px solid var(--ev-color,#aaa);
  color:#eee;font-size:11px;
  padding:4px 7px;margin-bottom:4px;border-radius:3px;
  display:flex;align-items:center;gap:5px;
}

/* Controls */
#ctrl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.ctrl-btn{
  width:32px;height:32px;background:#fff;border:1.5px solid var(--border);
  border-radius:7px;color:var(--txt);font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.ctrl-btn:hover{background:#f0f0f0}
#speed-ctrl{position:absolute;left:12px;bottom:12px;display:flex;gap:4px}
.spd-btn{
  padding:5px 10px;background:#fff;border:1.5px solid var(--border);
  border-radius:7px;color:var(--txt2);font-family:inherit;font-size:.7rem;
  cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.08);transition:all .1s;
}
.spd-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
#minimap-wrap{
  position:absolute;right:12px;top:12px;border:2px solid var(--border);
  background:#fff;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
#minimap{display:block;image-rendering:pixelated}
</style>
</head>
<body>

<div id="canvas-wrap">

<script>
'use strict';

// ════════════════════════════════════════════════════════════
//  Tile type enum
// ════════════════════════════════════════════════════════════
const T = {
  EMPTY:0, ROAD:1, RESIDENTIAL:2, COMMERCIAL:3, INDUSTRIAL:4, PARK:5,
  POWER:6, THERMAL:7, NUCLEAR:8,
  POLICE:9, FIRE:10, HOSPITAL:11, SCHOOL:12,
  STADIUM:13, AIRPORT:14,
  RAIL:15, STATION:16,
};
const GRID=60, BASE=32, SIM_MS=5000;
const TR={GRASS:0,RIVER:1,HIGHLAND:2,FOREST:3,SEA:4};
let currentMapType=0;
const MAP_PRESETS=[
  {seaT:.28,riverT:.37,highT:.64,forestH:.40,forestM:.52,rivers:5,fClusters:14},
  {seaT:.18,riverT:.25,highT:.78,forestH:.48,forestM:.68,rivers:2,fClusters:5},
  {seaT:.20,riverT:.28,highT:.70,forestH:.35,forestM:.42,rivers:4,fClusters:24},
  {seaT:.22,riverT:.30,highT:.52,forestH:.55,forestM:.65,rivers:7,fClusters:8},
  {seaT:.44,riverT:.52,highT:.72,forestH:.58,forestM:.52,rivers:5,fClusters:10},
];

const COSTS={
  road:50,bridge:120,rail:80,station:1000,airport:5000,
  residential:200,commercial:400,industrial:300,park:100,
  police:600,fire:500,hospital:800,school:400,stadium:2000,
  power:1000,thermal:2000,nuclear:10000,
  powerline:40,gas:30,water:25,sewer:20,
  bulldoze:10,
};
const EXPENSE_T={
  [T.ROAD]:2,[T.RAIL]:3,[T.STATION]:40,[T.AIRPORT]:500,
  [T.RESIDENTIAL]:1,[T.COMMERCIAL]:5,[T.INDUSTRIAL]:7,[T.PARK]:1,
  [T.POLICE]:80,[T.FIRE]:60,[T.HOSPITAL]:100,[T.SCHOOL]:50,[T.STADIUM]:200,
  [T.POWER]:28,[T.THERMAL]:60,[T.NUCLEAR]:200,
};
const INCOME_COM=[0,80,150,260];
const INCOME_IND=[0,45,90,160];
const POP_LV=[0,14,32,60];

const UTIL_TOOLS=new Set(['powerline','gas','water','sewer']);
const TOOL_TYPE={
  road:T.ROAD,bridge:T.ROAD,rail:T.RAIL,station:T.STATION,airport:T.AIRPORT,
  residential:T.RESIDENTIAL,commercial:T.COMMERCIAL,industrial:T.INDUSTRIAL,park:T.PARK,
  police:T.POLICE,fire:T.FIRE,hospital:T.HOSPITAL,school:T.SCHOOL,stadium:T.STADIUM,
  power:T.POWER,thermal:T.THERMAL,nuclear:T.NUCLEAR,
};

// ════════════════════════════════════════════════════════════
//  イベントシステム定数
// ════════════════════════════════════════════════════════════
const EV={
  EARTHQUAKE:'earthquake',TSUNAMI:'tsunami',TYPHOON:'typhoon',FIRE:'fire',
  CRIME:'crime',TRAFFIC:'traffic',
  BLACKOUT:'blackout',WATER_BREAK:'water_break',GAS_LEAK:'gas_leak',
  BOOM:'boom',RECESSION:'recession',SUBSIDY:'subsidy',
};
const EV_CHANCE={
  earthquake:0.015,tsunami:0.008,typhoon:0.03,fire:0.05,
  crime:0.06,traffic:0.04,
  blackout:0.025,water_break:0.02,gas_leak:0.015,
  boom:0.05,recession:0.025,subsidy:0.03,
};
const EV_INFO={
  earthquake:{icon:'🌍',label:'地震発生！',color:'#ff8800',severity:3},
  tsunami:   {icon:'🌊',label:'津波警報！',color:'#0066ff',severity:3},
  typhoon:   {icon:'🌀',label:'台風接近！',color:'#8800ff',severity:2},
  fire:      {icon:'🔥',label:'火災発生！',color:'#ff3300',severity:2},
  crime:     {icon:'🚨',label:'犯罪発生！',color:'#ff0055',severity:1},
  traffic:   {icon:'🚗',label:'交通事故！',color:'#ff8800',severity:1},
  blackout:  {icon:'⚡',label:'停電発生！',color:'#ffcc00',severity:2},
  water_break:{icon:'💧',label:'断水発生！',color:'#00aaff',severity:1},
  gas_leak:  {icon:'💨',label:'ガス漏れ！',color:'#88ff00',severity:2},
  boom:      {icon:'📈',label:'好景気到来！',color:'#00ff88',severity:0},
  recession: {icon:'📉',label:'不景気…',  color:'#aaaaaa',severity:1},
  subsidy:   {icon:'🏛️',label:'補助金支給！',color:'#ffd700',severity:0},
};

// ════════════════════════════════════════════════════════════
//  Grid
// ════════════════════════════════════════════════════════════
function mkTile(type,terrain=TR.GRASS){
  return{type,terrain,level:type===0?0:1,powered:false,road:false,rail:false,
    gasAccess:false,waterAccess:false,sewerAccess:false,
    pollution:0,growTimer:0,stadiumOf:null,
    util:{gas:false,water:false,powerline:false,sewer:false}};
}
const grid=Array.from({length:GRID},()=>Array.from({length:GRID},()=>mkTile(T.EMPTY)));

const gs={
  funds:1000000,year:1,population:0,happiness:100,income:0,
  tool:'road',speed:1,frame:0,
  cam:{x:0,y:0},zoom:1.6,
  hover:null,dragging:false,dragPt:null,drawing:false,lastSim:0,
};

// イベント状態変数
let fireTiles=[];        // [{x,y,life,spreadTimer}]
let activeEvents=[];     // [{type,ttl,label,color,icon}]
let shakeFrames=0;
let rainParticles=[];    // [{x,y,len,spd}]
let tsunamiWave=null;    // null | {progress}
let gasLeakTiles=new Set();
let economicMod=1.0;
let economicModTurns=0;
let covCache={};         // simulate()後に更新するカバレッジキャッシュ
let trafficPenaltyTurns=0;

// ════════════════════════════════════════════════════════════
//  Terrain generation
// ════════════════════════════════════════════════════════════
function hash2(x,y,s){let n=Math.sin(x*127.1+y*311.7+s*74.3)*43758.5453;return n-Math.floor(n);}
function octNoise(x,y,oct,seed){
  let v=0,a=1,f=1,mx=0;
  for(let i=0;i<oct;i++){
    const fx=x*f,fy=y*f,ix=Math.floor(fx),iy=Math.floor(fy);
    const tx=fx-ix,ty=fy-iy,ux=tx*tx*(3-2*tx),uy=ty*ty*(3-2*ty);
    const h=hash2(ix,iy,seed+i*13)*(1-ux)*(1-uy)+hash2(ix+1,iy,seed+i*13)*ux*(1-uy)
           +hash2(ix,iy+1,seed+i*13)*(1-ux)*uy+hash2(ix+1,iy+1,seed+i*13)*ux*uy;
    v+=h*a;mx+=a;a*=.5;f*=2;
  }
  return v/mx;
}
function generateTerrain(mapType=0){
  const p=MAP_PRESETS[mapType]||MAP_PRESETS[0];
  const s=Math.random()*1000;
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const h=octNoise(x/GRID*4,y/GRID*4,5,s);
    const m=octNoise(x/GRID*3,y/GRID*3,3,s+500);
    let t;
    if(h<p.seaT) t=TR.SEA;
    else if(h<p.riverT) t=TR.RIVER;
    else if(h>p.highT) t=TR.HIGHLAND;
    else if(m>p.forestM&&h>p.forestH) t=TR.FOREST;
    else t=TR.GRASS;
    grid[y][x].terrain=t;
  }
  for(let ri=0;ri<p.rivers;ri++){
    const starts=[];
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)
      if(grid[y][x].terrain===TR.HIGHLAND)starts.push([x,y]);
    if(!starts.length)break;
    let[x,y]=starts[Math.floor(Math.random()*starts.length)];
    for(let step=0;step<GRID*2;step++){
      grid[y][x].terrain=TR.RIVER;
      const d=[[1,0],[0,1],[0,-1],[1,1],[1,-1]][Math.floor(Math.random()*5)];
      x=Math.max(0,Math.min(GRID-1,x+d[0]));y=Math.max(0,Math.min(GRID-1,y+d[1]));
      if(grid[y][x].terrain===TR.SEA)break;
    }
  }
  for(let fi=0;fi<p.fClusters;fi++){
    const fx=Math.floor(Math.random()*GRID),fy=Math.floor(Math.random()*GRID);
    const sz=2+Math.floor(Math.random()*4);
    for(let dy=-sz;dy<=sz;dy++)for(let dx=-sz;dx<=sz;dx++){
      if(dx*dx+dy*dy>sz*sz)continue;
      const nx=fx+dx,ny=fy+dy;
      if(nx<0||nx>=GRID||ny<0||ny>=GRID)continue;
      if(grid[ny][nx].terrain===TR.GRASS&&Math.random()<.7)grid[ny][nx].terrain=TR.FOREST;
    }
  }
}
function resetGrid(){
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)grid[y][x]=mkTile(T.EMPTY);
  generateTerrain(currentMapType);
  center();
  Object.assign(gs,{funds:1000000,year:1,population:0,happiness:100,income:0,lastSim:0,frame:0});
  updateHUD();
}
generateTerrain(0);

// ════════════════════════════════════════════════════════════
//  Canvas setup
// ════════════════════════════════════════════════════════════
const wrap=document.getElementById('canvas-wrap');
const canvas=document.getElementById('city-canvas');
const ctx=canvas.getContext('2d');
const mm=document.getElementById('minimap');
const mctx=mm.getContext('2d');

const ASSET_BASE='assets/city-builder/';
const CITY_ASSETS={
  grass:'tiles/terrain-grass.webp',
  terrainForest:'tiles/terrain-forest-gpt-image-2.webp',
  terrainHighland:'tiles/terrain-highland-gpt-image-2.webp',
  terrainShoreline:'tiles/terrain-shoreline-gpt-image-2.webp',
  terrainSea:'tiles/terrain-sea.webp',
  roadH:'tiles/road-horizontal.webp',roadV:'tiles/road-vertical.webp',roadX:'tiles/road-intersection.webp',
  railH:'tiles/rail-horizontal.webp',railV:'tiles/rail-vertical.webp',railX:'tiles/rail-intersection.webp',
  station:'tiles/train-station.webp',airport:'tiles/airport-runway.webp',
  res1:'tiles/residential-lv1.webp',res2:'tiles/residential-lv2.webp',res3:'tiles/residential-lv3.webp',resOff:'tiles/residential-unpowered.webp',
  com1:'tiles/commercial-lv1.webp',com2:'tiles/commercial-lv2.webp',com3:'tiles/commercial-lv3.webp',comOff:'tiles/commercial-unpowered.webp',
  ind1:'tiles/industrial-lv1.webp',ind2:'tiles/industrial-lv2.webp',ind3:'tiles/industrial-lv3.webp',indOff:'tiles/industrial-unpowered.webp',
  park:'tiles/park.webp',power:'tiles/power-plant.webp',thermal:'tiles/power-plant.webp',nuclear:'tiles/nuclear-plant.webp',
  police:'tiles/police-station.webp',fire:'tiles/fire-station.webp',hospital:'tiles/hospital-service.webp',
  school:'tiles/school-community.webp',stadium:'tiles/citizen-plaza.webp'
};
const assetImgs={};
Object.entries(CITY_ASSETS).forEach(([key,src])=>{
  const img=new Image();
  img.decoding='async';
  img.src=ASSET_BASE+src;
  assetImgs[key]=img;
});
function readyImg(key){const img=assetImgs[key];return img&&img.complete&&img.naturalWidth>0;}
function drawAsset(c,key,s){if(!readyImg(key))return false;c.drawImage(assetImgs[key],0,0,s,s);return true;}
function drawAssetRotated(c,key,s,angle){
  if(!readyImg(key))return false;
  c.save();
  c.beginPath();c.rect(0,0,s,s);c.clip();
  c.translate(s/2,s/2);c.rotate(angle);
  const d=s*Math.SQRT2;
  c.drawImage(assetImgs[key],-d/2,-d/2,d,d);
  c.restore();
  return true;
}

function ts(){return BASE*gs.zoom;}
function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;if(gs.cam.x===0&&gs.cam.y===0)center();}
function center(){gs.cam.x=(canvas.width-GRID*ts())/2;gs.cam.y=(canvas.height-GRID*ts())/2;}
resize();window.addEventListener('resize',resize);

// ════════════════════════════════════════════════════════════
//  Drawing helpers
// ════════════════════════════════════════════════════════════
function drand(x,y,n){return Math.abs(Math.sin(x*127.1+y*311.7+n*74.3))%1;}

function grass(c,s){
  c.fillStyle='#7ec850';c.fillRect(0,0,s,s);
  c.fillStyle='rgba(0,0,0,.04)';c.fillRect(0,0,s,s*.5);
  c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=.5;c.strokeRect(.5,.5,s-1,s-1);
}
function river(c,s){
  c.fillStyle='#1e6fa8';c.fillRect(0,0,s,s);
  const ph=(gs.frame*.04)%(Math.PI*2);
  c.strokeStyle='rgba(100,180,255,.4)';c.lineWidth=1;
  for(let i=0;i<3;i++){const wy=s*.2+i*s*.25;c.beginPath();for(let px=0;px<=s;px+=3){const py=wy+Math.sin(ph+px*.25+i*1.1)*1.5;px?c.lineTo(px,py):c.moveTo(px,py);}c.stroke();}
}
function highland(c,s){
  if(drawAsset(c,'terrainHighland',s))return;
  c.fillStyle='#7a6244';c.fillRect(0,0,s,s);
  c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=.5;
  c.beginPath();c.moveTo(s*.1,s*.6);c.lineTo(s*.4,s*.35);c.lineTo(s*.65,s*.45);c.lineTo(s*.9,s*.3);c.stroke();
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(s*.38,s*.28,s*.1,s*.05,-.3,0,Math.PI*2);c.fill();
}
function forest(c,s){
  if(drawAsset(c,'terrainForest',s))return;
  c.fillStyle='#3a6e25';c.fillRect(0,0,s,s);
  [[s*.2,s*.55],[s*.55,s*.4],[s*.75,s*.65]].forEach(([tx,ty])=>{
    c.fillStyle='#2e5c1d';c.beginPath();c.arc(tx,ty,s*.16,0,Math.PI*2);c.fill();
    c.fillStyle='#4a8c32';c.beginPath();c.arc(tx-s*.03,ty-s*.05,s*.12,0,Math.PI*2);c.fill();
  });
}
function sea(c,s,tx,ty){
  if(touchesLand(tx,ty)&&drawAssetRotated(c,'terrainShoreline',s,coastAngle(tx,ty)))return;
  if(drawAsset(c,'terrainSea',s))return;
  c.fillStyle='#0e4d7a';c.fillRect(0,0,s,s);
  const ph=(gs.frame*.025)%(Math.PI*2);
  c.strokeStyle='rgba(50,150,220,.35)';c.lineWidth=1.2;
  for(let i=0;i<2;i++){const wy=s*.3+i*s*.35;c.beginPath();for(let px=0;px<=s;px+=4){const py=wy+Math.sin(ph+px*.2+i*.9)*2;px?c.lineTo(px,py):c.moveTo(px,py);}c.stroke();}
}
function drawStar(c,cx,cy,n,R,r){
  c.beginPath();
  for(let i=0;i<n*2;i++){const rad=i%2?r:R,a=(i*Math.PI/n)-Math.PI/2;i?c.lineTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a)):c.moveTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a));}
  c.closePath();c.fill();
}
function hasAdj(tx,ty,check){
  return[[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy])=>{
    const nx=tx+dx,ny=ty+dy;
    return nx>=0&&ny>=0&&nx<GRID&&ny<GRID&&check(grid[ny][nx]);
  });
}
function isLandTerrain(tr){return tr!==TR.SEA&&tr!==TR.RIVER;}
function coastAngle(tx,ty){
  let vx=0,vy=0;
  [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
    const nx=tx+dx,ny=ty+dy;
    if(nx>=0&&ny>=0&&nx<GRID&&ny<GRID&&isLandTerrain(grid[ny][nx].terrain)){
      vx+=dx;vy+=dy;
    }
  });
  if(vx===0&&vy===0)return 0;
  const base=Math.atan2(-1,1);
  return Math.atan2(vy,vx)-base;
}
function touchesLand(tx,ty){
  return hasAdj(tx,ty,t=>isLandTerrain(t.terrain));
}

// ════════════════════════════════════════════════════════════
//  Tile draw functions
// ════════════════════════════════════════════════════════════
function drawEmpty(c,s,tx,ty){
  const tr=grid[ty][tx].terrain;
  if(tr===TR.RIVER){river(c,s);return;}
  if(tr===TR.HIGHLAND){highland(c,s);return;}
  if(tr===TR.FOREST){forest(c,s);return;}
  if(tr===TR.SEA){sea(c,s,tx,ty);return;}
  if(drawAsset(c,'grass',s))return;
  grass(c,s);
}

function drawBridge(c,s,tx,ty){
  const tr=grid[ty][tx].terrain;
  if(tr===TR.RIVER)river(c,s);else sea(c,s,tx,ty);
  const L=tx>0&&grid[ty][tx-1].type===T.ROAD,R=tx<GRID-1&&grid[ty][tx+1].type===T.ROAD;
  const U=ty>0&&grid[ty-1][tx].type===T.ROAD,D=ty<GRID-1&&grid[ty+1][tx].type===T.ROAD;
  const horiz=(L||R)||!(U||D);
  const mid=s/2,hw=s*.34;
  // 橋桁（デッキ）
  c.fillStyle='#a8a29e';
  if(horiz)c.fillRect(0,mid-hw,s,hw*2);else c.fillRect(mid-hw,0,hw*2,s);
  c.fillStyle='#78716c';
  if(horiz){c.fillRect(0,mid-hw,s,s*.05);c.fillRect(0,mid+hw-s*.05,s,s*.05);}
  else     {c.fillRect(mid-hw,0,s*.05,s);c.fillRect(mid+hw-s*.05,0,s*.05,s);}
  // 支柱（橋脚）
  c.fillStyle='#57534e';
  if(horiz){c.fillRect(s*.22,mid-hw-s*.06,s*.06,s*.06);c.fillRect(s*.72,mid-hw-s*.06,s*.06,s*.06);
            c.fillRect(s*.22,mid+hw,s*.06,s*.06);c.fillRect(s*.72,mid+hw,s*.06,s*.06);}
  else     {c.fillRect(mid-hw-s*.06,s*.22,s*.06,s*.06);c.fillRect(mid-hw-s*.06,s*.72,s*.06,s*.06);
            c.fillRect(mid+hw,s*.22,s*.06,s*.06);c.fillRect(mid+hw,s*.72,s*.06,s*.06);}
  // 中央線
  c.strokeStyle='#fff';c.lineWidth=Math.max(.8,s*.025);c.setLineDash([s*.12,s*.1]);
  c.beginPath();
  if(horiz){c.moveTo(0,mid);c.lineTo(s,mid);}else{c.moveTo(mid,0);c.lineTo(mid,s);}
  c.stroke();c.setLineDash([]);
}
function drawRoad(c,s,tx,ty){
  if(grid[ty][tx].terrain===TR.RIVER||grid[ty][tx].terrain===TR.SEA){drawBridge(c,s,tx,ty);return;}
  const L=tx>0&&grid[ty][tx-1].type===T.ROAD,R=tx<GRID-1&&grid[ty][tx+1].type===T.ROAD;
  const U=ty>0&&grid[ty-1][tx].type===T.ROAD,D=ty<GRID-1&&grid[ty+1][tx].type===T.ROAD;
  const assetKey=(L||R)&&(U||D)?'roadX':((U||D)&&!(L||R)?'roadV':'roadH');
  if(drawAsset(c,assetKey,s))return;
  grass(c,s);
  const mid=s/2,hw=s*.3;
  c.fillStyle='#888';
  c.fillRect(mid-hw,mid-hw,hw*2,hw*2);
  if(L||(!R&&!U&&!D))c.fillRect(0,mid-hw,mid-hw,hw*2);
  if(R||(!L&&!U&&!D))c.fillRect(mid+hw,mid-hw,mid-hw,hw*2);
  if(U||(!L&&!R&&!D))c.fillRect(mid-hw,0,hw*2,mid-hw);
  if(D||(!L&&!R&&!U))c.fillRect(mid-hw,mid+hw,hw*2,mid-hw);
  c.strokeStyle='#fff';c.lineWidth=Math.max(.8,s*.025);c.setLineDash([s*.12,s*.1]);
  c.beginPath();
  if(L||R||(!U&&!D)){c.moveTo(L?0:mid,mid);c.lineTo(R?s:mid,mid);}
  if(U||D){c.moveTo(mid,U?0:mid);c.lineTo(mid,D?s:mid);}
  if(!L&&!R&&!U&&!D){c.moveTo(0,mid);c.lineTo(s,mid);c.moveTo(mid,0);c.lineTo(mid,s);}
  c.stroke();c.setLineDash([]);
}

function drawRail(c,s,tx,ty){
  const L=tx>0&&grid[ty][tx-1].type===T.RAIL,R=tx<GRID-1&&grid[ty][tx+1].type===T.RAIL;
  const U=ty>0&&grid[ty-1][tx].type===T.RAIL,D=ty<GRID-1&&grid[ty+1][tx].type===T.RAIL;
  const assetKey=(L||R)&&(U||D)?'railX':((U||D)&&!(L||R)?'railV':'railH');
  if(drawAsset(c,assetKey,s))return;
  c.fillStyle='#c8a96e';c.fillRect(0,0,s,s);
  c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=.5;c.strokeRect(.5,.5,s-1,s-1);
  const hasH=L||R||(!U&&!D),hasV=U||D||(!L&&!R);
  const mid=s/2,rw=s*.08;
  // Rail tracks
  c.fillStyle='#aaa';
  if(hasH){
    const y1=mid-s*.2,y2=mid+s*.2-rw;
    c.fillRect(L?0:mid-rw,y1,L&&R?s:s*.5+rw,rw);
    c.fillRect(L?0:mid-rw,y2,L&&R?s:s*.5+rw,rw);
    // Ties
    c.fillStyle='#8b6914';
    for(let i=0;i<5;i++){const tx2=(i+.5)*s*.2;c.fillRect(tx2-s*.035,y1-s*.02,s*.07,y2-y1+rw+s*.04);}
  }
  if(hasV){
    const x1=mid-s*.2,x2=mid+s*.2-rw;
    c.fillStyle='#aaa';
    c.fillRect(x1,U?0:mid-rw,rw,U&&D?s:s*.5+rw);
    c.fillRect(x2,U?0:mid-rw,rw,U&&D?s:s*.5+rw);
    c.fillStyle='#8b6914';
    for(let i=0;i<5;i++){const ty2=(i+.5)*s*.2;c.fillRect(x1-s*.02,ty2-s*.035,x2-x1+rw+s*.04,s*.07);}
  }
}

function drawStation(c,s){
  if(drawAsset(c,'station',s))return;
  grass(c,s);
  // Platform
  c.fillStyle='#d0d0d0';c.fillRect(s*.08,s*.35,s*.84,s*.55);
  // Building
  c.fillStyle='#e8e8e0';c.fillRect(s*.12,s*.14,s*.76,s*.28);
  c.fillStyle='#c0b040';c.fillRect(s*.12,s*.14,s*.76,s*.07);
  // Roof cover
  c.fillStyle='#4a4a4a';c.fillRect(s*.04,s*.32,s*.92,s*.06);
  // Windows
  c.fillStyle='#aad0f0';
  [.18,.38,.58,.78].forEach(x=>c.fillRect(s*x,s*.19,s*.14,s*.12));
  // Sign
  c.fillStyle='#2979ff';c.fillRect(s*.3,s*.38,s*.4,s*.1);
  c.fillStyle='#fff';c.font=`bold ${s*.08}px sans-serif`;c.textAlign='center';c.fillText('駅',s*.5,s*.465);
}

function drawAirport(c,s){
  if(drawAsset(c,'airport',s))return;
  grass(c,s);
  // Runway
  c.fillStyle='#555';c.fillRect(0,s*.44,s,s*.12);
  c.fillStyle='#fff';c.setLineDash([s*.06,s*.04]);
  c.beginPath();c.moveTo(0,s*.5);c.lineTo(s,s*.5);
  c.strokeStyle='#fff';c.lineWidth=s*.02;c.stroke();c.setLineDash([]);
  // Terminal
  c.fillStyle='#d8dde4';c.fillRect(s*.08,s*.06,s*.84,s*.32);
  c.fillStyle='#b0b8c4';c.fillRect(s*.08,s*.06,s*.84,s*.07);
  // Windows strip
  c.fillStyle='#aad0f0';
  for(let i=0;i<7;i++)c.fillRect(s*(.12+i*.12),s*.1,s*.08,s*.16);
  // Plane
  c.fillStyle='#e8e8e8';
  c.beginPath();
  c.ellipse(s*.5,s*.5,s*.12,s*.04,0,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(s*.42,s*.46);c.lineTo(s*.38,s*.38);c.lineTo(s*.48,s*.44);c.closePath();c.fill();
  c.beginPath();c.moveTo(s*.58,s*.46);c.lineTo(s*.62,s*.38);c.lineTo(s*.52,s*.44);c.closePath();c.fill();
}

function drawResidential(c,s,lv,powered){
  if(drawAsset(c,powered?`res${lv||1}`:'resOff',s))return;
  lv=lv||1;grass(c,s);
  if(lv===1){
    const bw=s*.56,bh=s*.46,bx=(s-bw)/2+2,by=s-bh-s*.07+2;
    c.fillStyle='rgba(0,0,0,.1)';c.fillRect(bx,by,bw,bh);
    c.fillStyle='#dde8f5';c.fillRect(bx-2,by-2,bw,bh);
    c.fillStyle=powered?'#c0392b':'#aaa';
    c.beginPath();c.moveTo(bx-2-s*.07,by-2);c.lineTo(bx-2+bw/2,by-2-bh*.45);c.lineTo(bx-2+bw+s*.07,by-2);c.closePath();c.fill();
    c.fillStyle='#7b5e3a';c.fillRect(bx-2+bw*.5-bw*.1,by-2+bh*.62,bw*.2,bh*.38);
    c.fillStyle=powered?'#fffde7':'#aaa';
    c.fillRect(bx-2+bw*.14,by-2+bh*.26,bw*.17,bh*.2);c.fillRect(bx-2+bw*.62,by-2+bh*.26,bw*.17,bh*.2);
  }else if(lv===2){
    const bw=s*.62,bh=s*.68,bx=(s-bw)/2+2,by=s-bh-s*.05+2;
    c.fillStyle='rgba(0,0,0,.1)';c.fillRect(bx,by,bw,bh);
    c.fillStyle='#b0c4de';c.fillRect(bx-2,by-2,bw,bh);
    c.fillStyle=powered?'#2980b9':'#999';c.fillRect(bx-2,by-2,bw,bh*.07);
    for(let r=0;r<3;r++)for(let cl=0;cl<3;cl++){
      c.fillStyle=powered?'#fffde7':'#ccc';
      c.fillRect(bx-2+bw*(.1+cl*.3),by-2+bh*(.16+r*.28),bw*.18,bh*.14);
    }
  }else{
    const bw=s*.52,bh=s*.88,bx=(s-bw)/2+2,by=s-bh-s*.04+2;
    c.fillStyle='rgba(0,0,0,.12)';c.fillRect(bx,by,bw,bh);
    const g=c.createLinearGradient(bx-2,0,bx-2+bw,0);
    g.addColorStop(0,'#7da6c8');g.addColorStop(.45,'#a8cadf');g.addColorStop(1,'#7da6c8');
    c.fillStyle=g;c.fillRect(bx-2,by-2,bw,bh);
    for(let r=0;r<9;r++)for(let cl=0;cl<3;cl++){
      const lit=powered&&drand(cl+5,r+5,lv)>.3;
      c.fillStyle=lit?'#fffde7':'rgba(255,255,255,.18)';
      c.fillRect(bx-2+bw*(.08+cl*.31),by-2+bh*(.07+r*.1),bw*.2,bh*.065);
    }
    c.fillStyle=powered?'#2980b9':'#999';c.fillRect(bx-2+bw*.3,by-2-s*.08,bw*.4,s*.08);c.fillRect(bx-2+bw*.44,by-2-s*.14,bw*.12,s*.07);
  }
}

function drawCommercial(c,s,lv,powered){
  if(drawAsset(c,powered?`com${lv||1}`:'comOff',s))return;
  lv=lv||1;grass(c,s);
  if(lv===1){
    const bw=s*.72,bh=s*.52,bx=(s-bw)/2+2,by=s-bh-s*.07+2;
    c.fillStyle='rgba(0,0,0,.1)';c.fillRect(bx,by,bw,bh);
    c.fillStyle='#f5e6d0';c.fillRect(bx-2,by-2,bw,bh);
    c.fillStyle=powered?'#e07b39':'#bbb';c.fillRect(bx-2-s*.03,by-2+bh*.28,bw+s*.06,bh*.18);
    c.fillStyle=powered?'#c0392b':'#aaa';c.fillRect(bx-2+s*.06,by-2+s*.04,bw-s*.12,bh*.22);
    c.fillStyle='#7b5e3a';c.fillRect(bx-2+bw*.5-bw*.1,by-2+bh*.62,bw*.2,bh*.38);
    c.fillStyle=powered?'#ddeeff':'#ccc';
    c.fillRect(bx-2+bw*.06,by-2+bh*.5,bw*.25,bh*.25);c.fillRect(bx-2+bw*.68,by-2+bh*.5,bw*.25,bh*.25);
  }else if(lv===2){
    const bw=s*.68,bh=s*.74,bx=(s-bw)/2+2,by=s-bh-s*.05+2;
    c.fillStyle='rgba(0,0,0,.1)';c.fillRect(bx,by,bw,bh);
    c.fillStyle='#e8d5b8';c.fillRect(bx-2,by-2,bw,bh);
    c.fillStyle=powered?'#d4660a':'#aaa';c.fillRect(bx-2,by-2,bw,bh*.08);
    for(let r=0;r<4;r++)for(let cl=0;cl<3;cl++){
      c.fillStyle=powered?(drand(cl+8,r+8,lv)>.35?'#ddeeff':'#b8d0e8'):'#ccc';
      c.fillRect(bx-2+bw*(.1+cl*.3),by-2+bh*(.12+r*.22),bw*.18,bh*.14);
    }
    c.fillStyle=powered?'#e07b39':'#bbb';c.fillRect(bx-2+bw*.1,by-2+bh*.88,bw*.8,bh*.1);
  }else{
    const bw=s*.62,bh=s*.9,bx=(s-bw)/2+2,by=s-bh-s*.03+2;
    c.fillStyle='rgba(0,0,0,.12)';c.fillRect(bx,by,bw,bh);
    const g=c.createLinearGradient(bx-2,0,bx-2+bw,0);
    g.addColorStop(0,'#a8c4d0');g.addColorStop(.5,'#c8dfe8');g.addColorStop(1,'#a8c4d0');
    c.fillStyle=g;c.fillRect(bx-2,by-2,bw,bh);
    for(let r=0;r<11;r++)for(let cl=0;cl<3;cl++){
      const lit=powered&&drand(cl+15,r+15,lv)>.25;
      c.fillStyle=lit?'#fff8e1':'rgba(255,255,255,.2)';
      c.fillRect(bx-2+bw*(.07+cl*.31),by-2+bh*(.05+r*.088),bw*.21,bh*.055);
    }
    c.fillStyle=powered?'#d35400':'#999';
    c.beginPath();c.moveTo(bx-2+bw*.5,by-2-s*.22);c.lineTo(bx-2+bw*.3,by-2);c.lineTo(bx-2+bw*.7,by-2);c.closePath();c.fill();
  }
}

function drawIndustrial(c,s,lv,powered){
  if(drawAsset(c,powered?`ind${lv||1}`:'indOff',s))return;
  lv=lv||1;grass(c,s);
  const bw=s*(.54+lv*.07),bh=s*(.44+lv*.09),bx=(s-bw)/2+2,by=s-bh-s*.06+2;
  c.fillStyle='rgba(0,0,0,.1)';c.fillRect(bx,by,bw,bh);
  c.fillStyle=powered?'#c0c0c0':'#999';c.fillRect(bx-2,by-2,bw,bh);
  c.fillStyle=powered?'#e0e0e0':'#aaa';c.fillRect(bx-2,by-2,bw,bh*.09);
  const nch=lv+1;
  for(let i=0;i<nch;i++){
    const cx2=bx-2+bw*(.18+i*(.64/Math.max(1,nch-1)));
    const cw2=s*.07,ch2=bh*(.38+drand(i,2,lv)*.18);
    c.fillStyle='#888';c.fillRect(cx2-cw2/2,by-2-ch2,cw2,ch2);
    c.fillStyle='#cc3300';c.fillRect(cx2-cw2/2,by-2-ch2,cw2,ch2*.12);
    if(powered)for(let j=0;j<4;j++){c.fillStyle=`rgba(150,150,150,${.26-j*.06})`;const r=s*(.05+j*.03);c.beginPath();c.arc(cx2,by-2-ch2-r*1.8-j*r*.9,r,0,Math.PI*2);c.fill();}
  }
  c.fillStyle=powered?'#fffde7':'#888';
  for(let i=0;i<lv+1;i++)c.fillRect(bx-2+bw*(.14+i*(.6/Math.max(1,lv))),by-2+bh*.35,s*.06,bh*.3);
}

function drawPark(c,s){
  if(drawAsset(c,'park',s))return;
  c.fillStyle='#5cb85c';c.fillRect(0,0,s,s);
  c.fillStyle='#6cc96c';c.fillRect(0,0,s,s*.5);

function drawStadiums(){
  // スタジアムは2x2マス分の合成スプライトとして起点マスから描画する
  const size=ts(),big=size*2;
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const t=grid[y][x];
    if(t.type!==T.STADIUM||t.stadiumOf)continue;
    const px=gs.cam.x+x*size,py=gs.cam.y+y*size;
    if(px+big<0||py+big<0||px>canvas.width||py>canvas.height)continue;
    ctx.save();ctx.translate(px,py);
    drawStadium(ctx,big);
    ctx.restore();
  }
}
function drawStadium(c,s){
  if(drawAsset(c,'stadium',s))return;
  grass(c,s);
  // Outer stands
  c.fillStyle='rgba(0,0,0,.1)';c.beginPath();c.ellipse(s*.5+2,s*.5+3,s*.44,s*.36,0,0,Math.PI*2);c.fill();
  c.fillStyle='#b0bec5';c.beginPath();c.ellipse(s*.5,s*.5,s*.44,s*.36,0,0,Math.PI*2);c.fill();
  // Bleachers (colored rows)
  ['#e53935','#2196f3','#4caf50','#ff9800'].forEach((col,i)=>{
    c.fillStyle=col;
    c.beginPath();c.ellipse(s*.5,s*.5,s*(.44-i*.06),s*(.36-i*.05),0,0,Math.PI*2);c.fill();
  });
  // Field
  c.fillStyle='#4caf50';c.beginPath();c.ellipse(s*.5,s*.5,s*.2,s*.16,0,0,Math.PI*2);c.fill();
  // Field markings
  c.strokeStyle='#fff';c.lineWidth=s*.012;
  c.beginPath();c.ellipse(s*.5,s*.5,s*.2,s*.16,0,0,Math.PI*2);c.stroke();
  c.beginPath();c.moveTo(s*.5,s*.34);c.lineTo(s*.5,s*.66);c.stroke();
  c.beginPath();c.arc(s*.5,s*.5,s*.06,0,Math.PI*2);c.stroke();
  // Roof accent
  c.strokeStyle='#78909c';c.lineWidth=s*.025;
  c.beginPath();c.ellipse(s*.5,s*.5,s*.44,s*.36,0,0,Math.PI*2);c.stroke();
}

// ─── Utility overlay ──────────────────────────────────────────
function drawUtilOverlay(c,s,tile,tx,ty){
  const u=tile.util;
  // Powerline: pole + wires
  if(u.powerline){
    const L=tx>0&&grid[ty][tx-1].util.powerline;
    const R=tx<GRID-1&&grid[ty][tx+1].util.powerline;
    const U=ty>0&&grid[ty-1][tx].util.powerline;
    const D=ty<GRID-1&&grid[ty+1][tx].util.powerline;
    const mid=s/2;
    c.fillStyle='#888';c.fillRect(mid-s*.025,0,s*.05,s);// pole
    if(L||(!R&&!U&&!D))c.fillRect(0,mid-s*.025,mid,s*.05);
    if(R||(!L&&!U&&!D))c.fillRect(mid,mid-s*.025,mid,s*.05);
    c.fillStyle='#666';c.fillRect(s*.2,mid-s*.04,s*.6,s*.025);c.fillRect(s*.2,mid+s*.015,s*.6,s*.025);
    c.fillStyle='#f9c846';c.beginPath();c.arc(mid,s*.05,s*.03,0,Math.PI*2);c.fill();
  }
  // Pipe utilities
  const pipes=[
    {key:'gas',   col:'#ff8c00',y:.82},
    {key:'water', col:'#2196f3',y:.88},
    {key:'sewer', col:'#546e7a',y:.94},
  ];
  pipes.forEach(({key,col,y})=>{
    if(!u[key]) return;
    const L=tx>0&&grid[ty][tx-1].util[key];
    const R=tx<GRID-1&&grid[ty][tx+1].util[key];
    const U2=ty>0&&grid[ty-1][tx].util[key];
    const D2=ty<GRID-1&&grid[ty+1][tx].util[key];
    const pw=s*.08,ph=s*.06,mid=s/2;
    c.fillStyle=col;
    c.fillRect(L?0:mid-pw/2,s*y-ph/2,L&&R?s:pw,ph);// horiz
    if(!L&&!R)c.fillRect(mid-pw/2,s*y-ph/2,pw,ph);
    if(U2)c.fillRect(mid-pw/2,0,pw,s*y-ph/2);
    if(D2)c.fillRect(mid-pw/2,s*y+ph/2,pw,s-s*y-ph/2);
    c.beginPath();c.arc(mid,s*y,ph*.6,0,Math.PI*2);c.fill();
  });
}

// ════════════════════════════════════════════════════════════
//  Minimap
// ════════════════════════════════════════════════════════════
const MM_COL={
  [T.EMPTY]:'#7ec850',[T.ROAD]:'#888',[T.RAIL]:'#c8a96e',[T.STATION]:'#7c4dff',[T.AIRPORT]:'#546e7a',
  [T.RESIDENTIAL]:'#5b9bd5',[T.COMMERCIAL]:'#e07b39',[T.INDUSTRIAL]:'#9b9b9b',[T.PARK]:'#5aab5a',
  [T.POWER]:'#f9c846',[T.THERMAL]:'#ff8f00',[T.NUCLEAR]:'#00c853',
  [T.POLICE]:'#1a237e',[T.FIRE]:'#c62828',[T.HOSPITAL]:'#e0e0e0',[T.SCHOOL]:'#fff9c4',
  [T.STADIUM]:'#4caf50',
};
const TR_MINI_COL={[TR.GRASS]:'#7ec850',[TR.RIVER]:'#1e6fa8',[TR.HIGHLAND]:'#7a6244',[TR.FOREST]:'#3a6e25',[TR.SEA]:'#0e4d7a'};
function drawMinimap(){
  const cell=mm.width/GRID;
  mctx.fillStyle='#7ec850';mctx.fillRect(0,0,mm.width,mm.height);
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const t=grid[y][x];
    if(t.type===T.EMPTY){
      if(t.terrain!==TR.GRASS){mctx.fillStyle=TR_MINI_COL[t.terrain]||'#7ec850';mctx.fillRect(x*cell,y*cell,cell+.5,cell+.5);}
      continue;
    }
    mctx.fillStyle=MM_COL[t.type]||'#ccc';
    mctx.fillRect(x*cell,y*cell,cell+.5,cell+.5);
  }
  const vx=(-gs.cam.x/ts())*cell,vy=(-gs.cam.y/ts())*cell;
  const vw=(canvas.width/ts())*cell,vh=(canvas.height/ts())*cell;
  mctx.strokeStyle='rgba(41,121,255,.9)';mctx.lineWidth=1;
  mctx.strokeRect(vx,vy,vw,vh);
}

// ════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#a8d8ea';ctx.fillRect(0,0,canvas.width,canvas.height);
  // 地震シェイク
  if(shakeFrames>0){
    ctx.save();
    ctx.translate(Math.sin(shakeFrames*1.4)*3,Math.cos(shakeFrames*1.1)*2);
  }
  const size=ts();
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const px=gs.cam.x+x*size,py=gs.cam.y+y*size;
    if(px+size<0||py+size<0||px>canvas.width||py>canvas.height)continue;
    const t=grid[y][x];
    ctx.save();ctx.translate(px,py);
    switch(t.type){
      case T.EMPTY:       drawEmpty(ctx,size,x,y);break;
      case T.ROAD:        drawRoad(ctx,size,x,y);break;
      case T.RAIL:        drawRail(ctx,size,x,y);break;
      case T.STATION:     drawStation(ctx,size);break;
      case T.AIRPORT:     drawAirport(ctx,size);break;
      case T.RESIDENTIAL: drawResidential(ctx,size,t.level,t.powered);break;
      case T.COMMERCIAL:  drawCommercial(ctx,size,t.level,t.powered);break;
      case T.INDUSTRIAL:  drawIndustrial(ctx,size,t.level,t.powered);break;
      case T.PARK:        drawPark(ctx,size);break;
      case T.POWER:       drawPower(ctx,size);break;
      case T.THERMAL:     drawThermal(ctx,size);break;
      case T.NUCLEAR:     drawNuclear(ctx,size);break;
      case T.POLICE:      drawPolice(ctx,size);break;
      case T.FIRE:        drawFire(ctx,size);break;
      case T.HOSPITAL:    drawHospital(ctx,size);break;
      case T.SCHOOL:      drawSchool(ctx,size);break;
      case T.STADIUM:     drawEmpty(ctx,size,x,y);break; // 本体は2x2の合成スプライトで別途描画
    }
    if(t.util.gas||t.util.water||t.util.powerline||t.util.sewer)drawUtilOverlay(ctx,size,t,x,y);
    ctx.restore();
  }
  drawStadiums();
  // Hover
  if(gs.hover&&gs.hover.x>=0&&gs.hover.y>=0&&gs.hover.x<GRID&&gs.hover.y<GRID){
    const {x,y}=gs.hover;
    const px=gs.cam.x+x*size,py=gs.cam.y+y*size;
    const hoverSize=gs.tool==='stadium'?size*2:size;
    ctx.strokeStyle='rgba(41,121,255,.85)';ctx.lineWidth=2.5;
    ctx.setLineDash([4,3]);ctx.strokeRect(px+1.5,py+1.5,hoverSize-3,hoverSize-3);ctx.setLineDash([]);
  }
  // イベントエフェクト描画
  drawFireEffects();
  if(rainParticles.length) drawRainOverlay();
  if(tsunamiWave) drawTsunamiWave();
  if(gasLeakTiles.size) drawGasLeakOverlay();
  // シェイク解除
  if(shakeFrames>0){ ctx.restore(); shakeFrames--; }
  drawMinimap();
}

function drawFireEffects(){
  if(fireTiles.length===0)return;
  const size=ts();
  ctx.save();
  for(const f of fireTiles){
    const px=gs.cam.x+f.x*size,py=gs.cam.y+f.y*size;
    if(px+size<0||py+size<0||px>canvas.width||py>canvas.height)continue;
    const t=gs.frame;
    // 複数の炎三角形を描く
    for(let k=0;k<5;k++){
      const ox=px+size*(0.2+k*0.13);
      const fw=size*0.14;
      const fh=size*(0.45+0.18*Math.sin(t*0.2+k*1.3));
      const a=0.55+0.3*Math.sin(t*0.3+k);
      ctx.globalAlpha=a;
      // 外炎（赤）
      ctx.fillStyle='#ff4400';
      ctx.beginPath();
      ctx.moveTo(ox,py+size*0.85);
      ctx.lineTo(ox-fw,py+size*0.85);
      ctx.lineTo(ox-fw*0.5+fw*0.3*Math.sin(t*0.4+k),py+size*0.85-fh);
      ctx.closePath();ctx.fill();
      // 内炎（黄）
      ctx.fillStyle='#ffcc00';
      ctx.beginPath();
      ctx.moveTo(ox,py+size*0.85);
      ctx.lineTo(ox-fw*0.5,py+size*0.85);
      ctx.lineTo(ox-fw*0.25+fw*0.15*Math.sin(t*0.5+k),py+size*0.85-fh*0.6);
      ctx.closePath();ctx.fill();
    }
    // 黒煙
    ctx.globalAlpha=0.22;
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(px+size*0.5,py+size*0.2,size*0.3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawRainOverlay(){
  ctx.save();ctx.strokeStyle='rgba(200,230,255,0.5)';ctx.lineWidth=1;
  for(const p of rainParticles){
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-4,p.y+p.len);ctx.stroke();
  }
  ctx.restore();
}

function drawTsunamiWave(){
  if(!tsunamiWave)return;
  const prog=tsunamiWave.progress;
  const W=canvas.width,H=canvas.height;
  ctx.save();
  // 波帯（上から流れてくる青い半透明帯）
  ctx.fillStyle='rgba(0,80,220,0.22)';
  ctx.fillRect(0,Math.max(0,prog-80),W,Math.min(100,prog+80));
  // 波頭ライン
  ctx.strokeStyle='rgba(100,180,255,0.7)';ctx.lineWidth=3;
  ctx.beginPath();
  for(let px=0;px<=W;px+=8){
    const wy=prog+Math.sin(px*0.05+gs.frame*0.08)*6;
    if(px===0)ctx.moveTo(px,wy);else ctx.lineTo(px,wy);
  }
  ctx.stroke();
  ctx.restore();
}

function drawGasLeakOverlay(){
  ctx.save();
  const size=ts();
  ctx.globalAlpha=0.18+0.06*Math.sin(gs.frame*0.1);
  ctx.fillStyle='#88ff44';
  for(const key of gasLeakTiles){
    const [gx,gy]=key.split(',').map(Number);
    const px=gs.cam.x+gx*size,py=gs.cam.y+gy*size;
    if(px+size<0||py+size<0||px>canvas.width||py>canvas.height)continue;
    ctx.beginPath();ctx.arc(px+size/2,py+size/2,size*0.55,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
}

function updateFireSystem(){
  for(let i=fireTiles.length-1;i>=0;i--){
    const f=fireTiles[i];
    f.life--;f.spreadTimer++;
    // 消防署カバレッジ内なら消火速度2倍
    if(covCache.fire?.[f.y]?.[f.x]) f.life-=1;
    if(f.life<=0){
      if(grid[f.y][f.x].type!==T.EMPTY){
        grid[f.y][f.x].type=T.EMPTY;grid[f.y][f.x].level=0;
        showToast('🔥 建物が焼失しました','err');
      }
      fireTiles.splice(i,1);continue;
    }
    // 延焼（spreadTimer>90 かつ最大12個）
    if(f.spreadTimer>90&&fireTiles.length<12){
      const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
      for(const [dx,dy] of dirs){
        const nx=f.x+dx,ny=f.y+dy;
        if(nx<0||ny<0||nx>=GRID||ny>=GRID)continue;
        const nt=grid[ny][nx];
        if([T.RESIDENTIAL,T.COMMERCIAL,T.INDUSTRIAL].includes(nt.type)
           &&!fireTiles.find(ft=>ft.x===nx&&ft.y===ny)){
          fireTiles.push({x:nx,y:ny,life:120,spreadTimer:0});
          f.spreadTimer=0;break;
        }
      }
    }
  }
}

function bfsFrom(...types){
  const vis=Array.from({length:GRID},()=>new Array(GRID).fill(false));
  const q=[];
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(types.includes(grid[y][x].type)){vis[y][x]=true;q.push([x,y]);}
  }
  const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  for(let i=0;i<q.length;i++){
    const [cx,cy]=q[i];
    for(const [dx,dy] of dirs){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GRID||ny>=GRID||vis[ny][nx])continue;
      if(grid[ny][nx].type===T.EMPTY&&!grid[ny][nx].util.powerline)continue;
      vis[ny][nx]=true;q.push([nx,ny]);
    }
  }
  return vis;
}

function bfsRail(){
  const vis=Array.from({length:GRID},()=>new Array(GRID).fill(false));
  const q=[];
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(grid[y][x].type===T.RAIL||grid[y][x].type===T.STATION){vis[y][x]=true;q.push([x,y]);}
  }
  const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
  for(let i=0;i<q.length;i++){
    const [cx,cy]=q[i];
    for(const [dx,dy] of dirs){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=GRID||ny>=GRID||vis[ny][nx])continue;
      if(grid[ny][nx].type===T.EMPTY)continue;
      vis[ny][nx]=true;q.push([nx,ny]);
    }
  }
  return vis;
}

function covMap(type,radius){
  const m=Array.from({length:GRID},()=>new Array(GRID).fill(0));
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if(grid[y][x].type!==type||grid[y][x].stadiumOf)continue;
    for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny>=0&&nx>=0&&ny<GRID&&nx<GRID)m[ny][nx]++;
    }
  }
  return m;
}

function simulate(){
  // BFS
  const roadVis=bfsFrom(T.ROAD,T.STATION);
  const powerVis=bfsFrom(T.POWER,T.THERMAL,T.NUCLEAR);
  const railVis=bfsRail();

  // Utility access (any adjacent utility tile)
  const utilAccess={gas:Array.from({length:GRID},()=>new Array(GRID).fill(false)),
                    water:Array.from({length:GRID},()=>new Array(GRID).fill(false)),
                    sewer:Array.from({length:GRID},()=>new Array(GRID).fill(false))};
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    ['gas','water','sewer'].forEach(k=>{
      if(grid[y][x].util[k])utilAccess[k][y][x]=true;
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
        const nx=x+dx,ny=y+dy;
        if(nx>=0&&ny>=0&&nx<GRID&&ny<GRID&&grid[ny][nx].util[k])utilAccess[k][y][x]=true;
      });
    });
  }

  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    grid[y][x].powered=powerVis[y][x];
    grid[y][x].road=roadVis[y][x];
    grid[y][x].rail=railVis[y][x];
    grid[y][x].gasAccess=utilAccess.gas[y][x];
    grid[y][x].waterAccess=utilAccess.water[y][x];
    grid[y][x].sewerAccess=utilAccess.sewer[y][x];
  }

  // Pollution
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    let p=0;
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const ny=y+dy,nx=x+dx;if(ny<0||nx<0||ny>=GRID||nx>=GRID)continue;
      const tt=grid[ny][nx].type;
      if(tt===T.INDUSTRIAL)p+=Math.max(0,5-Math.max(Math.abs(dx),Math.abs(dy)))*(grid[ny][nx].level||1);
      if(tt===T.THERMAL)  p+=Math.max(0,6-Math.max(Math.abs(dx),Math.abs(dy)))*2;
      if(tt===T.NUCLEAR)  p+=Math.max(0,3-Math.max(Math.abs(dx),Math.abs(dy)));
    }
    grid[y][x].pollution=p;
  }

  // Coverage maps
  const cov={
    park:   covMap(T.PARK,3),    police:  covMap(T.POLICE,5),
    fire:   covMap(T.FIRE,5),    hospital:covMap(T.HOSPITAL,5),
    school: covMap(T.SCHOOL,4),  stadium: covMap(T.STADIUM,8),
    airport:covMap(T.AIRPORT,6), station: covMap(T.STATION,5),
  };

  let income=0,expense=0,pop=0,happySum=0,happyN=0;
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    const t=grid[y][x];if(t.type===T.EMPTY)continue;
    if(t.stadiumOf)continue; // スタジアム2x2の付随マスは収支・成長判定の対象外
    expense+=(EXPENSE_T[t.type]||0)*(t.level||1);
    // Utility tile annual cost
    if(t.util.powerline)expense+=2;if(t.util.gas)expense+=1;if(t.util.water)expense+=1;if(t.util.sewer)expense+=1;

    // Grow (residential/commercial/industrial only)
    if([T.RESIDENTIAL,T.COMMERCIAL,T.INDUSTRIAL].includes(t.type)&&t.road&&t.powered){
      t.growTimer++;
      const thr=t.type===T.RESIDENTIAL?6:t.type===T.COMMERCIAL?8:10;
      if(t.growTimer>=thr&&t.level<3){t.level++;t.growTimer=0;showToast(`🏗️ 建物が成長！(${x},${y})`,'ok');}
    }

    if(t.type===T.COMMERCIAL)income+=INCOME_COM[t.level]||0;
    if(t.type===T.INDUSTRIAL)income+=INCOME_IND[t.level]||0;
    if(t.type===T.STADIUM)income+=300;
    if(t.type===T.AIRPORT)income+=1000;
    if(t.type===T.STATION)income+=80;

    if(t.type===T.RESIDENTIAL){
      pop+=POP_LV[t.level]||0;
      let h=40
        +(t.powered?15:0)
        +cov.park[y][x]*15
        +cov.police[y][x]*12
        +cov.fire[y][x]*10
        +cov.hospital[y][x]*18
        +cov.school[y][x]*10
        +cov.stadium[y][x]*6
        +cov.airport[y][x]*5
        +cov.station[y][x]*8
        +(t.gasAccess?5:0)+(t.waterAccess?8:0)+(t.sewerAccess?6:0)
        -t.pollution*6;
      happySum+=Math.max(0,Math.min(100,h));happyN++;
    }
  }
  // カバレッジキャッシュを更新（updateFireSystem等で参照）
  covCache=cov;

  // 経済修正適用
  if(economicModTurns>0){
    income=Math.round(income*economicMod);
    economicModTurns--;
    if(economicModTurns===0)economicMod=1.0;
  }
  // 交通事故ペナルティ
  if(trafficPenaltyTurns>0){ income=Math.round(income*0.9); trafficPenaltyTurns--; }

  const net=income-expense;
  gs.funds+=net;gs.income=net;gs.population=pop;
  gs.happiness=happyN>0?Math.min(100,Math.round(happySum/happyN)):100;
  gs.year++;updateHUD();

  // ランダムイベント発生判定（speed>0のときのみ）
  if(gs.speed>0){
    for(const [evType,chance] of Object.entries(EV_CHANCE)){
      if(Math.random()<chance && canTriggerEvent(evType)){ triggerEvent(evType); break; }
    }
  }
}

function canTriggerEvent(type){
  function hasType(...types){ return grid.some(row=>row.some(t=>types.includes(t.type))); }
  function hasUtil(key){ return grid.some(row=>row.some(t=>t.util[key])); }
  if(type===EV.FIRE)        return hasType(T.RESIDENTIAL,T.COMMERCIAL,T.INDUSTRIAL);
  if(type===EV.CRIME)       return hasType(T.RESIDENTIAL);
  if(type===EV.TRAFFIC)     return hasType(T.ROAD);
  if(type===EV.BLACKOUT)    return hasType(T.POWER,T.THERMAL,T.NUCLEAR)||hasUtil('powerline');
  if(type===EV.WATER_BREAK) return hasUtil('water');
  if(type===EV.GAS_LEAK)    return hasUtil('gas');
  if(type===EV.BOOM||type===EV.RECESSION) return hasType(T.COMMERCIAL,T.INDUSTRIAL);
  return true;
}

function triggerEvent(type){
  const info=EV_INFO[type];
  if(!info)return;
  showToast(info.icon+' '+info.label, info.severity>=2?'err':'ok', 5000);
  applyEventDamage(type);
  activeEvents.push({type,ttl:10,label:info.label,color:info.color,icon:info.icon});
  updateEventPanel();
}

function applyEventDamage(type){
  const buildTypes=new Set([T.RESIDENTIAL,T.COMMERCIAL,T.INDUSTRIAL,T.PARK,
    T.POLICE,T.FIRE,T.HOSPITAL,T.SCHOOL,T.STADIUM,T.AIRPORT,T.STATION,
    T.POWER,T.THERMAL,T.NUCLEAR]);

  if(type===EV.EARTHQUAKE){
    shakeFrames=45;
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      const t=grid[y][x];
      if(t.type===T.ROAD && Math.random()<0.10){ t.type=T.EMPTY; t.level=0; }
      else if(buildTypes.has(t.type) && Math.random()<0.05 && t.level>1) t.level--;
    }
    gs.funds=Math.max(0,gs.funds-Math.floor(1000+Math.random()*3000));
  }
  else if(type===EV.TSUNAMI){
    tsunamiWave={progress:-80};
    // 沿岸3タイル以内の建物を破壊
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      let nearSea=false;
      for(let dy=-3;dy<=3&&!nearSea;dy++)for(let dx=-3;dx<=3&&!nearSea;dx++){
        const ny2=y+dy,nx2=x+dx;
        if(ny2>=0&&ny2<GRID&&nx2>=0&&nx2<GRID&&grid[ny2][nx2].terrain===TR.SEA) nearSea=true;
      }
      if(nearSea && buildTypes.has(grid[y][x].type)){
        if(grid[y][x].type===T.STADIUM) removeStadium(x,y);
        else { grid[y][x].type=T.EMPTY; grid[y][x].level=0; }
      }
    }
  }
  else if(type===EV.TYPHOON){
    rainParticles=Array.from({length:80},()=>({
      x:Math.random()*1600,y:Math.random()*900,len:8+Math.random()*8,spd:6+Math.random()*4,
    }));
    // 全域8%でlevel--
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      const t=grid[y][x];
      if(buildTypes.has(t.type)&&t.level>1&&Math.random()<0.08) t.level--;
    }
    gs.funds=Math.max(0,gs.funds-Math.floor(500+Math.random()*2000));
    setTimeout(()=>{ rainParticles=[]; },15000);
  }
  else if(type===EV.FIRE){
    // 建物タイルからランダムに1個選んで着火
    const candidates=[];
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      if([T.RESIDENTIAL,T.COMMERCIAL,T.INDUSTRIAL].includes(grid[y][x].type)) candidates.push({x,y});
    }
    if(candidates.length>0){
      const c=candidates[Math.floor(Math.random()*candidates.length)];
      if(!fireTiles.find(f=>f.x===c.x&&f.y===c.y))
        fireTiles.push({x:c.x,y:c.y,life:150,spreadTimer:0});
    }
  }
  else if(type===EV.CRIME){
    // 警察カバレッジ外の住宅を最大3個ペナルティ
    const victims=[];
    for(let y=0;y<GRID&&victims.length<3;y++)for(let x=0;x<GRID&&victims.length<3;x++){
      if(grid[y][x].type===T.RESIDENTIAL&&!(covCache.police?.[y]?.[x])) victims.push({x,y});
    }
    gs.happiness=Math.max(0,gs.happiness-5*Math.max(1,victims.length));
  }
  else if(type===EV.TRAFFIC){
    trafficPenaltyTurns=3;
    gs.happiness=Math.max(0,gs.happiness-4);
  }
  else if(type===EV.BLACKOUT){
    // ランダムな送電線タイルを1本断線
    const powerlines=[];
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      if(grid[y][x].util.powerline) powerlines.push({x,y});
    }
    if(powerlines.length>0){
      const p=powerlines[Math.floor(Math.random()*powerlines.length)];
      grid[p.y][p.x].util.powerline=false;
    }
    gs.happiness=Math.max(0,gs.happiness-6);
  }
  else if(type===EV.WATER_BREAK){
    const waterPipes=[];
    for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
      if(grid[y][x].util.water) waterPipes.push({x,y});
    }
    if(waterPipes.length>0){
      const p=waterPipes[Math.floor(Math.random()*waterPipes.length)];
      grid[p.y][p.x].util.water=false;
    }
    gs.happiness=Math.max(0,gs.happiness-8);
  }
  else if(type===EV.GAS_LEAK){
    const gx=Math.floor(Math.random()*GRID),gy=Math.floor(Math.random()*GRID);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx2=gx+dx,ny2=gy+dy;
      if(nx2>=0&&nx2<GRID&&ny2>=0&&ny2<GRID) gasLeakTiles.add(nx2+','+ny2);
    }
    gs.happiness=Math.max(0,gs.happiness-10);
    setTimeout(()=>{
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++) gasLeakTiles.delete((gx+dx)+','+(gy+dy));
    },20000);
  }
  else if(type===EV.BOOM){ economicMod=1.4; economicModTurns=4; }
  else if(type===EV.RECESSION){ economicMod=0.65; economicModTurns=4; }
  else if(type===EV.SUBSIDY){ gs.funds+=Math.floor(3000+Math.random()*7000); }

  updateHUD();
}

function updateEventPanel(){
  const panel=document.getElementById('event-panel');
  if(!panel)return;
  panel.innerHTML=activeEvents.map(e=>
    `<div class="ev-item" style="--ev-color:${e.color}">${e.icon} ${e.label}</div>`
  ).join('');
}

// スタジアムは2x2の複合施設のため、どのマスが選ばれても4マス揃えて撤去する
function removeStadium(tx,ty){
  const t=grid[ty][tx];
  if(t.type!==T.STADIUM)return;
  const ax=t.stadiumOf?t.stadiumOf.x:tx, ay=t.stadiumOf?t.stadiumOf.y:ty;
  for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
    const gx=ax+dx,gy=ay+dy;
    if(gx<0||gy<0||gx>=GRID||gy>=GRID)continue;
    const gt=grid[gy][gx];
    if(gt.type!==T.STADIUM)continue;
    grid[gy][gx]=mkTile(T.EMPTY,gt.terrain);
  }
}
function placeTile(tx,ty){
  if(tx<0||ty<0||tx>=GRID||ty>=GRID)return;
  const t=grid[ty][tx];
  const onWater=t.terrain===TR.SEA||t.terrain===TR.RIVER;
  if(gs.tool!=='bulldoze'){
    // 橋は水上にのみ、それ以外の建物・道路等は海・川には建設不可
    if(gs.tool==='bridge'){ if(!onWater){showToast('🌉 橋は海・川の上にのみ設置できます','err');return;} }
    else if(onWater){ showToast('🌊 海・川には建設できません','err');return; }
  }

  if(gs.tool==='bulldoze'){
    const hasUtil=t.util.gas||t.util.water||t.util.powerline||t.util.sewer;
    if(t.type===T.EMPTY&&!hasUtil)return;
    if(gs.funds<COSTS.bulldoze){showToast('💸 資金不足！','err');return;}
    gs.funds-=COSTS.bulldoze;
    if(t.type===T.STADIUM){
      removeStadium(tx,ty);
      updateHUD();return;
    }
    const savedTerrain=t.terrain;
    grid[ty][tx]=mkTile(T.EMPTY,savedTerrain);
    updateHUD();return;
  }

  if(gs.tool==='stadium'){
    // スタジアムは2x2(4マス)の複合施設として設置する
    const ax=tx,ay=ty;
    if(ax+1>=GRID||ay+1>=GRID){showToast('⚠️ 設置スペース不足（2x2必要）','err');return;}
    const cells=[[ax,ay],[ax+1,ay],[ax,ay+1],[ax+1,ay+1]];
    for(const[gx,gy]of cells){
      const gt=grid[gy][gx];
      if(gt.type!==T.EMPTY||gt.terrain===TR.SEA||gt.terrain===TR.RIVER){
        showToast('⚠️ スタジアムには2x2の更地が必要です','err');return;
      }
    }
    const cost=COSTS.stadium;
    if(gs.funds<cost){showToast('💸 資金不足！','err');return;}
    gs.funds-=cost;
    for(const[gx,gy]of cells){
      grid[gy][gx]=mkTile(T.STADIUM);
      if(gx!==ax||gy!==ay)grid[gy][gx].stadiumOf={x:ax,y:ay};
    }
    updateHUD();return;
  }

  if(gs.tool==='bridge'){
    // 橋は水上の地形（海・川）を保持したまま道路として設置する（地形を更地化しない）
    if(t.type===T.ROAD)return;
    const cost=COSTS.bridge;
    if(gs.funds<cost){showToast('💸 資金不足！','err');return;}
    gs.funds-=cost;
    const savedUtil={...t.util},savedTerrain=t.terrain;
    grid[ty][tx]=mkTile(T.ROAD,savedTerrain);
    grid[ty][tx].util=savedUtil;
    updateHUD();return;
  }

  if(UTIL_TOOLS.has(gs.tool)){
    if(t.util[gs.tool])return;
    const cost=COSTS[gs.tool];
    if(gs.funds<cost){showToast('💸 資金不足！','err');return;}
    gs.funds-=cost;t.util[gs.tool]=true;updateHUD();return;
  }

  const nt=TOOL_TYPE[gs.tool];if(nt===undefined||t.type===nt)return;
  const cost=COSTS[gs.tool];
  if(gs.funds<cost){showToast('💸 資金不足！','err');return;}
  gs.funds-=cost;
  const savedUtil={...t.util};
  grid[ty][tx]=mkTile(nt);
  grid[ty][tx].util=savedUtil;
  updateHUD();
}

// ════════════════════════════════════════════════════════════
//  Input
// ════════════════════════════════════════════════════════════
function s2t(sx,sy){return{x:Math.floor((sx-gs.cam.x)/ts()),y:Math.floor((sy-gs.cam.y)/ts())};}

wrap.addEventListener('mousedown',e=>{
  if(e.button===2){gs.dragging=true;gs.dragPt={sx:e.clientX,sy:e.clientY,cx:gs.cam.x,cy:gs.cam.y};return;}
  const r=wrap.getBoundingClientRect();gs.drawing=true;
  const{x,y}=s2t(e.clientX-r.left,e.clientY-r.top);placeTile(x,y);
});
wrap.addEventListener('mousemove',e=>{
  const r=wrap.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  if(gs.dragging&&gs.dragPt){gs.cam.x=gs.dragPt.cx+(e.clientX-gs.dragPt.sx);gs.cam.y=gs.dragPt.cy+(e.clientY-gs.dragPt.sy);return;}
  gs.hover=s2t(sx,sy);if(gs.drawing)placeTile(gs.hover.x,gs.hover.y);
});
wrap.addEventListener('mouseup',()=>{gs.dragging=false;gs.dragPt=null;gs.drawing=false;});
wrap.addEventListener('mouseleave',()=>{gs.hover=null;gs.dragging=false;gs.drawing=false;});
wrap.addEventListener('contextmenu',e=>e.preventDefault());
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:.9;const nz=Math.max(.4,Math.min(5,gs.zoom*f));
  gs.cam.x=mx-(mx-gs.cam.x)*(nz/gs.zoom);gs.cam.y=my-(my-gs.cam.y)*(nz/gs.zoom);gs.zoom=nz;
},{passive:false});

let _ltd=null,_tc=null,_tstart=null,_tlast=null,_tpan=false;
wrap.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    _tstart={x:t.clientX,y:t.clientY};_tlast={x:t.clientX,y:t.clientY};
    _tpan=false;gs.drawing=false;
  } else if(e.touches.length===2){
    gs.drawing=false;_tpan=false;
    _ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    _tc={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    if(!_tpan&&_tstart&&(Math.abs(t.clientX-_tstart.x)>8||Math.abs(t.clientY-_tstart.y)>8))_tpan=true;
    if(_tpan&&_tlast){gs.cam.x+=t.clientX-_tlast.x;gs.cam.y+=t.clientY-_tlast.y;}
    else if(!_tpan){const r=wrap.getBoundingClientRect();gs.hover=s2t(t.clientX-r.left,t.clientY-r.top);}
    _tlast={x:t.clientX,y:t.clientY};
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(_ltd)gs.zoom=Math.max(.4,Math.min(5,gs.zoom*(d/_ltd)));_ltd=d;
    const nc={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};
    if(_tc){gs.cam.x+=nc.x-_tc.x;gs.cam.y+=nc.y-_tc.y;}_tc=nc;
  }
},{passive:false});
wrap.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!_tpan&&_tstart&&e.changedTouches.length===1){
    const t=e.changedTouches[0];
    const r=wrap.getBoundingClientRect();
    const tile=s2t(t.clientX-r.left,t.clientY-r.top);
    gs.hover=tile;placeTile(tile.x,tile.y);
  }
  gs.drawing=false;_ltd=null;_tc=null;_tpan=false;_tstart=null;_tlast=null;
},{passive:false});

const KEY_TOOLS={
  r:'road',u:'bridge',j:'rail',k:'station',a:'airport',
  h:'residential',c:'commercial',i:'industrial',p:'park',
  q:'police',f:'fire',m:'hospital',o:'school',d:'stadium',
  e:'power',t:'thermal',n:'nuclear',
  l:'powerline',g:'gas',w:'water',z:'sewer',
  b:'bulldoze',
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const tool=KEY_TOOLS[e.key.toLowerCase()];
  if(tool){gs.tool=tool;document.querySelectorAll('.tool-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.tool===tool));}
  if(e.key==='+')gs.zoom=Math.min(5,gs.zoom*1.15);
  if(e.key==='-')gs.zoom=Math.max(.4,gs.zoom/1.15);
  const step=Math.max(60,ts()*2);
  if(e.key==='ArrowLeft') {e.preventDefault();gs.cam.x+=step;}
  if(e.key==='ArrowRight'){e.preventDefault();gs.cam.x-=step;}
  if(e.key==='ArrowUp')   {e.preventDefault();gs.cam.y+=step;}
  if(e.key==='ArrowDown') {e.preventDefault();gs.cam.y-=step;}
});

// ── ミニマップクリック/タップでカメラ移動 ──
function minimapJump(clientX,clientY){
  const rect=mm.getBoundingClientRect();
  const mx=(clientX-rect.left)*(mm.width/rect.width);
  const my=(clientY-rect.top)*(mm.height/rect.height);
  const cell=mm.width/GRID;
  gs.cam.x=canvas.width/2-(mx/cell)*ts();
  gs.cam.y=canvas.height/2-(my/cell)*ts();
}
mm.style.cursor='crosshair';
mm.addEventListener('click',e=>minimapJump(e.clientX,e.clientY));
mm.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  minimapJump(t.clientX,t.clientY);
},{passive:false});

// ════════════════════════════════════════════════════════════
//  Loop
// ════════════════════════════════════════════════════════════
updateHUD();
function loop(t){
  gs.frame++;
  requestAnimationFrame(loop);
  // 毎フレーム更新
  updateFireSystem();
  for(const p of rainParticles){ p.y+=p.spd; if(p.y>canvas.height){ p.y=-20; p.x=Math.random()*canvas.width; } }
  if(tsunamiWave){ tsunamiWave.progress+=4; if(tsunamiWave.progress>canvas.height+100) tsunamiWave=null; }
  if(gs.frame%60===0){
    activeEvents.forEach(e=>e.ttl--);
    activeEvents=activeEvents.filter(e=>e.ttl>0);
    updateEventPanel();
  }
  render();
  if(gs.speed>0&&t-gs.lastSim>SIM_MS/gs.speed){gs.lastSim=t;simulate();}
}
requestAnimationFrame(loop);
</script>
