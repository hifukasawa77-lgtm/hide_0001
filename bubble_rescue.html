  spriteCanvas: null,
  effectCanvas: null,

function loadArtImage(src) {
  const img = new Image();
  img.decoding = 'async';
  img.src = src;
  img.onload = () => {
    if (src.includes('sprite-atlas')) ART.spriteCanvas = buildChromaKeyCanvas(img);
    if (src.includes('effects-atlas')) ART.effectCanvas = buildChromaKeyCanvas(img);
  };
  return img;
}

function buildChromaKeyCanvas(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const pixels = g.getImageData(0, 0, c.width, c.height);
  const d = pixels.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2];
    if (r > 170 && b > 170 && gg < 145 && Math.abs(r - b) < 95) {
      d[i + 3] = 0;
    }
  }
  g.putImageData(pixels, 0, 0);
  return c;
}

function hasSprites() { return !!ART.spriteCanvas; }
function hasEffects() { return !!ART.effectCanvas; }

function drawCoverImage(img, x, y, w, h) {
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if (!iw || !ih) return false;
  const scale = Math.max(w / iw, h / ih);
  const sw = w / scale, sh = h / scale;
  const sx = (iw - sw) / 2, sy = (ih - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  return true;
}

function drawAtlasSprite(canvas, cols, rows, idx, cx, cy, dw, dh, options = {}) {
  if (!canvas) return false;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const sx = (idx % cols) * cellW;
  const sy = Math.floor(idx / cols) * cellH;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (options.alpha !== undefined) ctx.globalAlpha *= options.alpha;
  if (options.flipX) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(canvas, sx, sy, cellW, cellH, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.drawImage(canvas, sx, sy, cellW, cellH, cx - dw / 2, cy - dh / 2, dw, dh);
  }
  ctx.restore();
  return true;
}

function drawSprite(idx, cx, cy, dw, dh, options) {
  return drawAtlasSprite(ART.spriteCanvas, 4, 4, idx, cx, cy, dw, dh, options);
}

function drawEffect(idx, cx, cy, dw, dh, options) {
  return drawAtlasSprite(ART.effectCanvas, 4, 2, idx, cx, cy, dw, dh, options);
}

// === Audio System (Phase 3) ===
const AudioSystem = {
  ctx: null, masterGain: null, bgmNodes: [], muted: false,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.4;
    this.masterGain.connect(this.ctx.destination);
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) this.masterGain.gain.value = this.muted ? 0 : 0.4;
  },
  startBGM() {
    if (!this.ctx) return;
    this.stopBGM();
    // 8bit風メロディ: square波ループ
    const notes = [523, 587, 659, 784, 659, 587, 523, 440];
    const noteDur = 0.22;
    const loopDur = notes.length * noteDur;
    const ac = this.ctx;
    const now = ac.currentTime;
    const loopRepeat = 16;
    for (let rep = 0; rep < loopRepeat; rep++) {
      notes.forEach((freq, i) => {
        const t = now + (rep * loopDur) + i * noteDur;
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(0.12, t + 0.02);
        g.gain.setValueAtTime(0.12, t + noteDur * 0.7);
        g.gain.linearRampToValueAtTime(0.0, t + noteDur * 0.9);
        osc.connect(g); g.connect(this.masterGain);
        osc.start(t); osc.stop(t + noteDur);
        this.bgmNodes.push(osc);
      });
    }
  },
  stopBGM() {
    this.bgmNodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e){} });
    this.bgmNodes = [];
  },
  playSE(type) {
    if (!this.ctx) return;
    const ac = this.ctx;
    const now = ac.currentTime;
    const g = ac.createGain();
    g.connect(this.masterGain);
    switch(type) {
      case 'pop': {
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(g); osc.start(now); osc.stop(now + 0.12);
        break;
      }
      case 'collect': {
        [440, 660, 880].forEach((f, i) => {
          const o = ac.createOscillator();
          const og = ac.createGain();
          o.type = 'square'; o.frequency.value = f;
          const t = now + i * 0.06;
          og.gain.setValueAtTime(0.15, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          o.connect(og); og.connect(this.masterGain);
          o.start(t); o.stop(t + 0.09);
        });
        break;
      }
      case 'combo': {
        [523, 784, 1047, 1568].forEach((f, i) => {
          const o = ac.createOscillator();
          const og = ac.createGain();
          o.type = 'square'; o.frequency.value = f;
          const t = now + i * 0.04;
          og.gain.setValueAtTime(0.18, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
          o.connect(og); og.connect(this.masterGain);
          o.start(t); o.stop(t + 0.07);
        });
        break;
      }
      case 'miss': {
        const osc = ac.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(g); osc.start(now); osc.stop(now + 0.25);
        break;
      }
      case 'gameover': {
        [400, 300, 200, 150].forEach((f, i) => {
          const o = ac.createOscillator();
          const og = ac.createGain();
          o.type = 'square'; o.frequency.value = f;
          const t = now + i * 0.18;
          og.gain.setValueAtTime(0.2, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          o.connect(og); og.connect(this.masterGain);
          o.start(t); o.stop(t + 0.15);
        });
        break;
      }
      case 'clear': {
        [523, 659, 784, 1047].forEach((f, i) => {
          const o = ac.createOscillator();
          const og = ac.createGain();
          o.type = 'square'; o.frequency.value = f;
          const t = now + i * 0.12;
          og.gain.setValueAtTime(0.2, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
          o.connect(og); og.connect(this.masterGain);
          o.start(t); o.stop(t + 0.10);
        });
        break;
      }
      case 'ladder': {
        const osc = ac.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g); osc.start(now); osc.stop(now + 0.08);
        break;
      }
      case 'bomb': {
        // 爆発音: ノイズバースト
        const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.3), ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const biquad = ac.createBiquadFilter();
        biquad.type = 'lowpass'; biquad.frequency.value = 400;
        src.connect(biquad); biquad.connect(g);
        g.gain.setValueAtTime(0.6, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        src.start(now);
        break;
      }
      case 'hammer': {
        const osc = ac.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        g.gain.setValueAtTime(0.5, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(g); osc.start(now); osc.stop(now + 0.15);
        break;
      }
      case 'crow': {
        const osc = ac.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.18);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(g); osc.start(now); osc.stop(now + 0.18);
        break;
      }
      case 'thunder': {
        const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++)
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.5);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const biq = ac.createBiquadFilter();
        biq.type = 'highpass'; biq.frequency.value = 150;
        src.connect(biq); biq.connect(g);
        g.gain.setValueAtTime(0.7, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        src.start(now);
        break;
      }
      case 'throw': {
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g); osc.start(now); osc.stop(now + 0.08);
        break;
      }
    }
  }
};

    this.scores = this.scores.slice(0, 3);
    hiScore = this.scores[0];
    this.saveRaw();
    return true;
  }
};

function pollGamepad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  const gp=Array.from(gps).find(g=>g);
  if(!gp)return;
  const b=gp.buttons,ax=gp.axes,DZ=0.3;
  playerControl.left  = !!(b[14]?.pressed||ax[0]<-DZ);
  playerControl.right = !!(b[15]?.pressed||ax[0]> DZ);
  playerControl.up    = !!(b[12]?.pressed||ax[1]<-DZ);
  playerControl.down  = !!(b[13]?.pressed||ax[1]> DZ);
  if(_gpShotCooldown>0) _gpShotCooldown--;
  if(b[0]?.pressed&&_gpShotCooldown===0&&state==='play'&&ballCount>0&&gnomes.length>0){
    const g0=gnomes[0];
    let near=null,nearD=Infinity;
    for(const bbl of bubbles){
      if(bbl.popped) continue;
      const d=Math.hypot(bbl.x-g0.x,bbl.y-g0.y);
      if(d<nearD){nearD=d;near=bbl;}
    }
    if(near){balls.push(makeProjectile(g0,near.x,near.y));ballCount=Math.max(0,ballCount-1);_gpShotCooldown=15;}
  }
  _gpPrev5=b.map(btn=>btn?.pressed);
}

function makeBubble() {
  const cfg = STAGE_CFG[stage];
  const r = 22 + Math.random() * 18;
  const baseY = BUBBLE_FLOW_Y + (Math.random() - 0.5) * 60;
  return {
    x: W + r + Math.random() * 80,
