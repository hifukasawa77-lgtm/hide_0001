<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幕末風雲記 — 戦役</title>
  <link rel="stylesheet" href="battle.css">
</head>
<body>
  <main class="battle-app">
    <header class="battle-topbar">
      <a href="bakumatsu.html" class="back-link">← 全国政局</a>
      <div><p>BAKUMATSU FŪUNKI / BATTLE COMMAND</p><h1 id="battle-title">野戦</h1></div>
      <div class="battle-meta"><span id="battle-date">慶応4年 5月18日</span><span id="battle-place">越後・榎峠</span><b id="weather">晴 / 視界: 良好</b></div>
    </header>
    <nav id="battle-modes" class="battle-modes" aria-label="戦役種別">
      <button class="active" data-mode="field">野戦 <small>地形と射程</small></button>
      <button data-mode="siege">攻城戦 <small>砲撃と城郭</small></button>
      <button data-mode="naval">海戦 <small>風向と艦隊</small></button>
    </nav>
    <section class="battle-layout">
      <aside id="friendly-panel" class="command-panel friendly"></aside>
      <section class="battlefield-shell">
        <div id="battlefield" class="battlefield" aria-label="戦術マップ">
          <div class="battlefield-vignette"></div><div id="terrain-markers" class="terrain-markers"></div><div id="unit-layer" class="unit-layer"></div>
          <div class="objective"><span>戦役目標</span><strong id="objective-text">榎峠の高地を確保せよ</strong><div><i id="objective-bar"></i></div></div>
        </div>
        <div id="action-log" class="action-log" aria-live="polite"></div>
        <div id="orders" class="orders" aria-label="命令"></div>
      </section>
      <aside id="enemy-panel" class="command-panel enemy"></aside>
    </section>
  </main>
  <script src="battle.js"></script>
</body>
</html>
