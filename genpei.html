/* ============================================================================

 *
 * ★ sengoku.html には一切手を入れない（決定事項B）。地図は assets/sengoku/ を参照するのみ。
 * ★ 拠点座標は正規化 MX,MY(0..1)。絶対画素値で持たない（地図の再エンコードで壊れるため）。
 * ========================================================================== */

const W = 1440, H = 810;
const SAVE_VERSION = 2;
const MAP_ASSET = 'assets/sengoku/gpt/sengoku-japan-map-user-v1.webp';

const canvas = document.getElementById('game');

const save = new GameKit.Save('genpei');
const clamp = GameKit.MathX.clamp;

// sengoku.html の IS_TOUCH を踏襲。固定Canvasをタッチ端末の小さい画面へ引き伸ばすと
// 文字が縮んで読めなくなるため（game-devスキル「固定Canvas UIのモバイル可読性対策」）、
// txt()/button() 等の共通描画経路（下記 mobileFont）でフォントサイズだけ底上げする。
// レイアウト（L, パネル座標）自体は変えない＝密なダッシュボードの配置崩れは起きない。
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0;

/* モバイル横画面ゲート（sengoku.html/sanguo.html と同じ方式）。
 * タッチ端末の縦画面でのみ表示し、ボタンで全画面化＋横向き固定を試みる。
 * screen.orientation.lock は非対応環境もあるため、失敗しても案内文自体で足りる。 */
(function () {
  document.body.classList.toggle('genpei-touch', IS_TOUCH);
  const gate = document.getElementById('landscapeGate');
  gate.querySelector('button').onclick = () => {
    const el = document.documentElement;
    const request = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      Promise.resolve(request ? request.call(el) : null).then(() => {
        if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
      }).catch(() => {});
    } catch (e) {}
  };
  const onFSChange = () => {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('is-fullscreen', on);
  };
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);
})();

/* ============================================================================
 * 0. 難易度（新規開始時に選択。RULE.ai を基準に AI の攻勢・収入を係数で伸縮する）

  hard:   { jp: '難しい',  en: 'Hard',   attackRatioMul: 0.75, maxActionsAdd: 1,  aiGoldMul: 1.15 },
};
function difficultyOf(state) { return DIFFICULTIES[state.difficulty] || DIFFICULTIES.normal; }

    // 閾値。開始時の頼朝（名分276・家格78）が「同じ国なら口説けるが、

const ERA = [

];
function waReki(year) {
  let e = ERA[0];
  for (const r of ERA) if (year >= r[0]) e = r;
  return `${e[1]}${numJP(year - e[0] + e[2])}年`;
}
function numJP(n) {
  const d = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
}

function parseKyotenCsv(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const head = lines[0].split(',');
  const idx = (n) => head.indexOf(n);
  const I = {
    id: idx('ID'), jp: idx('拠点名'), en: idx('英名'), type: idx('種別'), prov: idx('国'),
    mx: idx('MX'), my: idx('MY'), scale: idx('規模'), def: idx('防御'),
    holder: idx('荘園領主'), suigun: idx('水軍'), note: idx('備考'),
  };
  const cols = {};
  for (const s of SCENARIOS) cols[s.col] = idx(s.col);
  return lines.slice(1).map((line) => {
    const c = line.split(',');
    const own = {};
    for (const s of SCENARIOS) own[s.col] = c[cols[s.col]] || null;
    return {
      id: c[I.id], jp: c[I.jp], en: c[I.en], type: c[I.type], province: c[I.prov],
      mx: Number(c[I.mx]), my: Number(c[I.my]),
      scale: Number(c[I.scale]) || 0, defense: Number(c[I.def]) || 0,
      holder: c[I.holder] || null, suigun: c[I.suigun] || null, note: c[I.note] || '',
      own,
    };
  });
}

async function loadData() {
  let provinces = null, kyotenCsv = null, source = 'fetch';
  // file:// では fetch が CORS で必ず失敗する。試すと console.error が出て
  // 動的テストの「console.error 0件」を毎回落とすので、最初から埋め込みへ行く。
  const isFile = location.protocol === 'file:';
  try {
    if (isFile) throw new Error('file protocol');
    const [p, k] = await Promise.all([
      fetch('assets/genpei/provinces.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      fetch('kyoten_ichi.csv', { cache: 'no-store' }).then((r) => (r.ok ? r.text() : null)).catch(() => null),
    ]);
    provinces = p; kyotenCsv = k;
  } catch (e) { /* file:// / CORS / オフライン。下でシードへ落ちる */ }

  if (!provinces || !kyotenCsv) {
    provinces = provinces || EMBED.provinces;
    kyotenCsv = kyotenCsv || EMBED.kyotenCsv;
    source = 'embed';
    console.info('[genpei] 外部データを取得できないため埋め込みシードを使用します（file:// では正常）');
  }
  if (!provinces || !kyotenCsv) throw new Error('拠点・令制国データを読み込めませんでした');

  DATA.provinces = provinces.provinces;
  DATA.provById = Object.fromEntries(DATA.provinces.map((p) => [p.id, p]));
  DATA.kyoten = parseKyotenCsv(kyotenCsv);
  DATA.kyotenById = Object.fromEntries(DATA.kyoten.map((k) => [k.id, k]));
  DATA.byProvince = {};
  for (const k of DATA.kyoten) (DATA.byProvince[k.province] = DATA.byProvince[k.province] || []).push(k);
  // 国の範囲（拡大図のカメラ用）と重心
  DATA.provBox = {};
  for (const [pid, list] of Object.entries(DATA.byProvince)) {
    const xs = list.map((k) => k.mx), ys = list.map((k) => k.my);
    DATA.provBox[pid] = {
      x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys),
      cx: xs.reduce((a, b) => a + b, 0) / xs.length, cy: ys.reduce((a, b) => a + b, 0) / ys.length,
      hull: convexHull(list.map((k) => [k.mx, k.my])),
    };
  }
  DATA.source = source;
}

/* 凸包（単調鎖法）。国の領域を塗るための近似輪郭に使う */
function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const build = (arr) => {
    const st = [];
    for (const q of arr) {
      while (st.length >= 2 && cross(st[st.length - 2], st[st.length - 1], q) <= 0) st.pop();
      st.push(q);
    }
    st.pop();
    return st;
  };
  return build(p).concat(build(p.slice().reverse()));
}

/* ============================================================================
 * 2.5 武士団（基本設計 3.4）
 *
 * 軍事の最小単位。武将ではなく「団」が兵を持ち、勢力に所属するのではなく契約する。
 * ★ 別ファイルは作らず拠点データから決定論的に起こす。館・城柵・武家領の荘園が本領。
 *   こうすると拠点を足すだけで武士団も増え、データの二重管理が起きない。
 * ========================================================================== */
const BAND_HOME_TYPES = ['tachi', 'kisaku'];
/* 名の通った党の呼び名。載っていない拠点は「〈拠点名〉衆」になる */
const BAND_NAMES = {

  tachi_oba: '大庭党', tachi_kanasa: '佐竹党', tachi_nitta: '新田党',
  tachi_takeda: '甲斐源氏', tachi_yoda: '木曽党', tachi_kiso: '中原党',
  tachi_jo: '越後城氏', tachi_hiraizumi: '奥州藤原', tachi_koromogawa: '衣川衆',
  tachi_rokuhara: '六波羅の郎党', tachi_fukuhara: '福原の郎党', tachi_hojo: '北条党',
  shoen_miura: '三浦の郎党', shoen_chichibu: '秩父党', shoen_kodama: '児玉党',
  shoen_nasu: '那須党', shoen_ashikaga: '足利党', shoen_satake: '佐竹の郎党',

  kisaku_kikuchi: '菊池党', kisaku_kawagoe: '河越党', kisaku_utsunomiya: '宇都宮党',

/* 水軍（基本設計 4.11）。湊の「水軍」列から起こす。
 * ★去就が海戦の勝敗を直接決める。壇ノ浦は阿波水軍の離反で決まった。 */
const SUIGUN = {
  suigun_kumano:  { jp: '熊野水軍', en: 'Kumano Fleet',  leader: '湛増',       ships: 45 },
  suigun_kono:    { jp: '河野水軍', en: 'Kono Fleet',    leader: '河野通信',   ships: 45, gen: 'kono_michinobu' },
  suigun_awa:     { jp: '阿波水軍', en: 'Awa Fleet',     leader: '田口成良',   ships: 50, gen: 'taguchi_shigeyoshi' },
  suigun_matsura: { jp: '松浦党',   en: 'Matsura Fleet', leader: '松浦党の党首', ships: 40 },
};
/* 島の別。国をまたぐ移動が渡海になるかを決める */
function islandOf(provinceId) {
  const p = DATA.provById[provinceId];
  if (!p) return 'honshu';
  if (p.id === 'sado') return 'sado';
  if (p.id === 'awaji') return 'awaji';
  if (p.id === 'oki') return 'oki';
  if (p.circuit === 'saikaido') return 'kyushu';
  if (p.circuit === 'nankaido' && p.id !== 'kii') return 'shikoku';
  return 'honshu';
}

/* その勢力が、その国の武士団の「主人」たりうるか。
   知行国主にすぎない勢力（平氏・朝廷）は、本貫の外では主従関係を持たない。 */
function holdsAllegiance(fid, provinceId) {
  const f = FACTIONS[fid];
  if (!f) return false;
  if (!f.paperRule) return true;
  const p = DATA.provById[provinceId];
  return !!p && (f.heartland.includes(p.circuit) || f.heartlandProvinces.includes(p.id));
}
function buildBands() {
  const out = [];
  for (const k of DATA.kyoten) {
    const isHome = BAND_HOME_TYPES.includes(k.type) || (k.type === 'shoen' && k.holder === 'buke');
    if (!isHome) continue;
    const nameJP = BAND_NAMES[k.id] || `${k.jp}衆`;
    out.push({
      id: 'band_' + k.id, nameJP, nameEN: (k.en || k.jp) + ' Band',
      home: k.id, province: k.province,
      // 兵数は本領の規模から。館は収容兵力、荘園は田数なので係数を変える
      troops: Math.round(k.type === 'shoen' ? k.scale * 12 : k.scale * 0.45) + 120,
      // 独立志向。名の通った党ほど靡きにくい
      independence: 22 + (BAND_NAMES[k.id] ? 16 : 0) + (k.defense % 11),
    });
  }
  return out;
}

/* ============================================================================
 * 3. ルール層（純粋関数。state を書き換えず値を返す）
 * ========================================================================== */
const Rule = {
  seasonOf(month) {
    if (month >= 8 && month <= 10) return 'autumn';
    if (month >= 11 || month <= 1) return 'winter';
    if (month <= 4) return 'spring';
    return 'summer';
  },
  monthIndex(y, m) { return y * 12 + (m - 1); },
  famineActive(state) {
    const now = Rule.monthIndex(state.year, state.month), f = RULE.famine;
    return now >= Rule.monthIndex(f.from.y, f.from.m) && now <= Rule.monthIndex(f.to.y, f.to.m);
  },
  famineCoef(state, provinceId) {
    if (!Rule.famineActive(state)) return 0;
    const p = DATA.provById[provinceId];
    return RULE.famine.coef[p && p.famineZone] || 0;
  },

  /* 名分（基本設計 4.1）。権威 + 家格 + 評判 − 朝敵 */
  calcMeibun(state, fid) {
    const f = state.factions[fid];
    if (!f) return 0;
    let v = 0;
    for (const a of f.authority) v += (AUTHORITY[a] ? AUTHORITY[a].value : 0);
    v += (LORD_KAKAKU[f.lord] || 40) * RULE.meibun.kakakuMul;
    v += f.reputation;
    if (f.choteki) v -= RULE.meibun.chotekiPenalty;
    return clamp(Math.round(v), 0, RULE.meibun.max);
  },
  meibunBreakdown(state, fid) {
    const f = state.factions[fid];
    return {
      authority: f.authority.reduce((s, a) => s + (AUTHORITY[a] ? AUTHORITY[a].value : 0), 0),
      kakaku: (LORD_KAKAKU[f.lord] || 40) * RULE.meibun.kakakuMul,
      reputation: f.reputation,
      choteki: f.choteki ? -RULE.meibun.chotekiPenalty : 0,
      total: Rule.calcMeibun(state, fid),
    };
  },

  adjacent(a, b) {
    if (!a || !b || a.id === b.id) return false;
    if (a.province === b.province) return true;
    const p = DATA.provById[a.province];
    return !!(p && p.neighbors.includes(b.province));
  },
  ownedKyoten(state, fid) { return DATA.kyoten.filter((k) => state.kyoten[k.id].owner === fid); },

  /* 国の支配勢力 = その国の国府の持ち主 */
  provinceOwner(state, pid) {
    const k = DATA.kyotenById['kokufu_' + pid];
    return k ? state.kyoten[k.id].owner : null;
  },

  /* 文治の勅許（守護・地頭の設置）を受けているか。国衙収入の倍率に効く */
  hasShugoJito(state, fid) { return state.shugoJito === fid; },

  income(state, fid) {
    const hv = RULE.econ.harvest[Rule.seasonOf(state.month)];
    // ★勅許は「ログの飾り」にしない。国府の税率に倍率として効かせる
    const tax = RULE.econ.taxRate * (Rule.hasShugoJito(state, fid) ? RULE.econ.shugoJitoMul : 1);
    let food = 0, gold = 0, levy = 0, troops = 0;
    for (const k of Rule.ownedKyoten(state, fid)) {
      const famine = 1 - Rule.famineCoef(state, k.province);
      if (k.type === 'shoen' || k.type === 'mura') food += k.scale * hv * famine;
      if (k.type === 'machi') gold += k.scale * 0.4;
      if (k.type === 'sekisho') gold += k.scale * 0.02;
      if (k.type === 'kokufu') { gold += k.scale * tax; levy += k.scale * RULE.econ.levyMul; }
      troops += state.kyoten[k.id].garrison;
    }
    const upkeep = troops * RULE.econ.foodPerTroop;
    return {
      food: Math.round(food), gold: Math.round(gold), levyCap: Math.round(levy),
      upkeep: Math.round(upkeep), net: Math.round(food - upkeep), troops,
      shugoJito: Rule.hasShugoJito(state, fid),
    };
  },

  /* 出兵の強さ。守備は防御値ぶんだけ嵩上げされる */
  defenseStrength(state, k) { return state.kyoten[k.id].garrison + k.defense * 4; },

  aiActions(state, fid) {
    if (RULE.ai.famineBlock && Rule.famineActive(state)) return [];
    const diff = difficultyOf(state);
    const attackRatio = RULE.ai.attackRatio * diff.attackRatioMul;
    const maxActions = Math.max(1, RULE.ai.maxActions + diff.maxActionsAdd);
    const cand = [];
    for (const src of Rule.ownedKyoten(state, fid)) {
      const sg = state.kyoten[src.id].garrison;
      if (sg < RULE.ai.minGarrison) continue;
      for (const k of DATA.kyoten) {
        const st = state.kyoten[k.id];
        if (st.owner === fid || !Rule.adjacent(src, k)) continue;
        const need = Rule.defenseStrength(state, k) * attackRatio;
        if (sg <= need) continue;
        cand.push({ kind: 'capture', from: src.id, to: k.id, troops: Math.floor(sg * 0.6),
                    score: k.scale + (sg - need) * 0.1 });
      }
    }
    // 価値の高い順に、拠点の重複を避けて上限まで採る
    cand.sort((a, b) => b.score - a.score);
    const acts = [], usedFrom = new Set(), usedTo = new Set();
    for (const c of cand) {
      if (acts.length >= maxActions) break;
      if (usedFrom.has(c.from) || usedTo.has(c.to)) continue;
      usedFrom.add(c.from); usedTo.add(c.to); acts.push(c);
    }
    return acts;
  },

  /* ---------- 名分の行動（基本設計 4.2 / 4.3） ---------- */

  /* 無血開城。国府のみ。★本作の最重要ルール——名分だけで国が開く */
  canOpenBloodless(state, fid, kyotenId) {
    const k = DATA.kyotenById[kyotenId], st = state.kyoten[kyotenId];
    if (!k || k.type !== 'kokufu') return { ok: false, why: '国府にしか使えない' };
    if (st.owner === fid) return { ok: false, why: 'すでに自勢力の拠点' };
    if ((st.openRetryUntil || 0) > state.turn) return { ok: false, why: `${st.openRetryUntil - state.turn}ヶ月は再説得できない` };
    const f = state.factions[fid];
    const near = Rule.ownedKyoten(state, fid).filter((o) => Rule.adjacent(o, k)).length;
    if (!near) return { ok: false, why: '隣接する自勢力の拠点がない' };
    const atk = Rule.calcMeibun(state, fid) / RULE.open.garrisonDiv * 10
      + (LORD_KAKAKU[f.lord] || 40) * RULE.open.kakakuMul + near * RULE.open.bandMul;
    const dm = st.owner ? Rule.calcMeibun(state, st.owner) : 0;
    const def = dm / 10 + k.defense + st.garrison / RULE.open.garrisonDiv;
    return { ok: true, atk: Math.round(atk), def: Math.round(def), p: clamp(atk / Math.max(1, atk + def), 0.02, 0.95) };
  },
  /* 朝敵認定の可否 */
  canDeclareChoteki(state, fid, targetId) {
    const f = state.factions[fid], t = state.factions[targetId];
    if (!t || !t.alive) return { ok: false, why: 'その勢力は存在しない' };
    if (t.choteki) return { ok: false, why: 'すでに朝敵' };
    if (f.courtInfluence < RULE.choteki.needInfluence) return { ok: false, why: `朝廷支持が ${RULE.choteki.needInfluence} に足りない` };
    if (f.gold < RULE.choteki.costGold) return { ok: false, why: '金が足りない' };
    if ((f.chotekiCooldown || 0) > state.turn) return { ok: false, why: `${f.chotekiCooldown - state.turn}ヶ月は奏請できない` };
    if ((state.chotekiCount || 0) >= RULE.choteki.maxPerScenario * 3) return { ok: false, why: '奏請の回数を使い切った' };
    const p = clamp((Rule.calcMeibun(state, fid) - Rule.calcMeibun(state, targetId)) / 600
      + f.courtInfluence / 200 - 0.10, 0.05, 0.90);
    return { ok: true, p };
  },

  /* ---------- 渡海と水軍（基本設計 4.11） ---------- */

  /* 海を越える必要があるか（島が違えば渡海） */
  needsSeaCrossing(a, b) { return islandOf(a.province) !== islandOf(b.province); },

  /* 使える船。自勢力の湊＋麾下の水軍 */
  ships(state, fid) {
    let n = 0;
    for (const k of Rule.ownedKyoten(state, fid)) if (k.type === 'minato') n += k.scale;
    for (const [sid, s2] of Object.entries(state.suigun || {})) {
      if (s2.faction === fid) n += SUIGUN[sid].ships;
    }
    return n;
  },

  /* 渡海の可否（要件 M-33）。★湊を1つも持たない勢力は海を越えられない */
  canCrossSea(state, fid, from, to) {
    const a = DATA.kyotenById[from], b = DATA.kyotenById[to];
    if (!Rule.needsSeaCrossing(a, b)) return { ok: true, sea: false, failRate: 0 };
    const ports = Rule.ownedKyoten(state, fid).filter((k) => k.type === 'minato');
    if (!ports.length) return { ok: false, sea: true, why: '湊を持たないので海を越えられない' };
    const need = Math.ceil(state.kyoten[from].garrison / RULE.naval.crossShipDiv);
    const have = Rule.ships(state, fid);
    const N = RULE.naval;
    const winter = state.month >= 11 || state.month <= 2;
    const shortage = Math.max(0, 1 - have / Math.max(1, need));
    return {
      ok: true, sea: true, ships: have, need,
      failRate: clamp(N.crossFailBase + (winter ? N.crossWinterAdd : 0) + shortage * 0.4, 0, 0.9),
    };
  },

  /* 水軍の離反（要件 M-36）。劣勢なほど、相手の名分が高いほど寝返る */
  suigunDefectChance(state, suigunId, myFid, foeFid, weak) {
    const N = RULE.naval;
    const s2 = state.suigun[suigunId];
    if (!s2 || s2.faction !== myFid) return 0;
    return clamp((Rule.calcMeibun(state, foeFid) - Rule.calcMeibun(state, myFid)) / N.defectMeibunDiv
      + (weak || 0) * N.defectWeakMul, 0, N.defectMax);
  },

  /* ---------- 御恩と奉公（基本設計 4.4） ---------- */

  /* 奉公度の毎ターン減衰。★内訳も返す（なぜ落ちているかを画面で説明するため） */
  hokoDecay(state, bandId) {
    const b = state.bands[bandId];
    const f = b.faction ? state.factions[b.faction] : null;
    if (!f) return { total: 0, parts: [] };
    const H = RULE.hoko;
    const total0 = Math.max(1, Rule.ownedKyoten(state, b.faction).reduce((s2, k) => s2 + state.kyoten[k.id].garrison, 0));
    const homeLost = state.kyoten[b.home] && state.kyoten[b.home].owner !== b.faction;
    const parts = [
      ['基本', H.base],
      ['恩賞の未払い', (b.debt / total0) * H.debtMul],
      ['朝敵', f.choteki ? H.chotekiAdd : 0],
      ['本領が敵手に', homeLost ? H.homeLostAdd : 0],
      ['本領安堵', b.ando ? -H.andoSub : 0],
      ['名分', -(Rule.calcMeibun(state, b.faction) / RULE.meibun.max) * H.meibunSub],
    ].filter((x) => x[1] !== 0);
    return { total: parts.reduce((s2, x) => s2 + x[1], 0), parts };
  },
  bandsOf(state, fid) { return Object.values(state.bands).filter((b) => b.faction === fid); },
  totalDebt(state, fid) { return Rule.bandsOf(state, fid).reduce((s2, b) => s2 + b.debt, 0); },

  /* 武士団の勧誘（基本設計 4.5）。中立の勧誘と、他勢力からの引き抜きの両方を扱う。
     ★引き抜きを中立と同条件にすると「勧誘で敵の軍を丸ごと剥がす」抜け道になる。
       主の名分と当人の奉公度を抵抗として乗せ、成功時は評判を払わせる（tryRecruit）。 */
  recruitChance(state, fid, bandId, gift) {
    const b = state.bands[bandId];
    if (!b) return { ok: false, why: 'その武士団はいない' };
    if (b.faction === fid) return { ok: false, why: 'すでに麾下にある' };
    const f = state.factions[fid], R = RULE.recruit;
    const mine = Rule.ownedKyoten(state, fid);
    const same = mine.some((k) => k.province === b.province);
    const adj = mine.some((k) => Rule.adjacent(k, DATA.kyotenById[b.home]));
    if (!same && !adj) return { ok: false, why: '手の届く場所にいない' };
    const parts = [
      ['名分', Rule.calcMeibun(state, fid) / R.meibunDiv],
      ['家格', (LORD_KAKAKU[f.lord] || 40) * R.kakakuMul / 10],
      ['地縁', same ? R.sameProvince : R.adjacent],
      ['贈与', Math.min(R.giftCap, (gift || 0) / R.giftDiv)],
      ['独立志向', -b.independence],
    ];
    if (b.faction) {
      parts.push(['主の名分', -Rule.calcMeibun(state, b.faction) / R.poachMeibunDiv]);
      parts.push(['奉公', -b.hoko * R.poachHokoMul]);
    }
    const score = parts.reduce((s2, x) => s2 + x[1], 0);
    return { ok: true, score: Math.round(score), threshold: R.threshold, parts,
             poach: b.faction || null,
             p: clamp(score / (R.threshold * 2), 0.02, 0.95) };
  },

  /* 京（山城国府）を朝敵にならずに保っているか。木曽の勝利条件が数える月の判定 */
  holdsCapital(state, fid) {
    const kyoto = state.kyoten[KYOTO_KOKUFU];
    return !!kyoto && kyoto.owner === fid && !state.factions[fid].choteki;
  },

  checkVictory(state) {
    const f = state.factions[state.faction];
    const owned = Rule.ownedKyoten(state, state.faction);
    const seats = owned.filter((k) => k.type === 'kokufu').length;
    if (owned.length === 0) return { done: true, win: false, reason: '拠点をすべて失った / All sites lost' };
    if (Rule.monthIndex(state.year, state.month) < Rule.monthIndex(state.endYear, state.endMonth)) return { done: false };
    const v = FACTIONS[state.faction].victory;
    // ★VICTORY_TEXT に書いた条件をそのまま判定する。表示と実装が食い違うと、
    //   「高難度」と謳った条件が実際には「拠点が1つでも残っていれば勝ち」になる。
    let win;
    if (v === 'survive_regime') win = f.authority.includes('emperor') && !f.choteki && seats >= 20;
    else if (v === 'bakufu') win = !state.factions.taira.alive && f.authority.includes('senji') && seats >= 35;
    else if (v === 'seitai_shogun') {
      win = Rule.holdsCapital(state, state.faction) && f.authority.includes('senji')
        && ((state.kyotoHoldMonths && state.kyotoHoldMonths[state.faction]) || 0) >= RULE.capital.holdMonths;
    } else if (v === 'hiraizumi') win = !!state.kyoten['tachi_hiraizumi'] && state.kyoten['tachi_hiraizumi'].owner === state.faction;
    else win = owned.length > 0;
    return { done: true, win, reason: win ? '勝利条件を満たした / Victory conditions met' : '終幕 / The age has ended' };
  },
};

/* ============================================================================
 * 4. ゲーム状態
 * ========================================================================== */
function buildState(scenarioId, factionId, difficulty, factionId2) {
  const scn = SCENARIOS.find((s) => s.id === scenarioId);
  // ★2人対戦（同一端末の手番制パス＆プレイ）。state.faction は「今まさに操作中の人間」を指す
  //   単一の値のまま据え置き、humanFactions が「人間が握っている全勢力」を持つ。
  //   これでAIループ（fid===state.factionだけ除外）以外の大半のロジックは無改修で通る。
  const humanFactions = factionId2 && factionId2 !== factionId ? [factionId, factionId2] : [factionId];
  const state = {
    version: SAVE_VERSION, scenario: scenarioId, faction: factionId,
    humanFactions, actedThisRound: [],
    difficulty: DIFFICULTIES[difficulty] ? difficulty : 'normal',
    year: scn.start[0], month: scn.start[1], turn: 1,
    endYear: scn.end[0], endMonth: scn.end[1],
    factions: {}, kyoten: {}, bands: {}, suigun: {}, log: [], result: null, chotekiCount: 0,
    achieveStats: { bloodlessOpenCount: 0, armyMarchedCount: 0, foodNegativeDuringFamine: false },
  };
  for (const fid of Object.keys(FACTIONS)) {
    state.factions[fid] = {
      authority: (scn.authority[fid] || []).slice(),
      lord: scn.lords[fid] || FACTIONS[fid].jp,
      reputation: 0, choteki: false, chotekiUntil: 0, courtInfluence: fid === 'taira' ? 55 : 20,
      gold: 200, food: 0, alive: false,
    };
  }
  for (const k of DATA.kyoten) {
    const owner = k.own[scn.col] || null;
    // 駐留兵は種別と規模から導く（Phase 1 の暫定。Phase 2 で武士団へ移す）
    const mul = { kokufu: 1.2, tachi: 0.5, kisaku: 0.8, toride: 0.8, shoen: 2, tera: 6,
                  jinja: 3, sekisho: 1.2, machi: 2, mura: 4, minato: 3 }[k.type] || 1;
    state.kyoten[k.id] = { owner, garrison: Math.round(k.scale * mul + k.defense * 3) };
    if (owner) state.factions[owner].alive = true;
  }
  // 武士団。本領の持ち主に従い、無主の地の団は中立から始まる
  for (const b of buildBands()) {
    const home = state.kyoten[b.home];
    state.bands[b.id] = {
      id: b.id, nameJP: b.nameJP, nameEN: b.nameEN, home: b.home, province: b.province,
      troops: b.troops, independence: b.independence,
      faction: home && home.owner && holdsAllegiance(home.owner, b.province) ? home.owner : null,
      hoko: 0, ando: false, debt: 0,
    };
    if (state.bands[b.id].faction) state.bands[b.id].hoko = 55;
  }
  // 水軍は母港の持ち主に従うが、平氏の知行国であっても在地の海の民は中立から始まる
  for (const [sid] of Object.entries(SUIGUN)) {
    const port = DATA.kyoten.find((k) => k.suigun === sid);
    const owner = port ? state.kyoten[port.id].owner : null;
    state.suigun[sid] = {
      faction: port && owner && holdsAllegiance(owner, port.province) ? owner : null,
      home: port ? port.id : null,
    };
  }
  for (const fid of Object.keys(FACTIONS)) state.factions[fid].food = Rule.income(state, fid).food * 3;
  migrateState(state);
  pushLog(state, `${scn.jp} — ${state.year}年${state.month}月、乱世はじまる`);
  return state;
}

/* 保存データ・新規状態に、後から足したフィールドの既定値を入れる。
 * ★SAVE_VERSION を上げると遊びかけの盤面が捨てられるので、既定値で足りるものはここで補う。 */
function migrateState(state) {
  // 盤上に残っている神器・帝。開始時に誰も持っていないシナリオでは最初から「無い」
  if (!state.regalia) {
    state.regalia = {};
    for (const key of ['jingi', 'emperor']) {
      state.regalia[key] = Object.values(state.factions).some((f) => f.authority.includes(key));
    }
  }
  // ★2人対戦では京の保持月数を勢力ごとに数える必要があるため object 化。
  //   旧セーブ（数値のまま）は「その時のstate.faction」の値として引き継ぐ
  if (state.kyotoHoldMonths == null) state.kyotoHoldMonths = {};
  else if (typeof state.kyotoHoldMonths === 'number') state.kyotoHoldMonths = { [state.faction]: state.kyotoHoldMonths };
  if (!DIFFICULTIES[state.difficulty]) state.difficulty = 'normal';
  if (!state.achieveStats) state.achieveStats = { bloodlessOpenCount: 0, armyMarchedCount: 0, foodNegativeDuringFamine: false };
  if (!Array.isArray(state.humanFactions) || !state.humanFactions.length) state.humanFactions = [state.faction];
  if (!Array.isArray(state.actedThisRound)) state.actedThisRound = [];
  // 一騎討ちの戦績（列伝表示用・Could C-01）。武将id → {wins, losses}
  if (!state.duelRecord) state.duelRecord = {};
  return state;
}

function pushLog(state, text) {
  state.log.unshift({ y: state.year, m: state.month, text });
  if (state.log.length > 120) state.log.length = 120;
}

/* 一騎討ちの戦績（列伝表示用・Could C-01）。武将id → {wins, losses} */
function recordDuelResult(state, winGenId, loseGenId) {
  const bump = (id, key) => {
    if (!id) return;
    if (!state.duelRecord[id]) state.duelRecord[id] = { wins: 0, losses: 0 };
    state.duelRecord[id][key]++;
  };
  bump(winGenId, 'wins');
  bump(loseGenId, 'losses');
}

/* 拠点が落ちたときの後始末。★占領の副作用（恩賞の約束・寺社領接収の名分・ログ）は
 * 必ずここに集約する。AI の自動解決（applyActions）とプレイヤーのヘックス合戦の
 * 両方から呼ぶ。
 * ★かつてプレイヤー側は applyActions に troops:10**7 という番兵を渡して「必ず落ちた
 *   ことにする」つもりだったが、applyActions 冒頭の `src.garrison < act.troops` に
 *   弾かれて占領そのものが無言で捨てられていた。判定を二重化するとこうなる。 */
function captureKyoten(state, fid, kyotenId, garrison) {
  const target = DATA.kyotenById[kyotenId], dst = state.kyoten[kyotenId];
  const prev = dst.owner;
  dst.owner = fid;
  dst.garrison = Math.max(1, Math.round(garrison));
  state.factions[fid].alive = true;
  // 勝てば恩賞を約束したことになる。配れなければ後で効いてくる
  for (const b of Rule.bandsOf(state, fid)) b.debt += b.troops * RULE.debt.capture * 0.02;
  // 寺社領・摂関家領を武力で接収すると名分が下がる
  if (target.holder === 'jisha' || target.holder === 'sekkanke') {
    addRep(state, fid, RULE.rep.seizeJisha,
      fid === state.faction ? `${target.jp}を接収した——${HOLDER_JP[target.holder]}を侵したと京で沙汰される` : null);
  }
  if (prev === state.faction || fid === state.faction) pushLog(state, `${FACTIONS[fid].jp}が${target.jp}を落とした`);
}

/* 出兵の解決。★プレイヤーもAIも必ずこの関数を通す（判定が二重化すると必ず食い違う） */
function applyActions(state, fid, acts) {
  for (const act of acts) {
    const src = state.kyoten[act.from], dst = state.kyoten[act.to];
    if (!src || !dst || src.owner !== fid || src.garrison < act.troops) continue;
    const target = DATA.kyotenById[act.to];
    src.garrison -= act.troops;
    // 攻め手が守りを上回れば落ちる。下回れば撃退され、双方が兵を失う。
    // （「攻めれば必ず落ちる」にすると、拠点の多い勢力が毎ターン版図を倍にしてしまう）
    const defence = Rule.defenseStrength(state, target);
    const prev = dst.owner;
    if (act.troops > defence) {
      captureKyoten(state, fid, act.to, act.troops - defence);
    } else {
      dst.garrison = Math.max(0, dst.garrison - Math.floor(act.troops * 0.6));
      src.garrison += Math.floor(act.troops * 0.3);   // 生き残りが本領へ戻る
      if (prev === state.faction || fid === state.faction) pushLog(state, `${target.jp}が${FACTIONS[fid].jp}の攻めを凌いだ`);
    }
  }
}

/* 徴兵。金を兵に換える。国府の規模で決まる動員上限を超えられない */
function levy(state, fid, kyotenId, want) {
  const f = state.factions[fid], st = state.kyoten[kyotenId];
  if (!st || st.owner !== fid) return { ok: false, why: '自勢力の拠点ではない' };
  const inc = Rule.income(state, fid);
  const room = Math.max(0, inc.levyCap - inc.troops);
  const n = Math.min(want, room, Math.floor(f.gold / LEVY_COST));
  if (n <= 0) return { ok: false, why: room <= 0 ? '動員上限に達している' : '金が足りない' };
  f.gold -= n * LEVY_COST;
  st.garrison += n;
  return { ok: true, n };
}
const LEVY_COST = 0.5;   // 兵1あたりの金

/* 評判を動かす。★名分は毎回 calcMeibun で算出するので、ここは評判だけを触る */
function addRep(state, fid, delta, why) {
  const f = state.factions[fid];
  if (!f) return;
  f.reputation = clamp(f.reputation + delta, -600, 600);
  if (fid === state.faction && why) pushLog(state, why);
}

/* 無血開城を試みる（基本設計 4.2） */
function tryBloodlessOpen(state, fid, kyotenId) {
  const c = Rule.canOpenBloodless(state, fid, kyotenId);
  if (!c.ok) return { ok: false, why: c.why };
  const k = DATA.kyotenById[kyotenId], st = state.kyoten[kyotenId];
  const roll = c.def * (1 + (Math.random() * 2 - 1) * RULE.open.jitter);
  if (c.atk > roll) {
    st.owner = fid; st.garrison = Math.max(1, Math.round(st.garrison * 0.4));
    state.factions[fid].alive = true;
    addRep(state, fid, RULE.rep.bloodlessOpen);
    pushLog(state, `${k.jp}の在庁官人が門を開いた——${FACTIONS[fid].jp}、戦わずして国を得る`);
    if (fid === state.faction) {
      state.achieveStats.bloodlessOpenCount++;
      if (typeof checkAchievementsEvent === 'function') checkAchievementsEvent('bloodless_open', { isPlayer: true });
    }
    return { ok: true, opened: true };
  }
  st.openRetryUntil = state.turn + RULE.open.retryTurns;
  if (fid === state.faction) pushLog(state, `${k.jp}は門を開かなかった`);
  return { ok: true, opened: false };
}

/* 朝敵認定を奏請する（基本設計 4.3） */
function declareChoteki(state, fid, targetId) {
  const c = Rule.canDeclareChoteki(state, fid, targetId);
  if (!c.ok) return { ok: false, why: c.why };
  const f = state.factions[fid];
  f.gold -= RULE.choteki.costGold;
  f.chotekiCooldown = state.turn + RULE.choteki.cooldown;
  state.chotekiCount = (state.chotekiCount || 0) + 1;
  if (Math.random() < c.p) {
    const t = state.factions[targetId];
    t.choteki = true; t.chotekiUntil = state.turn + RULE.choteki.duration;
    pushLog(state, `院宣くだる——${FACTIONS[targetId].jp}、朝敵となる`);
    if (typeof checkAchievementsEvent === 'function') checkAchievementsEvent('choteki_declared', { targetFid: targetId, myFid: state.faction });
    return { ok: true, done: true };
  }
  if (fid === state.faction) pushLog(state, '奏請は容れられなかった');
  return { ok: true, done: false };
}

/* 乱妨取り（掠奪）と寺社への寄進。名分を金・兵糧と取り引きする2つの手。
 * ★飢饉のあいだ兵糧は買えない。「奪えば食えるが京での評判を失う」という
 *   選択を置くために掠奪がある。寄進はその評判を金で買い戻す手。 */
const PILLAGE_TYPES = new Set(['shoen', 'mura', 'machi', 'tera', 'jinja']);
function pillage(state, fid, kyotenId) {
  const k = DATA.kyotenById[kyotenId], st = state.kyoten[kyotenId];
  if (!st || st.owner !== fid) return { ok: false, why: '自勢力の拠点ではない' };
  if (!PILLAGE_TYPES.has(k.type)) return { ok: false, why: 'この拠点から奪えるものはない' };
  if ((st.pillagedUntil || 0) > state.turn) return { ok: false, why: `${st.pillagedUntil - state.turn}ヶ月は奪うものが残っていない` };
  const f = state.factions[fid];
  const gain = Math.max(1, Math.round(k.scale * RULE.econ.pillageMul));
  f.food += gain;
  st.pillagedUntil = state.turn + RULE.econ.pillageCooldown;
  // 寺社を襲えばなお悪い。接収と同じだけ上乗せする
  const jisha = k.type === 'tera' || k.type === 'jinja';
  addRep(state, fid, RULE.rep.pillage + (jisha ? RULE.rep.seizeJisha : 0),
    fid === state.faction ? `${k.jp}で乱妨取りをした——兵糧 ${gain}、そして京に悪評が立つ` : null);
  f.courtInfluence = clamp(f.courtInfluence + RULE.court.pillage, 0, RULE.court.max);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('pillaged', {});
  return { ok: true, gain };
}
function donateJisha(state, fid, kyotenId) {
  const k = DATA.kyotenById[kyotenId], st = state.kyoten[kyotenId];
  if (!st || st.owner !== fid) return { ok: false, why: '自勢力の拠点ではない' };
  if (k.type !== 'tera' && k.type !== 'jinja') return { ok: false, why: '寺社ではない' };
  const f = state.factions[fid];
  if (f.gold < RULE.econ.jishaDonateCost) return { ok: false, why: '金が足りない' };
  f.gold -= RULE.econ.jishaDonateCost;
  addRep(state, fid, RULE.rep.donateJisha, fid === state.faction ? `${k.jp}へ寄進した` : null);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('donation_made', {});
  return { ok: true };
}

/* 院への献納。朝廷支持と評判を買う */
function donateCourt(state, fid) {
  const f = state.factions[fid];
  if (f.gold < RULE.court.donateCost) return { ok: false, why: '金が足りない' };
  f.gold -= RULE.court.donateCost;
  f.courtInfluence = clamp(f.courtInfluence + RULE.court.donate, 0, RULE.court.max);
  addRep(state, fid, RULE.rep.donateCourt);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('donation_made', {});
  return { ok: true };
}

/* 本領安堵・新恩給与・粛清（基本設計 4.4） */
function grantAndo(state, fid, bandId) {
  const b = state.bands[bandId];
  if (!b || b.faction !== fid) return { ok: false, why: '麾下の武士団ではない' };
  if (b.ando) return { ok: false, why: 'すでに安堵している' };
  const f = state.factions[fid];
  if (Rule.calcMeibun(state, fid) < RULE.hoko.andoCost) return { ok: false, why: '名分が足りない' };
  f.reputation -= RULE.hoko.andoCost;
  b.ando = true; b.hoko = clamp(b.hoko + RULE.hoko.andoGain, 0, 100);
  pushLog(state, `${b.nameJP}の本領を安堵した`);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('reward_granted', {});
  return { ok: true };
}
function grantShinon(state, fid, bandId, kyotenId) {
  const b = state.bands[bandId], st = state.kyoten[kyotenId];
  if (!b || b.faction !== fid) return { ok: false, why: '麾下の武士団ではない' };
  if (!st || st.owner !== fid) return { ok: false, why: '自勢力の拠点ではない' };
  if (Object.values(state.bands).some((x) => x.shinon === kyotenId)) return { ok: false, why: 'その所領は他の団へ与えている' };
  b.shinon = kyotenId; b.debt = 0;
  b.hoko = clamp(b.hoko + RULE.hoko.shinonGain, 0, 100);
  pushLog(state, `${b.nameJP}に${DATA.kyotenById[kyotenId].jp}を宛て行った`);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('reward_granted', {});
  return { ok: true };
}
function purgeBand(state, fid, bandId) {
  const b = state.bands[bandId];
  if (!b || b.faction !== fid) return { ok: false, why: '麾下の武士団ではない' };
  b.faction = null; b.hoko = 0; b.debt = 0; b.ando = false; b.shinon = null;
  addRep(state, fid, RULE.rep.purge);
  for (const o of Rule.bandsOf(state, fid)) o.hoko = clamp(o.hoko - 5, 0, 100);
  pushLog(state, `${b.nameJP}を誅した——味方の胸に疑いが残る`);
  if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('band_purged', {});
  return { ok: true };
}
function tryRecruit(state, fid, bandId, gift) {
  const c = Rule.recruitChance(state, fid, bandId, gift);
  if (!c.ok) return { ok: false, why: c.why };
  const f = state.factions[fid], b = state.bands[bandId];
  if (f.gold < (gift || 0)) return { ok: false, why: '金が足りない' };
  f.gold -= (gift || 0);
  if (c.score > RULE.recruit.threshold * (1 + (Math.random() * 2 - 1) * RULE.recruit.jitter)) {
    const from = b.faction;
    b.faction = fid; b.hoko = RULE.hoko.joinHoko; b.debt = b.troops * RULE.debt.onJoin;
    b.ando = false; b.shinon = null;
    f.alive = true;
    // 他家の麾下を剥がすのは京では不義と見られる
    if (from) addRep(state, fid, RULE.recruit.poachRep);
    pushLog(state, from
      ? `${b.nameJP}が${FACTIONS[from].jp}を離れ${FACTIONS[fid].jp}に与した——不義と京では言う`
      : `${b.nameJP}が${FACTIONS[fid].jp}に与した`);
    if (fid === state.faction && typeof checkAchievementsEvent === 'function') checkAchievementsEvent('band_recruited', { poached: !!from });
    return { ok: true, joined: true, poached: !!from };
  }
  if (fid === state.faction) pushLog(state, `${b.nameJP}は動かなかった`);
  return { ok: true, joined: false };
}

/* 史実イベントの効果（要件 M-40 / M-41）。
   ★盤面に効かないイベントはログの飾りにしかならない。三国志で「シナリオを選んでも
     盤面が変わらない」失敗があったので、ここは必ず状態を動かす。 */
function applyEventEffect(state, fx) {
  const F = state.factions;
  switch (fx) {
    case 'kiyomori_death':
      // 清盛の死。当主が宗盛へ替わり家格が落ちる＝平氏の名分が一段下がる
      if (F.taira && F.taira.alive && F.taira.lord === '平清盛') {
        F.taira.lord = '平宗盛';
        pushLog(state, '清盛入道、熱病に薨ず——平氏の重石が外れた');
      }
      break;
    case 'nanto':
      // 南都焼討。寺社を敵に回す
      if (F.taira && F.taira.alive) {
        addRep(state, 'taira', RULE.rep.seizeJisha * 2);
        for (const b of Rule.bandsOf(state, 'taira')) b.hoko = clamp(b.hoko - 6, 0, 100);
      }
      break;
    case 'miyako_ochi':
      // 都落ち。平氏が畿内を保っていれば院の身柄を失い、神器と帝は連れて出る
      if (F.taira && F.taira.alive) {
        F.taira.authority = F.taira.authority.filter((a) => a !== 'in');
        F.taira.courtInfluence = clamp(F.taira.courtInfluence - 30, 0, RULE.court.max);
      }
      break;
    case 'senji': {
      // 寿永二年十月宣旨。東国で最も版図の大きい源氏へ宣旨が下る
      const cand = ['kamakura', 'kiso'].filter((f) => F[f] && F[f].alive)
        .sort((a, b) => Rule.ownedKyoten(state, b).length - Rule.ownedKyoten(state, a).length)[0];
      if (cand && !F[cand].authority.includes('senji')) {
        for (const f of Object.values(F)) f.authority = f.authority.filter((a) => a !== 'senji');
        F[cand].authority.push('senji');
        pushLog(state, `${FACTIONS[cand].jp}に宣旨くだる——東国の支配を朝廷が認めた`);
      }
      break;
    }
    case 'dannoura':
      // ★宝剣は海に沈む。神器の完全奪還は史実ルートでは成らない
      if (!state.jingiLost) {
        state.jingiLost = true;
        pushLog(state, '宝剣は波の底に沈み、ついに上がらなかった');
      }
      break;
    case 'shugo_jito': {
      // 文治の勅許。宣旨を持つ勢力の国府収入が上がる（守護・地頭の設置）
      const holder = Object.keys(F).find((f) => F[f].alive && F[f].authority.includes('senji'));
      if (holder) { addRep(state, holder, 40); state.shugoJito = holder; }
      break;
    }
    default: break;
  }
}

/* AI の政治行動（基本設計 第5節）。出兵と同じ優先度で名分・恩賞を運用する。
   ★これがないと「AIは殴るだけ」になり、名分を軸にしたゲームが player 側でしか回らない */
function aiPolitics(state, fid) {
  const f = state.factions[fid];
  // 離反寸前の団を安堵する（最も安い延命）
  const risky = Rule.bandsOf(state, fid).filter((b) => !b.ando && b.hoko < 35)
    .sort((a, b) => a.hoko - b.hoko)[0];
  if (risky && Rule.calcMeibun(state, fid) > RULE.hoko.andoCost * 3) grantAndo(state, fid, risky.id);
  // 隣の国府を名分で開ける見込みがあれば試す
  for (const k of DATA.kyoten) {
    if (k.type !== 'kokufu' || state.kyoten[k.id].owner === fid) continue;
    const c = Rule.canOpenBloodless(state, fid, k.id);
    if (c.ok && c.p > 0.6) { tryBloodlessOpen(state, fid, k.id); break; }
  }
  // 献納で朝廷支持を買い、最大勢力を朝敵に落とす
  if (f.gold > RULE.court.donateCost * 3 && f.courtInfluence < RULE.choteki.needInfluence) donateCourt(state, fid);
  const rival = Object.keys(FACTIONS)
    .filter((x) => x !== fid && state.factions[x].alive)
    .sort((a, b) => Rule.ownedKyoten(state, b).length - Rule.ownedKyoten(state, a).length)[0];
  if (rival && Rule.ownedKyoten(state, rival).length > Rule.ownedKyoten(state, fid).length) {
    const c = Rule.canDeclareChoteki(state, fid, rival);
    if (c.ok && c.p > 0.45) declareChoteki(state, fid, rival);
  }
  // 手の届く中立の団を勧誘する（AI は引き抜きまではしない。名分を捨ててまで欲しがらない）
  const neutral = Object.values(state.bands).filter((b) => !b.faction);
  for (const b of neutral) {
    const c = Rule.recruitChance(state, fid, b.id, 0);
    if (c.ok && c.score > RULE.recruit.threshold) { tryRecruit(state, fid, b.id, 0); break; }
  }
  // 兵糧が尽きたら乱妨取りに走る。名分を削ってでも兵を食わせる——飢饉の年の実像
  if (f.food <= 0) {
    const loot = Rule.ownedKyoten(state, fid)
      .filter((k) => PILLAGE_TYPES.has(k.type) && (state.kyoten[k.id].pillagedUntil || 0) <= state.turn)
      .sort((a, b) => b.scale - a.scale)[0];
    if (loot) pillage(state, fid, loot.id);
  }
  // 評判が沈んだら手持ちの寺社へ寄進して買い戻す
  if (f.reputation < -40 && f.gold > RULE.econ.jishaDonateCost * 3) {
    const jisha = Rule.ownedKyoten(state, fid).find((k) => k.type === 'tera' || k.type === 'jinja');
    if (jisha) donateJisha(state, fid, jisha.id);
  }
}

/* ターン終了（詳細設計 第5節のシーケンス。Phase 1 で実装済みの段のみ） */
function endTurn(state, audio) {
  const wasFamineActive = Rule.famineActive(state);
  // 1. 時代イベントの発火（ログを出し、fx があれば盤面へ効かせる）
  for (const ev of TIMELINE) {
    if (ev.y !== state.year || ev.m !== state.month) continue;
    pushLog(state, ev.jp);
    if (ev.fx) applyEventEffect(state, ev.fx);
  }
  // 3-4. 収支と兵糧枯渇
  for (const fid of Object.keys(FACTIONS)) {
    const f = state.factions[fid];
    if (!f.alive) continue;
    const inc = Rule.income(state, fid);
    const goldMul = fid === state.faction ? 1 : difficultyOf(state).aiGoldMul;
    f.food = Math.max(0, f.food + inc.net);
    f.gold += Math.round(inc.gold * goldMul);
    if (f.food <= 0 && inc.troops > 0) {
      for (const k of Rule.ownedKyoten(state, fid)) {
        const st = state.kyoten[k.id];
        st.garrison = Math.max(0, Math.round(st.garrison * (1 - RULE.econ.starveTroop)));
      }
      if (fid === state.faction) {
        pushLog(state, '兵糧が尽き、兵が逃散した');
        if (Rule.famineActive(state)) state.achieveStats.foodNegativeDuringFamine = true;
      }
    }
  }
  // 5. 院影響力（献納・畿内の国府・院の身柄・自然減衰）
  for (const fid of Object.keys(FACTIONS)) {
    const f = state.factions[fid];
    if (!f.alive) continue;
    let d = -f.courtInfluence * RULE.court.decay;
    for (const k of Rule.ownedKyoten(state, fid)) {
      const p = DATA.provById[k.province];
      if (k.type === 'kokufu' && p && p.circuit === 'kinai') d += RULE.court.kinaiKokufu;
    }
    if (f.authority.includes('in')) d += RULE.court.holdIn;
    f.courtInfluence = clamp(f.courtInfluence + d, 0, RULE.court.max);
  }
  // 6. 評判の減衰（名分は calcMeibun が都度算出するので、動かすのは評判だけ）
  for (const fid of Object.keys(FACTIONS)) {
    const f = state.factions[fid];
    f.reputation = Math.abs(f.reputation) < 1 ? 0 : f.reputation * (1 - RULE.meibun.reputationDecay);
  }
  // 7. 奉公度の減衰と離反
  //    ★6より後に置くこと。逆だと名分の変化が1ヶ月遅れて効き、朝敵になった直後に
  //      離反が起きず、プレイヤーに因果が伝わらない。
  for (const b of Object.values(state.bands)) {
    if (!b.faction) continue;
    b.debt += b.troops * RULE.debt.perTurn;
    b.hoko = clamp(b.hoko - Rule.hokoDecay(state, b.id).total, 0, 100);
    if (b.hoko >= RULE.hoko.defectBelow) continue;
    if (Math.random() >= (RULE.hoko.defectBelow - b.hoko) / RULE.hoko.defectDiv) continue;
    const was = b.faction, home = DATA.kyotenById[b.home];
    // 近くに名分の高い勢力がいればそちらへ寝返る。いなければ中立へ戻る
    let to = null, best = Rule.calcMeibun(state, was);
    for (const fid of Object.keys(FACTIONS)) {
      if (fid === was || !state.factions[fid].alive) continue;
      if (!Rule.ownedKyoten(state, fid).some((k) => Rule.adjacent(k, home))) continue;
      const m = Rule.calcMeibun(state, fid);
      if (m > best) { best = m; to = fid; }
    }
    b.faction = to; b.hoko = to ? 35 : 0; b.ando = false; b.debt = 0; b.shinon = null;
    if (was === state.faction || to === state.faction) {
      pushLog(state, to ? `${b.nameJP}が${FACTIONS[to].jp}へ寝返った` : `${b.nameJP}が離反した`);
    }
  }
  // 8. 朝敵の期限切れ
  for (const fid of Object.keys(FACTIONS)) {
    const f = state.factions[fid];
    if (f.choteki && state.turn >= f.chotekiUntil) {
      f.choteki = false;
      if (fid === state.faction) pushLog(state, '朝敵の宣を解かれた');
    }
  }
  // 9. AI の行動（★2人対戦では humanFactions 全員がAIの対象外。state.faction は「今の手番」1人だけを指すため単独では足りない）
  for (const fid of Object.keys(FACTIONS)) {
    if (state.humanFactions.includes(fid)) continue;
    const f = state.factions[fid];
    if (!f.alive || !FACTIONS[fid].playable) continue;
    applyActions(state, fid, Rule.aiActions(state, fid));
    aiPolitics(state, fid);
  }
  for (const fid of Object.keys(FACTIONS)) state.factions[fid].alive = Rule.ownedKyoten(state, fid).length > 0;
  // 10. 神器と帝の行方（要件 M-41）。保持勢力が滅べば最も名分の高い勢力へ渡る
  //     ★盤上に無いものを湧かせてはいけない。state.regalia[key] が「まだ盤上にある」の正本で、
  //       ここを見ないと (a) 平氏滅亡後に始まる s1185b で、冒頭文が「宝剣は海に沈んだ」と
  //       語った直後の一ヶ月目に神器と帝が最高名分の勢力へ湧き、(b) 壇ノ浦のあと保持勢力が
  //       滅ぶと「誰も持たない」状態が続くため、毎ターン評判+60とログが無限に積み上がる。
  for (const key of ['jingi', 'emperor']) {
    if (!state.regalia || !state.regalia[key]) continue;      // もう盤上に無い
    const holder = Object.keys(FACTIONS).find((f) => state.factions[f].authority.includes(key));
    if (holder && state.factions[holder].alive) continue;
    const next = Object.keys(FACTIONS).filter((f) => state.factions[f].alive && FACTIONS[f].playable)
      .sort((a, b) => Rule.calcMeibun(state, b) - Rule.calcMeibun(state, a))[0];
    if (!next) continue;
    for (const f of Object.values(state.factions)) f.authority = f.authority.filter((a) => a !== key);
    // 壇ノ浦のあとは宝剣を欠いた神器になる（権威としては失われ、名声だけが残る）
    if (key === 'jingi' && state.jingiLost) {
      state.factions[next].reputation += 60;
      state.regalia.jingi = false;                             // ★引き継ぎは一度きり
    } else state.factions[next].authority.push(key);
    pushLog(state, key === 'jingi'
      ? (state.jingiLost ? `神器は${FACTIONS[next].jp}の手に——ただし宝剣を欠く` : `三種の神器は${FACTIONS[next].jp}の手に渡った`)
      : `帝は${FACTIONS[next].jp}に奉じられた`);
  }
  // 11. 京の保持を数える（木曽の勝利条件。落とすか朝敵になれば振り出しに戻る）
  // ★勢力ごとに数える（2人対戦で「最後に手番を終えた側」だけが計測される事故を防ぐ）
  for (const fid of Object.keys(FACTIONS)) {
    state.kyotoHoldMonths[fid] = Rule.holdsCapital(state, fid) ? (state.kyotoHoldMonths[fid] || 0) + 1 : 0;
  }
  // 12. 月を進める
  state.month++;
  if (state.month > 12) { state.month = 1; state.year++; }
  state.turn++;
  // 13. 勝敗（★2人対戦ではhumanFactions全員について判定する。checkVictoryはstate.factionを見る
  //     実装のため、一時的に切り替えて呼ぶ——checkVictory自体は改修しない）
  let v;
  if (state.humanFactions.length > 1) {
    const savedFaction = state.faction;
    let anyContinuing = false, winResult = null, lastLoss = null;
    for (const fid of state.humanFactions) {
      state.faction = fid;
      const vf = Rule.checkVictory(state);
      if (vf.done && vf.win) { winResult = { ...vf, winner: fid }; break; }
      if (!vf.done) anyContinuing = true;
      else lastLoss = vf;
    }
    state.faction = savedFaction;
    v = winResult || (anyContinuing ? { done: false } : (lastLoss || { done: false }));
  } else {
    v = Rule.checkVictory(state);
  }
  if (v.done) {
    state.result = v;
    // 一度でも終幕まで見届けたら「もし清盛が死なざれば」を解禁する。
    // ★ここで書かないと unlockable のシナリオは誰にも開かれないまま残る
    save.set('unlocked_sif', true);
    if (typeof checkAchievementsEvent === 'function') {
      // ★2人対戦では勝者(v.winner)が state.faction と異なることがある（最後に手番を終えた側と
      //   勝者は別人でもよい）ため、実績の帰属先は必ず v.winner を優先する
      const attributedFid = v.winner || state.faction;
      checkAchievementsEvent('scenario_ended', {
        win: v.win, victory: FACTIONS[attributedFid].victory, faction: attributedFid,
        scenario: state.scenario, jingiLost: !!state.jingiLost,
      });
    }
  }
  if (typeof checkAchievementsPoll === 'function') {
    // ★2人対戦ではhumanFactions全員ぶん判定する（名分・拠点・京保持は各自算出。
    //   achieveStatsのみ共有カウンタ）
    for (const fid of state.humanFactions) {
      checkAchievementsPoll({
        faction: fid, scenario: state.scenario,
        meibun: Rule.calcMeibun(state, fid),
        seats: Rule.ownedKyoten(state, fid).filter((k) => k.type === 'kokufu').length,
        kyotoHoldMonths: (state.kyotoHoldMonths && state.kyotoHoldMonths[fid]) || 0,
        jingiLost: !!state.jingiLost,
        famineJustEnded: wasFamineActive && !Rule.famineActive(state),
        foodNegativeDuringFamine: state.achieveStats.foodNegativeDuringFamine,
        armyMarchedCount: state.achieveStats.armyMarchedCount,
        bloodlessOpenCount: state.achieveStats.bloodlessOpenCount,
      });
    }
  }
  // 飢饉(kikin) の開始検出。false→true になった最初のターンだけ、沈んだ不吉な低音を1回鳴らす
  if (audio && !wasFamineActive && Rule.famineActive(state)) {
    audio.beep(96, 0.5, 'sawtooth', 0.2);
    audio.beep(72, 0.7, 'sawtooth', 0.22);
  }
  // 14. オートセーブ
  save.set('autosave', state);
  return state;
}

      ctx.moveTo(-s * 0.8, -s * 0.22); ctx.lineTo(s * 0.8, -s * 0.22);
      ctx.moveTo(-s * 0.55, -s * 0.55); ctx.lineTo(-s * 0.42, s * 0.55);
      ctx.moveTo(s * 0.55, -s * 0.55); ctx.lineTo(s * 0.42, s * 0.55);
      ctx.lineWidth = Math.max(1.4, s * 0.19); ctx.strokeStyle = color; ctx.stroke();
      break;
    }
    case 'sekisho': {                                  // 関所: 門
      ctx.beginPath();
      ctx.moveTo(-s * 0.9, -s * 0.4); ctx.lineTo(s * 0.9, -s * 0.4);
      ctx.moveTo(-s * 0.6, -s * 0.4); ctx.lineTo(-s * 0.6, s * 0.55);
      ctx.moveTo(s * 0.6, -s * 0.4); ctx.lineTo(s * 0.6, s * 0.55);
      ctx.lineWidth = Math.max(1.3, s * 0.17); ctx.strokeStyle = color; ctx.stroke();
      break;
    }
    case 'machi': {                                    // 町: 家並み
      for (let i = -1; i <= 1; i++) {
        ctx.save(); ctx.translate(i * s * 0.62, i === 0 ? -s * 0.16 : 0);
        roof(s * 0.34, s * 0.2, 0); box(s * 0.24, s * 0.34, 0);
        ctx.restore();
      }
      break;
    }
    case 'mura':                                       // 村: 小屋
      roof(s * 0.6, s * 0.34, s * 0.1); box(s * 0.36, s * 0.3, s * 0.1);
      break;
    case 'minato': {                                   // 湊: 舟
      ctx.beginPath();
      ctx.moveTo(-s, s * 0.1); ctx.quadraticCurveTo(0, s * 0.8, s, s * 0.1);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, s * 0.1); ctx.lineTo(0, -s * 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -s * 0.85); ctx.lineTo(s * 0.7, -s * 0.35); ctx.lineTo(0, -s * 0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    }
    default:
      ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/* 家紋。★Canvas のみで描く（画像に依存しないので後読みの失敗で消えない）。
 * 意匠は伝統紋（保護期間の概念がない中世の図案）を Bezier で起こした自作で、
 * 既存の紋帳・素材集をトレースしたものではない。朝廷の菊も十二弁で、
 * 十六葉八重表菊（皇室の紋章そのもの）は避けてある。
 * 平氏＝揚羽蝶／源氏＝笹竜胆／奥州藤原＝下がり藤／朝廷＝菊。
 * 三つ鱗は北条氏用に用意してあるが、北条は現状「武士団」で勢力ではないため未割当。 */
/* GPT-image-2 の拠点アイコン。未読込・欠損時は従来のCanvas描画を使用する。 */
function drawLoadedSiteIcon(ctx, kind, x, y, s, color) {
  const variant = s <= 8 ? 'province' : (s <= 12 ? 'local' : 'detail');
  const img = ASSETS.siteIcons[variant] && ASSETS.siteIcons[variant][kind];
  if (img && img.complete && img.naturalWidth) {
    // 元のCanvasアイコンと同程度の画面占有率で、倍率別アセットを表示する。
    const d = s * 2.5;
    ctx.drawImage(img, x - d / 2, y - d / 2, d, d);
    return;
  }
  drawSiteIcon(ctx, kind, x, y, s, color);
}

const KAMON = {
  taira: 'ageha', kamakura: 'sasarindo', kiso: 'sasarindo', kai: 'sasarindo',
  yoshitsune: 'sasarindo', oshu: 'fuji', goshirakawa: 'kiku',
};
function drawKamon(ctx, fid, x, y, r) {
  const c = FACTIONS[fid] ? FACTIONS[fid].color : '#94a3b8';
  const kind = KAMON[fid] || 'kiku';
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(8,11,17,0.88)'; ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.11); ctx.strokeStyle = c; ctx.stroke();
  ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = Math.max(0.8, r * 0.09);
  const u = r * 0.72;
  if (kind === 'ageha') {                                  // 揚羽蝶
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, u * 0.15);
      ctx.quadraticCurveTo(sx * u * 1.05, -u * 0.95, sx * u * 0.42, -u * 0.05);
      ctx.quadraticCurveTo(sx * u * 0.95, u * 0.35, sx * u * 0.18, u * 0.82);
      ctx.quadraticCurveTo(sx * u * 0.05, u * 0.4, 0, u * 0.15);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(0, u * 0.2); ctx.lineTo(0, -u * 0.5); ctx.stroke();
  } else if (kind === 'sasarindo') {                       // 笹竜胆
    for (const [dx, dy, sc] of [[0, -0.55, 1], [-0.5, 0.15, 0.85], [0.5, 0.15, 0.85]]) {
      ctx.beginPath();
      ctx.ellipse(dx * u, dy * u, u * 0.2 * sc, u * 0.42 * sc, dx * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, u * 0.55);
      ctx.quadraticCurveTo(sx * u * 0.7, u * 0.6, sx * u * 0.85, u * 0.15);
      ctx.stroke();
    }
  } else if (kind === 'mitsuuroko') {                      // 三つ鱗
    for (const [dx, dy] of [[0, -0.45], [-0.45, 0.4], [0.45, 0.4]]) {
      ctx.beginPath();
      ctx.moveTo(dx * u, dy * u - u * 0.38);
      ctx.lineTo(dx * u - u * 0.36, dy * u + u * 0.3);
      ctx.lineTo(dx * u + u * 0.36, dy * u + u * 0.3);
      ctx.closePath(); ctx.fill();
    }
  } else if (kind === 'fuji') {                            // 下がり藤
    ctx.beginPath(); ctx.moveTo(-u * 0.5, -u * 0.75); ctx.quadraticCurveTo(0, -u * 0.45, u * 0.5, -u * 0.75); ctx.stroke();
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const yy = -u * 0.5 + i * u * 0.4;
        ctx.beginPath();
        ctx.ellipse(sx * u * (0.42 - i * 0.06), yy + u * 0.25, u * 0.17, u * 0.24, sx * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else {                                                 // 菊
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * u * 0.55, Math.sin(a) * u * 0.55, u * 0.15, u * 0.32, a + Math.PI / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, u * 0.24, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* 人物の肖像。★プロシージャル（大鎧・直垂・僧形・法衣を能力と勢力から描き分ける）。
 * 画像アセットが無くても顔が出るので、後読みの失敗で白い箱にならない。 */
function drawPortrait(ctx, gen, x, y, size) {
  const portrait = gen && ASSETS.portraits[gen.id];
  if (portrait && portrait.naturalWidth) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); ctx.roundRect(-size, -size, size * 2, size * 2, size * 0.12); ctx.clip();
    ctx.drawImage(portrait, -size, -size, size * 2, size * 2);
    ctx.restore();
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = 'rgba(216,178,106,0.62)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-size, -size, size * 2, size * 2, size * 0.12); ctx.stroke(); ctx.restore();
    return;
  }
  const col = gen && FACTIONS[gen.faction] ? FACTIONS[gen.faction].color : '#94a3b8';
  const rank = gen ? gen.kakaku : 50;
  const S = (v) => size * v;
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.roundRect(-size, -size, size * 2, size * 2, S(0.12)); ctx.clip();

  // 背景（勢力色を敷いてから暗く落とす。白系の勢力でも顔が沈まないように）
  const bg = ctx.createRadialGradient(0, -S(0.3), S(0.1), 0, 0, size * 1.4);
  bg.addColorStop(0, hexA(col, 0.24)); bg.addColorStop(1, 'rgba(6,9,14,0.96)');
  ctx.fillStyle = bg; ctx.fillRect(-size, -size, size * 2, size * 2);

  // 大鎧の胴と草摺（縅の段を重ねる）
  const armor = ctx.createLinearGradient(0, S(0.05), 0, size);
  armor.addColorStop(0, hexA(col, 0.95)); armor.addColorStop(1, hexA(col, 0.55));
  ctx.fillStyle = armor;
  ctx.beginPath();
  ctx.moveTo(-S(0.92), size);
  ctx.quadraticCurveTo(-S(0.86), S(0.2), -S(0.38), S(0.06));
  ctx.lineTo(S(0.38), S(0.06));
  ctx.quadraticCurveTo(S(0.86), S(0.2), S(0.92), size);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = Math.max(1, S(0.045));
  for (let i = 1; i <= 4; i++) {
    const yy = S(0.18 + i * 0.19), w = S(0.9 - i * 0.015);
    ctx.beginPath(); ctx.moveTo(-w, yy); ctx.lineTo(w, yy); ctx.stroke();
  }
  // 大袖
  ctx.fillStyle = hexA(col, 0.8);
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sx * S(0.5), S(0.1));
    ctx.quadraticCurveTo(sx * S(1.0), S(0.16), sx * S(0.96), S(0.7));
    ctx.lineTo(sx * S(0.58), S(0.66));
    ctx.closePath(); ctx.fill();
  }

  // 首・顔
  ctx.fillStyle = '#b8926c';
  ctx.beginPath(); ctx.rect(-S(0.15), -S(0.16), S(0.3), S(0.28)); ctx.fill();
  const skin = ctx.createLinearGradient(0, -S(0.7), 0, S(0.06));
  skin.addColorStop(0, '#e0bb92'); skin.addColorStop(1, '#c19a72');
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.moveTo(-S(0.3), -S(0.44));
  ctx.quadraticCurveTo(-S(0.32), -S(0.02), 0, S(0.07));
  ctx.quadraticCurveTo(S(0.32), -S(0.02), S(0.3), -S(0.44));
  ctx.quadraticCurveTo(S(0.24), -S(0.74), 0, -S(0.74));
  ctx.quadraticCurveTo(-S(0.24), -S(0.74), -S(0.3), -S(0.44));
  ctx.closePath(); ctx.fill();

  // 目（騎射が高いほど鋭く細い）
  const sharp = gen ? clamp((gen.kisha - 55) / 55, -0.5, 0.7) : 0;
  for (const sx of [-1, 1]) {
    ctx.fillStyle = '#f4e7d6';
    ctx.beginPath();
    ctx.ellipse(sx * S(0.14), -S(0.36), S(0.10), S(0.055 - sharp * 0.016), sx * sharp * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#25201c';
    ctx.beginPath(); ctx.arc(sx * S(0.14), -S(0.36), S(0.042), 0, Math.PI * 2); ctx.fill();
    // 眉（太刀が高いほど太い）
    ctx.strokeStyle = '#2a231d'; ctx.lineWidth = Math.max(1, S(0.03 + (gen ? gen.tachi : 50) / 2600));
    ctx.beginPath();
    ctx.moveTo(sx * S(0.05), -S(0.47));
    ctx.quadraticCurveTo(sx * S(0.16), -S(0.53 + sharp * 0.03), sx * S(0.25), -S(0.45));
    ctx.stroke();
  }
  // 鼻と口
  ctx.strokeStyle = 'rgba(90,64,44,0.6)'; ctx.lineWidth = Math.max(1, S(0.026));
  ctx.beginPath(); ctx.moveTo(0, -S(0.32)); ctx.lineTo(-S(0.04), -S(0.18)); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-S(0.09), -S(0.09));
  ctx.quadraticCurveTo(0, -S(0.055), S(0.09), -S(0.09));
  ctx.stroke();
  // 髭（太刀が高い者は蓄える）
  if (gen && gen.tachi >= 78) {
    ctx.strokeStyle = '#2a231d'; ctx.lineWidth = Math.max(1, S(0.05));
    ctx.beginPath();
    ctx.moveTo(-S(0.17), -S(0.13)); ctx.quadraticCurveTo(0, -S(0.05), S(0.17), -S(0.13));
    ctx.stroke();
  }

  // 烏帽子／兜（家格が高いほど立派）
  ctx.fillStyle = '#161b22';
  ctx.beginPath();
  ctx.moveTo(-S(0.34), -S(0.56));
  ctx.quadraticCurveTo(-S(0.3), -S(0.84 + rank / 320), 0, -S(0.86 + rank / 300));
  ctx.quadraticCurveTo(S(0.3), -S(0.84 + rank / 320), S(0.34), -S(0.56));
  ctx.quadraticCurveTo(0, -S(0.66), -S(0.34), -S(0.56));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = hexA(col, 0.85); ctx.lineWidth = Math.max(1, S(0.035)); ctx.stroke();
  if (rank >= 68) {                       // 吹返し（高家のしるし）
    ctx.fillStyle = hexA(col, 0.92);
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * S(0.31), -S(0.58));
      ctx.quadraticCurveTo(sx * S(0.66), -S(0.52), sx * S(0.52), -S(0.2));
      ctx.quadraticCurveTo(sx * S(0.36), -S(0.4), sx * S(0.31), -S(0.58));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (rank >= 85) {                       // 鍬形（最上位）
    ctx.strokeStyle = '#d8b26a'; ctx.lineWidth = Math.max(1.4, S(0.06));
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * S(0.1), -S(0.8));
      ctx.quadraticCurveTo(sx * S(0.3), -S(1.02), sx * S(0.16), -S(1.1));
      ctx.stroke();
    }
  }
  ctx.restore();
  // 枠
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = 'rgba(216,178,106,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(-size, -size, size * 2, size * 2, S(0.12)); ctx.stroke();
  ctx.restore();
}

/* 背景のアニメーションパーティクル（サイト共通の演出） */
class Backdrop {
  constructor() { this.p = new GameKit.Particles(W, H, { count: 40 }); }
  update(dt) { this.p.update(dt); }
  draw(ctx) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#080b11'); g.addColorStop(1, '#0d1119');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = 0.45; this.p.draw(ctx); ctx.restore();
  }
}

/* ============================================================================
 * 6. シーン（タイトル〜勢力選択）
 * ========================================================================== */
class BootScene extends GameKit.Scene {
  enter(g) {
    this.msg = 'データを読み込んでいます / Loading';
    this.t = 0;
    Promise.all([loadData(), loadMap(), loadPortraits(), loadSiteIcons(), loadSiteDetailArt(), loadBattleBg(), loadEventArt()])
      .then(() => { g.changeScene(new TitleScene()); })
      .catch((e) => {
        console.error(e);
        this.msg = '起動に失敗しました: ' + e.message;
        const el = document.getElementById('boot-error');
        el.style.display = 'block';
        el.textContent = '起動に失敗しました / Failed to start: ' + e.message;
      });
  }
  update(dt) { this.t += Math.max(0, dt); }   // 初回フレームの dt は負になりうる
  draw(ctx) {
    ctx.fillStyle = '#080b11'; ctx.fillRect(0, 0, W, H);
    txt(ctx, '源平争乱記', W / 2, H / 2 - 40, { font: '600 40px "Hiragino Mincho ProN", serif', color: '#e8d3a0', align: 'center' });
    txt(ctx, this.msg, W / 2, H / 2 + 24, { font: '13px "Segoe UI", sans-serif', color: '#7c8ba1', align: 'center' });
    txt(ctx, '・'.repeat(Math.max(0, Math.floor(Math.max(0, this.t) * 3) % 4)), W / 2, H / 2 + 48, { font: '13px sans-serif', color: '#d8b26a', align: 'center' });
  }
}

class TitleScene extends GameKit.Scene {
  enter() {
    this.bd = new Backdrop(); this.t = 0;
    const saved = save.get('autosave', null);
    this.hasSave = !!(saved && saved.version === SAVE_VERSION && !saved.result);
    this.staleSave = !!(saved && saved.version !== SAVE_VERSION);
    this.buttons = [
      { id: 'new', x: W / 2 - 190, y: 470, w: 380, h: 58, jp: '新規に始める', en: 'New Game' },
      { id: 'cont', x: W / 2 - 190, y: 540, w: 380, h: 58, jp: '続きから', en: 'Continue', disabled: !this.hasSave },
    ];
    this.helpBtn = { id: 'help', x: W / 2 - 190, y: 610, w: 320, h: 44, jp: '遊び方 / How to Play', font: '600 15px "Hiragino Mincho ProN", serif', radius: 6 };
    this.bgmBtn = { id: 'bgm', x: W / 2 + 140, y: 610, w: 50, h: 44, jp: BGM.enabled ? '♪' : '🔇', font: '600 18px sans-serif', radius: 6 };
    this.help = { open: false, page: 0 };
  }
  update(dt, g) {
    this.t += dt; this.bd.update(dt);
    const p = g.input.pointer;
    if (!p.justPressed) return;
    if (!BGM.ac) { BGM.ensure(); if (BGM.enabled) BGM.start(); }
    if (this.help.open) { handleHelpClick(this.help, p); return; }
    if (hit(this.helpBtn, p)) { g.audio.jingle([{ f: 440, d: 0.07 }]); this.help.open = true; this.help.page = 0; return; }
    if (hit(this.bgmBtn, p)) { BGM.toggle(); this.bgmBtn.jp = BGM.enabled ? '♪' : '🔇'; return; }
    for (const b of this.buttons) {
      if (!hit(b, p) || b.disabled) continue;
      g.audio.jingle([{ f: 392, d: 0.09 }, { f: 523, d: 0.14 }]);
      if (b.id === 'new') g.changeScene(new ScenarioSelectScene());
      else {
        const st = save.get('autosave', null);
        if (st && st.version === SAVE_VERSION) g.changeScene(new MapScene(migrateState(st)));
      }
    }
  }
  draw(ctx, g) {
    this.bd.draw(ctx);
    if (ASSETS.mapReady) {
      ctx.save(); ctx.globalAlpha = 0.22;
      const s = Math.max(W / ASSETS.map.naturalWidth, H / ASSETS.map.naturalHeight) * 1.1;
      const dw = ASSETS.map.naturalWidth * s, dh = ASSETS.map.naturalHeight * s;
      ctx.drawImage(ASSETS.map, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.restore();
    }
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(8,11,17,0.55)'); grad.addColorStop(1, 'rgba(8,11,17,0.92)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    txt(ctx, '源 平 争 乱 記', W / 2, 210, { font: '600 66px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
    txt(ctx, 'GENPEI SOURANKI', W / 2, 300, { font: '15px "Segoe UI", sans-serif', color: '#d8b26a', align: 'center' });
    txt(ctx, '治承・寿永の乱  1180 — 1189', W / 2, 336, { font: '14px "Hiragino Mincho ProN", serif', color: '#8b98ab', align: 'center' });
    txt(ctx, '城ではなく、名分を獲る。 / Win legitimacy, not castles.', W / 2, 374, { font: '13px "Hiragino Mincho ProN", serif', color: '#a78bfa', align: 'center' });
    const p = g.input.pointer;
    for (const b of this.buttons) button(ctx, b, hit(b, p) && !b.disabled);
    button(ctx, this.helpBtn, hit(this.helpBtn, p));
    button(ctx, this.bgmBtn, hit(this.bgmBtn, p));
    if (this.staleSave) txt(ctx, '保存データの形式が古いため読み込めません（新規に始めてください）', W / 2, 666, { font: '12px sans-serif', color: '#fca5a5', align: 'center' });
    txt(ctx, DATA.source === 'embed' ? 'データ: 埋め込みシード（オフライン）' : `データ: assets/genpei/ ＋ kyoten_ichi.csv（拠点 ${DATA.kyoten.length}）`,
      W / 2, H - 32, { font: '11px sans-serif', color: '#4b5563', align: 'center' });
    if (this.help.open) drawHelpOverlay(ctx, this.help);
  }
}

class ScenarioSelectScene extends GameKit.Scene {
  enter() {
    this.bd = new Backdrop();
    this.list = SCENARIOS.filter((s) => !s.unlockable || save.get('unlocked_sif', false));
    this.sel = 0;
    this.rows = this.list.map((s, i) => ({ x: 70, y: 140 + i * 80, w: 470, h: 68, i }));
    this.back = { x: 70, y: H - 92, w: 200, h: 54, jp: '戻る', en: 'Back' };
    this.go = { x: W - 370, y: H - 92, w: 300, h: 54, jp: 'この時代で始める', en: 'Choose This Age' };
  }
  update(dt, g) {
    this.bd.update(dt);
    const p = g.input.pointer;
    if (!p.justPressed) return;
    for (const r of this.rows) if (hit(r, p)) { this.sel = r.i; g.audio.jingle([{ f: 440, d: 0.07 }]); }
    if (hit(this.back, p)) g.changeScene(new TitleScene());
    if (hit(this.go, p)) g.changeScene(new OpeningScene(this.list[this.sel]));
  }
  draw(ctx, g) {
    this.bd.draw(ctx);
    txt(ctx, '時代を選ぶ', 70, 56, { font: '600 30px "Hiragino Mincho ProN", serif', color: '#f0e2c0' });

class OpeningScene extends GameKit.Scene {
  constructor(scn) { super(); this.scn = scn; }
  enter() {
    this.bd = new Backdrop(); this.t = 0;
    this.lines = this.scn.opening.split('\n');
    this.next = { x: W / 2 - 150, y: H - 100, w: 300, h: 56, jp: '勢力を選ぶ', en: 'Choose a Power' };
    this.back = { x: 70, y: H - 100, w: 160, h: 56, jp: '戻る', en: 'Back' };
  }
  update(dt, g) {
    this.t += dt; this.bd.update(dt);
    const p = g.input.pointer;
    if (!p.justPressed) return;
    if (hit(this.next, p)) g.changeScene(new FactionSelectScene(this.scn));
    if (hit(this.back, p)) g.changeScene(new ScenarioSelectScene());

    this.bd.draw(ctx);

    for (const k of DATA.kyoten) { const o = k.own[this.scn.col]; if (o) this.counts[o] = (this.counts[o] || 0) + 1; }
    this.difficulty = 'normal';
    this.diffButtons = Object.keys(DIFFICULTIES).map((id, i) => ({
      id, x: 70 + i * 150, y: H - 168, w: 140, h: 44,
      jp: DIFFICULTIES[id].jp, en: DIFFICULTIES[id].en, font: '600 14px "Hiragino Mincho ProN", serif', radius: 4,
    }));
    // 2人対戦（同一端末での手番制パス＆プレイ）。P1/P2は同じ勢力を選べない
    this.twoPlayer = false;

    this.sel2 = null;

    this.twoPlayerBtn = { id: 'two', x: px2 + 24, y: 470, w: 160, h: 40, jp: '1人プレイ', en: '1P', font: '600 13px "Hiragino Mincho ProN", serif', radius: 4 };

    this.targetP2Btn = { id: 'p2', x: px2 + 310, y: 470, w: 100, h: 40, jp: '後手を選ぶ', font: '600 12px "Hiragino Mincho ProN", serif', radius: 4 };
  }
  update(dt, g) {
    this.bd.update(dt);
    const p = g.input.pointer;
    if (!p.justPressed) return;
    if (hit(this.twoPlayerBtn, p)) {
      this.twoPlayer = !this.twoPlayer;
      this.pickTarget = 'p1';
      if (!this.twoPlayer) this.sel2 = null;
      else if (this.sel2 == null) this.sel2 = (this.sel + 1) % this.list.length;
      g.audio.jingle([{ f: 440, d: 0.07 }]);
      return;
    }
    if (this.twoPlayer && hit(this.targetP1Btn, p)) { this.pickTarget = 'p1'; return; }
    if (this.twoPlayer && hit(this.targetP2Btn, p)) { this.pickTarget = 'p2'; return; }
    for (const r of this.rows) {
      if (!hit(r, p)) continue;
      if (this.twoPlayer && this.pickTarget === 'p2') {
        if (r.i === this.sel) { this._notice2 = '先手と同じ勢力は選べません'; break; }
        this.sel2 = r.i;
      } else {
        if (this.twoPlayer && r.i === this.sel2) { this._notice2 = '後手と同じ勢力は選べません'; break; }
        this.sel = r.i;
      }
      g.audio.jingle([{ f: 440, d: 0.07 }]);
      break;
    }
    for (const b of this.diffButtons) if (hit(b, p)) { this.difficulty = b.id; g.audio.jingle([{ f: 440, d: 0.07 }]); }
    if (hit(this.back, p)) g.changeScene(new OpeningScene(this.scn));
    if (hit(this.go, p)) {

      g.audio.jingle([{ f: 392, d: 0.1 }, { f: 523, d: 0.1 }, { f: 659, d: 0.2 }]);

      g.changeScene(new MapScene(buildState(this.scn.id, this.list[this.sel], this.difficulty, fid2)));

      frame(ctx, r.x, r.y, r.w, r.h, {
        fill: on ? 'rgba(216,178,106,0.17)' : on2 ? 'rgba(94,234,212,0.15)' : hit(r, p) ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)',
        stroke: on ? 'rgba(216,178,106,0.8)' : on2 ? 'rgba(94,234,212,0.75)' : 'rgba(255,255,255,0.13)',
      });
      drawKamon(ctx, fid, r.x + 32, r.y + 33, 14);
      txt(ctx, f.jp, r.x + 58, r.y + 13, { font: '600 20px "Hiragino Mincho ProN", serif', color: '#e8eef5' });
      txt(ctx, `${f.en} ・ ${this.scn.lords[fid] || ''}`, r.x + 58, r.y + 42, { font: '11px "Segoe UI", sans-serif', color: '#7c8ba1' });
      txt(ctx, `${this.counts[fid] || 0} 拠点`, r.x + r.w - 66, r.y + 24, { font: '14px "Segoe UI", sans-serif', color: '#8b98ab', align: 'right' });
      if (on) txt(ctx, '先手', r.x + r.w - 12, r.y + 20, { font: '600 12px "Hiragino Mincho ProN", serif', color: '#d8b26a', align: 'right' });
      else if (on2) txt(ctx, '後手', r.x + r.w - 12, r.y + 20, { font: '600 12px "Hiragino Mincho ProN", serif', color: '#5eead4', align: 'right' });

    });
    const fid = this.list[this.sel], f = FACTIONS[fid], px = 540, pw = W - 540 - 70;
    frame(ctx, px, 150, pw, H - 150 - 116);
    txt(ctx, f.jp, px + 24, 174, { font: '600 28px "Hiragino Mincho ProN", serif', color: '#f0e2c0' });

function wrapText(ctx, str, x, y, maxW, lh, opts) {
  // 折り返し判定は txt() が実際に描く幅（mobileFont適用後）と一致させる。
  // 未適用の幅で判定すると、拡大後の行がmaxWをはみ出したまま描かれる。
  ctx.save(); ctx.font = mobileFont(opts.font);
  let line = '', yy = y;
  for (const ch of str) {
    if (ctx.measureText(line + ch).width > maxW) { txt(ctx, line, x, yy, opts); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) txt(ctx, line, x, yy, opts);
  ctx.restore();
  return yy + lh;
}

function helpButtonRects(pg, total) {
  const pw = 900, ph = 560, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  return {
    px, py, pw, ph,
    close: { id: 'close', x: px + pw - 96, y: py + 20, w: 72, h: 28, jp: '閉じる', font: '600 13px "Hiragino Mincho ProN", serif', radius: 4 },
    prev: { id: 'prev', x: px + 40, y: py + ph - 50, w: 100, h: 34, jp: '← 前へ', font: '600 13px "Hiragino Mincho ProN", serif', radius: 4, disabled: pg === 0 },
    next: { id: 'next', x: px + pw - 140, y: py + ph - 50, w: 100, h: 34, jp: '次へ →', font: '600 13px "Hiragino Mincho ProN", serif', radius: 4, disabled: pg === total - 1 },
  };
}
function drawHelpOverlay(ctx, help) {
  const pages = HELP_PAGES, pg = clamp(help.page || 0, 0, pages.length - 1), p = pages[pg];
  const r = helpButtonRects(pg, pages.length);
  ctx.fillStyle = 'rgba(5,7,11,0.72)'; ctx.fillRect(0, 0, W, H);
  frame(ctx, r.px, r.py, r.pw, r.ph, { fill: 'rgba(10,15,22,0.98)', stroke: 'rgba(216,178,106,0.5)', radius: 10 });
  txt(ctx, '遊び方 / How to Play', r.px + r.pw / 2, r.py + 30, { font: '600 26px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
  txt(ctx, `${p.title} / ${p.en}`, r.px + r.pw / 2, r.py + 68, { font: '600 17px "Hiragino Mincho ProN", serif', color: '#a78bfa', align: 'center' });
  p.lines.forEach((ln, i) => wrapText(ctx, ln, r.px + 40, r.py + 112 + i * 60, r.pw - 80, 22, { font: '14px "Hiragino Mincho ProN", serif', color: '#dbe4ee' }));
  txt(ctx, `${pg + 1} / ${pages.length}`, r.px + r.pw / 2, r.py + r.ph - 74, { font: '13px "Segoe UI", sans-serif', color: '#7d93ab', align: 'center' });
  [r.close, r.prev, r.next].forEach((b) => button(ctx, b, false));
}
// help オーバーレイ内のクリックはここで全て吸収する（背後のシーンへ伝えない）。戻り値は常に true。
function handleHelpClick(help, p) {
  const pages = HELP_PAGES, pg = clamp(help.page || 0, 0, pages.length - 1);
  const r = helpButtonRects(pg, pages.length);
  if (hit(r.close, p)) help.open = false;
  else if (!r.prev.disabled && hit(r.prev, p)) help.page = pg - 1;
  else if (!r.next.disabled && hit(r.next, p)) help.page = pg + 1;
  return true;
}
