    baseY,
    vx: -(cfg.bubbleSpeed + Math.random() * 0.4),
    vy: 0,
    radius: r,
    wobbleOffset: Math.random() * Math.PI * 2,
    wobbleAmp: 30 + Math.random() * 15,
    contents: cfg.contents[Math.floor(Math.random() * cfg.contents.length)],
    popped: false,
    popTimer: 0,
    alpha: 1,
  };
}

function makeGnome(x, charIdx) {
  const ci = (charIdx !== undefined) ? charIdx % 4 : gnomes.length % 4;
  const ch = GNOME_CHARS[ci];
  return {
    x, y: GROUND_Y - 5,
    vx: 0, vy: 0,
    onGround: true,
    onLadder: false,
    onRope: false,
    climbing: false,
    descending: false,
    state: 'idle',
    waypoints: [],
    rawPath: null,
    jumpBoost: ch.jumpMult,
    jumpCooldown: 0,
    waypointTimer: 0,
    hatColor: ch.hatColor,
    bodyColor: ch.bodyColor,
    charName: ch.name,
    speedMult: ch.speedMult,
    avoidHazard: ch.avoidHazard,
    scoreMult: ch.scoreMult,
    expression: 'normal', expressionTimer: 0,
  };
}

function makeItem(x, y, type) {
  return {
    x, y,
    vx: (Math.random() - 0.5) * 1.5,
    vy: -0.5,
    type,
    collected: false,
    landed: false,
  };
}

function makeLadder(x) {
  return { x, bottomY: GROUND_Y, height: LADDER_HEIGHT, active: true };
}

function spawnParticle(x, y, color) {
  const p = _pPool.find(p => !p.active);
  if (!p) return;
  const angle = Math.random() * Math.PI * 2;
  const speed = 1.5 + Math.random() * 3;
  p.x = x; p.y = y;
  p.vx = Math.cos(angle) * speed;
  p.vy = Math.sin(angle) * speed - 1;
  p.life = 25 + Math.floor(Math.random() * 20);
  p.maxLife = p.life;
  p.color = color; p.r = 2 + Math.random() * 3;
  p.active = true;
}

function makeRing(x, y, maxR, color) {
  return { x, y, r: maxR * 0.15, maxR, color, life: 20, maxLife: 20 };
}

function makeProjectile(gnome, tx, ty) {
  const sx = gnome.x, sy = gnome.y - 22;
  const dx = tx - sx, dy = ty - sy;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const speed = 10;
  return {
    x: sx, y: sy,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    life: 90,
    trail: [],
  };
}

function makeBlock(x, y, w) {
  return { x, y, w: w || 48, h: 18 };
}

function makeCrow() {
  const side = Math.random() < 0.5 ? 0 : 1;
  return {
    x: side === 0 ? -20 : W + 20,
    y: 80 + Math.random() * 200,
    vx: side === 0 ? (1.2 + Math.random() * 0.8) : -(1.2 + Math.random() * 0.8),
    vy: 0,
    wingAnim: 0,
    attackCooldown: 0,
    diving: false,
    diveTimer: 0,
    warnTimer: 0,
  };
}

function makeLightning(x) {
  return { x, phase: 'warn', timer: 0, boltPoints: null };
}

// === 物理ヘルパー ===
const GRAVITY = 0.35;

function dist2(ax, ay, bx, by) {
  return (ax - bx) ** 2 + (ay - by) ** 2;
}

function updateBubble(b) {
  if (b.popped) {
    b.popTimer++;
    b.alpha = Math.max(0, 1 - b.popTimer / 16);
    return;
  }
  b.x += b.vx;
  b.y = b.baseY + Math.sin(frameCount * 0.025 + b.wobbleOffset) * b.wobbleAmp;
}

function updateItem(it) {
  if (it.collected || it.landed) return;
  it.vy += GRAVITY;
  it.y  += it.vy;
  it.x  += it.vx;
  it.vx *= 0.97;
  if (it.y >= GROUND_Y - 10) {
    it.y = GROUND_Y - 10;
    it.vy *= -0.2;
    it.vx *= 0.6;
    if (Math.abs(it.vy) < 0.6) { it.vy = 0; it.vx = 0; it.landed = true; }
  }
  if (it.x < 10)     { it.x = 10;     it.vx = Math.abs(it.vx); }
  if (it.x > W - 10) { it.x = W - 10; it.vx = -Math.abs(it.vx); }
}

// === 泡POP・アイテム収集 ===
function popBubble(b) {
  if (b.popped) return;
  b.popped = true;
  items.push(makeItem(b.x, b.y, b.contents));
  // 玉アイテムを3個スポーン
  for (let i = 0; i < 3; i++) {
    const bx = b.x + (Math.random() - 0.5) * b.radius;
    const by = b.y + (Math.random() - 0.5) * b.radius * 0.4;
    const ballItem = makeItem(bx, by, 'ball');
    ballItem.vx = (Math.random() - 0.5) * 2.5;
    ballItem.vy = -1 - Math.random() * 1.5;
    items.push(ballItem);
  }
  const pColors = { coin:'#ffd700', chest:'#c8843a', tool:'#aaaacc', ladder:'#c8a06a', bomb:'#ff4400', hammer:'#888888', ball:'#88ddff' };
  for (let i = 0; i < 20; i++) spawnParticle(b.x, b.y, pColors[b.contents] || '#fff');
  rings.push(makeRing(b.x, b.y, b.radius * 2.0, pColors[b.contents] || '#aadeee'));
  playSE('pop');
  if (navigator.vibrate) navigator.vibrate(10);
}

function collectItem(it, gnome) {
  it.collected = true;
  // Phase 6: コンボシステム
  comboCount++;
  comboTimer = COMBO_WINDOW;
  const comboMult = Math.min(4, 1 + (comboCount - 1) * 0.5);
  const baseScore = ITEM_SCORE[it.type] || 0;
  const scoreMult = gnome ? (gnome.scoreMult || 1.0) : 1.0;
  const earned = Math.round(baseScore * comboMult * scoreMult);
  score += earned;
  itemsCollected++;
  if (it.type === 'tool') gnome.jumpBoost = Math.min(2.0, gnome.jumpBoost + 0.3);
  // ポップアップ表示
  if (comboCount >= 3) {
    bonusPopups.push({ x: it.x, y: it.y - 20, text: 'x' + comboMult.toFixed(1) + ' COMBO! +' + earned, life: 80, maxLife: 80, color: '#ff8800', large: true });
    playSE('combo'); // Phase 3: combo SE
    if (gnome) { gnome.expression = 'happy'; gnome.expressionTimer = 50; }
  } else {
    if (earned > 0) bonusPopups.push({ x: it.x, y: it.y - 20, text: '+' + earned, life: 60, maxLife: 60, color: '#ffd700', large: false });
    playSE('collect'); // Phase 3: collect SE
  }
  updateHUD();
  checkStageClear();
}

function checkStageClear() {
  const cfg = stage < STAGE_CFG.length ? STAGE_CFG[stage]
    : (() => { const b = STAGE_CFG[STAGE_CFG.length-1]; const ex = stage-STAGE_CFG.length+1; return {...b, target: b.target+ex*15}; })();
  if (itemsCollected < cfg.target) return;
  playSE('clear');
  if (!isEndless && stage === STAGE_CFG.length - 1) {
    HiScore.save(); state = 'clear';
  } else {
    showStageBonus();
  }
}

function placeLadder(x) {
  const existing = ladders.find(l => l.active && Math.abs(l.x - x) < 25);
  if (existing) {
    existing.height = Math.min(GROUND_Y - 30, existing.height + LADDER_HEIGHT);
  } else {
    ladders.push(makeLadder(x));
  }
  score += ITEM_SCORE['ladder'];
  itemsCollected++;
  playSE('ladder');
  bonusPopups.push({ x, y: GROUND_Y - 40, text: '🪜 SET!', life: 50, maxLife: 50, color: '#44ff88', large: false });
  rings.push(makeRing(x, GROUND_Y - 20, 30, '#44ff88'));
  updateHUD();
  checkStageClear();
}

// Phase 8-4: 小人消滅関数
function killGnome(g) {
  shakeFrames = 12; shakeAmt = 4;
  if (navigator.vibrate) navigator.vibrate(50);
  for (let i = 0; i < 16; i++) {
    spawnParticle(g.x, g.y, '#ff3333');
  }
  const idx = gnomes.indexOf(g);
  if (idx >= 0) gnomes.splice(idx, 1);
  lives = Math.max(0, lives - 1);
  updateHUD();
  if (gnomes.length === 0) {
    AudioSystem.stopBGM();
    playSE('gameover');
    HiScore.save();
    state = 'gameover';
  }
}

// Phase 6: ステージクリアボーナス
function showStageBonus() {
  const elapsed = (Date.now() - stageStartTime) / 1000;
  const timeBonus = Math.max(0, Math.round(500 - elapsed * 5));
  const comboBonus = comboCount * 20;
  score += timeBonus + comboBonus;
  for (let i = 0; i < 40; i++) spawnParticle(W/2, H/2, ['#ffd700','#ff88aa','#88ffcc','#88aaff'][i%4]);
  if (timeBonus > 0) bonusPopups.push({ x: W/2, y: H*0.4, text: 'TIME BONUS +' + timeBonus, life: 120, maxLife: 120, color: '#88ffcc', large: true });
  if (comboBonus > 0) bonusPopups.push({ x: W/2, y: H*0.5, text: 'COMBO BONUS +' + comboBonus, life: 120, maxLife: 120, color: '#ffaa44', large: true });
  const nextStage = stage + 1;
  setTimeout(() => {
    if (state === 'play') {
      stage = nextStage;
      itemsCollected = 0;
      if (stage >= STAGE_CFG.length) isEndless = true;
      initStage();
    }
  }, 1800);
}

// 最も高い（長い）アクティブな梯子を返す
function getBestLadder() {
  let best = null;
  for (const l of ladders) {
    if (l.active && (!best || l.height > best.height)) best = l;
  }
  return best;
}

// パスが急勾配（縦線=ロープ）か判定
function isPathSteep(path) {
  if (path.length < 2) return false;
  const dx = Math.abs(path[path.length - 1].x - path[0].x);
  const dy = Math.abs(path[path.length - 1].y - path[0].y);
  return dy > dx * 1.2; // 縦成分が横成分の1.2倍以上 → ロープ扱い
}

// パス上の最近傍点を返す
function getNearestOnPath(path, gx, gy) {
  let bestDist = Infinity, bestX = gx, bestY = gy;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const lenSq = dx * dx + dy * dy;
    if (lenSq < 1) continue;
    let t = ((gx - a.x) * dx + (gy - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const px = a.x + t * dx, py = a.y + t * dy;
    const d = (gx - px) ** 2 + (gy - py) ** 2;
    if (d < bestDist) { bestDist = d; bestX = px; bestY = py; }
  }
  return { dist: Math.sqrt(bestDist), x: bestX, y: bestY };
}

// 引いた線の x 位置における y を線形補間で返す（範囲外なら null）
function getPathYAtX(path, x) {
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
    if (x >= minX - 2 && x <= maxX + 2) {
      if (Math.abs(b.x - a.x) < 1) return (a.y + b.y) / 2;
      const t = (x - a.x) / (b.x - a.x);
      return a.y + t * (b.y - a.y);
    }
  }
  return null;
}

// === 小人AI ===
function updateGnomeAI(g, idx) {
  // プレイヤー操作チェック
  const isKbCtrl = idx === 0 && !touchControlActive &&
    (playerControl.left || playerControl.right || playerControl.up || playerControl.down);
  const isTouchCtrl = touchControlActive && idx === touchControlledGnomeIdx;
  if (isKbCtrl || isTouchCtrl) {
    g.climbing = false; g.descending = false;
    if (playerControl.left)       { g.vx = -PLAYER_SPEED * (g.speedMult || 1); g.state = 'walk'; }
    else if (playerControl.right) { g.vx =  PLAYER_SPEED * (g.speedMult || 1); g.state = 'walk'; }
    else { g.vx = 0; g.state = 'idle'; }
    if (g.onLadder) {
      if (playerControl.up)   { g.climbing = true; }
      if (playerControl.down) { g.descending = true; }
    } else if (playerControl.up && g.onGround && g.jumpCooldown === 0) {
      g.vy = -8 * g.jumpBoost; g.onGround = false; g.jumpCooldown = 40; g.state = 'jump';
    }
    g.waypoints = []; g.rawPath = null;
    return;
  }
  // 1. ウェイポイント追跡（線引き）
  if (g.waypoints.length > 0) {
    // 300フレーム到達できなければ経路リセット
    g.waypointTimer++;
    if (g.waypointTimer > 300) { g.waypoints = []; g.rawPath = null; g.waypointTimer = 0; return; }

    // 到達済み・通過済みウェイポイントを除去
    while (g.waypoints.length > 0) {
      const w0 = g.waypoints[0];
      const d0 = Math.sqrt((w0.x - g.x) ** 2 + (w0.y - g.y) ** 2);
      if (d0 < 16 || (g.y <= w0.y + 4 && Math.abs(w0.x - g.x) < 32)) {
        g.waypoints.shift(); g.waypointTimer = 0;
      } else break;
    }
    if (g.waypoints.length === 0) { g.rawPath = null; return; }

    const wp = g.waypoints[0];
    const dx = wp.x - g.x;
    const dy = wp.y - g.y;
    const d  = Math.sqrt(dx * dx + dy * dy);

    if (g.onRope) {
      // ロープよじ登り: パスの方向ベクトルで直接移動
      const speed = 1.6;
      g.vx = d > 1 ? (dx / d) * speed : 0;
      g.vy = d > 1 ? (dy / d) * speed : 0;
      g.state = 'climb';
      return;
    }

    // 坂として歩けるか判定（dx方向の傾斜が緩やかなら坂歩き）
    const onSlope = g.rawPath && getPathYAtX(g.rawPath, g.x) !== null;

    g.vx = Math.sign(dx) * Math.min(2.0, d * 0.1) * 1.5 * (g.speedMult || 1);
    if (dy < -20 && g.onLadder) {
      g.climbing = true;
    } else if (dy < -8 && !onSlope && g.onGround && g.jumpCooldown === 0) {
      // 坂の上でなければジャンプ（垂直段差など）
      let minY = wp.y;
      for (let i = 1; i < Math.min(g.waypoints.length, 20); i++) {
        if (g.waypoints[i].y < minY) minY = g.waypoints[i].y;
      }
      const rise = g.y - minY;
      g.vy = -Math.min(10, Math.sqrt(rise * 0.18) + 2.5) * g.jumpBoost;
      g.onGround = false; g.jumpCooldown = 55; g.state = 'jump';
    }
    if (g.state !== 'jump') g.state = 'walk';
    return;
  }

  // 1.5 落下梯子を最優先で拾いに行く（既存梯子に連結するため）
  if (ladders.some(l => l.active)) {
    let nearestFallen = null, nearestFallenDist = Infinity;
    for (const it of items) {
      if (it.collected || !it.landed || it.type !== 'ladder') continue;
      const d = Math.abs(it.x - g.x);
      if (d < nearestFallenDist) { nearestFallenDist = d; nearestFallen = it; }
    }
    if (nearestFallen && nearestFallenDist < 320) {
      g.climbing = false;
      g.vx = Math.sign(nearestFallen.x - g.x) * 1.4 * (g.speedMult || 1);
      g.state = 'walk';
      return;
    }
  }

  // 2. 最寄りの泡を自動ターゲット（梯子経由含む）
  let bestTarget = null, bestScore = Infinity;
  for (const b of bubbles) {
    if (b.popped) continue;
    const dxB = Math.abs(b.x - g.x);
    if (dxB > 280) continue;
    const dyDirect = g.y - b.y;
    // 直接ジャンプで届くか
    if (dyDirect > 0 && dyDirect < 140 * g.jumpBoost) {
      const sc = dxB + dyDirect * 0.3;
      if (sc < bestScore) { bestScore = sc; bestTarget = { bubble: b, ladder: null }; }
    }
    // 梯子経由で届くか
    for (const lad of ladders) {
      if (!lad.active) continue;
      const dxBL = Math.abs(b.x - lad.x);
      if (dxBL > 80) continue;
      const ladTopY = lad.bottomY - lad.height;
      const dyFromTop = ladTopY - b.y;
      if (dyFromTop >= 0 && dyFromTop < 140 * g.jumpBoost) {
        const dxToLad = Math.abs(lad.x - g.x);
        const sc = dxToLad + dyFromTop * 0.3;
        if (sc < bestScore) { bestScore = sc; bestTarget = { bubble: b, ladder: lad }; }
      }
    }
  }

  if (bestTarget) {
    const { bubble: best, ladder: targetLad } = bestTarget;
    if (!targetLad) {
      // 直接ジャンプ
      g.climbing = false;
      const dx = best.x - g.x, absDx = Math.abs(dx);
      g.vx = absDx > 5 ? Math.sign(dx) * 1.4 * (g.speedMult || 1) : 0;
      g.state = absDx > 5 ? 'walk' : 'idle';
      const dy = g.y - best.y;
      if (absDx < best.radius + 15 && dy > 10 && dy < 140 * g.jumpBoost
          && g.onGround && g.jumpCooldown === 0) {
        g.vy = -Math.min(10, Math.sqrt(dy * 0.16) + 3) * g.jumpBoost;
        g.onGround = false; g.jumpCooldown = 50; g.state = 'jump';
      }
    } else {
      // 梯子経由
      const dxToLad = targetLad.x - g.x;
      const ladTopY = targetLad.bottomY - targetLad.height;
      if (Math.abs(dxToLad) > 8 && (g.onGround || !g.onLadder)) {
        g.vx = Math.sign(dxToLad) * 1.4 * (g.speedMult || 1); g.state = 'walk'; g.climbing = false;
      } else {
        g.vx = 0;
        if (g.y > ladTopY + 4) {
          g.climbing = true; g.state = 'climb';
        } else {
          // 梯子の先端に到達 → 泡に向かってジャンプ
          g.climbing = false;
          const dx = best.x - g.x, absDx = Math.abs(dx);
          g.vx = absDx > 5 ? Math.sign(dx) * 1.4 * (g.speedMult || 1) : 0;
          const dy = g.y - best.y;
          if (absDx < best.radius + 20 && dy > 0 && g.jumpCooldown === 0) {
            g.vy = -Math.min(10, Math.sqrt(dy * 0.16) + 3) * g.jumpBoost;
            g.onGround = false; g.jumpCooldown = 50; g.state = 'jump';
          }
        }
      }
    }
    return;
  }

  // 3. 落下アイテムを拾いに行く（梯子含む）
  // Braver以外は近くに危険アイテムがあれば逃げる
  if (g.avoidHazard !== false) {
    for (const it of items) {
      if (it.collected || !it.landed || !HAZARD_TYPES.has(it.type)) continue;
      if (Math.abs(it.x - g.x) < 70 && Math.abs(it.y - g.y) < 60) {
        g.vx = Math.sign(g.x - it.x) * 1.6 * (g.speedMult || 1);
        g.state = 'walk';
        return;
      }
    }
  }
  let nearItem = null, nearDist = Infinity;
  for (const it of items) {
    if (it.collected || !it.landed) continue;
    if (g.avoidHazard !== false && HAZARD_TYPES.has(it.type)) continue;
    const d = Math.abs(it.x - g.x);
    if (d < nearDist) { nearDist = d; nearItem = it; }
  }
  if (nearItem && nearDist < 220) {
    g.vx = Math.sign(nearItem.x - g.x) * 1.2 * (g.speedMult || 1);
    g.state = 'walk';
    return;
  }

  // 4. アイドル（ランダム徘徊）
  if (frameCount % 110 === idx * 37 % 110) g.vx = (Math.random() - 0.5) * 1.4 * (g.speedMult || 1);
  g.state = Math.abs(g.vx) > 0.1 ? 'walk' : 'idle';
}

function updateGnomePhysics(g) {
  if (g.jumpCooldown > 0) g.jumpCooldown--;
  if (!g.onLadder && !g.onRope) g.vy += GRAVITY;

  g.x += g.vx;
  g.y += g.vy;

  // ロープ（急勾配の線）をよじ登る
  g.onRope = false;
  if (g.rawPath && g.rawPath.length > 1 && isPathSteep(g.rawPath)) {
    const near = getNearestOnPath(g.rawPath, g.x, g.y);
    if (near.dist < 20) {
      g.x = near.x;
      g.y = near.y;
      g.vy = 0;
      g.onRope = true;
    }
  }

  // 引いた線を坂として歩く（物理より先に判定して重力を打ち消す）
  if (!g.onRope && g.rawPath && g.rawPath.length > 1) {
    const pathY = getPathYAtX(g.rawPath, g.x);
    if (pathY !== null && g.y >= pathY - 32 && g.y < pathY + 8) {
      g.y = pathY;
      g.vy = 0;
      g.onGround = true;
    }
  }

  // 浮遊ブロックの上に乗る
  let onBlock = false;
  for (const bl of floatingBlocks) {
    if (g.vy >= 0
        && g.y >= bl.y - 5 && g.y <= bl.y + 10
        && g.x >= bl.x - 6 && g.x <= bl.x + bl.w + 6) {
      g.y = bl.y - 5;
      g.vy = 0;
      g.onGround = true;
      onBlock = true;
      if (g.state === 'jump') g.state = 'idle';
      break;
    }
  }

  // 地面（足底が g.y+5 になる描画オフセットを考慮して -5）
  if (g.y >= GROUND_Y - 5) {
    g.y = GROUND_Y - 5;
    g.vy = 0;
    g.onGround = true;
    if (g.state === 'jump') g.state = 'idle';
  } else if (!onBlock && !g.onRope && (!g.rawPath || getPathYAtX(g.rawPath, g.x) === null)) {
    g.onGround = false;
  }

  // 壁
  if (g.x < 10) { g.x = 10; g.vx = 0; }
  if (g.x > W - 10) { g.x = W - 10; g.vx = 0; }

  // 梯子
  g.onLadder = false;
  for (const lad of ladders) {
    if (!lad.active) continue;
    const topY = lad.bottomY - lad.height;
    if (Math.abs(g.x - lad.x) < 14 && g.y > topY - 5 && g.y < lad.bottomY + 5) {
      g.onLadder = true;
      g.x = lad.x;
      if (g.climbing) {
        g.vy = -CLIMB_SPEED;
      } else if (g.descending) {
        g.vy = CLIMB_SPEED;
      } else if (g.vy > 0) {
        g.vy = 0;
      }
      break;
    }
  }
  if (!g.onLadder) g.climbing = false;

  // 泡に触れたらPOP
  for (const b of bubbles) {
    if (b.popped) continue;
    const dy = (g.y - GNOME_H * 0.5) - b.y;
    const dx = g.x - b.x;
    if (dx * dx + dy * dy < (b.radius + 8) ** 2) popBubble(b);
  }

  // アイテム収集
  const COLLECT_R2 = 28 * 28;
  for (const it of items) {
    if (it.collected || !it.landed) continue;
    if (HAZARD_TYPES.has(it.type)) {
      // Phase 8-3: 危険アイテムは小人に当たると小人消滅
      if (dist2(g.x, g.y, it.x, it.y) < 30 * 30) {
        it.collected = true;
        killGnome(g);
        return; // この小人のループを抜ける
      }
    } else if (dist2(g.x, g.y, it.x, it.y) < COLLECT_R2) {
      if (it.type === 'ball') {
        it.collected = true;
        ballCount++;
        updateHUD();
        bonusPopups.push({ x: it.x, y: it.y - 20, text: '🔮+1', life: 40, maxLife: 40, color: '#88ddff', large: false });
      } else if (it.type === 'ladder') {
        it.collected = true;
        const bestLad = getBestLadder();
        if (bestLad) {
          // 一番長い梯子に連結して伸ばす
          bestLad.height = Math.min(GROUND_Y - 30, bestLad.height + LADDER_HEIGHT);
          score += ITEM_SCORE['ladder'];
          itemsCollected++;
          playSE('ladder');
          updateHUD();
          checkStageClear();
        } else {
          placeLadder(it.x);
        }
      } else {
        collectItem(it, g);
      }
    }
  }
}
// === カラス更新 ===
function updateCrow(crow) {
  crow.wingAnim++;
  if (crow.attackCooldown > 0) crow.attackCooldown--;

  if (crow.diving) {
    crow.diveTimer++;
    crow.y += 2.5;

    // 小人に当たったら吹き飛ばす
    for (let i = gnomes.length - 1; i >= 0; i--) {
      const g = gnomes[i];
      if (dist2(crow.x, crow.y, g.x, g.y) < 28 * 28 && crow.attackCooldown === 0) {
        g.vx += Math.sign(g.x - crow.x) * 4;
        g.vy = -4.5;
        g.onGround = false;
        g.waypoints = [];
        g.rawPath = null;
        crow.attackCooldown = 100;
        playSE('crow');
        bonusPopups.push({ x: g.x, y: g.y - 30, text: 'CAW!', life: 50, maxLife: 50, color: '#ffaa00', large: false });
        g.expression = 'surprised'; g.expressionTimer = 65;
        break;
      }
    }

    // 梯子に触れたら破壊
    if (crow.attackCooldown === 0) {
      for (const lad of ladders) {
        if (!lad.active) continue;
        if (Math.abs(crow.x - lad.x) < 18 && crow.y > lad.bottomY - lad.height - 10 && crow.y < lad.bottomY) {
          lad.active = false;
          crow.attackCooldown = 130;
          playSE('crow');
          bonusPopups.push({ x: lad.x, y: lad.bottomY - lad.height / 2, text: '梯子破壊!', life: 70, maxLife: 70, color: '#ff4444', large: false });
          for (let k = 0; k < 8; k++) spawnParticle(lad.x, lad.bottomY - lad.height / 2, '#c8a06a');
          break;
        }
      }
    }

    if (crow.diveTimer > 45) {
      crow.diving = false;
      crow.diveTimer = 0;
      crow.vy = -2.5;
    }
  } else {
    crow.x += crow.vx;
    crow.y += crow.vy;
    crow.vy *= 0.94;
    crow.vy += Math.sin(frameCount * 0.022 + crow.x * 0.012) * 0.06;
    crow.y = Math.max(55, Math.min(340, crow.y));

    // 画面外に出たら反対側から再登場
    if (crow.x < -40) { crow.x = W + 40; crow.vx = Math.abs(crow.vx); }
    if (crow.x > W + 40) { crow.x = -40; crow.vx = -Math.abs(crow.vx); }

    // D3: 警告フェーズ中は警告タイマーを消化してからダイブ
    if (crow.warnTimer > 0) {
      crow.warnTimer--;
      if (crow.warnTimer === 0) { crow.diving = true; crow.diveTimer = 0; }
    } else if (crow.attackCooldown === 0) {
      // 近くに小人がいれば警告開始
      for (const g of gnomes) {
        const dx = Math.abs(crow.x - g.x);
        const dy = crow.y - g.y;
        if (dx < 55 && dy > 20 && dy < 260) {
          crow.warnTimer = 30;
          break;
        }
      }
    }
  }
}

// === 雷更新 ===
function updateLightning(lt) {
  lt.timer++;
  if (lt.phase === 'warn') {
    if (lt.timer >= 65) {
      lt.phase = 'strike';
      lt.timer = 0;
      // ボルトの折れ線を事前生成（毎フレーム乱数を使わないよう）
      const pts = [{ x: lt.x, y: 0 }];
      for (let i = 1; i < 9; i++) {
        pts.push({ x: lt.x + (Math.random() - 0.5) * 22, y: (GROUND_Y / 9) * i });
      }
      pts.push({ x: lt.x, y: GROUND_Y });
      lt.boltPoints = pts;
      playSE('thunder');
      // 小人が範囲内なら即死
      for (let i = gnomes.length - 1; i >= 0; i--) {
        if (Math.abs(gnomes[i].x - lt.x) < 26) killGnome(gnomes[i]);
      }
    }
  } else if (lt.phase === 'strike') {
    if (lt.timer >= 22) lt.phase = 'done';
  }
}

// === HUD更新 ===
function updateHUD() {
  document.getElementById('score-disp').textContent  = 'SCORE: ' + score;
  document.getElementById('stage-disp').textContent  = 'STAGE ' + (stage + 1);
  document.getElementById('target-disp').textContent = itemsCollected + ' / ' + STAGE_CFG[stage].target;
}

// === 描画ヘルパー ===
function drawBackground() {
  if ((ART.bg.complete && ART.bg.naturalWidth) && drawCoverImage(ART.bg, 0, 0, W, H)) {
    const tint = stage >= 7 ? 'rgba(90,20,70,0.18)' :
      stage >= 4 ? 'rgba(35,20,80,0.14)' : 'rgba(0,20,50,0.08)';
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(2,8,24,0.48)';
    ctx.fillRect(0, 0, W, 48);
    return;
  }
  // D4: ステージ間背景色補間
  function lerpHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r  = Math.round(((pa>>16)&0xff)*(1-t)+((pb>>16)&0xff)*t);
    const g2 = Math.round(((pa>>8) &0xff)*(1-t)+((pb>>8) &0xff)*t);
    const bl = Math.round((pa      &0xff)*(1-t)+(pb      &0xff)*t);
    return '#'+[r,g2,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  const cur = stage < STAGE_CFG.length ? STAGE_CFG[stage].bgColor : ['#1e0010','#2a0010'];
  const bgColor = prevBgColor && bgTransProgress < 1
    ? [lerpHex(prevBgColor[0], cur[0], bgTransProgress), lerpHex(prevBgColor[1], cur[1], bgTransProgress)]
    : cur;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, bgColor[0]);
  grad.addColorStop(0.75, bgColor[1]);
  grad.addColorStop(1, '#0a2a0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // D1: 視差星2層（遠層30個・近層15個）
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 137 + 29) + frameCount * 0.04) % W;
    const sy = (i * 97 + 11) % (H - 120);
    const a  = 0.2 + 0.3 * ((Math.sin(frameCount * 0.03 + i) + 1) / 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(sx, sy, 1, 1);
  }
  for (let i = 0; i < 15; i++) {
    const sx = ((i * 211 + 73) + frameCount * 0.11) % W;
    const sy = (i * 59 + 43) % (H - 120);
    const a  = 0.5 + 0.4 * ((Math.sin(frameCount * 0.05 + i * 1.7) + 1) / 2);
    ctx.fillStyle = `rgba(220,240,255,${a})`;
    ctx.fillRect(sx, sy, 2, 2);
  }
  drawStageTheme(Math.min(4, Math.floor(stage / 2)));
}

function drawStageTheme(themeId) {
  ctx.save();
  ctx.globalAlpha *= bgTransProgress;
  if (themeId === 0) {
    // 森林テーマ（Stage 1-2）
    const trees = [55, 130, 230, 335, 420];
    for (let i = 0; i < trees.length; i++) {
      const tx = trees[i];
      const th = 70 + (i % 3) * 20;
      ctx.fillStyle = '#1e1a08';
      ctx.fillRect(tx - 5, H - 130 - th + 40, 10, th);
      for (let k = 0; k < 3; k++) {
        const ofs = k * 18;
        ctx.fillStyle = k === 0 ? '#0a2a0a' : k === 1 ? '#0d3a0d' : '#0f4a0f';
        ctx.beginPath();
        ctx.moveTo(tx, H - 130 - th + ofs - 12);
        ctx.lineTo(tx - 18 + k * 3, H - 130 - th + ofs + 24);
        ctx.lineTo(tx + 18 - k * 3, H - 130 - th + ofs + 24);
        ctx.closePath();
        ctx.fill();
      }
    }
    // 遠景の丘
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = `rgba(8,30,8,${0.25 + i * 0.08})`;
      ctx.beginPath();
      ctx.arc(90 + i * 150, H - 90, 100 + i * 30, Math.PI, Math.PI * 2);
      ctx.fill();
    }
  } else if (themeId === 1) {
    // 洞窟テーマ（Stage 3-4）
    const stalacs = [30,70,115,160,215,270,320,370,415,455];
    for (let i = 0; i < stalacs.length; i++) {
      const sx = stalacs[i];
      const sl = 24 + (i % 4) * 14;
      ctx.fillStyle = i % 2 === 0 ? '#3a3058' : '#4a4070';
      ctx.beginPath();
      ctx.moveTo(sx - 9, 48);
      ctx.lineTo(sx + 9, 48);
      ctx.lineTo(sx, 48 + sl);
      ctx.closePath();
      ctx.fill();
    }
    // 石積み地面
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 14; col++) {
        const rx = col * 35 + (row % 2 === 0 ? 0 : 17);
        const ry = H - 110 + row * 14;
        ctx.fillStyle = row % 2 === 0 ? 'rgba(50,50,70,0.30)' : 'rgba(60,60,85,0.25)';
        ctx.fillRect(rx, ry, 33, 12);
        ctx.strokeStyle = 'rgba(20,20,40,0.35)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(rx, ry, 33, 12);
      }
    }
  } else if (themeId === 2) {
    // お城テーマ（Stage 5-6）
    ctx.globalAlpha *= 0.22;
    for (let row = 0; row < Math.floor(H / 16); row++) {
      for (let col = 0; col < Math.floor(W / 24) + 1; col++) {
        const rx = col * 24 + (row % 2 === 0 ? 0 : 12);
        const ry = 48 + row * 16;
        ctx.strokeStyle = '#7a5030';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(rx, ry, 22, 14);
      }
    }
    ctx.globalAlpha /= 0.22;
    // 塔シルエット（左右）
    for (const tx of [0, W - 38]) {
      ctx.fillStyle = 'rgba(30,15,5,0.45)';
      ctx.fillRect(tx, 48, 38, H);
      // 城壁の凸部
      for (let k = 0; k < 3; k++) {
        ctx.fillRect(tx + k * 14, 34, 11, 18);
      }
    }
  } else if (themeId === 3) {
    // 空中テーマ（Stage 7-8）
    const clouds = [
      { bx:60,  by:90,  rx:55, ry:22 },
      { bx:200, by:120, rx:45, ry:18 },
      { bx:340, by:80,  rx:60, ry:25 },
      { bx:110, by:155, rx:35, ry:14 },
      { bx:390, by:150, rx:40, ry:16 },
    ];
    for (const c of clouds) {
      const cx = ((c.bx + frameCount * 0.18) % (W + 120)) - 60;
      ctx.globalAlpha *= 0.55;
      ctx.fillStyle = '#b8d4f8';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.ellipse(cx + k * 18 - 18, c.by, c.rx * (0.6 + k * 0.2), c.ry * (0.7 + k * 0.15), 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha /= 0.55;
    }
  } else if (themeId === 4) {
    // 火山テーマ（Stage 9-10）
    // 岩山シルエット
    const mountains = [{x:60,w:140,h:160},{x:240,w:120,h:130},{x:380,w:110,h:150}];
    for (const m of mountains) {
      ctx.fillStyle = 'rgba(40,8,2,0.50)';
      ctx.beginPath();
      ctx.moveTo(m.x - m.w / 2, H - 100);
      ctx.quadraticCurveTo(m.x, H - 100 - m.h, m.x + m.w / 2, H - 100);
      ctx.fill();
    }
    // 溶岩ライン（sin波）
    ctx.strokeStyle = '#ff4400';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let px = 0; px <= W; px += 4) {
      const py = H - 105 + Math.sin((px * 0.035) + frameCount * 0.04) * 7;
      if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawGround() {
  if (hasSprites()) {
    const grad = ctx.createLinearGradient(0, GROUND_Y - 8, 0, H);
    grad.addColorStop(0, '#53b84b');
    grad.addColorStop(1, '#1c5e28');
    ctx.fillStyle = grad;
    ctx.fillRect(0, GROUND_Y - 2, W, H - GROUND_Y + 2);
    for (let x = -12; x < W + 22; x += 32) {
      drawSprite(15, x + 16, GROUND_Y - 8, 42, 34);
    }
    drawSprite(13, 42, GROUND_Y - 32, 66, 66);
    drawSprite(14, W - 42, GROUND_Y - 32, 66, 66);
    return;
  }
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#2d6a2d';
  ctx.fillRect(0, GROUND_Y, W, 10);
  ctx.fillStyle = '#3d8a3d';
  for (let x = 8; x < W; x += 22) {
    ctx.fillRect(x,     GROUND_Y - 5, 3, 5);
    ctx.fillRect(x + 6, GROUND_Y - 7, 3, 7);
    ctx.fillRect(x + 12,GROUND_Y - 4, 3, 4);
  }
}

function drawBubble(b) {
  if (b.popped && b.alpha <= 0) return;
  if (hasSprites()) {
    ctx.save();
    ctx.globalAlpha = b.alpha;
    const r = b.popped ? b.radius * Math.max(0.05, 1 - b.popTimer * 0.06) : b.radius;
    drawSprite(4, b.x, b.y, r * 2.45, r * 2.45);
    if (HAZARD_TYPES.has(b.contents)) {
      const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.18);
      ctx.strokeStyle = `rgba(255,50,50,${0.72 + 0.28 * pulse})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ff2200';
      ctx.shadowBlur = 10 + 12 * pulse;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r * 0.94, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if (!b.popped) drawItemIcon(b.x, b.y, b.contents,
      Math.floor(r * (HAZARD_TYPES.has(b.contents) ? 0.7 : 0.58)));
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.globalAlpha = b.alpha;
  const r = b.popped ? b.radius * Math.max(0.05, 1 - b.popTimer * 0.06) : b.radius;
  const grad = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.35, r * 0.05, b.x, b.y, r);
  grad.addColorStop(0,   'rgba(200,240,255,0.55)');
  grad.addColorStop(0.6, 'rgba(80,180,255,0.18)');
  grad.addColorStop(1,   'rgba(60,140,220,0.38)');
  ctx.beginPath();
  ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  // 危険アイテムの泡は内部に赤ティントを重ねる
  if (HAZARD_TYPES.has(b.contents) && !b.popped) {
    const pulse2 = 0.5 + 0.5 * Math.sin(frameCount * 0.18);
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,0,0,${0.07 + 0.05 * pulse2})`;
    ctx.fill();
  }
  // 危険アイテムの泡は赤縁グロー＋太いボーダーで点滅表示
  if (HAZARD_TYPES.has(b.contents)) {
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.18);
    ctx.strokeStyle = `rgba(255,50,50,${0.7 + 0.3 * pulse})`;
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 8 + 10 * pulse;
  } else {
    ctx.strokeStyle = 'rgba(180,240,255,0.85)';
    ctx.lineWidth = 1.5;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  // ハイライト
  ctx.beginPath();
  ctx.arc(b.x - r * 0.28, b.y - r * 0.32, r * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fill();
  // 中身アイコン（危険アイテムは拡大表示）
  if (!b.popped) drawItemIcon(b.x, b.y, b.contents,
    Math.floor(r * (HAZARD_TYPES.has(b.contents) ? 0.68 : 0.55)));
  ctx.restore();
}

function drawItemIcon(x, y, type, size) {
  if (hasSprites()) {
    const spriteMap = {
      coin: 5, chest: 6, ladder: 7, tool: 8,
      bomb: 9, hammer: 10, ball: 11
    };
    const idx = spriteMap[type];
    if (idx !== undefined) {
      const scale = type === 'chest' ? 2.7 :
        type === 'ladder' ? 2.9 :
        type === 'tool' ? 2.7 :
        type === 'hammer' ? 2.8 :
        type === 'bomb' ? 2.65 :
        type === 'ball' ? 2.45 : 2.35;
      drawSprite(idx, x, y, size * scale, size * scale);
      return;
    }
  }
  ctx.save();
  if (type === 'coin') {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.fill();
    ctx.strokeStyle = '#c8a000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#a07800';
    ctx.font = `bold ${Math.max(8, size * 0.75)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', x, y + 1);
  } else if (type === 'chest') {
    const s = size * 0.7;
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(x - s, y - s * 0.5, s * 2, s * 1.1);
    ctx.fillStyle = '#c8841a';
    ctx.fillRect(x - s, y - s * 0.5, s * 2, s * 0.45);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(x - s * 0.22, y - s * 0.15, s * 0.44, s * 0.38);
    ctx.strokeStyle = '#5a2a00';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - s, y - s * 0.5, s * 2, s * 1.1);
  } else if (type === 'ladder') {
    ctx.strokeStyle = '#c8a06a';
    ctx.lineWidth = 2;
    const h = size * 1.1, w = size * 0.65;
    ctx.beginPath(); ctx.moveTo(x - w, y - h); ctx.lineTo(x - w, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + w, y - h); ctx.lineTo(x + w, y + h); ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x - w, y + i * h * 0.45);
      ctx.lineTo(x + w, y + i * h * 0.45);
      ctx.stroke();
    }
  } else if (type === 'tool') {
    ctx.fillStyle = '#999';
    ctx.fillRect(x - size * 0.22, y - size * 0.8, size * 0.44, size * 1.3);
    ctx.fillStyle = '#bbb';
    ctx.fillRect(x - size * 0.5, y - size * 0.8, size, size * 0.35);
    ctx.fillRect(x - size * 0.5, y - size * 0.55, size, size * 0.2);
  } else if (type === 'bomb') {
    // Phase 8-2: 爆弾 — 黒い円 + 導火線 + 点滅火花
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x, y, size * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + size * 0.5, y - size * 0.5);
    ctx.quadraticCurveTo(x + size, y - size, x + size * 0.8, y - size * 1.2);
    ctx.stroke();
    // 火花（点滅）
    if (Math.floor(frameCount / 4) % 2 === 0) {
      ctx.fillStyle = '#ffdd00';
      ctx.beginPath(); ctx.arc(x + size * 0.8, y - size * 1.2, size * 0.25, 0, Math.PI * 2); ctx.fill();
    }
  } else if (type === 'hammer') {
    // Phase 8-2: ハンマー — 矩形ヘッド + 柄
    ctx.fillStyle = '#888';
    ctx.fillRect(x - size * 0.9, y - size * 0.9, size * 1.8, size * 0.7); // ヘッド
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x - size * 0.15, y - size * 0.2, size * 0.3, size * 1.2); // 柄
  } else if (type === 'ball') {
    // 玉アイテム — シアン発光オーブ
    const pulse = 0.85 + 0.15 * Math.sin(frameCount * 0.18);
    const grad = ctx.createRadialGradient(x - size * 0.25, y - size * 0.25, 0, x, y, size * 0.7 * pulse);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, '#aaeeff');
    grad.addColorStop(0.7, '#44aaff');
    grad.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.beginPath();
    ctx.arc(x, y, size * 0.7 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, size * 0.7 * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(136,221,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawLadder(lad) {
  const x = lad.x, top = lad.bottomY - lad.height, bot = lad.bottomY;
  if (hasSprites()) {
    drawSprite(7, x, top + lad.height / 2, 42, lad.height + 26);
    return;
  }
  ctx.strokeStyle = '#c8a06a';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - 8, top); ctx.lineTo(x - 8, bot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 8, top); ctx.lineTo(x + 8, bot); ctx.stroke();
  ctx.lineWidth = 2;
  const steps = Math.floor(lad.height / 13);
  for (let i = 0; i <= steps; i++) {
    const ry = top + (i / steps) * lad.height;
    ctx.beginPath(); ctx.moveTo(x - 8, ry); ctx.lineTo(x + 8, ry); ctx.stroke();
  }
}

function drawGnome(g) {
  // 表情タイマー更新
  if (g.expressionTimer > 0) g.expressionTimer--;
  else g.expression = 'normal';

  const x = Math.round(g.x), y = Math.round(g.y);
  const bob = g.state === 'walk' ? Math.sin(frameCount * 0.28) * 1.5 : 0;
  const ay = y + bob; // animation y offset applied to body

  // キャラ名ネームタグ
  if (g.charName) {
    ctx.save();
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = g.hatColor || '#ffffff';
    ctx.fillText(g.charName, x, ay - GNOME_H - 22);
    ctx.restore();
  }

  // プレイヤー操作中インジケータ
  const gnomeIdx = gnomes.indexOf(g);
  const isPlayerCtrl = (gnomeIdx === 0 && !touchControlActive &&
    (playerControl.left || playerControl.right || playerControl.up || playerControl.down)) ||
    (touchControlActive && gnomeIdx === touchControlledGnomeIdx);
  if (isPlayerCtrl) {
    ctx.save();
    ctx.fillStyle = '#ffff44';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▶◀', x, ay - GNOME_H - 13);
    ctx.restore();
  }
  // 帽子（三角）
  if (hasSprites()) {
    let spriteIdx = gnomeIdx >= 0 ? gnomeIdx % 4 : 0;
    if (g.hatColor === '#33aa33') spriteIdx = 1;
    else if (g.hatColor === '#5555dd') spriteIdx = 2;
    else if (g.hatColor === '#dddd33') spriteIdx = 3;
    drawSprite(spriteIdx, x, ay - 18, 54, 54, { flipX: g.vx < -0.1 });
    return;
  }
  ctx.fillStyle = g.hatColor;
  ctx.beginPath();
  ctx.moveTo(x, ay - GNOME_H - 8);
  ctx.lineTo(x - 8, ay - GNOME_H + 3);
  ctx.lineTo(x + 8, ay - GNOME_H + 3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = g.bodyColor;
  ctx.fillRect(x - 9, ay - GNOME_H + 3, 18, 3);

  // 顔
  ctx.fillStyle = '#f5c07a';
  ctx.fillRect(x - 6, ay - GNOME_H + 6, 12, 10);
  if (g.expression === 'surprised') {
    // 驚き顔: 大きい目＋O型の口
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 4, ay - GNOME_H + 7, 3, 3);
    ctx.fillRect(x + 1, ay - GNOME_H + 7, 3, 3);
    ctx.beginPath();
    ctx.arc(x, ay - GNOME_H + 13, 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (g.expression === 'happy') {
    // 笑顔: 通常目＋上向きカーブ口
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 4, ay - GNOME_H + 8, 2, 2);
    ctx.fillRect(x + 2, ay - GNOME_H + 8, 2, 2);
    ctx.beginPath();
    ctx.arc(x, ay - GNOME_H + 11, 3, 0, Math.PI);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else {
    // 通常顔
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 4, ay - GNOME_H + 8, 2, 2);
    ctx.fillRect(x + 2, ay - GNOME_H + 8, 2, 2);
    ctx.fillStyle = '#d08060';
    ctx.fillRect(x - 1, ay - GNOME_H + 11, 2, 2);
  }

  // ボディ
  ctx.fillStyle = g.bodyColor;
  ctx.fillRect(x - 7, ay - GNOME_H + 16, 14, 10);

  // 足（歩行アニメ）
  const legSwing = g.state === 'walk' ? Math.sin(frameCount * 0.3) * 3 : 0;
  ctx.fillStyle = '#3a2008';
  ctx.fillRect(x - 5, ay - GNOME_H + 26 + legSwing, 5, 7);
  ctx.fillRect(x,     ay - GNOME_H + 26 - legSwing, 5, 7);
}

function drawBall(ball) {
  ctx.save();
  if (hasSprites()) {
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const a = (i / ball.trail.length) * 0.35;
      ctx.globalAlpha = a;
      drawSprite(11, t.x, t.y, 18, 18);
    }
    ctx.globalAlpha = 1;
    drawSprite(11, ball.x, ball.y, 30, 30);
    ctx.restore();
    return;
  }
  // トレイル
  for (let i = 0; i < ball.trail.length; i++) {
    const t = ball.trail[i];
    const a = (i / ball.trail.length) * 0.35;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(136,221,255,${a})`;
    ctx.fill();
  }
  // 玉本体（グロー）
  const grd = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, 8);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.3, '#88eeff');
  grd.addColorStop(1, 'rgba(0,180,255,0)');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.restore();
}

function drawItem(it) {
  if (it.collected) return;
  ctx.save();
  if (!it.landed && it.type === 'ladder') {
    // 梯子アイテムはドラッグ可能なのでグロー表示
    ctx.shadowColor = '#c8a06a';
    ctx.shadowBlur = 8 + Math.sin(frameCount * 0.1) * 4;
  }
  drawItemIcon(it.x, it.y, it.type, 14);
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of _pPool) {
    if (!p.active) continue;
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) { p.active = false; continue; }
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawRings() {
  ctx.save();
  for (let i = rings.length - 1; i >= 0; i--) {
    const rg = rings[i];
    rg.r += (rg.maxR - rg.r) * 0.22;
    rg.life--;
    if (rg.life <= 0) { rings.splice(i, 1); continue; }
    const alpha = rg.life / rg.maxLife;
    ctx.globalAlpha = alpha * 0.75;
    ctx.strokeStyle = rg.color;
    ctx.lineWidth = 3 * alpha;
    ctx.shadowColor = rg.color;
    ctx.shadowBlur = 6 * alpha;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// === 浮遊ブロック描画（マリオ風レンガ）===
function drawFloatingBlocks() {
  for (const bl of floatingBlocks) {
    const { x, y, w, h } = bl;
    if (hasSprites()) {
      drawSprite(12, x + w / 2, y + h / 2, w + 30, 54);
      continue;
    }
    // メイン面
    ctx.fillStyle = '#c8843a';
    ctx.fillRect(x, y, w, h);
    // 水平目地
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(x, y + Math.floor(h / 2) - 1, w, 2);
    // 垂直目地（上段・下段で半ズレ）
    const bw = Math.floor(w / 2);
    ctx.fillRect(x + bw - 1, y, 2, Math.floor(h / 2) - 1);
    ctx.fillRect(x + Math.floor(bw / 2) - 1, y + Math.floor(h / 2) + 1, 2, h - Math.floor(h / 2) - 1);
    ctx.fillRect(x + bw + Math.floor(bw / 2) - 1, y + Math.floor(h / 2) + 1, 2, h - Math.floor(h / 2) - 1);
    // 上端ハイライト
    ctx.fillStyle = '#e8a450';
    ctx.fillRect(x, y, w, 2);
    // 下端シャドウ
    ctx.fillStyle = '#6a3010';
    ctx.fillRect(x, y + h - 2, w, 2);
  }
}

// === カラス描画 ===
function drawCrow(crow) {
  const cx = Math.round(crow.x), cy = Math.round(crow.y);
  const wing = Math.sin(crow.wingAnim * 0.28) * 7;
  const facingRight = crow.vx >= 0;
  if (hasEffects()) {
    drawEffect(facingRight ? 0 : 1, cx, cy + wing * 0.12, 52, 52);
    if (crow.warnTimer > 0) {
      ctx.save();
      ctx.globalAlpha = Math.floor(crow.warnTimer / 5) % 2 === 0 ? 1.0 : 0.35;
      drawEffect(2, cx, cy - 31, 28, 24);
      ctx.restore();
    }
    return;
  }
  ctx.save();
  // 翼（左右）
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(cx - 13, cy + wing, 11, 5, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + 13, cy + wing, 11, 5, 0.35, 0, Math.PI * 2);
  ctx.fill();
  // 胴体
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(cx, cy, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // くちばし
  ctx.fillStyle = '#cc7700';
  const bx = facingRight ? cx + 9 : cx - 9;
  const bdir = facingRight ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(bx, cy - 1);
  ctx.lineTo(bx + bdir * 7, cy + 1);
  ctx.lineTo(bx, cy + 4);
  ctx.closePath();
  ctx.fill();
  // 目（赤）
  ctx.fillStyle = '#ff3333';
  ctx.beginPath();
  ctx.arc(cx + bdir * 5, cy - 1, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // D3: 警告マーク
  if (crow.warnTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.floor(crow.warnTimer / 5) % 2 === 0 ? 1.0 : 0.3;
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚠', cx, cy - 22);
    ctx.restore();
  }
}

// === 雷描画 ===
function drawLightnings() {
  for (const lt of lightnings) {
    if (lt.phase === 'done') continue;
    ctx.save();
    if (hasEffects()) {
      if (lt.phase === 'warn') {
        if (Math.floor(lt.timer / 6) % 2 === 0) {
          ctx.strokeStyle = 'rgba(255,255,80,0.35)';
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(lt.x, 0);
          ctx.lineTo(lt.x, GROUND_Y);
          ctx.stroke();
          ctx.setLineDash([]);
          drawEffect(2, lt.x, 52 + Math.sin(frameCount * 0.15) * 5, 42, 34);
        }
      } else if (lt.phase === 'strike') {
        const alpha = Math.max(0, 1 - lt.timer / 22);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgba(255,255,180,0.16)';
        ctx.fillRect(lt.x - 34, 0, 68, GROUND_Y);
        drawEffect(3, lt.x, GROUND_Y / 2, 96, GROUND_Y);
      }
      ctx.restore();
      continue;
    }
    if (lt.phase === 'warn') {
      // 点滅する警告ライン
      if (Math.floor(lt.timer / 6) % 2 === 0) {
        ctx.strokeStyle = 'rgba(255,255,80,0.35)';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(lt.x, 0);
        ctx.lineTo(lt.x, GROUND_Y);
        ctx.stroke();
        ctx.setLineDash([]);
        // 警告マーク
        ctx.fillStyle = 'rgba(255,220,0,0.7)';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚡', lt.x, 50 + Math.sin(frameCount * 0.15) * 5);
      }
    } else if (lt.phase === 'strike' && lt.boltPoints) {
      const alpha = Math.max(0, 1 - lt.timer / 22);
      ctx.globalAlpha = alpha;
      // 光エフェクト
      ctx.fillStyle = 'rgba(255,255,180,0.2)';
      ctx.fillRect(lt.x - 32, 0, 64, GROUND_Y);
      // ボルト本体
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(lt.boltPoints[0].x, lt.boltPoints[0].y);
      for (let i = 1; i < lt.boltPoints.length; i++) {
        ctx.lineTo(lt.boltPoints[i].x, lt.boltPoints[i].y);
      }
      ctx.stroke();
      // 細いコア
      ctx.strokeStyle = '#ffffaa';
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(lt.boltPoints[0].x, lt.boltPoints[0].y);
      for (let i = 1; i < lt.boltPoints.length; i++) {
        ctx.lineTo(lt.boltPoints[i].x, lt.boltPoints[i].y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ボーナスポップアップ表示（スコア加算時のフローティングテキスト）
function drawBonusPopups() {
  if (bonusPopups.length === 0) return;
  ctx.save();
  for (let i = bonusPopups.length - 1; i >= 0; i--) {
    const p = bonusPopups[i];
    p.y -= 0.6;
    p.life--;
    if (p.life <= 0) { bonusPopups.splice(i, 1); continue; }
    const alpha = Math.min(1, p.life / (p.maxLife * 0.35));
    ctx.globalAlpha = alpha;
    ctx.font = p.large ? 'bold 18px monospace' : 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

function drawPath() {
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth = 2;

  // 引き中のパス（水色）
  if (isDrawing && drawnPath.length >= 2) {
    ctx.strokeStyle = 'rgba(100,220,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(drawnPath[0].x, drawnPath[0].y);
    for (let i = 1; i < drawnPath.length; i++) ctx.lineTo(drawnPath[i].x, drawnPath[i].y);
    ctx.stroke();
  }

  // 各小人のウェイポイント（小人位置→終点の点線）
  for (const g of gnomes) {
    if (g.waypoints.length < 1) continue;
    ctx.strokeStyle = 'rgba(160,255,180,0.7)';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    for (const wp of g.waypoints) ctx.lineTo(wp.x, wp.y);
    ctx.stroke();
  }

  ctx.setLineDash([]);
  ctx.restore();
}

// Phase 2: ハート描画関数（ベジェ曲線でハート形）
function drawHeart(cx, cy, size, filled) {
  if (hasEffects()) {
    drawEffect(4, cx, cy + size * 0.26, size * 3.2, size * 3.2, { alpha: filled ? 1 : 0.28 });
    return;
  }
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx, cy + size * 0.3);
  ctx.bezierCurveTo(cx - size, cy - size * 0.6, cx - size * 1.6, cy + size * 0.5, cx, cy + size * 1.2);
  ctx.bezierCurveTo(cx + size * 1.6, cy + size * 0.5, cx + size, cy - size * 0.6, cx, cy + size * 0.3);
  ctx.closePath();
  ctx.fillStyle = filled ? '#ff4466' : 'rgba(255,80,120,0.25)';
  ctx.fill();
  ctx.strokeStyle = filled ? '#ff88aa' : 'rgba(255,80,120,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.restore();
}

// === スクリーン描画 ===
function drawHUDBar() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.72)';
  ctx.fillRect(0, 0, W, 42);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('SCORE ' + score, 10, 27);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aaeeff';
  ctx.fillText(isEndless ? 'ENDLESS ' + (stage - STAGE_CFG.length + 2) : 'STAGE ' + (stage + 1), W / 2, 27);

  // B2: コンボ表示（残り30フレームで赤フラッシュ＋タイマーバー）
  if (comboCount >= 2) {
    const warning = comboTimer > 0 && comboTimer < 30;
    const flash = warning && Math.floor(frameCount / 4) % 2 === 0;
    ctx.fillStyle = flash ? '#ff4444' : '#ffdd44';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('COMBO x' + comboCount, W / 2, 40);
    if (comboTimer > 0) {
      const prog2 = comboTimer / COMBO_WINDOW;
      ctx.fillStyle = warning ? '#ff4444' : '#ffdd44';
      ctx.globalAlpha = 0.4;
      ctx.fillRect(W / 2 - 30, 42, 60, 2);
      ctx.globalAlpha = 1;
      ctx.fillRect(W / 2 - 30, 42, 60 * prog2, 2);
    }
  }

  // Phase 2: ハートでライフ表示（右上端）
  const maxLives = STAGE_CFG[stage].lives || MAX_LIVES;
  for (let h = 0; h < maxLives; h++) {
    drawHeart(W - 18 - h * 22, 14, 7, h < lives);
  }

  // ミュートボタン
  ctx.textAlign = 'center';
  ctx.font = '14px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(AudioSystem.muted ? '🔇' : '🔊', W - 18 - maxLives * 22 - 22, 18);

  // B1: ポーズボタン
  ctx.fillText('⏸', getPauseButtonX(), 18);

  // 玉残数
  ctx.textAlign = 'left';
  ctx.font = '12px monospace';
  const ballFlash = ballCount <= 3 && Math.floor(frameCount / 10) % 2 === 0;
  ctx.fillStyle = ballFlash ? '#ff4444' : '#88ddff';
  if (hasSprites()) {
    drawSprite(11, 58, 22, 22, 22);
    ctx.fillText(String(ballCount), 74, 27);
  } else {
    ctx.fillText('🔮 ' + ballCount, 56, 27);
  }

  // プログレスバー（アイテム収集）
  ctx.textAlign = 'right';
  ctx.fillStyle = '#88ffaa';
  ctx.font = '12px monospace';
  ctx.fillText(itemsCollected + ' / ' + STAGE_CFG[stage].target, W - 18 - maxLives * 22 - 42, 27);
  const prog = Math.min(1, itemsCollected / STAGE_CFG[stage].target);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(10, 33, W - 20, 5);
  ctx.fillStyle = '#44ff88';
  ctx.fillRect(10, 33, (W - 20) * prog, 5);

  // B3: タイムボーナスバー（右寄せ、金色）
  const elapsed = (Date.now() - stageStartTime) / 1000;
  const timeProg = Math.max(0, 1 - elapsed / 100);
  if (timeProg > 0) {
    const bw = 80, bx = W - bw - 10;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(bx, 38, bw, 3);
    ctx.fillStyle = timeProg > 0.3 ? '#ffd700' : '#ff8844';
    ctx.fillRect(bx, 38, bw * timeProg, 3);
  }

  ctx.restore();
}

// B1: ポーズオーバーレイ
function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,30,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aaeeff';
  ctx.font = 'bold 32px monospace';
  ctx.fillText('⏸ PAUSE', W / 2, H * 0.38);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px sans-serif';
  ctx.fillText(AudioSystem.muted ? '🔇 ミュート中' : '🔊 音あり', W / 2, H * 0.50);
  ctx.fillStyle = (Math.floor(frameCount / 22) % 2 === 0) ? '#ffffff' : '#66aaff';
  ctx.font = '14px monospace';
  ctx.fillText('タップ / Esc で再開', W / 2, H * 0.62);
  ctx.restore();
}

// C2: 初回チュートリアルオーバーレイ（5ステップ式）
function drawTutorialOverlay() {
  if (!tutorialActive || tutorialStep < 0) return;
  const step = TUTORIAL_STEPS[tutorialStep];
  ctx.save();
  // 半透明オーバーレイ
  ctx.fillStyle = 'rgba(0,0,30,0.88)';
  ctx.fillRect(0, 0, W, H);

  // スキップ（右上）
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150,180,255,0.7)';
  ctx.fillText('スキップ ▶▶', W - 12, 22);

  // ステップインジケーター（●5個）
  for (let i = 0; i < TUTORIAL_STEPS.length; i++) {
    ctx.beginPath();
    ctx.arc(W / 2 + (i - 2) * 16, H * 0.20, 4, 0, Math.PI * 2);
    ctx.fillStyle = i === tutorialStep ? '#aaeeff' : 'rgba(170,238,255,0.30)';
    ctx.fill();
  }

  // タイトル
  ctx.textAlign = 'center';
  ctx.font = 'bold 17px monospace';
  ctx.fillStyle = '#aaeeff';
  ctx.fillText(step.title, W / 2, H * 0.28);

  // アイコン
  if (step.icon) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    drawItemIcon(W / 2, H * 0.44, step.icon, 26);
    ctx.restore();
  }

  // 説明文（改行対応）
  const lines = step.desc.split('\n');
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#e0e8ff';
  const startY = step.icon ? H * 0.56 : H * 0.44;
  lines.forEach((line, i) => ctx.fillText(line, W / 2, startY + i * 20));

  // 「次へ」ボタン
  const btnX = W * 0.55, btnY = H * 0.78, btnW = W * 0.34, btnH = 32;
  const isLast = tutorialStep >= TUTORIAL_STEPS.length - 1;
  ctx.fillStyle = isLast ? 'rgba(0,200,120,0.25)' : 'rgba(0,150,220,0.25)';
  ctx.beginPath();
  ctx.roundRect(btnX - btnW / 2, btnY - btnH / 2, btnW, btnH, 8);
  ctx.fill();
  ctx.strokeStyle = isLast ? '#00cc78' : '#00aaff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = isLast ? '#00ff99' : '#aaeeff';
  ctx.font = 'bold 13px monospace';
  ctx.fillText(isLast ? 'はじめる！' : '次へ ▶', btnX, btnY + 5);

  ctx.restore();
}

function drawTitle() {
  drawBackground();

  // 泡アニメーション背景
  for (const b of titleBubbles) {
    ctx.save();
    ctx.globalAlpha = b.alpha + 0.08 * Math.sin(frameCount * 0.04 + b.r);
    const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 1, b.x, b.y, b.r);
    grad.addColorStop(0, 'rgba(200,240,255,0.5)');
    grad.addColorStop(0.7, 'rgba(100,200,255,0.15)');
    grad.addColorStop(1, 'rgba(80,180,255,0.0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,230,255,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  ctx.textAlign = 'center';

  // ロゴ（虹色グラデーション + 浮遊）
  const logoY = H * 0.22 + Math.sin(frameCount * 0.04) * 6;
  ctx.save();
  ctx.font = 'bold 13px monospace';
  const subGrad = ctx.createLinearGradient(W * 0.2, 0, W * 0.8, 0);
  subGrad.addColorStop(0, '#aaeeff');
  subGrad.addColorStop(1, '#88ccff');
  ctx.fillStyle = subGrad;
  ctx.fillText('🫧  B U B B L E', W / 2, logoY);
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 27px monospace';
  const rainbowGrad = ctx.createLinearGradient(W * 0.1, 0, W * 0.9, 0);
  rainbowGrad.addColorStop(0,    '#ff6b6b');
  rainbowGrad.addColorStop(0.18, '#ffa500');
  rainbowGrad.addColorStop(0.35, '#ffd700');
  rainbowGrad.addColorStop(0.52, '#7fff00');
  rainbowGrad.addColorStop(0.68, '#00cfff');
  rainbowGrad.addColorStop(0.85, '#a78bfa');
  rainbowGrad.addColorStop(1,    '#ff6b6b');
  ctx.fillStyle = rainbowGrad;
  ctx.shadowColor = 'rgba(100,200,255,0.5)';
  ctx.shadowBlur = 10;
  ctx.fillText('RESCUE CLIMBER', W / 2, logoY + 30);
  ctx.restore();

  ctx.fillStyle = 'rgba(160,200,230,0.75)';
  ctx.font = '12px monospace';
  ctx.fillText('バブル・レスキュー・クライマー', W / 2, logoY + 50);

  // ハイスコアTOP3
  if (HiScore.scores[0] > 0) {
    ctx.font = 'bold 11px monospace';
    ['#ffd700','#cccccc','#cd7f32'].forEach((col, i) => {
      if (HiScore.scores[i] > 0) {
        ctx.fillStyle = col;
        ctx.fillText(['🥇','🥈','🥉'][i] + '  ' + HiScore.scores[i], W / 2, H * 0.46 + i * 16);
      }
    });
  }

  // 小人プレビュー（左右に歩く）
  const demoG = {
    x: titleGnomeX, y: H * 0.62,
    vx: titleGnomeDir * 0.5,
    state: 'walk',
    hatColor: GNOME_CHARS[(Math.floor(frameCount / 120)) % 4].hatColor,
    bodyColor: GNOME_CHARS[(Math.floor(frameCount / 120)) % 4].bodyColor,
    charName: GNOME_CHARS[(Math.floor(frameCount / 120)) % 4].name,
    expression: 'normal',
  };
  drawGnome(demoG);

  // PLAYボタン（パルスアニメ）
  const btnW2 = 160, btnH2 = 38, btnX2 = W / 2, btnY2 = H * 0.72;
  const pulse = 1.5 + 2 * Math.abs(Math.sin(frameCount * 0.07));
  ctx.save();
  ctx.strokeStyle = (Math.floor(frameCount / 22) % 2 === 0) ? '#aaeeff' : '#66aaff';
  ctx.lineWidth = pulse;
  ctx.fillStyle = 'rgba(0,100,200,0.18)';
  ctx.beginPath();
  ctx.roundRect(btnX2 - btnW2 / 2, btnY2 - btnH2 / 2, btnW2, btnH2, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = (Math.floor(frameCount / 22) % 2 === 0) ? '#ffffff' : '#aaeeff';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('▶  PLAY', btnX2, btnY2 + 6);
  ctx.restore();

  // キャラクター紹介
  ctx.fillStyle = 'rgba(120,160,200,0.70)';
  ctx.font = '10px monospace';
  ctx.fillText('Speedy / Jumpy / Braver / Lucky', W / 2, H * 0.84);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5566';
  ctx.font = 'bold 36px monospace';
  ctx.fillText('GAME OVER', W / 2, H * 0.35);
  ctx.fillStyle = '#ffd700';
  ctx.font = '22px monospace';
  ctx.fillText('SCORE: ' + score, W / 2, H * 0.46);
  ctx.fillStyle = '#aaaaff';
  ctx.font = '14px monospace';
  ctx.fillText('STAGE ' + (stage + 1) + ' まで到達', W / 2, H * 0.54);
  // Phase 5: ハイスコア・NEWレコード表示
  if (score >= hiScore && score > 0) {
    ctx.fillStyle = (Math.floor(frameCount / 18) % 2 === 0) ? '#ffd700' : '#ff88aa';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('★ NEW HI-SCORE! ★', W / 2, H * 0.63);
  } else if (hiScore > 0) {
    ctx.fillStyle = '#aaaaaa';
    ctx.font = '13px monospace';
    ctx.fillText('BEST: ' + hiScore, W / 2, H * 0.63);
  }
  ctx.fillStyle = (Math.floor(frameCount / 22) % 2 === 0) ? '#fff' : '#66aaff';
  ctx.font = '15px monospace';
  ctx.fillText('クリック / タップ でリトライ', W / 2, H * 0.75);
  ctx.textAlign = 'left';
}

function drawClear() {
  ctx.fillStyle = 'rgba(0,10,0,0.85)';
  ctx.fillRect(0, 0, W, H);
  // D2: 紙吹雪 80個（四角50＋円30）
  const cfColors = ['#ffd700','#ff88aa','#88ffcc','#88aaff','#ffaa44','#ffffff'];
  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = cfColors[i % cfColors.length];
    ctx.fillRect(
      ((i * 137 + frameCount * 3) % W + W) % W,
      ((i * 79  + frameCount * 2) % H + H) % H, 5, 7
    );
  }
  for (let i = 0; i < 30; i++) {
    const cx2 = ((i * 173 + frameCount * 4 + 50) % W + W) % W;
    const cy2 = ((i * 113 + frameCount * 2.5 + 80) % H + H) % H;
    ctx.beginPath();
    ctx.arc(cx2, cy2, 3, 0, Math.PI * 2);
    ctx.fillStyle = cfColors[(i + 2) % cfColors.length];
    ctx.fill();
  }
  // D2: "ALL CLEAR!" スケールパルス
  const scale = 1.0 + 0.06 * Math.sin(frameCount * 0.12);
  ctx.save();
  ctx.translate(W / 2, H * 0.32);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 18;
  ctx.font = 'bold 30px monospace';
  ctx.fillText('ALL CLEAR!', 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#88ffcc';
  ctx.font = '20px monospace';
  ctx.fillText('全ステージクリア！', W / 2, H * 0.44);
  ctx.fillStyle = '#ffffff';
  ctx.font = '18px monospace';
  ctx.fillText('最終スコア: ' + score, W / 2, H * 0.55);
  ctx.fillStyle = (Math.floor(frameCount / 22) % 2 === 0) ? '#fff' : '#ffd700';
  ctx.font = '15px monospace';
  ctx.fillText('クリック / タップ でタイトルへ', W / 2, H * 0.68);
  ctx.textAlign = 'left';
}

// === 入力処理 ===
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top)  * (H / rect.height),
  };
}

function handleStateClick(pos) {
  AudioSystem.init();
  if (state === 'title')    { initGame(); state = 'play'; AudioSystem.startBGM(); return true; }
  if (state === 'gameover') { initGame(); state = 'play'; AudioSystem.startBGM(); return true; }
  if (state === 'clear')    { state = 'title';            AudioSystem.stopBGM();  return true; }
  if (state === 'pause')    { state = 'play';                                     return true; }
  return false;
}

function handlePlayClick(pos) {
  // B1: ポーズボタン判定
  if (pos.y < 42 && Math.abs(pos.x - getPauseButtonX()) < 20) {
    state = 'pause'; return;
  }
  // C2: チュートリアル操作（次へ / スキップ）
  if (tutorialActive) {
    const finishTutorial = () => {
      tutorialActive = false; tutorialStep = -1;
      localStorage.setItem('brc_tutorial_done', '1');
    };
    // スキップ判定（右上エリア: x > W-100, y < 36）
    if (pos.x > W - 100 && pos.y < 36) { finishTutorial(); return; }
    // 次へボタン判定（中央下: x ∈ [W*0.38, W*0.72], y ∈ [H*0.74, H*0.82]）
    if (pos.x >= W * 0.38 && pos.x <= W * 0.72 && pos.y >= H * 0.74 && pos.y <= H * 0.82) {
      tutorialStep++;
      if (tutorialStep >= TUTORIAL_STEPS.length) finishTutorial();
    }
    return;
  }
  // C3: ミュートボタン判定（ヒット半径拡大: 18→30）
  const maxLives = STAGE_CFG[stage].lives || MAX_LIVES;
  const muteX = W - 18 - maxLives * 22 - 22;
  if (pos.y < 42 && Math.abs(pos.x - muteX) < 30) {
    AudioSystem.toggleMute();
    return;
  }
  // 最近傍の小人から玉を発射
  if (gnomes.length > 0) {
    if (ballCount <= 0) {
      bonusPopups.push({ x: pos.x, y: pos.y - 20, text: '弾切れ!', life: 50, maxLife: 50, color: '#ff4444', large: false });
      return;
    }
    let nearestG = gnomes[0], nearestD = dist2(gnomes[0].x, gnomes[0].y, pos.x, pos.y);
    for (let i = 1; i < gnomes.length; i++) {
      const d = dist2(gnomes[i].x, gnomes[i].y, pos.x, pos.y);
      if (d < nearestD) { nearestD = d; nearestG = gnomes[i]; }
    }
    balls.push(makeProjectile(nearestG, pos.x, pos.y));
    ballCount--;
    playSE('throw');
    updateHUD();
    return;
  }
  // 梯子アイテムを設置（地面付近でクリック）
  for (const it of items) {
    if (it.collected || it.type !== 'ladder' || !it.landed) continue;
    if (dist2(it.x, it.y, pos.x, pos.y) < 30 * 30) {
      it.collected = true;
      placeLadder(it.x);
      return;
    }
  }
}

canvas.addEventListener('mousedown', e => {
  const pos = getCanvasPos(e);
  mouseDownPos = { ...pos };
  hasDragged = false;
  if (state !== 'play') return;
  // 小人の近くなら線引きモード
  activeGnomeIdx = -1;
  for (let i = 0; i < gnomes.length; i++) {
    if (dist2(gnomes[i].x, gnomes[i].y, pos.x, pos.y) < 45 * 45) {
      activeGnomeIdx = i;
      isDrawing = true;
      drawnPath = [pos];
      break;
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const pos = getCanvasPos(e);
  if (mouseDownPos) {
    if (dist2(pos.x, pos.y, mouseDownPos.x, mouseDownPos.y) > DRAG_THRESHOLD * DRAG_THRESHOLD)
      hasDragged = true;
  }
  if (isDrawing && activeGnomeIdx >= 0) {
    const last = drawnPath[drawnPath.length - 1];
    if (dist2(pos.x, pos.y, last.x, last.y) > 64) drawnPath.push(pos);
  }
});

canvas.addEventListener('mouseup', e => {
  const pos = getCanvasPos(e);
  if (isDrawing && activeGnomeIdx >= 0 && drawnPath.length > 2) {
    gnomes[activeGnomeIdx].waypoints = [...drawnPath];
    gnomes[activeGnomeIdx].rawPath  = [...drawnPath];
    gnomes[activeGnomeIdx].waypointTimer = 0;
  }
  isDrawing = false;
  drawnPath = [];
  activeGnomeIdx = -1;
  if (!hasDragged) {
    if (!handleStateClick(pos) && state === 'play') handlePlayClick(pos);
  } else {
    if (state !== 'play') handleStateClick(pos);
  }
  mouseDownPos = null;
});

// タッチイベント — 方向操作 or マウスイベント変換
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = getCanvasPos({ clientX: t.clientX, clientY: t.clientY });
  // 方向タッチ判定
  if (state === 'play' && gnomes.length > 0) {
    let nearestIdx = 0, nearestD = Infinity;
    for (let i = 0; i < gnomes.length; i++) {
      const g = gnomes[i];
      const d = Math.sqrt((g.x - pos.x) ** 2 + (g.y - pos.y) ** 2);
      if (d < nearestD) { nearestD = d; nearestIdx = i; }
    }
    if (nearestD > 18 && nearestD < 90) {
      const g = gnomes[nearestIdx];
      const dx = pos.x - g.x, dy = pos.y - g.y;
      touchControlActive = true;
      touchControlledGnomeIdx = nearestIdx;
      if (Math.abs(dx) >= Math.abs(dy)) {
        if (dx < 0) playerControl.left = true; else playerControl.right = true;
      } else {
        if (dy < 0) playerControl.up = true; else playerControl.down = true;
      }
      return;
    }
  }
  canvas.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (touchControlActive) return;
  const t = e.touches[0];
  canvas.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (touchControlActive) {
    playerControl.left = playerControl.right = playerControl.up = playerControl.down = false;
    touchControlActive = false;
    touchControlledGnomeIdx = -1;
    return;
  }
  const t = e.changedTouches[0];
  canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'play') {
    if (e.key === 'ArrowLeft')  { playerControl.left  = true; e.preventDefault(); }
    if (e.key === 'ArrowRight') { playerControl.right = true; e.preventDefault(); }
    if (e.key === 'ArrowUp')    { playerControl.up    = true; e.preventDefault(); }
    if (e.key === 'ArrowDown')  { playerControl.down  = true; e.preventDefault(); }
  }
  if (e.key === 'Enter') {
    if (state === 'title')    { initGame(); state = 'play'; }
    else if (state === 'gameover') { initGame(); state = 'play'; }
    else if (state === 'clear')    { state = 'title'; }
    else if (state === 'pause')    { state = 'play'; }
  }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (state === 'play')  state = 'pause';
    else if (state === 'pause') state = 'play';
  }
});
document.addEventListener('keyup', e => {
  keys[e.key] = false;
  if (e.key === 'ArrowLeft')  playerControl.left  = false;
  if (e.key === 'ArrowRight') playerControl.right = false;
  if (e.key === 'ArrowUp')    playerControl.up    = false;
  if (e.key === 'ArrowDown')  playerControl.down  = false;
});

// === ゲーム管理 ===
function initStage() {
  // E3: エンドレス用に cfg を動的生成
  const cfg = stage < STAGE_CFG.length ? STAGE_CFG[stage] : (() => {
    const base = STAGE_CFG[STAGE_CFG.length - 1];
    const ex = stage - STAGE_CFG.length + 1;
    return { ...base,
      bubbleRate:  Math.max(25, base.bubbleRate - ex * 3),
      bubbleSpeed: Math.min(4.0, base.bubbleSpeed + ex * 0.15),
      target:      base.target + ex * 15,
      maxBubbles:  Math.min(12, base.maxBubbles + Math.floor(ex / 2)),
      bgColor:     ['#1e0010','#2a0010'],
    };
  })();
  // D4: 背景色遷移
  const prevStage = Math.max(0, stage - 1);
  prevBgColor = (prevStage < STAGE_CFG.length ? STAGE_CFG[prevStage] : { bgColor: ['#1e0010','#2a0010'] }).bgColor;
  bgTransProgress = 0;
  bubbles = []; items = []; ladders = [];
  _pPool.forEach(p => p.active = false); particles = []; rings = []; drawnPath = [];
  bubbleTimer = 0;
  balls = []; ballCount = 10;
  playerControl.left = playerControl.right = playerControl.up = playerControl.down = false;
  touchControlActive = false; touchControlledGnomeIdx = -1;
  gnomes = [];
  floatingBlocks = []; crows = []; lightnings = []; lightningTimer = 0;
  // Phase 2: ステージ開始時にlivesをリセット（Stage 8〜10はlives:2）
  lives = cfg.lives || MAX_LIVES;
  // Phase 6: コンボ・タイム計測リセット
  comboCount = 0; comboTimer = 0;
  stageStartTime = Date.now();
  bonusPopups = [];
  for (let i = 0; i < cfg.gnomes; i++) {
    gnomes.push(makeGnome(80 + i * Math.floor((W - 160) / Math.max(1, cfg.gnomes - 1)), i));
  }

  // 浮遊ブロックを生成（1～5個、ステージが進むほど増加）
  const blockCount = Math.min(5, stage + 1);
  for (let i = 0; i < blockCount; i++) {
    const bw = 40 + Math.floor(Math.random() * 36);
    const bx = 20 + Math.floor(Math.random() * (W - bw - 40));
    const by = 130 + Math.floor(Math.random() * 210);
    floatingBlocks.push(makeBlock(bx, by, bw));
  }

  // カラスを生成（ステージ3以降: 1〜3羽）
  if (stage >= 2) {
    const crowCount = Math.min(3, Math.floor((stage - 1) / 2) + 1);
    for (let i = 0; i < crowCount; i++) crows.push(makeCrow());
  }

  // 初期泡を2個スポーン
  bubbles.push(makeBubble());
  bubbles.push(makeBubble());
  bubbles[0].y = H * 0.6;
  bubbles[1].y = H * 0.45;
  updateHUD();
}

function initGame() {
  stage = 0; score = 0; itemsCollected = 0; isEndless = false;
  lives = MAX_LIVES;
  comboCount = 0; comboTimer = 0;
  bonusPopups = [];
  initStage();
  // C2: 初回チュートリアル（旧キー互換含む）
  if (!localStorage.getItem('brc_tutorial_done') && !localStorage.getItem('brc_tutorial')) {
    tutorialStep = 0;
    tutorialActive = true;
  }
}

// === メインループ ===
function update() {
  frameCount++;
  if (bgTransProgress < 1) bgTransProgress = Math.min(1, bgTransProgress + 1 / 60);
  if (state === 'title') {
    for (const b of titleBubbles) {
      b.x += b.vx; b.y += b.vy;
      if (b.y < -b.r * 2) { b.y = 660 + Math.random() * 100; b.x = Math.random() * 480; }
    }
    titleGnomeX += 1.2 * titleGnomeDir;
    if (titleGnomeX > 400 || titleGnomeX < 80) titleGnomeDir *= -1;
  }
  if (state !== 'play') return;
  const cfg = STAGE_CFG[stage];

  // 泡スポーン
  bubbleTimer++;
  if (bubbleTimer >= cfg.bubbleRate && bubbles.filter(b => !b.popped).length < cfg.maxBubbles) {
    bubbles.push(makeBubble());
    bubbleTimer = 0;
  }

  // 泡更新・削除
  for (let i = bubbles.length - 1; i >= 0; i--) {
    updateBubble(bubbles[i]);
    const b = bubbles[i];
    if (b.x < -b.radius - 20 && !b.popped) {
      // Phase 2: スコア減算→ライフ減少に変更（ただし危険アイテムは見逃しOK）
      if (!HAZARD_TYPES.has(b.contents)) {
        lives--;
        playSE('miss'); // Phase 3: miss SE
        if (lives <= 0) {
          AudioSystem.stopBGM();
          playSE('gameover');
          HiScore.save();
          state = 'gameover';
        }
      }
      bubbles.splice(i, 1);
    } else if (b.popped && b.alpha <= 0) bubbles.splice(i, 1);
  }

  // アイテム更新
  for (const it of items) updateItem(it);

  // 投射物（玉）更新
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 5) ball.trail.shift();
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.life--;
    let hit = false;
    if (ball.x < 0 || ball.x > W || ball.y > GROUND_Y || ball.y < 0) {
      hit = true;
    } else {
      for (const b of bubbles) {
        if (b.popped) continue;
        if (dist2(ball.x, ball.y, b.x, b.y) < (b.radius + 6) ** 2) {
          popBubble(b); hit = true; break;
        }
      }
    }
    if (hit || ball.life <= 0) balls.splice(i, 1);
  }

  // Phase 6: コンボタイマー更新
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) comboCount = 0;
  }

  // カラス更新
  for (let i = crows.length - 1; i >= 0; i--) updateCrow(crows[i]);

  // 雷更新・スポーン（ステージ5以降）
  lightnings = lightnings.filter(lt => lt.phase !== 'done');
  for (const lt of lightnings) updateLightning(lt);
  if (stage >= 4) {
    lightningTimer++;
    const interval = Math.max(180, 520 - stage * 28);
    if (lightningTimer >= interval) {
      lightningTimer = 0;
      lightnings.push(makeLightning(44 + Math.random() * (W - 88)));
    }
  }

  // 小人更新（逆順でsplice時のスキップを防止）
  for (let i = gnomes.length - 1; i >= 0; i--) {
    if (!gnomes[i]) continue;
    updateGnomeAI(gnomes[i], i);
    updateGnomePhysics(gnomes[i]);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title')    { drawTitle();    return; }
  if (state === 'gameover') { drawGameOver(); return; }
  if (state === 'clear')    { drawClear();    return; }

  // 画面シェイク
  let shakeX = 0, shakeY = 0;
  if (shakeFrames > 0) {
    shakeX = (Math.random() - 0.5) * shakeAmt * 2;
    shakeY = (Math.random() - 0.5) * shakeAmt * 2;
    shakeFrames--;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawGround();
  drawFloatingBlocks();
  ladders.forEach(drawLadder);
  bubbles.forEach(drawBubble);
  items.forEach(drawItem);
  gnomes.forEach(drawGnome);
  balls.forEach(drawBall);
  crows.forEach(drawCrow);
  drawLightnings();
  drawParticles();
  drawRings();
  drawBonusPopups();
  drawPath();
  drawHUDBar();

  if (state === 'pause') drawPauseOverlay();
  if (state === 'play' && tutorialActive) drawTutorialOverlay();

  ctx.restore();
}

function loop() {
  pollGamepad();
  update();
  render();
  requestAnimationFrame(loop);
}

HiScore.load(); // Phase 5: ページロード時にハイスコアを読み込む
loop();
  </script>
</body>
</html>
