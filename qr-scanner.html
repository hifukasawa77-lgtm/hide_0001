<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!--
    CSP: jsQR はローカル（同一オリジン）に vendor 済みのため外部CDN不要。外部通信は一切なし。
    映像はカメラから取得し Canvas 内でデコードするのみ（外部送信なし）。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="カメラでQRコードをその場でスキャン・デコード。URLはワンタップで開ける。完全ブラウザ内処理・映像は外部送信なし。Scan QR codes with your camera, fully on-device.">
  <title>QRスキャナー | QR Scanner</title>
  <link rel="canonical" href="https://hifukasawa77-lgtm.github.io/main/qr-scanner.html">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="QRスキャナー | QR Scanner">
  <meta property="og:description" content="カメラでQRコードをその場でスキャン・デコード。完全ブラウザ内処理・映像は外部送信なし。">
  <meta property="og:url" content="https://hifukasawa77-lgtm.github.io/main/qr-scanner.html">
  <meta property="og:image" content="https://hifukasawa77-lgtm.github.io/main/assets/logo/favicon.svg">
  <meta name="twitter:card" content="summary">
  <style>
    :root{
      --bg:#05070d; --text:#e6edf6; --muted:#8b97a8;
      --cyan:#22d3ee; --purple:#a78bfa;
      --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.09); --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg); color:var(--text); min-height:100vh;
      font-family:"Aptos","Segoe UI Variable","Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
      line-height:1.6; -webkit-font-smoothing:antialiased}
    a{color:var(--cyan)}
    #bg-canvas{position:fixed; inset:0; z-index:-1; pointer-events:none}
    .wrap{max-width:820px; margin:0 auto; padding:28px 18px 72px}
    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
    .home{color:var(--muted); text-decoration:none; font-size:.85rem}
    .home:hover{color:var(--cyan)}
    .hero{text-align:center; margin-bottom:22px}
    .hero h1{font-size:clamp(1.7rem,5vw,2.5rem); margin:.2em 0 .1em}
    .hero .sub{color:var(--muted); font-weight:600; margin:0; font-size:.9rem}
    .hero .note{color:var(--muted); font-size:.82rem; margin:.7em 0 0}
    .grad{background:linear-gradient(135deg,var(--cyan) 0%,var(--purple) 100%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      box-shadow:0 8px 30px rgba(0,0,0,0.35); padding:20px; margin:18px 0}

    .stage{position:relative; width:100%; max-width:520px; margin:0 auto; aspect-ratio:1/1;
      border-radius:16px; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center}
    #canvas{width:100%; height:100%; object-fit:cover; display:block}
    #video{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
    .placeholder{position:absolute; color:var(--muted); text-align:center; padding:20px; font-size:.9rem}
    .placeholder .big{font-size:2.6rem; display:block; margin-bottom:8px}
    .scan-frame{position:absolute; inset:16%; border-radius:14px; pointer-events:none;
      box-shadow:0 0 0 3px rgba(34,211,238,0.5), 0 0 0 100vmax rgba(5,7,13,0.35); display:none}
    .scan-frame.show{display:block}

    .btn{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600; border-radius:12px;
      padding:11px 18px; color:#04121a; background:linear-gradient(135deg,var(--cyan) 0%,#38bdf8 100%);
      box-shadow:0 4px 16px rgba(34,211,238,0.22); transition:transform .15s,box-shadow .15s,opacity .15s}
    .btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(34,211,238,0.3)}
    .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
    .btn.ghost{background:transparent; color:var(--cyan); border:1px solid var(--border); box-shadow:none}
    .btn.ghost:hover{background:rgba(34,211,238,0.08)}
    .btn-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-top:16px}
    #status{color:var(--muted); font-size:.84rem; min-height:1.3em; text-align:center; margin-top:12px}

    .result{margin-top:16px; border:1px solid var(--border); border-radius:14px; padding:14px 16px;
      background:rgba(34,211,238,0.05); display:none}
    .result.show{display:block}
    .result .lbl{color:var(--muted); font-size:.72rem; margin-bottom:6px; letter-spacing:.04em}
    .result .val{word-break:break-all; font-size:.95rem; line-height:1.5}
    .result .val a{font-weight:700}
    .result .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}

    .hist-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
    .hist-head h2{font-size:1rem; margin:0}
    .hist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
    .hist li{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border);
      border-radius:10px; background:rgba(255,255,255,0.02)}
    .hist .txt{flex:1; min-width:0; word-break:break-all; font-size:.82rem}
    .hist .mini{appearance:none; border:1px solid var(--border); background:transparent; color:var(--muted);
      border-radius:8px; padding:3px 9px; font:inherit; font-size:.72rem; cursor:pointer; flex:0 0 auto}
    .hist .mini:hover{color:var(--cyan); border-color:var(--cyan)}
    .hist .empty{color:var(--muted); font-size:.85rem; border:0; background:none; padding:6px 0}

    .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
      background:rgba(11,16,32,0.95); color:var(--text); border:1px solid var(--border);
      padding:11px 18px; border-radius:12px; font-size:.86rem; opacity:0; pointer-events:none;
      transition:opacity .25s,transform .25s; z-index:50; max-width:90vw; text-align:center}
    .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
    @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <main class="wrap">
    <div class="topbar"><a class="home" href="index.html">← ホーム / Home</a></div>

    <header class="hero">
      <h1>🔳 <span class="grad">QRスキャナー</span></h1>
      <p class="sub">QR Scanner — カメラでQRを読み取り</p>
      <p class="note">QRコードをその場でデコード。完全ブラウザ内処理・映像は外部送信なし。<br>
        Decode QR codes instantly — everything runs on your device.</p>
    </header>

    <section class="card">
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" width="480" height="480"></canvas>
        <div class="scan-frame" id="scan-frame"></div>
        <div class="placeholder" id="placeholder">
          <span class="big">🔳</span>
          カメラを起動してQRをかざす<br>
          <span style="font-size:.8rem">Start the camera and aim at a QR</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="start-btn" type="button">カメラ起動 / Start</button>
        <button class="btn ghost" id="torch-btn" type="button" disabled hidden>🔦 ライト / Torch</button>
        <button class="btn ghost" id="stop-btn" type="button" disabled>停止 / Stop</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>

      <div class="result" id="result" aria-live="polite">
        <div class="lbl" id="result-kind">RESULT</div>
        <div class="val" id="result-val"></div>
        <div class="acts">
          <button class="btn ghost" id="copy-btn" type="button">コピー / Copy</button>
          <button class="btn ghost" id="rescan-btn" type="button">再スキャン / Scan again</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="hist-head">
        <h2>🕘 履歴 / History</h2>
        <button class="btn ghost" id="clear-btn" type="button">クリア</button>
      </div>
      <ul class="hist" id="hist"><li class="empty">まだ読み取りがありません / Nothing scanned yet</li></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script src="assets/js/jsQR.js"></script>
  <script>
  (function () {
    'use strict';
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var placeholder = document.getElementById('placeholder');
    var scanFrame = document.getElementById('scan-frame');
    var startBtn = document.getElementById('start-btn'), stopBtn = document.getElementById('stop-btn');
    var torchBtn = document.getElementById('torch-btn');
    var statusEl = document.getElementById('status');
    var resultEl = document.getElementById('result'), resultKind = document.getElementById('result-kind'), resultVal = document.getElementById('result-val');
    var copyBtn = document.getElementById('copy-btn'), rescanBtn = document.getElementById('rescan-btn');
    var histEl = document.getElementById('hist'), clearBtn = document.getElementById('clear-btn');
    var toastEl = document.getElementById('toast');

    var stream = null, track = null, rafId = 0, running = false, paused = false;
    var lastText = '', history = [];
    var torchOn = false;

    var toastTimer = 0;
    function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400); }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function isSafeUrl(s) { return /^https?:\/\//i.test(s); }

    // 検出音（Web Audio・プロシージャル）
    var actx = null;
    function beep() {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.15, actx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
        o.start(); o.stop(actx.currentTime + 0.19);
      } catch (e) {}
    }

    function startCamera() {
      if (!window.jsQR) { toast('QRデコーダを読み込めませんでした / QR decoder failed to load'); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('このブラウザはカメラ非対応です / Camera not supported'); return; }
      statusEl.textContent = 'カメラを起動中… / Starting camera…';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
        .then(function (s) {
          stream = s; track = s.getVideoTracks()[0]; video.srcObject = s; return video.play();
        })
        .then(function () {
          running = true; paused = false;
          placeholder.style.display = 'none'; scanFrame.classList.add('show');
          stopBtn.disabled = false; startBtn.disabled = true;
          statusEl.textContent = 'QRコードを枠内に / Aim a QR at the frame';
          setupTorch();
          loop();
        })
        .catch(function (err) { statusEl.textContent = ''; toast('カメラを起動できませんでした（' + ((err && err.name) || 'error') + '）/ Camera unavailable'); });
    }
    function stopCamera() {
      running = false; paused = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      track = null; torchOn = false; video.srcObject = null;
      scanFrame.classList.remove('show'); placeholder.style.display = '';
      stopBtn.disabled = true; startBtn.disabled = false;
      torchBtn.hidden = true; torchBtn.disabled = true;
      statusEl.textContent = '';
    }

    function setupTorch() {
      try {
        var caps = track && track.getCapabilities ? track.getCapabilities() : {};
        if (caps && 'torch' in caps) { torchBtn.hidden = false; torchBtn.disabled = false; }
      } catch (e) {}
    }
    torchBtn.addEventListener('click', function () {
      if (!track) return;
      torchOn = !torchOn;
      track.applyConstraints({ advanced: [{ torch: torchOn }] })
        .then(function () { torchBtn.textContent = torchOn ? '🔦 ライト OFF / Torch' : '🔦 ライト / Torch'; })
        .catch(function () { toast('ライトを切り替えられません / Torch unavailable'); });
    });

    function loop() {
      if (!running || paused) return;
      if (video.readyState >= 2 && video.videoWidth) {
        var vw = video.videoWidth, vh = video.videoHeight;
        var side = Math.min(vw, vh), sx = (vw - side) / 2, sy = (vh - side) / 2;
        var w = Math.min(side, 640);
        if (canvas.width !== w || canvas.height !== w) { canvas.width = w; canvas.height = w; }
        ctx.drawImage(video, sx, sy, side, side, 0, 0, w, w);
        var img = ctx.getImageData(0, 0, w, w);
        var code = window.jsQR(img.data, w, w, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
          drawBox(code.location, w);
          onDetected(code.data);
          return; // 一時停止（再スキャンで再開）
        }
      }
      rafId = requestAnimationFrame(loop);
    }

    function drawBox(loc, w) {
      if (!loc) return;
      ctx.lineWidth = Math.max(3, w / 120); ctx.strokeStyle = '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(loc.topLeftCorner.x, loc.topLeftCorner.y);
      ctx.lineTo(loc.topRightCorner.x, loc.topRightCorner.y);
      ctx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
      ctx.lineTo(loc.bottomLeftCorner.x, loc.bottomLeftCorner.y);
      ctx.closePath(); ctx.stroke();
    }

    function onDetected(text) {
      paused = true;
      lastText = text;
      beep();
      var url = isSafeUrl(text);
      resultKind.textContent = url ? 'URL' : 'テキスト / TEXT';
      // XSS対策：常にエスケープ。URLのみリンク化し、自動遷移はしない。
      if (url) {
        resultVal.innerHTML = '<a href="' + esc(text) + '" target="_blank" rel="noopener noreferrer nofollow">' + esc(text) + '</a>';
      } else {
        resultVal.textContent = text;
      }
      resultEl.classList.add('show');
      statusEl.textContent = '読み取りました。「再スキャン」で続けられます。/ Detected — tap “Scan again” to continue.';
      addHistory(text);
    }

    copyBtn.addEventListener('click', function () { if (lastText) copy(lastText); });
    rescanBtn.addEventListener('click', function () {
      resultEl.classList.remove('show');
      statusEl.textContent = 'QRコードを枠内に / Aim a QR at the frame';
      if (running) { paused = false; loop(); }
    });

    function addHistory(text) {
      if (history[0] === text) return;
      history.unshift(text); if (history.length > 20) history.pop();
      renderHistory();
    }
    function renderHistory() {
      histEl.innerHTML = '';
      if (!history.length) { histEl.innerHTML = '<li class="empty">まだ読み取りがありません / Nothing scanned yet</li>'; return; }
      history.forEach(function (t) {
        var li = document.createElement('li');
        var span = document.createElement('span'); span.className = 'txt';
        if (isSafeUrl(t)) { var a = document.createElement('a'); a.href = t; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; a.textContent = t; span.appendChild(a); }
        else { span.textContent = t; }
        var btn = document.createElement('button'); btn.className = 'mini'; btn.type = 'button'; btn.textContent = 'copy';
        btn.addEventListener('click', function () { copy(t); });
        li.appendChild(span); li.appendChild(btn); histEl.appendChild(li);
      });
    }
    clearBtn.addEventListener('click', function () { history = []; renderHistory(); });

    function copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('コピーしました / Copied'); }, function () { toast('コピーできませんでした / Copy failed'); });
      } else {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('コピーしました / Copied'); } catch (e) { toast('コピーできませんでした'); }
        document.body.removeChild(ta);
      }
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    window.addEventListener('beforeunload', stopCamera);

    /* ---------- 背景アンビエントパーティクル ---------- */
    (function ambient() {
      var c = document.getElementById('bg-canvas'), x = c.getContext('2d');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var pts = [], W, H;
      function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
      resize(); addEventListener('resize', resize);
      var N = reduce ? 0 : Math.min(60, Math.floor(innerWidth / 22));
      for (var i = 0; i < N; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, c: Math.random() > 0.5 ? '34,211,238' : '167,139,250' });
      function tick() {
        x.clearRect(0, 0, W, H);
        for (var i = 0; i < pts.length; i++) { var p = pts[i]; p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fillStyle = 'rgba(' + p.c + ',0.5)'; x.fill(); }
        if (!reduce) requestAnimationFrame(tick);
      }
      tick();
    })();
  })();
  </script>
</body>
</html>
