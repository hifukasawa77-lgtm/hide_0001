<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太平風雲記 UI Redesign Preview v3</title><style>:root{--ink:#17120d;--paper:#eadbb8;--gold:#b38a45;--verm:#9f2f24;--north:#9b3b32;--south:#365b73}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0a08;color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:68px 1fr 76px;background:radial-gradient(circle at 45% 10%,#332619,#15100c 55%,#0b0806)}.top{display:grid;grid-template-columns:300px 1fr;background:linear-gradient(#312318,#1e160f);border-bottom:2px solid var(--gold)}.brand{display:flex;align-items:center;gap:13px;padding:8px 18px;border-right:1px solid #60462e}.crest{width:43px;height:43px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px}.title{font-size:24px;letter-spacing:.15em}.era{font-size:12px;color:#bca985;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(6,1fr)}.stat{padding:8px 12px;border-right:1px solid #4c3724;display:flex;flex-direction:column;justify-content:center}.stat span{font-size:10px;color:#a89473}.stat b{font-size:18px;color:#f0dfb9}.main{min-height:0;display:grid;grid-template-columns:1fr 326px}.map{position:relative;overflow:hidden;border-right:2px solid #4d3824;background:#17110d}.map iframe{width:100%;height:100%;border:0;filter:saturate(.72) sepia(.17) brightness(.82)}.veil{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,.72)}.legend{position:absolute;left:14px;bottom:14px;padding:7px 10px;background:rgba(24,17,12,.92);border:1px solid #705234;font-size:11px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px}.legend i:first-child{margin-left:0}.side{padding:10px;overflow:auto;background:linear-gradient(90deg,#251a11,#17100b)}.panel{margin-bottom:9px;border:1px solid #5c432c;background:linear-gradient(145deg,rgba(62,45,28,.75),rgba(30,22,15,.91))}.panel h2{margin:0;padding:8px 11px;font-size:14px;letter-spacing:.1em;background:rgba(128,88,45,.18);border-bottom:1px solid #5a412b}.body{padding:10px}.big{font-size:22px}.badge{float:right;padding:3px 7px;border:1px solid #76533a;font-size:10px;color:#d6c39d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.cell{padding:7px;background:rgba(0,0,0,.18);border-left:2px solid #88683b}.cell small{display:block;color:#9f8c6d}.meter{height:7px;background:#21160f;border:1px solid #503921;margin-top:6px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#7d3027,#c18d4e)}.court{display:grid;grid-template-columns:1fr 1fr;gap:7px}.court>div{padding:8px;background:#201711;border:1px solid #56402c}.court b{display:block}.alert{margin-top:8px;padding:8px;border-left:3px solid var(--verm);background:rgba(112,38,27,.14);font-size:11px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{padding:9px;border:1px solid #68492f;background:#2a1b12;color:#dbc7a1}.bottom{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid var(--gold);background:linear-gradient(#24180f,#120d09)}.cmd{border:0;border-right:1px solid #4f3824;background:transparent;color:#d7c6a2;font:inherit;cursor:pointer}.cmd strong{display:block;font-size:20px;color:#c59a55}.cmd.active{background:linear-gradient(#58311e,#2a190f);box-shadow:inset 0 3px 0 var(--verm)}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 16px;background:#24170f;border:1px solid var(--gold);opacity:0;transition:.2s}.toast.on{opacity:1}.sync{position:absolute;right:12px;bottom:12px;background:rgba(24,17,12,.9);border:1px solid #665039;padding:6px 9px;font-size:10px;color:#aa9675}@media(max-width:900px){.shell{grid-template-rows:56px 1fr 62px}.top{grid-template-columns:220px 1fr}.title{font-size:18px}.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(n+4){display:none}.main{grid-template-columns:1fr 250px}.cmd{font-size:11px}.cmd strong{font-size:15px}.side{padding:6px}}@media(max-width:700px) and (orientation:portrait){body:before{content:"太平風雲記は横向きで表示してください";position:fixed;inset:0;z-index:50;background:#17110c;display:grid;place-items:center;text-align:center;padding:30px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="crest">二</div><div><div class="title">太平風雲記</div><div class="era" id="era">セーブデータ待機中</div></div></div><div class="stats"><div class="stat"><span>金</span><b id="gold">--</b></div><div class="stat"><span>総兵力</span><b id="army">--</b></div><div class="stat"><span>威信</span><b id="prestige">--</b></div><div class="stat"><span>朝廷関係</span><b id="courtRel">--</b></div><div class="stat"><span>平均忠義</span><b id="loyalty">--</b></div><div class="stat"><span>恩賞待ち</span><b id="reward">--</b></div></div></header><main class="main"><section class="map"><iframe id="gameframe" src="taihei.html" title="太平風雲記本体"></iframe><div class="veil"></div><div class="legend"><i style="background:var(--north)"></i>北朝方 <i style="background:var(--south)"></i>南朝方 <i style="background:#786b52"></i>中立・地方</div><div class="toast" id="toast"></div><div class="sync" id="sync">実データ同期: 待機</div></section><aside class="side" id="side"></aside></main><nav class="bottom"><button class="cmd active" data-p="domestic"><strong>政</strong>内政</button><button class="cmd" data-p="military"><strong>軍</strong>軍事</button><button class="cmd" data-p="diplomacy"><strong>盟</strong>外交</button><button class="cmd" data-p="court"><strong>廷</strong>朝廷</button><button class="cmd" data-p="reward"><strong>賞</strong>恩賞</button><button class="cmd" data-p="akutou"><strong>悪</strong>悪党</button><button class="cmd" data-p="info"><strong>覧</strong>情報</button></nav></div><script>const KEY='gamekit:taihei:autosave',side=document.getElementById('side'),toast=document.getElementById('toast');let state=null,panel='domestic';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function read(){try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}render()}function camp(){return state&&state.camps?state.camps[state.playerCamp]:null}function gens(){return state?Object.values(state.generals||{}).filter(g=>g.camp===state.playerCamp&&!g.dead):[]}function provinces(){return state?Object.values(state.provinces||{}).filter(p=>p.owner===state.playerCamp):[]}function rel(){if(!state)return 0;const c=camp(),court=c&&c.court;if(!court)return 0;const r=state.courtRel&&state.courtRel[state.playerCamp+'|'+court];return Math.round(r?.courtRel||0)}function legitimacy(id){const c=state?.courts?.[id];if(!c)return 0;return Math.max(0,Math.min(100,Math.round((c.legitimacy||0)+(c.heldBy?20:0))))}function header(){const c=camp(),gs=gens(),ps=provinces();document.getElementById('era').textContent=state?`${state.year}年 ${state.month||1}月　${c?.jp||state.playerCamp}`:'セーブデータ待機中';document.getElementById('gold').textContent=c?Math.round(c.gold||0).toLocaleString():'--';document.getElementById('army').textContent=state?ps.reduce((n,p)=>n+(p.garrison||0),0).toLocaleString():'--';document.getElementById('prestige').textContent=c?Math.round(c.prestige||0):'--';document.getElementById('courtRel').textContent=state?rel():'--';document.getElementById('loyalty').textContent=gs.length?Math.round(gs.reduce((n,g)=>n+(g.loyalty||0),0)/gs.length):'--';document.getElementById('reward').textContent=state?gs.filter(g=>(g.pendingContribution||0)>0).length:'--';document.getElementById('sync').textContent=state?'実データ同期: ON':'実データ同期: セーブ未作成'}function common(){if(!state)return `<section class="panel"><h2>実データ</h2><div class="body alert">本体で新規ゲームを開始すると、ここに実際の勢力・兵力・忠義・朝廷データが自動表示されます。</div></section>`;const c=camp(),ps=provinces(),gs=gens();return `<section class="panel"><h2>自勢力</h2><div class="body"><span class="big">${esc(c?.jp||state.playerCamp)}</span><span class="badge">${ps.length}国</span><div class="grid"><div class="cell"><small>総石高</small>${ps.reduce((n,p)=>n+(p.koku||0),0)||'—'}</div><div class="cell"><small>総兵力</small>${ps.reduce((n,p)=>n+(p.garrison||0),0).toLocaleString()}</div><div class="cell"><small>武将</small>${gs.length}名</div><div class="cell"><small>悪党</small>${state.akutou?.[state.playerCamp]?.count||0}</div></div></div></section>`}function body(){const gs=gens(),c=camp();if(panel==='domestic')return common()+`<section class="panel"><h2>内政</h2><div class="body"><div class="actions"><button>開墾</button><button>治安</button><button>築城</button><button>徴税</button></div></div></section>`;if(panel==='military')return common()+`<section class="panel"><h2>軍事</h2><div class="body"><div class="grid"><div class="cell"><small>領国</small>${provinces().length}</div><div class="cell"><small>兵力</small>${provinces().reduce((n,p)=>n+(p.garrison||0),0).toLocaleString()}</div></div></div></section>`;if(panel==='diplomacy')return common()+`<section class="panel"><h2>外交</h2><div class="body">周辺勢力との同盟・停戦・従属交渉をここへ統合予定。</div></section>`;if(panel==='court')return `<section class="panel"><h2>朝廷・正統性</h2><div class="body"><div class="court"><div><b style="color:#d18f83">北朝</b><span class="big">${legitimacy('hokucho')}</span><div class="meter"><i style="width:${legitimacy('hokucho')}%"></i></div></div><div><b style="color:#84b2cb">南朝</b><span class="big">${legitimacy('nancho')}</span><div class="meter"><i style="width:${legitimacy('nancho')}%"></i></div></div></div><div class="alert">自勢力の朝廷関係 ${state?rel():'--'} / 100</div></div></section>`;if(panel==='reward'){const pending=gs.filter(g=>(g.pendingContribution||0)>0);return `<section class="panel"><h2>恩賞</h2><div class="body">${pending.length?pending.slice(0,6).map(g=>`<div style="margin-bottom:8px"><b>${esc(g.jp)}</b>　功績 ${Math.round(g.pendingContribution||0)}　忠義 ${Math.round(g.loyalty||0)}<div class="meter"><i style="width:${Math.max(0,Math.min(100,g.loyalty||0))}%"></i></div></div>`).join(''):'現在、恩賞待ちの武将はいません。'}</div></section>`}if(panel==='akutou'){const a=state?.akutou?.[state.playerCamp];return `<section class="panel"><h2>悪党衆</h2><div class="body"><div class="grid"><div class="cell"><small>雇用数</small>${a?.count||0}</div><div class="cell"><small>質</small>${a?.quality||0}</div><div class="cell"><small>待機</small>${a?.cooldown||0}</div><div class="cell"><small>軍資金</small>${Math.round(c?.gold||0)}</div></div><div class="actions" style="margin-top:8px"><button>夜襲</button><button>放火</button><button>略奪</button><button>城門破壊</button></div></div></section>`}const logs=(state?.log||[]).slice(-8).reverse();return `<section class="panel"><h2>年代記</h2><div class="body">${logs.length?logs.map(e=>`<div style="font-size:11px;margin-bottom:7px">${e.year||''}年　${esc(e.jp||'')}</div>`).join(''):'年代記はまだありません。'}</div></section>`}function render(){header();side.innerHTML=body()}document.querySelectorAll('.cmd').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cmd').forEach(x=>x.classList.remove('active'));b.classList.add('active');panel=b.dataset.p;render()});window.addEventListener('storage',read);document.getElementById('gameframe').addEventListener('load',()=>setTimeout(read,500));setInterval(read,1500);read();</script></body></html>
