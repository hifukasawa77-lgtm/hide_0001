 * 6.6 BGM — Web Audio API プロシージャル生成（音声ファイル不要・sengoku.html踏襲）
 *     ★ game.audio._ac() で GameKit.Sfx と同じ AudioContext を共有する
 *       （AudioContext を2つ持つとブラウザによっては合計出力が絞られる）
 * ========================================================================== */
const BGM = {
  enabled: (() => { try { return localStorage.getItem('genpeiBgm') !== '0'; } catch (_) { return true; } })(),
  ac: null, master: null, drone: [], mood: 'calm', _timer: null, _step: 0,
  themes: {
    calm:   { root: 220,   interval: 900, steps: [0, 3, 5, 7, 5, 3], type: 'sine',     density: 0.5, drone: 0.040 },
    battle: { root: 174.6, interval: 430, steps: [0, 3, 7, 5, 8, 7, 3, 0], type: 'triangle', density: 0.8, drone: 0.058 },
  },
  scale: [0, 2, 3, 7, 9, 12, 14, 15, 19, 21], // 呂旋法寄りの音階（sengoku.htmlとは別音階で聞き分けられるように）
  theme() { return this.themes[this.mood] || this.themes.calm; },
  ensure() {
    if (this.ac) return true;
    try {
      this.ac = game.audio._ac(); this.master = this.ac.createGain(); this.master.gain.value = this.enabled ? 0.20 : 0; this.master.connect(this.ac.destination);
      [0, 7].forEach((semi, i) => {
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = i ? 'triangle' : 'sine'; o.frequency.value = 110 * Math.pow(2, semi / 12); g.gain.value = 0.0001;
        o.connect(g).connect(this.master); o.start(); this.drone.push({ o, g, semi });
      });
      this.applyTheme(true);
    } catch (_) { this.ac = null; return false; }
    return true;
  },
  applyTheme(immediate) {
    if (!this.ac) return;
    const t = this.theme(), now = this.ac.currentTime, glide = immediate ? 0.01 : 0.6;
    this.drone.forEach((v, i) => {
      v.o.frequency.cancelScheduledValues(now);
      v.o.frequency.linearRampToValueAtTime(t.root / 2 * Math.pow(2, (i ? 7 : 0) / 12), now + glide);
      v.g.gain.setTargetAtTime(t.drone * (i ? 0.55 : 1), now, glide / 2);
    });
  },
  freq(step, octave) { return this.theme().root * Math.pow(2, this.scale[(step + this.scale.length) % this.scale.length] / 12 + (octave || 0)); },
  tone(freq, dur, vol, type, attack) {
    const ac = this.ac, now = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = type || 'sine'; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = type === 'sawtooth' ? 1000 : 2200;
    const a = attack || 0.02;
    g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + a); g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
    o.connect(f).connect(g).connect(this.master); o.start(now); o.stop(now + dur + 0.08);
  },
  taiko(strength, long) {
    const ac = this.ac, now = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), d = long ? 0.4 : 0.22;
    o.type = 'sine'; o.frequency.setValueAtTime(long ? 90 : 130, now); o.frequency.exponentialRampToValueAtTime(long ? 34 : 48, now + d);
    g.gain.setValueAtTime(strength, now); g.gain.exponentialRampToValueAtTime(0.001, now + d);
    o.connect(g).connect(this.master); o.start(now); o.stop(now + d + 0.03);
  },
  play() {
    const t = this.theme(), i = this._step++, d = t.steps[i % t.steps.length];
    if (this.mood === 'battle') {
      this.taiko(i % 4 === 0 ? 0.26 : 0.15, i % 4 === 0);
      if (Math.random() < t.density) this.tone(this.freq(d, i % 4 === 2 ? 1 : 0), 0.28, 0.085, 'triangle', 0.012);
    } else {
      if (i % 4 === 0 || Math.random() < t.density) this.tone(this.freq(d, i % 8 === 0 ? 1 : 0), 0.8, 0.065, 'sine', 0.06);
      if (i % 8 === 3) this.tone(this.freq(d + 2, -1), 0.44, 0.03, 'triangle', 0.012);
    }
  },
  start() { if (this._timer || !this.ensure()) return; const next = () => { if (!this.ac) return; this.play(); this._timer = setTimeout(next, this.theme().interval); }; next(); },
  setMood(m) { if (!this.themes[m]) m = 'calm'; if (this.mood === m) return; this.mood = m; this._step = 0; this.applyTheme(); },
  setEnabled(on) {
    this.enabled = on;
    try { localStorage.setItem('genpeiBgm', on ? '1' : '0'); } catch (_) { /* ignore */ }
    if (this.master && this.ac) this.master.gain.setTargetAtTime(on ? 0.20 : 0, this.ac.currentTime, 0.12);
  },
  toggle() { this.ensure(); this.setEnabled(!this.enabled); if (this.enabled) this.start(); },
};

/* ============================================================================
 * 7. MapScene — 参照UIの三段構え（全国図 → 国の拡大図 → 拠点の周辺図）
 * ========================================================================== */
const L = {
  bar:    { x: 6, y: 6, w: W - 12, h: 26 },
  nation: { x: 6, y: 36, w: 694, h: 566 },
  prov:   { x: 706, y: 36, w: W - 706 - 6, h: 344 },
  local:  { x: 706, y: 386, w: 470, h: 216 },
  detail: { x: 1182, y: 386, w: W - 1182 - 6, h: 216 },
  list:   { x: 6, y: 608, w: 474, h: 162 },
  events: { x: 486, y: 608, w: 414, h: 162 },
  side:   { x: 906, y: 608, w: W - 906 - 6, h: 162 },
  cmd:    { x: 6, y: 776, w: W - 12, h: 30 },
  panel:  { x: 150, y: 60, w: W - 300, h: 700 },   // コマンドのモーダル
};
const COMMANDS = [
  { id: 'naisei',  jp: '内政', en: 'Domestic',  phase: 2 },
  { id: 'gunji',   jp: '軍事', en: 'Military',  phase: 3 },
  { id: 'jinji',   jp: '人事', en: 'Vassals',   phase: 2 },
  { id: 'gaiko',   jp: '外交', en: 'Diplomacy', phase: 2 },
  { id: 'keiryaku',jp: '計略', en: 'Stratagem', phase: 2 },
  { id: 'jinji2',  jp: '列伝', en: 'Chronicles',phase: 5 },
  { id: 'joho',    jp: '情報', en: 'Records',   phase: 1 },
  { id: 'kino',    jp: '機能', en: 'System',    phase: 1 },
  { id: 'endTurn', jp: 'ターン終了', en: 'End Turn', phase: 1 },
];
/* 開通済みのコマンド。Phase を進めるたびにここへ足す */
const OPEN_COMMANDS = new Set(['naisei', 'gunji', 'jinji', 'gaiko', 'keiryaku', 'jinji2', 'joho', 'kino', 'endTurn']);

class MapScene extends GameKit.Scene {
  constructor(state) { super(); this.state = state; }
  enter(g) {
    // 全国図のカメラ
    // 幅に合わせて列島全体を見せる。枠を覆う倍率まで寄せると東西が切れてしまう。
    // 余る上下は海として塗る（地図の周囲はもともと外洋なので違和感がない）。
    this.minZoom = 1;
    // 原寸の ZOOM_CAP.nation 倍を超えて引き伸ばさない
    this.maxZoom = Math.max(this.minZoom, maxMapScale(ZOOM_CAP.nation) / L.nation.w);
    this.cam = { cx: 0.5, cy: 0.5, zoom: this.minZoom };
    this.drag = null;
    // 拡大図（国の拡大表示）のカメラ。null=自動フィット（国を選び直すとリセットされる）
    this.provCam = null;
    this.provPan = null;
    // 選択: 自勢力の本拠がある国を初期選択にする
    const mine = Rule.ownedKyoten(this.state, this.state.faction);
    this.province = mine.length ? mine[0].province : 'sagami';
    this.sel = mine.length ? mine[0].id : null;
    this.listScroll = 0;
    this.notice = null; this.noticeT = 0;
    this.eventArtId = null; this.eventArtT = 0;
    this.panel = null; this.panelScroll = 0; this.panelButtons = [];
    this.cmdButtons = this._layoutCommands();
    this.helpBtn = { id: 'help', x: L.bar.x + L.bar.w - 26, y: L.bar.y + 1, w: 24, h: 24, jp: '？', font: '600 13px "Hiragino Mincho ProN", serif', radius: 4 };
    this.bgmBtn = { id: 'bgm', x: L.bar.x + L.bar.w - 54, y: L.bar.y + 1, w: 24, h: 24, jp: BGM.enabled ? '♪' : '🔇', font: '600 13px sans-serif', radius: 4 };
    this.help = { open: false, page: 0 };
    BGM.setMood('calm');
    if (!BGM.ac) { BGM.ensure(); if (BGM.enabled) BGM.start(); }
    // 初回のみ遊び方を自動表示（新規ゲームの1ターン目・他オーバーレイが無い時。sengoku.html踏襲）
    if (this.state.turn === 1) {
      try {
        if (!localStorage.getItem('genpeiHelpSeen')) { localStorage.setItem('genpeiHelpSeen', '1'); this.help.open = true; }
      } catch (_) { /* ignore */ }
    }
    this._bindWheel(g);
    this._bindPan(g);
    this._bindProvWheel(g);
    this._bindProvPan(g);
    this._bindTouch(g);
  }
  exit() {
    if (this._wheel) canvas.removeEventListener('wheel', this._wheel);
    if (this._panDown) canvas.removeEventListener('mousedown', this._panDown);
    if (this._panUp) window.removeEventListener('mouseup', this._panUp);
    if (this._panMenu) canvas.removeEventListener('contextmenu', this._panMenu);
    if (this._provWheel) canvas.removeEventListener('wheel', this._provWheel);
    if (this._provPanDown) canvas.removeEventListener('mousedown', this._provPanDown);
    if (this._provPanUp) window.removeEventListener('mouseup', this._provPanUp);
    if (this._onTouchStart) canvas.removeEventListener('touchstart', this._onTouchStart);
    if (this._onTouchMove) canvas.removeEventListener('touchmove', this._onTouchMove);
    if (this._onTouchEnd) canvas.removeEventListener('touchend', this._onTouchEnd);
  }

  _layoutCommands() {
    const n = COMMANDS.length, gap = 6;
    const w = (L.cmd.w - gap * (n - 1)) / n;
    // ★en は渡さない。button() は en があると2段組みで描くが、バーは高さ30pxしかない
    return COMMANDS.map((c, i) => ({
      id: c.id, phase: c.phase, x: L.cmd.x + i * (w + gap), y: L.cmd.y, w, h: L.cmd.h,
      jp: c.jp, font: '600 15px "Hiragino Mincho ProN", serif', radius: 4,
    }));
  }
  /* 「ターン終了」の実処理。2人対戦（同一端末ホットシート）ではまだ手番を終えていない
   * 人間がいる限り、実際の月送り(endTurn)はせず手番だけを交代する。
   * ★全員が終えて初めて実際の endTurn を呼ぶ（AI行動・暦・オートセーブはここでのみ動く）。 */
  _endPlayerTurn(g) {
    const st = this.state;
    if (st.result) return;
    if (st.humanFactions.length > 1) {
      if (!st.actedThisRound.includes(st.faction)) st.actedThisRound.push(st.faction);
      const next = st.humanFactions.find((fid) => !st.actedThisRound.includes(fid));
      if (next) {
        st.faction = next;
        save.set('autosave', st);
        g.changeScene(new HandoffScene(st, () => new MapScene(st)));
        return;
      }
      st.actedThisRound = [];
    }
    this._fireEventArt();
    endTurn(st, g.audio);
    g.audio.jingle([{ f: 330, d: 0.08 }, { f: 392, d: 0.12 }]);
    if (st.humanFactions.length > 1 && !st.result) {
      st.faction = st.humanFactions[0];
      g.changeScene(new HandoffScene(st, () => new MapScene(st)));
    }
  }
  _bindWheel(g) {
    this._wheel = (e) => {
      const p = g.input.pointer;
      if (!inRect(L.nation, p)) return;
      e.preventDefault();
      const before = this._n2m(p);
      this.cam.zoom = clamp(this.cam.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12), this.minZoom, this.maxZoom);
      const after = this._n2m(p);
      this.cam.cx += before.x - after.x; this.cam.cy += before.y - after.y;
      this._clampCam();
    };
    canvas.addEventListener('wheel', this._wheel, { passive: false });
  }
  /* 右／中ドラッグを全国図の平行移動にあてる。
   * ★左ドラッグは「どの国にも当たらなかったとき」しか始まらない（_pickProvince が
   *   半径0.05で国を拾うため、事実上は海の上でしか掴めない）。畿内のように国が
   *   密なところでは地図を動かす手段が無くなるので、専用のボタンを与える。
   * ★GameKit の pointer はボタンを区別せず右押下も justPressed にするので、
   *   掴んだフレームのクリックは _suppressClick で捨てる。 */
  _bindPan(g) {
    this._panDown = (e) => {
      if (e.button !== 1 && e.button !== 2) return;
      this._suppressClick = true;           // 右／中ボタンは盤面のクリックとして扱わない
      const p = g.input.pointer;
      if (this.panel || !inRect(L.nation, p)) return;
      e.preventDefault();
      this.pan = { x: p.x, y: p.y, cx: this.cam.cx, cy: this.cam.cy };
    };
    this._panUp = () => { this.pan = null; };
    this._panMenu = (e) => { const p = g.input.pointer; if (inRect(L.nation, p) || inRect(L.prov, p)) e.preventDefault(); };
    canvas.addEventListener('mousedown', this._panDown);
    window.addEventListener('mouseup', this._panUp);
    canvas.addEventListener('contextmenu', this._panMenu);
  }
  /* 拡大図（国の拡大表示）が「国の形に合わせて寄せたい」半幅（=素の希望値。解像度上限は考慮しない） */
  _provFitHalfW() {
    const b = DATA.provBox[this.province];
    return Math.max(0.035, (b.x1 - b.x0) / 2 + 0.022);
  }
  // 自動フィット時に実際に使う半幅＝「国の形」と「素材原寸のZOOM_CAP.prov倍（解像度の下限）」の広い方。
  // 畿内のように国が小さいと解像度下限が勝つ（=そこが最大ズームインで、ユーザー操作でもそれ以上は寄れない）。
  _provDefaultHalfW() { return Math.max(this._provFitHalfW(), this._minHalfW(L.prov, ZOOM_CAP.prov)); }
  _ensureProvCam() {
    if (!this.provCam) {
      const b = DATA.provBox[this.province];
      this.provCam = { cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, halfW: this._provDefaultHalfW() };
    }
    return this.provCam;
  }
  // 半幅は「素材原寸のZOOM_CAP.provZoom倍（＝これ以上寄らない・ユーザー操作用の緩い上限）」〜
  // 「自動フィットの4倍（＝周辺国まで見渡せる）」に収める。
  // ズームインの下限にZOOM_CAP.prov（自動フィット用の保守的な値）をそのまま使うと、自動フィットが
  // 既にその下限で頭打ちの国（66国中65国）でズームインが完全な無効操作になるためprovZoomを使う。
  // 上限を自動フィットそのもの止まりにすると、自動フィットが下限で頭打ちの国（畿内等）で
  // ズームアウトも一切できなくなるため、ズームインの下限とズームアウトの上限は別々に持つ。
  _clampProvCam() {
    if (!this.provCam) return;
    const minHalfW = this._minHalfW(L.prov, ZOOM_CAP.provZoom);
    const maxHalfW = Math.max(minHalfW, Math.min(0.5, this._provDefaultHalfW() * 4));
    this.provCam.halfW = clamp(this.provCam.halfW, minHalfW, maxHalfW);
    const r = L.prov, hw = this.provCam.halfW, hh = hw * (r.h / r.w) / mapAspect();
    this.provCam.cx = clamp(this.provCam.cx, Math.min(0.5, hw), Math.max(0.5, 1 - hw));
    this.provCam.cy = clamp(this.provCam.cy, Math.min(0.5, hh), Math.max(0.5, 1 - hh));
  }
  /* 拡大図: ホイールでカーソル位置を中心にズーム（全国図の_bindWheelと同じ考え方） */
  _bindProvWheel(g) {
    this._provWheel = (e) => {
      const p = g.input.pointer;
      if (this.panel || !inRect(L.prov, p)) return;
      e.preventDefault();
      this._ensureProvCam();
      const before = this._provView().toMap(p.x, p.y);
      this.provCam.halfW *= (e.deltaY < 0 ? 1 / 1.12 : 1.12);
      this._clampProvCam();
      const after = this._provView().toMap(p.x, p.y);
      this.provCam.cx += before.x - after.x; this.provCam.cy += before.y - after.y;
      this._clampProvCam();
    };
    canvas.addEventListener('wheel', this._provWheel, { passive: false });
  }
  /* 拡大図: 右／中ドラッグで平行移動（全国図の_bindPanと同じ考え方。左クリックは拠点選択に使う） */
  _bindProvPan(g) {
    this._provPanDown = (e) => {
      if (e.button !== 1 && e.button !== 2) return;
      this._suppressClick = true;
      const p = g.input.pointer;
      if (this.panel || !inRect(L.prov, p)) return;
      e.preventDefault();
      this._ensureProvCam();
      this.provPan = { x: p.x, y: p.y, cx: this.provCam.cx, cy: this.provCam.cy };
    };
    this._provPanUp = () => { this.provPan = null; };
    canvas.addEventListener('mousedown', this._provPanDown);
    window.addEventListener('mouseup', this._provPanUp);
  }
  /* タッチ: 2本指ピンチで全国図を拡大縮小・1本指ドラッグで平行移動（taihei.html踏襲）。
   * ★GameKit.Input も同じ canvas に touchstart/touchmove/touchend を張っているため
   *   （pointer.justPressed 等の管理用）、指を置いた瞬間に「その位置の国」が一瞬
   *   選択されるのは避けられない副作用として許容する（2026-08-19 taihei.html で実証済み）。
   *   ピンチ中とドラッグ終了直後だけ _touchPinch / _touchSuppressUntil でクリックを止める。 */
  _clientToCanvasXY(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * canvas.width, y: (clientY - r.top) / r.height * canvas.height };
  }
  // 拡大図: 画面 → 地図正規化（全国図の_n2m相当。provCamのhalfWから実効スケールを出す）
  _prov2m(p) { return this._provView().toMap(p.x, p.y); }
  _bindTouch(g) {
    this._touchPinch = null;
    this._touchPan = null;
    this._provTouchPinch = null;
    this._provTouchPan = null;
    this._touchSuppressUntil = 0;
    this._onTouchStart = (e) => {
      if (this.panel) return;
      if (e.touches.length === 2) {
        const p1 = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        const p2 = this._clientToCanvasXY(e.touches[1].clientX, e.touches[1].clientY);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        if (inRect(L.nation, p1) || inRect(L.nation, p2)) {
          this._touchPinch = { dist, zoom: this.cam.zoom, m: this._n2m(mid) };
          this._touchPan = null;
          e.preventDefault();
        } else if (inRect(L.prov, p1) || inRect(L.prov, p2)) {
          this._ensureProvCam();
          this._provTouchPinch = { dist, halfW: this.provCam.halfW, m: this._prov2m(mid) };
          this._provTouchPan = null;
          e.preventDefault();
        }
      } else if (e.touches.length === 1) {
        const p = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        if (inRect(L.nation, p)) {
          this._touchPan = { x: p.x, y: p.y, cx: this.cam.cx, cy: this.cam.cy, dragging: false };
        } else if (inRect(L.prov, p)) {
          this._ensureProvCam();
          this._provTouchPan = { x: p.x, y: p.y, cx: this.provCam.cx, cy: this.provCam.cy, dragging: false };
        }
      }
    };
    this._onTouchMove = (e) => {
      if (e.touches.length === 2 && this._touchPinch) {
        const p1 = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        const p2 = this._clientToCanvasXY(e.touches[1].clientX, e.touches[1].clientY);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        this.cam.zoom = clamp(this._touchPinch.zoom * (dist / Math.max(1, this._touchPinch.dist)), this.minZoom, this.maxZoom);
        const after = this._n2m(mid);
        this.cam.cx += this._touchPinch.m.x - after.x;
        this.cam.cy += this._touchPinch.m.y - after.y;
        this._clampCam();
        e.preventDefault();
      } else if (e.touches.length === 2 && this._provTouchPinch) {
        const p1 = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        const p2 = this._clientToCanvasXY(e.touches[1].clientX, e.touches[1].clientY);
        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        this.provCam.halfW = this._provTouchPinch.halfW / (dist / Math.max(1, this._provTouchPinch.dist));
        this._clampProvCam();
        const after = this._prov2m(mid);
        this.provCam.cx += this._provTouchPinch.m.x - after.x;
        this.provCam.cy += this._provTouchPinch.m.y - after.y;
        this._clampProvCam();
        e.preventDefault();
      } else if (e.touches.length === 1 && this._touchPan) {
        const p = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        const dx = p.x - this._touchPan.x, dy = p.y - this._touchPan.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) this._touchPan.dragging = true;
        if (this._touchPan.dragging) {
          const s = this._nationScale();
          this.cam.cx = this._touchPan.cx - dx / s;
          this.cam.cy = this._touchPan.cy - dy / (s * mapAspect());
          this._clampCam();
          e.preventDefault();
        }
      } else if (e.touches.length === 1 && this._provTouchPan) {
        const p = this._clientToCanvasXY(e.touches[0].clientX, e.touches[0].clientY);
        const dx = p.x - this._provTouchPan.x, dy = p.y - this._provTouchPan.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) this._provTouchPan.dragging = true;
        if (this._provTouchPan.dragging) {
          const s = L.prov.w / (2 * this.provCam.halfW);
          this.provCam.cx = this._provTouchPan.cx - dx / s;
          this.provCam.cy = this._provTouchPan.cy - dy / (s * mapAspect());
          this._clampProvCam();
          e.preventDefault();
        }
      }
    };
    this._onTouchEnd = (e) => {
      if (e.touches.length < 2 && this._touchPinch) { this._touchPinch = null; this._touchSuppressUntil = performance.now() + 300; }
      if (e.touches.length < 2 && this._provTouchPinch) { this._provTouchPinch = null; this._touchSuppressUntil = performance.now() + 300; }
      if (e.touches.length === 0 && this._touchPan) {
        if (this._touchPan.dragging) this._touchSuppressUntil = performance.now() + 150;
        this._touchPan = null;
      }
      if (e.touches.length === 0 && this._provTouchPan) {
        if (this._provTouchPan.dragging) this._touchSuppressUntil = performance.now() + 150;
        this._provTouchPan = null;
      }
    };
    canvas.addEventListener('touchstart', this._onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', this._onTouchMove, { passive: false });
    canvas.addEventListener('touchend', this._onTouchEnd);
  }
  /* 全国図: 画面 → 地図正規化 */
  _nationScale() { return L.nation.w * this.cam.zoom; }
  _n2m(p) {
    const s = this._nationScale();
    return {
      x: this.cam.cx + (p.x - L.nation.x - L.nation.w / 2) / s,
      y: this.cam.cy + (p.y - L.nation.y - L.nation.h / 2) / (s * mapAspect()),
    };
  }
  _m2n(mx, my) {
    const s = this._nationScale();
    return {
      x: L.nation.x + L.nation.w / 2 + (mx - this.cam.cx) * s,
      y: L.nation.y + L.nation.h / 2 + (my - this.cam.cy) * s * mapAspect(),
    };
  }
  _clampCam() {
    const s = this._nationScale();
    const hx = (L.nation.w / 2) / s, hy = (L.nation.h / 2) / (s * mapAspect());
    this.cam.cx = clamp(this.cam.cx, Math.min(0.5, hx), Math.max(0.5, 1 - hx));
    this.cam.cy = clamp(this.cam.cy, Math.min(0.5, hy), Math.max(0.5, 1 - hy));
  }

  /* 国の拡大図 / 拠点の周辺図: 与えた中心と幅で地図を切り出す共通変換 */
  _viewFor(rect, cx, cy, halfW) {
    const s = rect.w / (halfW * 2);
    return {
      s,
      toScreen: (mx, my) => ({
        x: rect.x + rect.w / 2 + (mx - cx) * s,
        y: rect.y + rect.h / 2 + (my - cy) * s * mapAspect(),
      }),
      toMap: (px, py) => ({
        x: cx + (px - rect.x - rect.w / 2) / s,
        y: cy + (py - rect.y - rect.h / 2) / (s * mapAspect()),
      }),
    };
  }
  /* 表示半幅の下限＝拡大率の上限。これより寄せると素材の原寸を超えて引き伸ばすことになる */
  _minHalfW(rect, cap) { return rect.w / (2 * maxMapScale(cap)); }

  // provCamが未実体化（=ホイール/ドラッグで一度も操作していない）間は国の自動フィットを返す。
  // 操作後はprovCamに従う（国を選び直すとenter()と同じ理由でnullへ戻り、自動フィットに復帰する）
  _provView() {
    if (this.provCam) return this._viewFor(L.prov, this.provCam.cx, this.provCam.cy, this.provCam.halfW);
    const b = DATA.provBox[this.province];
    return this._viewFor(L.prov, (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, this._provDefaultHalfW());
  }
  _localView() {
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const b = DATA.provBox[this.province];
    const cx = k ? k.mx : b.cx, cy = k ? k.my : b.cy;
    const halfW = Math.max(0.016, this._minHalfW(L.local, ZOOM_CAP.local));
    return this._viewFor(L.local, cx, cy, halfW);
  }

  update(dt, g) {
    const p = g.input.pointer;
    if (this.noticeT > 0) this.noticeT -= dt;
    if (this.eventArtT > 0) this.eventArtT -= dt;

    // 右／中ドラッグでの平行移動。掴んだフレームのクリックは選択に使わせない
    if (this.pan) {
      const s = this._nationScale();
      this.cam.cx = this.pan.cx - (p.x - this.pan.x) / s;
      this.cam.cy = this.pan.cy - (p.y - this.pan.y) / (s * mapAspect());
      this._clampCam();
    }
    // 拡大図（国の拡大表示）の右／中ドラッグ平行移動
    if (this.provPan) {
      const s = L.prov.w / (2 * this.provCam.halfW);
      this.provCam.cx = this.provPan.cx - (p.x - this.provPan.x) / s;
      this.provCam.cy = this.provPan.cy - (p.y - this.provPan.y) / (s * mapAspect());
      this._clampProvCam();
    }
    if (this._suppressClick) { this._suppressClick = false; return; }
    if (this._touchPinch || this._provTouchPinch || performance.now() < (this._touchSuppressUntil || 0)) return;

    if (p.justPressed && this.help.open) { handleHelpClick(this.help, p); return; }
    if (p.justPressed && this.helpBtn && hit(this.helpBtn, p)) { g.audio.jingle([{ f: 440, d: 0.07 }]); this.help.open = true; this.help.page = 0; return; }
    if (p.justPressed && this.bgmBtn && hit(this.bgmBtn, p)) { BGM.toggle(); this.bgmBtn.jp = BGM.enabled ? '♪' : '🔇'; return; }
    if (p.justPressed && this.panel) {
      // 開いているパネルの操作を最優先で拾う（背後の地図に吸われないように）
      for (const b of this.panelButtons) {
        if (!hit(b, p)) continue;
        this._runPanelAction(b, g);
        return;
      }
      if (!inRect(L.panel, p)) { this.panel = null; return; }
      return;
    }
    if (p.justPressed) {
      // コマンドバー
      for (const b of this.cmdButtons) {
        if (!hit(b, p)) continue;
        if (b.id === 'endTurn') {
          this._endPlayerTurn(g);
        } else if (b.id === 'kino') { g.changeScene(new TitleScene()); return; }
        else if (b.id === 'jinji2') { g.changeScene(new RetsudenScene(this.state, () => new MapScene(this.state))); return; }
        else if (OPEN_COMMANDS.has(b.id)) { this.panel = this.panel === b.id ? null : b.id; this.panelScroll = 0; }
        else this._notice(`「${b.jp}」は Phase ${b.phase} で開きます / coming in Phase ${b.phase}`);
        return;
      }
      // 命令ボタン（詳細パネル）
      for (const b of (this.actionButtons || [])) {
        if (!hit(b, p)) continue;
        const k = DATA.kyotenById[this.sel];
        if (b.id === 'levy') {
          const res = levy(this.state, this.state.faction, k.id, 500);
          this._notice(res.ok ? `${k.jp} で ${res.n} 名を徴発した` : `徴兵できない — ${res.why}`);
        } else if (b.id === 'open') {
          const res = tryBloodlessOpen(this.state, this.state.faction, k.id);
          this._notice(res.ok ? (res.opened ? `${k.jp}の門が開いた——戦わずして国を得る` : `${k.jp}は門を開かなかった`) : `試みられない — ${res.why}`);
        } else if (b.id === 'attack') {
          this._launchAttack(k, g);
          return;
        }
        g.audio.jingle([{ f: 349, d: 0.08 }, { f: 440, d: 0.1 }]);
        return;
      }
      // 全国図: 国を選ぶ
      if (inRect(L.nation, p)) {
        const pid = this._pickProvince(p);
        if (pid) {
          this.province = pid; this.listScroll = 0;
          this.provCam = null; // 国を選び直したら拡大図は自動フィットへ戻す
          const list = DATA.byProvince[pid];
          this.sel = list && list.length ? list[0].id : null;
          g.audio.jingle([{ f: 523, d: 0.06 }]);
        } else this.drag = { x: p.x, y: p.y, cx: this.cam.cx, cy: this.cam.cy };
      }
      // 拡大図・周辺図: 拠点を選ぶ
      if (inRect(L.prov, p)) { const k = this._pickKyoten(p, this._provView(), null); if (k) { this.sel = k.id; g.audio.jingle([{ f: 587, d: 0.05 }]); } }
      if (inRect(L.local, p)) { const k = this._pickKyoten(p, this._localView(), null); if (k) { this.sel = k.id; g.audio.jingle([{ f: 587, d: 0.05 }]); } }
      // 拠点一覧
      if (inRect(L.list, p)) {
        const i = Math.floor((p.y - (L.list.y + 42)) / 20) + this.listScroll;
        const list = this._provList();
        if (i >= 0 && i < list.length) { this.sel = list[i].id; g.audio.jingle([{ f: 587, d: 0.05 }]); }
      }
    }
    // ★タッチの1本指ドラッグは _bindTouch の _touchPan が受け持つ。
    //   同じ指の動きを二重に camera へ適用しないよう、_touchPan 稼働中はここを止める。
    if (p.isDown && this.drag && !(this._touchPan && this._touchPan.dragging)) {
      const s = this._nationScale();
      this.cam.cx = this.drag.cx - (p.x - this.drag.x) / s;
      this.cam.cy = this.drag.cy - (p.y - this.drag.y) / (s * mapAspect());
      this._clampCam();
    }
    if (!p.isDown) this.drag = null;
    if (g.input.justPressed('Space') && !this.state.result) { this._fireEventArt(); endTurn(this.state, g.audio); }
  }
  _notice(msg) { this.notice = msg; this.noticeT = 2.6; }
  /* このターン終了で発火する史実イベントにイベント絵があれば、endTurn() 適用前に拾って表示予約する */
  _fireEventArt() {
    const y = this.state.year, m = this.state.month;
    for (const ev of TIMELINE) {
      if (ev.y !== y || ev.m !== m) continue;
      const id = eventArtFor(ev);
      if (id) { this.eventArtId = id; this.eventArtLabel = ev.jp; this.eventArtT = 6.0; return; }
    }
  }
  _drawEventArt(ctx) {
    const img = ASSETS.eventArt[this.eventArtId];
    if (!img) return;
    const a = this.eventArtT > 5.4 ? (6.0 - this.eventArtT) / 0.6 : clamp(this.eventArtT / 1.2, 0, 1);
    const w = 440, h = 248, x = W / 2 - w / 2, y = 76;
    ctx.save(); ctx.globalAlpha = a;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    ctx.restore();
    frame(ctx, x, y, w, 34 + h, { fill: 'rgba(0,0,0,0)', stroke: 'rgba(216,178,106,0.6)', radius: 4 });
    frame(ctx, x, y + h, w, 34, { fill: 'rgba(8,11,17,0.82)', stroke: 'rgba(216,178,106,0.6)', radius: 4 });
    txt(ctx, this.eventArtLabel, W / 2, y + h + 22, { font: '13px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
    ctx.restore();
  }
  _provList() { return (DATA.byProvince[this.province] || []).slice().sort((a, b) => KYOTEN_TYPE[a.type].tier - KYOTEN_TYPE[b.type].tier || b.scale - a.scale); }

  _pickProvince(p) {
    const m = this._n2m(p);
    let best = null, bestD = 0.05;
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const d = Math.hypot(b.cx - m.x, (b.cy - m.y) / mapAspect());
      if (d < bestD) { bestD = d; best = pid; }
    }
    return best;
  }
  _pickKyoten(p, view, types) {
    let best = null, bestD = 15;
    for (const k of DATA.byProvince[this.province] || []) {
      if (types && !types.includes(k.type)) continue;
      const s = view.toScreen(k.mx, k.my);
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < bestD) { bestD = d; best = k; }
    }
    return best;
  }

  draw(ctx, g) {
    ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
    this._drawTopBar(ctx);
    this._drawNation(ctx);
    this._drawProvince(ctx);
    this._drawLocal(ctx);
    this._drawDetail(ctx);
    this._drawList(ctx, g);
    this._drawEvents(ctx);
    this._drawSide(ctx);
    const p = g.input.pointer;
    for (const b of this.cmdButtons) button(ctx, b, hit(b, p));
    if (this.noticeT > 0) {
      const a = clamp(this.noticeT / 0.6, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      frame(ctx, W / 2 - 260, H - 122, 520, 34, { fill: 'rgba(216,178,106,0.16)', stroke: 'rgba(216,178,106,0.5)' });
      txt(ctx, this.notice, W / 2, H - 112, { font: '13px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
      ctx.restore();
    }
    if (this.eventArtT > 0) this._drawEventArt(ctx);
    if (this.panel) this._drawPanel(ctx, g);
    if (this.state.result) this._drawResult(ctx);
    if (this.help.open) drawHelpOverlay(ctx, this.help);
  }

  /* -------- 上部ステータスバー -------- */
  _drawTopBar(ctx) {
    const st = this.state, me = st.factions[st.faction], f = FACTIONS[st.faction];
    frame(ctx, L.bar.x, L.bar.y, L.bar.w, L.bar.h, { fill: 'rgba(216,178,106,0.10)', stroke: 'rgba(216,178,106,0.30)', radius: 4 });
    const inc = Rule.income(st, st.faction);
    let x = L.bar.x + 12;
    const put = (s, color, font) => {
      txt(ctx, s, x, L.bar.y + 6, { font: font || '13px "Hiragino Mincho ProN", serif', color: color || '#e8eef5' });
      // 幅計測は txt() の実描画幅（mobileFont適用後）と一致させる。ここがズレると
      // タッチ端末の拡大フォントで次の項目に文字が重なる。
      ctx.save(); ctx.font = mobileFont(font || '13px "Hiragino Mincho ProN", serif');
      x += ctx.measureText(s).width + 18; ctx.restore();
    };
    put(`${st.year}年（${waReki(st.year)}）${st.month}月`, '#f0e2c0');
    put(SEASON_JP[Rule.seasonOf(st.month)], '#d8b26a');
    drawKamon(ctx, st.faction, x + 8, L.bar.y + 13, 8); x += 22;
    put(me.lord, '#e8eef5', '600 13px "Hiragino Mincho ProN", serif');
    const meibun = Rule.calcMeibun(st, st.faction);
    put(`名分 ${meibun}`, meibun >= 500 ? '#5eead4' : meibun >= 250 ? '#f9d423' : '#fca5a5');
    put(`金銭 ${me.gold}`);
    put(`兵糧 ${me.food}`, inc.net < 0 ? '#fca5a5' : '#e8eef5');
    put(`兵士 ${inc.troops}`);
    put(`拠点 ${Rule.ownedKyoten(st, st.faction).length}`);
    put(`朝廷支持 ${Math.round(me.courtInfluence)}`);
    if (me.choteki) put('朝敵', '#fca5a5', '600 13px "Hiragino Mincho ProN", serif');
    // 京の保持は木曽の勝利条件そのものなので、数えている月数を出す（見えないと詰められない）
    if (f.victory === 'seitai_shogun') {
      const held = (st.kyotoHoldMonths && st.kyotoHoldMonths[st.faction]) || 0;
      put(`京 ${held}/${RULE.capital.holdMonths}ヶ月`, held >= RULE.capital.holdMonths ? '#5eead4' : held > 0 ? '#f9d423' : '#8b98ab');
    }
    if (Rule.famineActive(st)) txt(ctx, '養和の飢饉', L.bar.x + L.bar.w - 68, L.bar.y + 6, { font: '600 13px "Hiragino Mincho ProN", serif', color: '#f9d423', align: 'right' });
    button(ctx, this.bgmBtn, false);
    button(ctx, this.helpBtn, false);
  }

  /* -------- 全国図 -------- */
  _drawNation(ctx) {
    const r = L.nation;
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#0a2233' });
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2, 6); ctx.clip();
    if (ASSETS.mapReady) {
      const s = this._nationScale(), o = this._m2n(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, s, s * mapAspect());
    }
    ctx.fillStyle = 'rgba(5,7,11,0.34)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    // 国の領有を凸包で塗る（地図画像に境界線がないための近似）
    ctx.globalCompositeOperation = 'lighter';
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const owner = Rule.provinceOwner(this.state, pid);
      if (!owner || !b.hull.length) continue;
      ctx.beginPath();
      b.hull.forEach((pt, i) => { const s = this._m2n(pt[0], pt[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
      ctx.closePath();
      ctx.fillStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.34 : 0.20);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const [pid, b] of Object.entries(DATA.provBox)) {
      const owner = Rule.provinceOwner(this.state, pid);
      if (!owner || !b.hull.length) continue;
      ctx.beginPath();
      b.hull.forEach((pt, i) => { const s = this._m2n(pt[0], pt[1]); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
      ctx.closePath();
      ctx.lineWidth = pid === this.province ? 1.8 : 0.7;
      ctx.strokeStyle = hexA(FACTIONS[owner].color, pid === this.province ? 0.95 : 0.55); ctx.stroke();
    }
    // 勢力の名札（各勢力の最大拠点の位置に置く）
    const marks = {};
    for (const k of DATA.kyoten) {
      const o = this.state.kyoten[k.id].owner;
      if (!o || k.type !== 'kokufu') continue;
      if (!marks[o] || k.scale > marks[o].scale) marks[o] = k;
    }
    for (const [fid, k] of Object.entries(marks)) {
      const s = this._m2n(k.mx, k.my);
      if (s.x < r.x || s.x > r.x + r.w || s.y < r.y || s.y > r.y + r.h) continue;
      drawKamon(ctx, fid, s.x, s.y, 9);
      ctx.save();
      ctx.font = '600 13px "Hiragino Mincho ProN", serif'; ctx.textAlign = 'left';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(FACTIONS[fid].jp, s.x + 13, s.y + 5);
      ctx.fillStyle = FACTIONS[fid].color; ctx.fillText(FACTIONS[fid].jp, s.x + 13, s.y + 5);
      ctx.restore();
    }
    // 選択中の国を示す枠（参照UIの黄色い矩形）
    const b = DATA.provBox[this.province];
    if (b) {
      const a = this._m2n(b.x0 - 0.012, b.y0 - 0.012), c = this._m2n(b.x1 + 0.012, b.y1 + 0.012);
      ctx.lineWidth = 1.6; ctx.strokeStyle = '#f9d423';
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(a.x, a.y, c.x - a.x, c.y - a.y);
      ctx.setLineDash([]);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, '全国図 — 国をクリックして選ぶ', 'National Map');
    // 凡例
    const alive = Object.keys(FACTIONS).filter((fid) => this.state.factions[fid].alive);
    const lh = 17, lw = 108;
    frame(ctx, r.x + 8, r.y + 30, lw, alive.length * lh + 10, { fill: 'rgba(8,11,17,0.8)' });
    alive.forEach((fid, i) => {
      const y = r.y + 36 + i * lh;
      ctx.fillStyle = FACTIONS[fid].color; ctx.fillRect(r.x + 16, y + 3, 9, 9);
      txt(ctx, FACTIONS[fid].jp, r.x + 31, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#cbd5e1' });
    });
  }

  /* -------- 国の拡大図 -------- */
  _drawProvince(ctx) {
    const r = L.prov, prov = DATA.provById[this.province];
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#071018' });
    const view = this._provView();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 23, r.w - 2, r.h - 46, 6); ctx.clip();
    if (ASSETS.mapReady) {
      const o = view.toScreen(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, view.s, view.s * mapAspect());
      ctx.fillStyle = 'rgba(5,7,11,0.30)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    // 街道: 同国内の拠点を国府から結ぶ＋隣国の国府へ伸ばす
    this._drawRoads(ctx, view);
    const boxes = [];
    // 選択中 → 国府・館 → その他 の順に描く。先に置いた札が優先される
    const order = DATA.kyoten
      .filter((k) => KYOTEN_TYPE[k.type].tier <= 1)
      .sort((a, b) => (this.sel === b.id) - (this.sel === a.id)
        || (a.province === this.province ? 0 : 1) - (b.province === this.province ? 0 : 1)
        || KYOTEN_TYPE[a.type].tier - KYOTEN_TYPE[b.type].tier
        || b.scale - a.scale);
    for (const k of order) {
      const s = view.toScreen(k.mx, k.my);
      if (s.x < r.x - 20 || s.x > r.x + r.w + 20 || s.y < r.y || s.y > r.y + r.h) continue;
      this._drawSite(ctx, k, s, 8, k.province === this.province, boxes);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, `拡大図（${prov ? prov.nameJP : this.province}国）`, prov ? prov.nameEN : '');
    // 下端のステータス帯（参照UIの選択拠点バー）
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const by = r.y + r.h - 22;
    frame(ctx, r.x, by, r.w, 22, { fill: 'rgba(216,178,106,0.10)', stroke: 'rgba(216,178,106,0.28)', radius: 4 });
    if (k) {
      const st = this.state.kyoten[k.id];
      const own = st.owner ? FACTIONS[st.owner].jp : '中立';
      txt(ctx, `${k.jp}（${KYOTEN_TYPE[k.type].jp}）  ${own}  兵士 ${st.garrison}  規模 ${k.scale}  防御 ${k.defense}`,
        r.x + 10, by + 4, { font: '12px "Hiragino Mincho ProN", serif', color: '#e8d3a0' });
    }
  }

  /* 街道: 国府どうしを隣接関係で結ぶ（令制七道の近似） */
  _drawRoads(ctx, view) {
    ctx.save();
    ctx.strokeStyle = 'rgba(216,178,106,0.30)';
    ctx.lineWidth = 1.6; ctx.setLineDash([6, 4]);
    for (const p of DATA.provinces) {
      const a = DATA.kyotenById['kokufu_' + p.id];
      if (!a) continue;
      const sa = view.toScreen(a.mx, a.my);
      for (const nb of p.neighbors) {
        if (nb < p.id) continue;                       // 双方向を1回だけ描く
        const b = DATA.kyotenById['kokufu_' + nb];
        if (!b) continue;
        const sb = view.toScreen(b.mx, b.my);
        ctx.beginPath(); ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* 地名の重なりを避ける。拡大率に上限を掛けたぶん一画面に入る拠点が増えるので、
     置けない札は落とす。優先順位は tier（国府・館 → その他 → 村）。 */
  _labelFits(boxes, x, y, w, h) {
    for (const b of boxes) {
      if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return false;
    }
    boxes.push({ x, y, w, h });
    return true;
  }

  _drawSite(ctx, k, s, size, inFocus, labelBoxes) {
    const ty = KYOTEN_TYPE[k.type];
    const st = this.state.kyoten[k.id];
    const owner = st && st.owner ? FACTIONS[st.owner] : null;
    ctx.save();
    ctx.globalAlpha = inFocus ? 1 : 0.42;
    // 勢力色の台座
    ctx.beginPath(); ctx.ellipse(s.x, s.y + size * 0.62, size * 0.85, size * 0.34, 0, 0, Math.PI * 2);
    ctx.fillStyle = owner ? hexA(owner.color, 0.85) : 'rgba(150,160,175,0.7)'; ctx.fill();
    drawLoadedSiteIcon(ctx, ty.icon, s.x, s.y, size, ty.color);
    if (this.sel === k.id) {
      ctx.beginPath(); ctx.arc(s.x, s.y, size * 1.6, 0, Math.PI * 2);
      ctx.lineWidth = 2; ctx.strokeStyle = '#f9d423'; ctx.stroke();
    }
    if (inFocus) {
      ctx.font = '10px "Hiragino Mincho ProN", serif'; ctx.textAlign = 'center';
      const tw = ctx.measureText(k.jp).width, ty = s.y + size * 1.9;
      const ok = !labelBoxes || this.sel === k.id
        || this._labelFits(labelBoxes, s.x - tw / 2 - 2, ty - 2, tw + 4, 13);
      if (ok) {
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.92)';
        ctx.strokeText(k.jp, s.x, ty);
        ctx.fillStyle = '#e8eef5'; ctx.fillText(k.jp, s.x, ty);
      }
    }
    ctx.restore();
  }

  /* -------- 拠点の周辺図 -------- */
  _drawLocal(ctx) {
    const r = L.local;
    frame(ctx, r.x, r.y, r.w, r.h, { fill: '#071018' });
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    const view = this._localView();
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x + 1, r.y + 23, r.w - 2, r.h - 24, 6); ctx.clip();
    if (ASSETS.mapReady) {
      const o = view.toScreen(0, 0);
      ctx.drawImage(ASSETS.map, o.x, o.y, view.s, view.s * mapAspect());
      ctx.fillStyle = 'rgba(5,7,11,0.24)'; ctx.fillRect(r.x, r.y, r.w, r.h);
    }
    const boxes = [];
    const order = DATA.kyoten.slice().sort((a, b) => (this.sel === b.id) - (this.sel === a.id)
      || KYOTEN_TYPE[a.type].tier - KYOTEN_TYPE[b.type].tier || b.scale - a.scale);
    for (const kk of order) {
      const s = view.toScreen(kk.mx, kk.my);
      if (s.x < r.x - 30 || s.x > r.x + r.w + 30 || s.y < r.y || s.y > r.y + r.h) continue;
      this._drawSite(ctx, kk, s, 12, true, boxes);
    }
    ctx.restore();
    frameTitle(ctx, r.x, r.y, r.w, k ? `${k.jp} 周辺` : '周辺図', 'Local Map');
  }

  /* -------- 拠点の詳細 -------- */
  _drawDetail(ctx) {
    const r = L.detail;
    frame(ctx, r.x, r.y, r.w, r.h);
    const k = this.sel ? DATA.kyotenById[this.sel] : null;
    frameTitle(ctx, r.x, r.y, r.w, k ? k.jp : '拠点', k ? k.en : 'Site');
    if (!k) return;
    const st = this.state.kyoten[k.id], ty = KYOTEN_TYPE[k.type];
    // 拠点の絵。専用アセットがある拠点は、左側を大きく使って詳細を読ませる。
    const detailArt = ASSETS.siteDetailArt[k.id] || ASSETS.siteDetailArt[k.type];
    ctx.save();
    if (detailArt) {
      frame(ctx, r.x + 8, r.y + 28, 112, 126, { fill: 'rgba(255,255,255,0.03)', stroke: 'rgba(255,255,255,0.08)', radius: 4 });
      ctx.drawImage(detailArt, r.x + 8, r.y + 34, 112, 112);
    } else {
      frame(ctx, r.x + 8, r.y + 28, r.w - 16, 62, { fill: 'rgba(255,255,255,0.03)', stroke: 'rgba(255,255,255,0.08)', radius: 4 });
      drawLoadedSiteIcon(ctx, ty.icon, r.x + r.w / 2, r.y + 62, 22, ty.color);
    }
    ctx.restore();
    let y = detailArt ? r.y + 42 : r.y + 96;
    const rowX = detailArt ? r.x + 128 : r.x + 12;
    const rowLimit = r.y + r.h - 82;      // 命令ボタン（最大2段）の上端まで
    const row = (jp, v, color) => {
      if (y > rowLimit) return;
      txt(ctx, jp, rowX, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#8a7a58' });
      txt(ctx, String(v), r.x + r.w - 12, y - 1, { font: '600 12px "Segoe UI", sans-serif', color: color || '#e8eef5', align: 'right' });
      y += 17;
    };
    row('種類', ty.jp, ty.color);
    const prov = DATA.provById[k.province];
    row('国', prov ? prov.nameJP : k.province);
    row('支配勢力', st.owner ? FACTIONS[st.owner].jp : '中立', st.owner ? FACTIONS[st.owner].color : '#94a3b8');
    row('兵士', st.garrison);
    row('規模', k.scale);
    row('防御', k.defense);
    if (k.holder) row('領主', HOLDER_JP[k.holder] || k.holder, '#c792ea');
    if (k.suigun) row('水軍', k.suigun, '#4dd0e1');
    if (k.note === 'riverPort') row('河港', 'はい');
    // 命令ボタン
    this.actionButtons = [];
    const bw = r.w - 20, by = r.y + r.h - 40;
    const F = '600 14px "Hiragino Mincho ProN", serif';
    if (st.owner === this.state.faction) {
      this.actionButtons.push({ id: 'levy', x: r.x + 10, y: by, w: bw, h: 30, jp: '徴 兵', font: F, radius: 4 });
    } else {
      // ★国府は名分だけで開くことがある。出兵より上に置いて、まず試させる
      const open = Rule.canOpenBloodless(this.state, this.state.faction, k.id);
      const src0 = this._attackSource(k);
      const sea = src0 ? Rule.canCrossSea(this.state, this.state.faction, src0.id, k.id) : null;
      const canAtk = !!src0 && (!sea || sea.ok);
      if (sea && sea.sea) {
        txt(ctx, sea.ok ? `渡海（船 ${sea.ships}／要 ${sea.need}・失敗 ${Math.round(sea.failRate * 100)}%）` : sea.why,
          r.x + 12, r.y + r.h - 96, { font: '11px "Hiragino Mincho ProN", serif', color: sea.ok ? '#4dd0e1' : '#fca5a5' });
      }
      if (open.ok) {
        this.actionButtons.push({ id: 'open', x: r.x + 10, y: by - (canAtk ? 34 : 0), w: bw, h: 30,
          jp: `無血開城 ${Math.round(open.p * 100)}%`, font: F, radius: 4 });
      }
      if (canAtk) this.actionButtons.push({ id: 'attack', x: r.x + 10, y: by, w: bw, h: 30, jp: '出 兵', font: F, radius: 4 });
    }
    for (const b of this.actionButtons) button(ctx, b, false);
  }

  /* 出兵する。詳細パネルの「出 兵」と「軍事」パネルの両方から呼ぶ。
   * ★勝敗の反映はここ1箇所に集約する。合戦の生き残り（res.atkLeft / res.defLeft）を
   *   そのまま駐留兵にするので、損害が盤面へ素直に効く。 */
  _launchAttack(k, g) {
    const src = this._attackSource(k);
    if (!src) { this._notice('隣接する自勢力の拠点に兵がいない'); return; }
    const troops = Math.floor(this.state.kyoten[src.id].garrison * 0.7);
    const st = this.state, me = st.faction;
    // ★渡海の判定。湊を持たない勢力は海を越えられない
    const cross = Rule.canCrossSea(st, me, src.id, k.id);
    if (!cross.ok) { this._notice(cross.why); return; }
    if (cross.sea && Math.random() < cross.failRate) {
      st.kyoten[src.id].garrison = Math.round(st.kyoten[src.id].garrison * (1 - RULE.naval.crossLoss));
      pushLog(st, `${k.jp}へ渡ろうとして時化に遭い、引き返した`);
      this._notice('時化に阻まれ渡海できなかった');
      return;
    }
    // ★プレイヤーの出兵はヘックス合戦へ。AI 同士は applyActions の自動解決のまま
    st.achieveStats.armyMarchedCount++;
    if (typeof checkAchievementsEvent === 'function') checkAchievementsEvent('army_marched', { fid: me });
    g.changeScene(new BattleScene(st, { fid: me, from: src.id, to: k.id, troops }, (res) => {
      st.kyoten[src.id].garrison = Math.max(0, st.kyoten[src.id].garrison - troops);
      if (res.winner === 'atk') {
        // ★占領は captureKyoten を通す。恩賞の約束・寺社領接収の名分・ログがここに集まっている
        captureKyoten(st, me, k.id, Math.max(1, res.atkLeft || Math.round(troops * 0.5)));
        addRep(st, me, RULE.rep.greatVictory);
      } else {
        // 敗れた寄手の生き残りは本領へ引き揚げる。守りも削れた分だけ減る
        st.kyoten[src.id].garrison += Math.max(0, Math.round((res.atkLeft || 0) * 0.6));
        // 守備側の隊には拠点の防御値ぶんの嵩上げが入っているので、駐留兵へ戻すときに差し引く
        st.kyoten[k.id].garrison = Math.max(0, Math.round(res.defLeft || 0) - k.defense * 4);
        pushLog(st, `${k.jp}を攻めあぐねた`);
      }
      game.changeScene(new MapScene(st));
    }));
  }

  /* 攻め手になれる自勢力の拠点（隣接かつ兵の多い順の先頭） */
  _attackSource(target) {
    const mine = Rule.ownedKyoten(this.state, this.state.faction)
      .filter((k) => Rule.adjacent(k, target) && this.state.kyoten[k.id].garrison >= 100)
      .sort((a, b) => this.state.kyoten[b.id].garrison - this.state.kyoten[a.id].garrison);
    return mine[0] || null;
  }

  /* -------- 拠点一覧（選択中の国） -------- */
  _drawList(ctx, g) {
    const r = L.list, prov = DATA.provById[this.province];
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, `拠点一覧（${prov ? prov.nameJP : ''}国）`, 'Sites');
    const cols = [12, 132, 196, 300, 372, 440];
    const head = ['拠点名', '種類', '支配勢力', '兵士', '規模'];
    head.forEach((h, i) => txt(ctx, h, r.x + cols[i], r.y + 26, { font: '10px "Hiragino Mincho ProN", serif', color: '#8a7a58' }));
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y + 40, r.w, r.h - 42); ctx.clip();
    const list = this._provList();
    const rows = Math.floor((r.h - 46) / 20);
    this.listScroll = clamp(this.listScroll, 0, Math.max(0, list.length - rows));
    for (let i = 0; i < rows && i + this.listScroll < list.length; i++) {
      const k = list[i + this.listScroll], st = this.state.kyoten[k.id];
      const y = r.y + 44 + i * 20;
      if (this.sel === k.id) frame(ctx, r.x + 6, y - 3, r.w - 12, 19, { fill: 'rgba(249,212,35,0.14)', stroke: 'rgba(249,212,35,0.4)', radius: 3 });
      const owner = st.owner ? FACTIONS[st.owner] : null;
      txt(ctx, fitText(ctx, k.jp, 112, '12px "Hiragino Mincho ProN", serif'), r.x + cols[0], y, { font: '12px "Hiragino Mincho ProN", serif', color: '#e8eef5' });
      txt(ctx, KYOTEN_TYPE[k.type].jp, r.x + cols[1], y, { font: '12px "Hiragino Mincho ProN", serif', color: KYOTEN_TYPE[k.type].color });
      txt(ctx, owner ? owner.jp : '中立', r.x + cols[2], y, { font: '12px "Hiragino Mincho ProN", serif', color: owner ? owner.color : '#7c8ba1' });
      txt(ctx, String(st.garrison), r.x + cols[4], y, { font: '12px "Segoe UI", sans-serif', color: '#cbd5e1', align: 'right' });
      txt(ctx, String(k.scale), r.x + cols[5] + 22, y, { font: '12px "Segoe UI", sans-serif', color: '#8b98ab', align: 'right' });
    }
    ctx.restore();
    if (list.length > rows) txt(ctx, `${this.listScroll + 1}–${Math.min(list.length, this.listScroll + rows)} / ${list.length}`, r.x + r.w - 10, r.y + 26, { font: '10px sans-serif', color: '#6b7787', align: 'right' });
  }

  /* -------- 時代イベント -------- */
  _drawEvents(ctx) {
    const r = L.events;
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, '時代イベント', 'Chronicle');
    const now = Rule.monthIndex(this.state.year, this.state.month);
    let y = r.y + 30;
    const rows = Math.floor((r.h - 34) / 17);
    // 直近に起きたもの＋これから起きるものを窓で見せる
    let start = TIMELINE.findIndex((e) => Rule.monthIndex(e.y, e.m) >= now);
    if (start < 0) start = TIMELINE.length - rows;
    start = clamp(start - 2, 0, Math.max(0, TIMELINE.length - rows));
    for (let i = start; i < Math.min(TIMELINE.length, start + rows); i++) {
      const e = TIMELINE[i], past = Rule.monthIndex(e.y, e.m) < now;
      txt(ctx, `${e.y}年`, r.x + 12, y, { font: '11px "Segoe UI", sans-serif', color: past ? '#5c6673' : '#d8b26a' });
      txt(ctx, fitText(ctx, e.jp, r.w - 74, '12px "Hiragino Mincho ProN", serif'), r.x + 62, y,
        { font: '12px "Hiragino Mincho ProN", serif', color: past ? '#7c8ba1' : '#dbe4ee' });
      y += 17;
    }
  }

  /* 勢力一覧に出す4行。★自勢力は名分順で圏外になっても必ず出す
   * （劣勢のときほど自分の数字が要るのに、上位4件で切ると真っ先に消えるのが自分だった） */
  _sideRows() {
    const me = this.state.faction;
    const all = Object.keys(FACTIONS)
      .filter((fid) => this.state.factions[fid].alive)
      .map((fid) => ({ fid, n: Rule.ownedKyoten(this.state, fid).length, m: Rule.calcMeibun(this.state, fid) }))
      .sort((a, b) => b.m - a.m);
    const rows = all.slice(0, 4);
    if (!rows.some((x) => x.fid === me)) {
      const mine = all.find((x) => x.fid === me);
      if (mine) { rows.length = 3; rows.push(mine); }
    }
    return rows;
  }

  /* -------- 右下: 勢力一覧と年代記 -------- */
  _drawSide(ctx) {
    const r = L.side;
    frame(ctx, r.x, r.y, r.w, r.h);
    frameTitle(ctx, r.x, r.y, r.w, '勢力と年代記', 'Powers & Log');
    let y = r.y + 30;
    const me = this.state.faction;
    for (const row of this._sideRows()) {
      const own = row.fid === me;
      ctx.fillStyle = FACTIONS[row.fid].color; ctx.fillRect(r.x + 12, y + 3, 9, 9);
      txt(ctx, FACTIONS[row.fid].jp + (own ? '（自）' : ''), r.x + 27, y,
        { font: `${own ? '600 ' : ''}12px "Hiragino Mincho ProN", serif`, color: own ? '#f0e2c0' : '#dbe4ee' });
      txt(ctx, `名分 ${row.m}`, r.x + 130, y, { font: '11px "Segoe UI", sans-serif', color: own ? '#c8b78c' : '#8b98ab' });
      txt(ctx, `${row.n}`, r.x + r.w - 12, y, { font: '11px "Segoe UI", sans-serif', color: own ? '#c8b78c' : '#8b98ab', align: 'right' });
      y += 17;
    }
    y += 6;
    for (const l of this.state.log.slice(0, 3)) {
      txt(ctx, `${l.m}月`, r.x + 12, y, { font: '10px "Segoe UI", sans-serif', color: '#d8b26a' });
      txt(ctx, fitText(ctx, l.text, r.w - 60, '11px "Hiragino Mincho ProN", serif'), r.x + 46, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#a9b6c6' });
      y += 16;
    }
  }

  /* ---------- コマンドのモーダル（内政・人事・外交・計略） ---------- */
  _runPanelAction(b, g) {
    const st = this.state, me = st.faction;
    let r = null;
    switch (b.act) {
      case 'close':   this.panel = null; return;
      case 'levy':    r = levy(st, me, b.arg, 500); this._notice(r.ok ? `${DATA.kyotenById[b.arg].jp} で ${r.n} 名を徴発した` : `徴兵できない — ${r.why}`); break;
      case 'ando':    r = grantAndo(st, me, b.arg); this._notice(r.ok ? `${st.bands[b.arg].nameJP}の本領を安堵した` : `安堵できない — ${r.why}`); break;
      case 'shinon':  r = grantShinon(st, me, b.arg, b.arg2); this._notice(r.ok ? '新恩を宛て行った' : `与えられない — ${r.why}`); break;
      case 'purge':   r = purgeBand(st, me, b.arg); this._notice(r.ok ? '誅した' : `できない — ${r.why}`); break;
      case 'donate':  r = donateCourt(st, me); this._notice(r.ok ? `院へ献納した（朝廷支持 ${Math.round(st.factions[me].courtInfluence)}）` : `献納できない — ${r.why}`); break;
      case 'choteki': r = declareChoteki(st, me, b.arg); this._notice(r.ok ? (r.done ? `${FACTIONS[b.arg].jp}を朝敵に落とした` : '奏請は容れられなかった') : `奏請できない — ${r.why}`); break;
      case 'recruit': r = tryRecruit(st, me, b.arg, 200);
        this._notice(r.ok
          ? (r.joined ? `${st.bands[b.arg].nameJP}が与した${r.poached ? '——引き抜きは京で不義と言われる' : ''}` : `${st.bands[b.arg].nameJP}は動かなかった`)
          : `勧誘できない — ${r.why}`); break;
      case 'open':    r = tryBloodlessOpen(st, me, b.arg); this._notice(r.ok ? (r.opened ? `${DATA.kyotenById[b.arg].jp}が門を開いた` : `${DATA.kyotenById[b.arg].jp}は門を開かなかった`) : `試みられない — ${r.why}`); break;
      case 'attack':  this.panel = null; this.sel = b.arg; this._launchAttack(DATA.kyotenById[b.arg], g); return;
      case 'pillage': r = pillage(st, me, b.arg); this._notice(r.ok ? `${DATA.kyotenById[b.arg].jp}で乱妨取り——兵糧 +${r.gain}、京に悪評` : `奪えない — ${r.why}`); break;
      case 'donateJisha': r = donateJisha(st, me, b.arg); this._notice(r.ok ? `${DATA.kyotenById[b.arg].jp}へ寄進した` : `寄進できない — ${r.why}`); break;
      case 'scroll':  this.panelScroll = Math.max(0, this.panelScroll + b.arg); return;
      default: return;
    }
    g.audio.jingle(r && (r.opened || r.joined || r.done || r.ok) ? [{ f: 523, d: 0.08 }, { f: 659, d: 0.12 }] : [{ f: 262, d: 0.12 }]);
  }

  _drawPanel(ctx, g) {
    const r = L.panel;
    ctx.fillStyle = 'rgba(5,7,11,0.72)'; ctx.fillRect(0, 0, W, H);
    frame(ctx, r.x, r.y, r.w, r.h, { fill: 'rgba(10,15,22,0.97)', radius: 8 });

        rows.push({
          cells: [k.jp, KYOTEN_TYPE[k.type].jp, String(st.kyoten[k.id].garrison), String(k.scale)],
          buttons: [
            { jp: `寄進${RULE.econ.jishaDonateCost}`, act: 'donateJisha', arg: k.id, w: 72,

      // ★出兵できる相手を一覧にする。拠点詳細からしか攻められないと、

      const targets = DATA.kyoten
        .filter((k) => st.kyoten[k.id].owner !== me)
        .map((k) => ({ k, src: this._attackSource(k) }))
        .filter((x) => !!x.src)
        .map((x) => ({ ...x, sea: Rule.canCrossSea(st, me, x.src.id, x.k.id),
                       open: Rule.canOpenBloodless(st, me, x.k.id) }))
        .sort((a, b) => st.kyoten[b.k.id].garrison - st.kyoten[a.k.id].garrison);
      note = `出兵できる相手 ${targets.length}　※攻め手は隣接する自勢力の拠点のうち兵の多いもの。`
           + `兵の7割を率いて出る　船 ${Rule.ships(st, me)}`;
      head = ['拠点', '国', '支配勢力', '守備', '攻め手', ''];
      for (const x of targets) {
        const g2 = st.kyoten[x.k.id].garrison, mine = st.kyoten[x.src.id].garrison;
        rows.push({
          cells: [x.k.jp, DATA.provById[x.k.province] ? DATA.provById[x.k.province].nameJP : x.k.province,
                  st.kyoten[x.k.id].owner ? FACTIONS[st.kyoten[x.k.id].owner].jp : '中立',
                  String(g2) + (x.sea.sea ? `（渡海・失敗${Math.round(x.sea.failRate * 100)}%）` : ''),
                  `${x.src.jp} ${Math.floor(mine * 0.7)}`],
          hot: Math.floor(mine * 0.7) > Rule.defenseStrength(st, x.k),
          buttons: [
            { jp: `無血開城 ${x.open.ok ? Math.round(x.open.p * 100) + '%' : '—'}`, act: 'open', arg: x.k.id, w: 104, off: !x.open.ok },
            { jp: '出 兵', act: 'attack', arg: x.k.id, w: 62, off: !x.sea.ok },
          ],
        });
      }
    } else if (this.panel === 'jinji') {
      const debt = Rule.totalDebt(st, me);
      note = `麾下の武士団 ${Rule.bandsOf(st, me).length}　恩賞の未払い ${Math.round(debt)}　`
           + '※奉公度が20を切ると離反する。安堵は名分を、新恩は所領を要する';
      head = ['武士団', '本領', '兵', '奉公', '未払', ''];
      for (const b of Rule.bandsOf(st, me).sort((a, b2) => a.hoko - b2.hoko)) {
        const free = Rule.ownedKyoten(st, me).find((k) => !Object.values(st.bands).some((x) => x.shinon === k.id));
        rows.push({
          cells: [b.nameJP + (b.ando ? '（安堵）' : ''), DATA.kyotenById[b.home] ? DATA.kyotenById[b.home].jp : '—',
                  String(b.troops), String(Math.round(b.hoko)), String(Math.round(b.debt))],
          hot: b.hoko < RULE.hoko.defectBelow + 10,
          buttons: [
            { jp: '安堵', act: 'ando', arg: b.id, w: 52, off: b.ando },
            { jp: '新恩', act: 'shinon', arg: b.id, arg2: free && free.id, w: 52, off: !free || !!b.shinon },
            { jp: '誅殺', act: 'purge', arg: b.id, w: 52 },

      const bd = Rule.meibunBreakdown(st, me);

      // 名分の内訳を可視化するバー（Could C-03）。令旨・官位・神器など個々の寄与を積み上げで見せる
      this._meibunBd = { bd, items: f.authority.map((a) => ({ key: a, ...AUTHORITY[a] })).filter((x) => x.jp) };
      head = ['勢力', '名分', '拠点', '状態', ''];
      this.panelButtons.push({ act: 'donate', x: r.x + 14, y: r.y + 108, w: 190, h: 26,

          cells: [FACTIONS[fid].jp, String(Rule.calcMeibun(st, fid)), String(Rule.ownedKyoten(st, fid).length),

          buttons: [{ jp: c.ok ? `朝敵に奏請 ${Math.round(c.p * 100)}%` : '奏請不可', act: 'choteki', arg: fid, w: 118, off: !c.ok }],

      note = '武士団を勧誘する。名分と家格と地縁で決まる。'
           + `他家の麾下は「引き抜き」——主の名分と当人の奉公が抵抗し、成れば評判 ${RULE.recruit.poachRep}　`
           + `贈与200は断られても戻らない　金 ${f.gold}`;

      for (const l of st.log) rows.push({ cells: [`${l.y}年${l.m}月`, l.text], buttons: [] });
    }

    txt(ctx, note, r.x + 14, r.y + 34, { font: '12px "Hiragino Mincho ProN", serif', color: '#c8b78c' });

    for (let i = 0; i < visible && i + this.panelScroll < rows.length; i++) {
      const row = rows[i + this.panelScroll], y = top + 18 + i * rowH;

      row.cells.forEach((c, ci) => txt(ctx, ci === 1 && this.panel === 'joho' ? fitText(ctx, c, r.w - 200, '13px "Hiragino Mincho ProN", serif') : c,
        r.x + cols[ci], y, { font: '13px "Hiragino Mincho ProN", serif', color: ci === 0 ? '#e8eef5' : '#b9c4d2' }));
      let bx = r.x + r.w - 14;
      for (const b of (row.buttons || []).slice().reverse()) {
        bx -= b.w + 6;
        const btn = { ...b, x: bx, y: y - 5, h: 22, disabled: b.off, font: '600 12px "Hiragino Mincho ProN", serif', radius: 4 };
        button(ctx, btn, false);
        if (!b.off) this.panelButtons.push(btn);
      }
    }
    if (rows.length > visible) {
      const up = { act: 'scroll', arg: -visible, x: r.x + r.w - 78, y: r.y + r.h - 40, w: 32, h: 26, jp: '▲', font: '12px sans-serif', radius: 4 };
      const dn = { act: 'scroll', arg: visible, x: r.x + r.w - 42, y: r.y + r.h - 40, w: 32, h: 26, jp: '▼', font: '12px sans-serif', radius: 4 };
      button(ctx, up, false); button(ctx, dn, false);
      this.panelButtons.push(up, dn);
      txt(ctx, `${this.panelScroll + 1}–${Math.min(rows.length, this.panelScroll + visible)} / ${rows.length}`,
        r.x + 14, r.y + r.h - 34, { font: '11px sans-serif', color: '#8a7a58' });
    }
    for (const b of this.panelButtons) if (b.act === 'close' || b.act === 'donate') button(ctx, b, hit(b, g.input.pointer));
  }

  /* 名分の内訳を可視化するバー（外交パネル・Could C-03）。
   * 令旨・院宣・宣旨・三種の神器・帝／院の身柄・家格・評判を積み上げ棒で見せる。
   * 朝敵・評判マイナスは負の寄与なので積み上げには乗せず、バー右端の赤印と凡例の文字で示す。 */
  _drawMeibunBar(ctx, r) {
    const { bd, items } = this._meibunBd;
    const x = r.x + 14, y = r.y + 52, w = r.w - 28, h = 16;
    const max = RULE.meibun.max;
    frame(ctx, x, y, w, h, { fill: 'rgba(255,255,255,0.05)', radius: 3 });
    const segs = [
      ...items.map((it) => ({ label: it.jp, value: it.value, color: MEIBUN_COLORS[it.key] || '#d8b26a' })),
      { label: '家格', value: bd.kakaku, color: MEIBUN_COLORS.kakaku },
    ];
    if (bd.reputation > 0) segs.push({ label: '評判', value: bd.reputation, color: MEIBUN_COLORS.reputation });
    let cx = x;
    for (const s of segs) {
      if (s.value <= 0) continue;
      const sw = Math.max(0, Math.min(w - (cx - x), (s.value / max) * w));
      if (sw <= 0.5) continue;
      ctx.fillStyle = s.color;
      ctx.fillRect(cx, y, sw, h);
      cx += sw;
    }
    if (bd.choteki || bd.reputation < 0) { ctx.fillStyle = 'rgba(248,113,113,0.85)'; ctx.fillRect(x + w - 4, y, 4, h); }
    // 凡例（保持している項目だけ列挙。折り返しは2行まで見込む）
    const legendFont = '11px "Hiragino Mincho ProN", serif';
    // 幅計測は txt() の実描画幅（mobileFont適用後）と一致させる（top barの put() と同じ理由）
    ctx.save(); ctx.font = mobileFont(legendFont);
    let lx = x, ly = y + h + 16;
    for (const s of segs) {
      if (s.value <= 0) continue;
      ctx.fillStyle = s.color; ctx.fillRect(lx, ly - 8, 9, 9);
      const label = `${s.label} ${Math.round(s.value)}`;
      txt(ctx, label, lx + 13, ly - 9, { font: legendFont, color: '#c8b78c' });
      lx += 13 + ctx.measureText(label).width + 16;
      if (lx > x + w - 100) { lx = x; ly += 16; }
    }
    if (bd.choteki) txt(ctx, '朝敵 −400', lx, ly - 9, { font: legendFont, color: '#f87171' });
    else if (bd.reputation < 0) txt(ctx, `評判 ${Math.round(bd.reputation)}`, lx, ly - 9, { font: legendFont, color: '#f87171' });
    ctx.restore();
  }

  _drawResult(ctx) {
    ctx.fillStyle = 'rgba(5,7,11,0.86)'; ctx.fillRect(0, 0, W, H);
    const r = this.state.result;
    txt(ctx, r.win ? '勝 利' : '終 幕', W / 2, H / 2 - 80, { font: '600 58px "Hiragino Mincho ProN", serif', color: r.win ? '#d8b26a' : '#cbd5e1', align: 'center' });
    if (r.winner && FACTIONS[r.winner]) {
      txt(ctx, `${FACTIONS[r.winner].jp} の勝利`, W / 2, H / 2 - 26, { font: '600 20px "Hiragino Mincho ProN", serif', color: '#f0e2c0', align: 'center' });
    }
    txt(ctx, r.reason, W / 2, H / 2 + 6, { font: '16px "Hiragino Mincho ProN", serif', color: '#94a3b8', align: 'center' });
    txt(ctx, '「機能」からタイトルへ戻れます / Use 機能 to return to the title', W / 2, H / 2 + 46, { font: '12px "Segoe UI", sans-serif', color: '#6b7787', align: 'center' });
  }
}

function inRect(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
