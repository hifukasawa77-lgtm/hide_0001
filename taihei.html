 * フルスクリーン状態は body.is-fullscreen に反映し、CSS側で横向き時にcanvasを
 * 100vw/100vhへ引き伸ばして左右の黒帯を消す（sengoku.htmlのis-fullscreen踏襲）。 */
(function () {
  const touchCapable = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
  document.body.classList.toggle('taihei-touch', touchCapable);
  const gate = document.getElementById('landscapeGate');
  gate.querySelector('button').onclick = () => {
    const el = document.documentElement;
    const request = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      Promise.resolve(request ? request.call(el) : null).then(() => {
        if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
      }).catch(() => {});
    } catch (e) {}
  };
  const onFSChange = () => {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('is-fullscreen', on);
  };
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);
})();

  if (!raw) return null;

  return raw;
}

async function loadProvinces() {
  let provinces = null;
  // file:// で開いた場合、fetchはCORSエラーになると分かっているので試みない（genpei.html踏襲）。
  // ここで試みるとブラウザがネットワークエラーをconsole.errorへ出してしまい、
  // try/catchで捕まえてもコンソール上は「例外が出た」ように見える。
  if (location.protocol !== 'file:') {
    try {
      const res = await fetch('assets/taihei/provinces.json', { cache: 'no-store' });
      if (res.ok) provinces = (await res.json()).provinces;
    } catch (e) { /* http(s)配信でも念のためフォールバック */ }
  }
  if (!provinces || !provinces.length) provinces = EMBED.provinces.provinces;
  DATA.provinces = provinces;
  DATA.provById = Object.fromEntries(provinces.map((p) => [p.id, p]));
  return DATA;
}
const dataReady = loadProvinces();

/* ---- 汎用ヘルパー ---- */
function srand(state) {
  // 決定論PRNG（mulberry32・セーブ往復で再現可能）。sengoku.html の srand() を踏襲。
  state.rngSeq = (state.rngSeq + 0x6D2B79F5) >>> 0;
  let t = state.rngSeq;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function neighborsOf(pid) { const p = DATA.provById[pid]; return (p && p.adjacency) || []; }
function pushLog(state, entry) {
  state.log.push(Object.assign({ turn: state.turn, year: state.year, month: state.month || 1 }, entry));
  if (state.log.length > 300) state.log.shift();
}
function campGenerals(state, campId) {
  const out = [];
  for (const g of Object.values(state.generals)) if (g.camp === campId && !g.dead && !g.unborn) out.push(g);
  return out;
}
function campAlive(state, campId) {
  const camp = state.camps[campId];
  if (!camp || camp.eliminated) return false;
  for (const p of Object.values(state.provinces)) if (p.owner === campId) return true;
  for (const g of Object.values(state.generals)) if (g.camp === campId && !g.dead && !g.unborn) return true;
  return false;
}
function generalAlive(state, id) { const g = state.generals[id]; return !!g && !g.dead && !g.unborn; }
function generalLoyalty(state, id) { const g = state.generals[id]; return g ? g.loyalty : 0; }
function campTotalKoku(state, campId) {
  let sum = 0;
  for (const p of Object.values(state.provinces)) {
    if (p.owner === campId) sum += (DATA.provById[p.id] ? DATA.provById[p.id].koku : 0);
  }
  return sum;
}
function otherCamps(state, excludeId) {
  return Object.keys(state.camps).filter((id) => id !== excludeId && campAlive(state, id));
}
function campGold(state, campId) { const c = state.camps[campId]; return c ? (c.gold || 0) : 0; }
function spendGold(state, campId, amount) { const c = state.camps[campId]; if (c) c.gold = Math.max(0, (c.gold || 0) - amount); }
function addGold(state, campId, amount) { const c = state.camps[campId]; if (c) c.gold = (c.gold || 0) + amount; }
function addPrestige(state, campId, amount) { const c = state.camps[campId]; if (c) c.prestige = (c.prestige || 0) + amount; }

function killGeneral(state, id) {
  const g = state.generals[id];
  if (!g || g.dead) return;
  g.dead = true;
  if (g.isEmperor) {
    const court = state.courts[g.isEmperor];
    if (court) {
      court.emperor.alive = false;
      court.heldBy = null;
      court.legitimacy = Math.round(court.legitimacy * RULE.court.emperorDeathLegitimacyMul);
    }
  }
  pushLog(state, { jp: `${g.jp}が没した`, en: `${g.en} has died.` });
}

function updateGeneralLifeCycle(state) {
  for (const g of Object.values(state.generals)) {
    if (g.unborn && g.born != null && state.year >= g.born) {
      g.unborn = false;
      pushLog(state, { jp: `${g.jp}が登場した`, en: `${g.en} has come of age.` });
    }
    if (!g.unborn && !g.dead && g.died != null && state.year > g.died) killGeneral(state, g.id);
  }
}

/* ---- 朝廷関係(CourtRelation)ヘルパー ---- */
function courtRelKey(campId, courtId) { return campId + '|' + courtId; }
function getCourtRelRec(state, campId, courtId) {
  const key = courtRelKey(campId, courtId);

  return state.courtRel[key];
}
function courtRelValue(state, campId, courtId) { return getCourtRelRec(state, campId, courtId).courtRel; }
function setCourtRel(state, campId, courtId, value) { getCourtRelRec(state, campId, courtId).courtRel = clamp(value, 0, 100); }
function adjustCourtRelPair(state, campId, courtId, delta) {
  const rec = getCourtRelRec(state, campId, courtId);
  rec.courtRel = clamp(rec.courtRel + delta, 0, 100);

}
/* spec 4.5節の悪党失敗時ペナルティ呼び出し `adjustCourtRel(state, camp, -8)` は
 * courtIdを取らない3引数のため、「自陣営が現在属している朝廷」への影響として解決する。
 * 朝廷に属していない陣営（地方勢力の多くは court:null で開始）には効果がない。 */
function adjustCourtRel(state, campId, delta) {

}

/* ---- 恩賞システム（spec 4.4節） ---- */
function accrueLandDesire(gen, contributionValue) {
  gen.landDesire = clamp(gen.landDesire + contributionValue * 0.8, 0, 100);
}
function contribution(battleResult) {
  return battleResult.won ? (10 + (battleResult.provincesCaptured || 0) * 25) : 2;
}
function recordContribution(state, generalId, battleResult) {
  const gen = state.generals[generalId];
  if (!gen) return { ok: false, reason: 'invalid_general' };
  const c = contribution(battleResult);
  gen.pendingContribution = (gen.pendingContribution || 0) + c;
  accrueLandDesire(gen, c);
  return { ok: true, contribution: c, landDesire: gen.landDesire };
}
function grantDirectReward(state, gen, value) {
  if (!gen) return { ok: false, reason: 'invalid_general' };
  gen.recentRewardValue = (gen.recentRewardValue || 0) + value;
  gen.landDesire = clamp(gen.landDesire - value * 0.5, 0, 100);
  const camp = state.camps[gen.camp];

function evaluateReward(state, campId) {

  const floor = RULE.reward.minFulfillRatio * (inGrace ? RULE.reward.graceRelaxMul : 1);
  for (const gen of campGenerals(state, campId)) {
    if (!gen.pendingContribution) continue;
    const expected = gen.pendingContribution * (1 + gen.landDesire / 100);
    const given = gen.recentRewardValue || 0;
    if (given < expected * floor) {
      adjustLoyalty(state, gen, -RULE.reward.unrewardedPenalty, 'unrewarded');
    }
    gen.pendingContribution = 0;
    gen.recentRewardValue = 0;
  }

/* ---- 忠義・思想システム（spec 4.4節） ---- */
function adjustLoyalty(state, gen, delta, reason) {
  const table = IDEOLOGY_MUL[gen.ideology];
  const mul = (table && table[reason] != null) ? table[reason] : 1.0;
  gen.loyalty = clamp(gen.loyalty + delta * mul, 0, 100);
  checkDefection(state, gen);
}
function checkDefection(state, gen) {
  if (gen.dead) return;
  if (gen.loyalty >= RULE.loyalty.defectBelow) return;
  const dest = pickDefectionTarget(state, gen);
  if (dest) defect(state, gen, dest);
}
function pickDefectionTarget(state, gen) {
  const myCamp = state.camps[gen.camp];
  const candidates = otherCamps(state, gen.camp);
  if (!candidates.length) return null;
  switch (gen.ideology) {
    case 'sonno': {
      const myCourt = myCamp ? myCamp.court : null;
      const oppositeCourt = myCourt === 'nancho' ? 'hokucho' : (myCourt === 'hokucho' ? 'nancho' : null);
      const pool = oppositeCourt
        ? candidates.filter((id) => state.camps[id].court === oppositeCourt)
        : candidates.filter((id) => state.camps[id].court);
      if (!pool.length) return null;
      return pool.reduce((best, id) => (campTotalKoku(state, id) > campTotalKoku(state, best) ? id : best), pool[0]);
    }
    case 'bakufu': {
      const scoreOf = (cid) => (state.camps[cid].battleWins || 0) - (state.camps[cid].battleLosses || 0);
      return candidates.reduce((best, id) => (scoreOf(id) > scoreOf(best) ? id : best), candidates[0]);
    }
    case 'yashin': {
      const now = state.turn;
      const withOffer = candidates.filter((id) => state.camps[id].lastRewardOffer && (now - state.camps[id].lastRewardOffer.turn) <= 5);
      const pool = withOffer.length ? withOffer : candidates;
      const offerOf = (cid) => (state.camps[cid].lastRewardOffer ? state.camps[cid].lastRewardOffer.value : 0);
      return pool.reduce((best, id) => (offerOf(id) > offerOf(best) ? id : best), pool[0]);
    }
    case 'genjitsu':
    default:
      return candidates.reduce((best, id) => (campTotalKoku(state, id) > campTotalKoku(state, best) ? id : best), candidates[0]);

function defect(state, gen, destCampId) {

  gen.camp = destCampId;
  gen.loyalty = RULE.loyalty.defectBelow + 15;
  gen.landDesire = Math.round(gen.landDesire * 0.5);
  const fromJp = (state.camps[from] && state.camps[from].jp) || from;
  const fromEn = (state.camps[from] && state.camps[from].en) || from;
  const toJp = (state.camps[destCampId] && state.camps[destCampId].jp) || destCampId;
  const toEn = (state.camps[destCampId] && state.camps[destCampId].en) || destCampId;
  pushLog(state, {
    jp: `${gen.jp}が${fromJp}家から離反し、${toJp}家へ出奔した`,
    en: `${gen.en} defected from ${fromEn} to ${toEn}.`,

/* ---- 朝廷システム（spec 4.3節） ---- */
function courtPropose(state, campId, courtId, action, opts) {
  opts = opts || {};
  const camp = state.camps[campId];
  const court = state.courts[courtId];
  if (!camp || !court) return { ok: false, reason: 'invalid_camp_or_court' };
  if (!court.active) return { ok: false, reason: 'court_inactive' };
  const rec = getCourtRelRec(state, campId, courtId);
  if (rec.actedTurn === state.turn) return { ok: false, reason: 'already_acted_this_turn' };
  if (action === 'kani') return proposeKani(state, camp, court, rec);
  if (action === 'onsho') return proposeOnsho(state, camp, court, rec, opts);
  if (action === 'tobatsurei') return issueTobatsurei(state, courtId, campId, opts.targetCampId);
  return { ok: false, reason: 'unknown_action' };
}
function grantKani(state, campId, courtId) {
  // 官位授与の実適用（成功時にのみ呼ぶ）。ランクを1つ進め、威信を得る。
  const rec = getCourtRelRec(state, campId, courtId);
  const court = state.courts[courtId];
  if (!court) return null;
  const nextRank = court.kaniRanks[rec.kaniRank + 1];
  if (!nextRank) return null;
  rec.kaniRank += 1;
  addPrestige(state, campId, nextRank.prestigeGain);
  return court.kaniRanks[rec.kaniRank];
}

  if (campGold(state, camp.id) < nextRank.cost) return { ok: false, reason: 'insufficient_gold' };
  // 官位条件を満たしていなくても申請自体は可能。申請でcourtRelを積み上げ、
  // 条件(courtRel)を満たしている場合のみ任官抽選を行う（sengoku.html _courtPropose踏襲）。
  const meetsReq = rec.courtRel >= nextRank.rel;
  spendGold(state, camp.id, nextRank.cost);
  rec.courtRel = clamp(rec.courtRel + 5, 0, 100);
  rec.actedTurn = state.turn;
  const chance = (rec.courtRel / 100) * 0.8;
  let success = false;
  if (meetsReq && srand(state) < chance) {
    grantKani(state, camp.id, court.id);
    success = true;
    pushLog(state, { jp: `${camp.jp}が${nextRank.jp}に任官した`, en: `${camp.en} was appointed to ${nextRank.en}.` });
  }
  return { ok: true, action: 'kani', success, meetsReq, kaniRank: rec.kaniRank };
}
function proposeOnsho(state, camp, court, rec, opts) {
  const gen = state.generals[opts.generalId];
  if (!gen) return { ok: false, reason: 'invalid_general' };
  const relCost = opts.relCost != null ? opts.relCost : 10;
  if (rec.courtRel < relCost) return { ok: false, reason: 'insufficient_court_rel' };
  rec.courtRel = clamp(rec.courtRel - relCost, 0, 100);
  rec.actedTurn = state.turn;
  const value = opts.value != null ? opts.value : (20 + relCost * 2);
  gen.recentRewardValue = (gen.recentRewardValue || 0) + value;
  gen.landDesire = clamp(gen.landDesire - value * 0.5, 0, 100);
  camp.lastRewardOffer = { turn: state.turn, value };
  return { ok: true, action: 'onsho', success: true, value };
}
function issueTobatsurei(state, courtId, issuingCampId, targetCampId) {
  // spec 4.3節の疑似コードは issueTobatsurei(state,courtId,targetCampId) の3引数だが、
  // 「発する側の陣営がcourtRel>=60かつlegitimacy>=50」を判定するには発令元campIdが要る。
  // 4引数(issuingCampId追加)へ拡張して実装した（仕様の不足点。完了報告で明記）。
  const court = state.courts[courtId];
  const camp = state.camps[issuingCampId];
  if (!court || !camp) return { ok: false, reason: 'invalid_camp_or_court' };
  if (!court.active) return { ok: false, reason: 'court_inactive' };
  const rec = getCourtRelRec(state, issuingCampId, courtId);
  if (rec.actedTurn === state.turn) return { ok: false, reason: 'already_acted_this_turn' };
  if (rec.courtRel < RULE.court.tobatsureiCourtRelMin || effectiveLegitimacy(state, courtId) < RULE.court.tobatsureiLegitimacyMin) {
    return { ok: false, reason: 'requirements_not_met' };
  }
  if (!targetCampId || !state.camps[targetCampId]) return { ok: false, reason: 'invalid_target' };
  rec.actedTurn = state.turn;
  const expiresTurn = state.turn + RULE.court.tobatsureiDurationTurns;
  for (const cid of Object.keys(state.camps)) {
    if (state.camps[cid].court !== courtId) continue;
    state.camps[cid].tobatsureiBuff = {
      targetCampId, courtId, expiresTurn,
      atkBonus: RULE.court.tobatsureiCombatBonus,
      moraleBonus: RULE.court.tobatsureiMoraleBonus,
    };
  }
  adjustLegitimacy(state, courtId, 3);
  pushLog(state, {
    jp: `${court.jp}が${camp.jp}の求めに応じ、${state.camps[targetCampId].jp}への討伐令を発した`,
    en: `The ${court.en} issued a punitive decree against ${state.camps[targetCampId].en} at ${camp.en}’s request.`,
  });
  return { ok: true, action: 'tobatsurei', success: true, targetCampId, expiresTurn };
}
// 足利方が南朝(建武政権)に属したまま未離反の間は「恩賞不足への不満が募る期間」
// （中先代の乱＝史実の離反イベント発火前）。aiTurn()の朝廷工作ステップ同様、
// この期間かどうかの判定をここに一本化する。
function ashikagaAwaitingBreak(state, campId, camp) {
  return campId === 'ashikaga' && camp.court === 'nancho' && !state.flags.ashikagaBreak;
}
function regenCourtRel(state) {
  for (const rec of Object.values(state.courtRel)) {
    const court = state.courts[rec.courtId];
    if (!court || !court.active) continue;
    const camp = state.camps[rec.campId];
    if (!camp || camp.court !== rec.courtId) continue; // 未所属陣営は自然回復しない
    if (ashikagaAwaitingBreak(state, rec.campId, camp)) {
      // ここを他陣営と同じ自然回復のままにすると、プレイヤー/AIどちらが操作しても
      // 誰も何もしないままcourtRelが際限なく積み上がり、中先代の乱(courtRel<25で発火)が
      // 構造的に発火不能になる（「太平風雲記で足利尊氏が弓を引かないままゲームオーバー」の原因。
      // 2026-08-28修正）。恩賞を求める武士たちの不満が募る期間として自然悪化させ、
      // 史実通りの離反を既定の帰結にする。楽観的に持ち直したい場合は官位申請(courtKani)で
      // 相殺できる。
      rec.courtRel = clamp(rec.courtRel - RULE.court.courtRelRecoveryBase, 0, 100);
      continue;
    }
    const mul = court.heldBy ? RULE.court.courtRelRecoveryHolderMul : 1;
    rec.courtRel = clamp(rec.courtRel + RULE.court.courtRelRecoveryBase * mul, 0, 100);
  }
}

/* ---- 悪党システム（spec 4.5節） ---- */
function hireAkutou(state, campId, gold) {
  const pool = state.akutou[campId];
  if (!pool) return { ok: false, reason: 'invalid_camp' };
  const bought = Math.floor(gold / RULE.akutou.hireCostPerUnit);
  if (bought <= 0) return { ok: false, reason: 'insufficient_gold' };
  spendGold(state, campId, bought * RULE.akutou.hireCostPerUnit);
  pool.count = Math.min(RULE.akutou.poolCap, pool.count + bought);
  pool.quality = clamp(pool.quality + 2, 0, 100);
  return { ok: true, hired: bought, count: pool.count };
}
function akutouCommand(state, campId, kind, targetProvinceId) {
  const cmd = AKUTOU_COMMANDS[kind];
  const pool = state.akutou[campId];
  if (!cmd || !pool) return { ok: false, reason: 'invalid_command_or_camp' };
  if (pool.count <= 0 || pool.cooldown > 0) return { ok: false, reason: 'no_akutou_or_cooldown' };
  const target = state.provinces[targetProvinceId];
  if (!target) return { ok: false, reason: 'invalid_target' };
  const success = srand(state) < cmd.baseSuccess * (0.5 + pool.quality / 200);
  pool.count -= 1;
  pool.cooldown = RULE.akutou.cooldownTurns;
  if (success) {
    applyAkutouEffect(state, campId, cmd, kind, target);
  } else {
    adjustCourtRel(state, campId, -8);
    pushLog(state, {
      jp: `${(state.camps[campId] && state.camps[campId].jp) || campId}の悪党働きが露見した`,
      en: `The akutō raid by ${(state.camps[campId] && state.camps[campId].en) || campId} was exposed.`,
    });
  }
  return { ok: true, kind, success, targetProvinceId };
}
function applyAkutouEffect(state, campId, cmd, kind, prov) {
  const campJp = (state.camps[campId] && state.camps[campId].jp) || campId;
  const campEn = (state.camps[campId] && state.camps[campId].en) || campId;
  switch (kind) {
    case 'yogeki':
      prov.garrison = Math.max(0, Math.round(prov.garrison * 0.85));
      break;
    case 'housen':
      prov.kokuPenalty = { ratio: 0.8, untilTurn: state.turn + 3 };
      break;
    case 'ryakudatsu': {
      const baseKoku = DATA.provById[prov.id] ? DATA.provById[prov.id].koku : 0;
      addGold(state, campId, Math.round(baseKoku * 0.3));
      prov.kokuPenalty = { ratio: 0.9, untilTurn: state.turn + 3 };
      break;
    }
    case 'jomonhakai':
      prov.defenseDisabledUntilBattle = true;
      break;
  }
  pushLog(state, { jp: `${campJp}の悪党が${cmd.jp}に成功した`, en: `${campEn}’s akutō succeeded at ${cmd.en}.` });
}
function pickAkutouTarget(state, campId) {
  const candidates = Object.values(state.provinces).filter((p) => p.owner && p.owner !== campId);
  if (!candidates.length) return null;
  return candidates[Math.floor(srand(state) * candidates.length)].id;
}

/* ---- 政務・軍事の下地（spec 6章 step6向け。spec本文に疑似コードが無いため
 * Phase B(MapScene)実装にあたり必要最小限だけ追加した。仕様の不足点として完了報告で明記する） ---- */
function buildFacility(state, campId, provinceId, facilityId) {
  const prov = state.provinces[provinceId];
  const def = FACILITIES[facilityId];
  if (!prov || !def) return { ok: false, reason: 'invalid_province_or_facility' };
  if (prov.owner !== campId) return { ok: false, reason: 'not_owner' };
  if (prov.facility) return { ok: false, reason: 'already_built' };
  if (campGold(state, campId) < def.cost) return { ok: false, reason: 'insufficient_gold' };
  spendGold(state, campId, def.cost);
  prov.facility = facilityId;
  pushLog(state, {
    jp: `${(state.camps[campId] && state.camps[campId].jp) || campId}が${DATA.provById[provinceId] ? DATA.provById[provinceId].jp : provinceId}に${def.jp}を築いた`,
    en: `${(state.camps[campId] && state.camps[campId].en) || campId} built a ${def.en} in ${DATA.provById[provinceId] ? DATA.provById[provinceId].en : provinceId}.`,
  });
  return { ok: true, facilityId };
}
function strongestGeneralIn(state, campId, provinceId) {
  let best = null;
  for (const g of campGenerals(state, campId)) {
    if (g.province !== provinceId) continue;
    if (!best || (g.stats.tosotsu || 0) > (best.stats.tosotsu || 0)) best = g;
  }
  if (best) return best;
  // 物理的にその国にいる武将がいない場合、陣営内で最も統率が高い者を代理で立たせる
  // （討伐軍を率いる将がいないと出兵UIが完全に詰むため。仕様に無い救済措置、完了報告で明記）。
  const gens = campGenerals(state, campId);
  for (const g of gens) if (!best || (g.stats.tosotsu || 0) > (best.stats.tosotsu || 0)) best = g;
  return best;
}
function transferProvinceOwner(state, provinceId, campId, survivorGarrison) {
  const prov = state.provinces[provinceId];
  if (!prov) return;
  const fromCampId = prov.owner;
  prov.owner = campId;
  prov.garrison = Math.max(0, Math.round(survivorGarrison != null ? survivorGarrison : prov.garrison * 0.4));
  prov.defenseDisabledUntilBattle = false;
  pushLog(state, {
    jp: `${DATA.provById[provinceId] ? DATA.provById[provinceId].jp : provinceId}が${(state.camps[campId] && state.camps[campId].jp) || campId}の手に落ちた`,
    en: `${DATA.provById[provinceId] ? DATA.provById[provinceId].en : provinceId} has fallen to ${(state.camps[campId] && state.camps[campId].en) || campId}.`,
  });
  return fromCampId;
}

function recordBattleOccurred(state) { state.flags.lastBattleTurn = state.turn; }

/* ---- 年代記イベント効果ヘルパー（spec 4.6節） ---- */
function redistributeOwnerlessJito(state) {
  const unclaimed = Object.values(state.provinces).filter((p) => p.owner === null);
  for (const p of unclaimed) {
    const r = srand(state);
    if (r < 0.35) p.owner = 'nancho';
    else if (r < 0.55) p.owner = 'ashikaga';
  }
  // この直後は恩賞未充足判定を一時緩和し(evaluateReward)、数ターン後に効かせることで
  // 新田・足利間の恩賞不満という史実の伏線を表現する（spec 4.6節脚注）。
  state.flags.jitoGraceUntil = state.turn + RULE.reward.gracePeriod;
  pushLog(state, { jp: '幕府滅亡で空白化した地頭職が再分配された', en: 'Ownerless jitō posts from the fallen shogunate were redistributed.' });
}
function bushiIdeologyPenalty(state, ideologies, delta) {
  for (const gen of Object.values(state.generals)) {

function setCampCourt(state, campId, courtId) { if (state.camps[campId]) state.camps[campId].court = courtId; }
function flagAshikagaBreak(state) { state.flags.ashikagaBreak = true; state.flags.ashikagaBreakTurn = state.turn; }
function activateCourt(state, courtId) {
  const court = state.courts[courtId];
  if (!court) return;
  court.active = true;
  court.emperor.alive = true;
  court.legitimacy = Math.max(court.legitimacy, 30);

function relocateEmperor(state, courtId, provinceId) {
  const court = state.courts[courtId];
  if (!court) return;
  court.capital = provinceId;
  if (court.emperor.generalId) {
    const g = state.generals[court.emperor.generalId];
    if (g) g.province = provinceId;
  }
}
function splitCamp(state, campId, keepIds, newCampIds) {
  const base = state.camps[campId];
  if (!base) return null;
  let n = 0;
  while (state.camps[campId + '_split_' + n]) n++;
  const newId = campId + '_split_' + n;
  state.camps[newId] = {
    id: newId, jp: base.jp + '（内訌方）', en: base.en + ' (Breakaway)', color: base.color,
    playable: false, ai: 'aggressive', court: base.court, home: [], parentGroup: base.id,
    gold: Math.round((base.gold || 0) * 0.3), prestige: Math.round((base.prestige || 0) * 0.5),
  };
  state.akutou[newId] = { campId: newId, count: 0, quality: 0, cooldown: 0 };
  for (const gid of newCampIds) {

    if (g) g.camp = newId;
  }
  pushLog(state, { jp: `${base.jp}が分裂した`, en: `${base.en} has split into a breakaway faction.` });

function checkTimelineEvents(state) {
  for (const ev of TIMELINE_EVENTS) {
    if (Object.prototype.hasOwnProperty.call(state.firedEvents, ev.id)) continue;
    // 月次カレンダーの現在年月に到達したイベントだけを判定する。開始以前の史実イベントは
    // 新シナリオ開始時に連鎖発火させず、そのシナリオの初期状態へ織り込み済みとして扱う。
    const scenario = SCENARIOS.find((s) => s.id === state.scenarioId) || SCENARIOS[0];
    const eventAt = calendarOrdinal(ev.year, ev.month || 1);
    const scenarioStartsAt = calendarOrdinal(scenario.startYear, scenario.startMonth || 1);
    const now = calendarOrdinal(state.year, state.month || 1);
    if (eventAt < scenarioStartsAt || now < eventAt) continue;
    let met = false;
    try { met = !!ev.condition(state); } catch (e) { met = false; }
    if (!met) continue;
    state.firedEvents[ev.id] = state.turn;
    try { ev.effect(state); } catch (e) { console.error('[Taihei] event effect error:', ev.id, e); }
    pushLog(state, { jp: `【${ev.year}年${ev.month || 1}月】${ev.jp}`, en: `[${ev.year}/${ev.month || 1}] ${ev.en}` });
  }
}

/* ---- エンディング判定（spec 2.2節・6章 step9） ----
 * ヘルパー群。総石高・制圧国数は DATA.provinces（provinces.json 由来、koku固定値）から
 * 都度計算する。camp.court は「現在どちらの朝廷に属しているか」（4.2節注記）なので、
 * 「南朝方/北朝方」勢力の合計は court===courtId の陣営を合算する形で求める。 */
function totalProvinceCount(state) { return Object.keys(state.provinces).length; }
function campControlledProvinceCount(state, campId) {
  let n = 0;
  for (const p of Object.values(state.provinces)) if (p.owner === campId) n++;
  return n;
}
function courtCamps(state, courtId) {
  return Object.keys(state.camps).filter((cid) => state.camps[cid].court === courtId);
}
function courtCampsAlive(state, courtId) {
  return courtCamps(state, courtId).filter((cid) => campAlive(state, cid));
}
function courtControlledProvinceCount(state, courtId) {
  const camps = new Set(courtCamps(state, courtId));
  let n = 0;
  for (const p of Object.values(state.provinces)) if (p.owner && camps.has(p.owner)) n++;
  return n;
}
function courtTotalKoku(state, courtId) {
  return courtCamps(state, courtId).reduce((sum, cid) => sum + campTotalKoku(state, cid), 0);
}
function grandTotalKoku(state) {
  let sum = 0;
  for (const p of Object.values(state.provinces)) sum += (DATA.provById[p.id] ? DATA.provById[p.id].koku : 0);
  return sum;
}
/* checkEndings: spec 2.2節の表の優先度順（①→⑥）に評価し、最初に成立した1件のみ返す。
 * 呼び出し元(endTurn)は !state.ending のときのみ呼ぶため、一度確定したら以後は評価しない。 */
function checkEndings(state) {
  const totalProv = totalProvinceCount(state);
  if (totalProv <= 0) return null;
  const R = RULE.ending;

  // ①建武の新政成功: 建武の新政が続いたまま(regime==='kenmu')、中先代の乱が
  //   不発(flags.ashikagaBreakが立っていない)のまま既定ターン数が経過した。
  if (state.regime === 'kenmu' && !state.flags.ashikagaBreak && state.flags.kenmuStartTurn != null
      && (state.turn - state.flags.kenmuStartTurn) >= R.kenmuHoldTurns) {
    return 'kenmu_success';
  }

  // ②新幕府樹立: 観応の擾乱(内訌)を経ても足利方が全国石高の一定割合を維持し、
  //   南朝方勢力(court==='nancho'の陣営合算)の総石高が閾値未満に落ち込んだ。
  if (state.firedEvents.kanno_no_jouran) {
    const grand = grandTotalKoku(state);
    if (grand > 0 && campAlive(state, 'ashikaga')) {
      const ashiRatio = campTotalKoku(state, 'ashikaga') / grand;
      const nanchoRatio = courtTotalKoku(state, 'nancho') / grand;
      if (ashiRatio >= R.newBakufuAshikagaKokuRatio && nanchoRatio < R.newBakufuNanchoKokuRatio) {
        return 'shinbakufu';
      }
    }
  }

  // ③南朝統一: 南朝方(court==='nancho')の制圧国数割合が閾値以上、かつ
  //   北朝方の勢力そのものが消滅しているか、北朝の正統性が破綻している。
  if (courtControlledProvinceCount(state, 'nancho') / totalProv >= R.unificationProvinceRatio
      && (courtCampsAlive(state, 'hokucho').length === 0 || effectiveLegitimacy(state, 'hokucho') <= R.legitimacyCollapse)) {
    return 'nancho_unification';
  }

  // ④北朝統一: ③の対称形。南朝方勢力が消滅しているか南朝の正統性が破綻している。
  if (courtControlledProvinceCount(state, 'hokucho') / totalProv >= R.unificationProvinceRatio
      && (courtCampsAlive(state, 'nancho').length === 0 || effectiveLegitimacy(state, 'nancho') <= R.legitimacyCollapse)) {
    return 'hokucho_unification';
  }

  // ⑤天下泰平: 南北朝合一イベント(nanboku_gouitsu)がstate.flags.courtsUnifiedを立てる。
  if (state.flags.courtsUnified) return 'tenka_taihei';

  // ⑥全国統一: いずれの朝廷正統性条件も満たさないが、単独勢力が制圧国数の閾値に到達。
  for (const campId of Object.keys(state.camps)) {
    if (!campAlive(state, campId)) continue;
    if (campControlledProvinceCount(state, campId) / totalProv >= R.fullConquestProvinceRatio) {
      return 'zenkoku_toitsu';
    }
  }

  return null;
}
/* 上限ターン到達時の暫定エンド（scenario_end_fallback）用: この時点で最も国土を
 * 制圧している陣営を返す。EndingSceneの本文生成に使う（spec 2.2節注記）。 */
function leadingCamp(state) {
  let bestId = null, bestN = -1;
  for (const campId of Object.keys(state.camps)) {
    if (!campAlive(state, campId)) continue;
    const n = campControlledProvinceCount(state, campId);
    if (n > bestN) { bestN = n; bestId = campId; }
  }
  return { campId: bestId, provinces: Math.max(0, bestN), ratio: totalProvinceCount(state) > 0 ? bestN / totalProvinceCount(state) : 0 };
}
/* このターンで新たに発火したがカットシーン未表示のTIMELINE_EVENTSを取り出し、
 * 表示済みとして記録する（spec 6章 step8）。buildState直後(genko_no_ran)・endTurn直後の
 * 両方から呼ばれる想定で、firedEvents(発火記録)とcutscenesShown(表示記録)を分離することで、
 * 「同一ターンで複数イベントが連鎖発火した場合にキューへ積んで連続表示する」を実現する。 */
function dequeueCutscenes(state) {
  if (!state.flags.cutscenesShown) state.flags.cutscenesShown = {};
  const out = [];
  for (const ev of TIMELINE_EVENTS) {
    if (state.firedEvents[ev.id] == null) continue;
    if (state.flags.cutscenesShown[ev.id]) continue;
    state.flags.cutscenesShown[ev.id] = true;
    out.push(ev);
  }
  return out;
}

/* ---- ターン制御: buildState / applyActions / endTurn / aiTurn ---- */
function cloneCampArchetype(def) {
  return { id: def.id, jp: def.jp, en: def.en, color: def.color, playable: def.playable, ai: def.ai, court: def.court, home: def.home.slice() };
}
function buildState(opts) {
  opts = opts || {};
  const scenarioId = opts.scenarioId || RULE.scenario.defaultId;
  const scenario = SCENARIOS.filter((s) => s.id === scenarioId)[0] || SCENARIOS[0];
  const playerCamp = opts.playerCamp || 'nancho';
  const playerGeneralId = opts.playerGeneralId || null;

  const state = {
    version: SAVE_VERSION,
    scenarioId: scenario.id,
    turn: 0,
    year: scenario.startYear,
    month: scenario.startMonth || 5,
    rngSeq: (opts.seed != null ? opts.seed : 0x9e3779b9) >>> 0,
    playerCamp,
    playerGeneralId,
    regime: scenario.regime || 'kamakura_end',
    ending: null,
    flags: {
      lastBattleTurn: -100,
      cutscenesShown: {},
      ashikagaBreak: !!scenario.lateState,
      ashikagaBreakTurn: scenario.lateState ? 0 : null,
      kenmuStartTurn: scenario.kenmuStart ? 0 : null,
      peaceTrackOpen: !!scenario.peaceTrackOpen,
    },
    firedEvents: {},
    log: [],
    camps: {},
    generals: {},
    provinces: {},
    courts: {},
    courtRel: {},
    akutou: {},
  };

  // 陣営: 足利方・南朝方・鎌倉幕府北条家（NPC）+ 地方9家
  state.camps.ashikaga = cloneCampArchetype(CAMPS.ashikaga);
  state.camps.nancho = cloneCampArchetype(CAMPS.nancho);
  state.camps.hojo = cloneCampArchetype(CAMPS.hojo);
  const ashikagaDisplay = factionInfo('ashikaga', scenario.id);
  const nanchoDisplay = factionInfo('nancho', scenario.id);
  Object.assign(state.camps.ashikaga, { jp: ashikagaDisplay.jp, en: ashikagaDisplay.en });
  Object.assign(state.camps.nancho, { jp: nanchoDisplay.jp, en: nanchoDisplay.en });
  for (const h of CHIHOU_HOUSES) {
    state.camps[h.id] = { id: h.id, jp: h.jp, en: h.en, color: h.color, playable: true, ai: h.ai || 'opportunist', court: null, home: h.home.slice() };
  }

  // 南北朝分裂後のシナリオは、幕府成立後の平定を反映した共通の後期シードを使う。
  const ownerSeed = scenario.lateState ? buildKannoProvinceOwnerSeed() : (scenario.id === 'genko' ? GENKO_PROVINCE_OWNER_SEED : PROVINCE_OWNER_SEED);
  for (const p of DATA.provinces || []) {
    const owner = ownerSeed[p.id] || null;
    state.provinces[p.id] = {
      id: p.id, owner, facility: null,
      garrison: owner ? Math.round(120 + p.koku * 0.4) : Math.round(40 + p.koku * 0.15),
    };
  }

  // 経済初期値（本国の石高に応じた概算。詳細な内政計算は後続Phase）
  for (const campId of Object.keys(state.camps)) {
    const koku = campTotalKoku(state, campId);
    state.camps[campId].gold = Math.round(300 + koku * 1.2);
    state.camps[campId].prestige = 10;
    state.camps[campId].battleWins = 0;
    state.camps[campId].battleLosses = 0;
  }

  // 武将（born/diedは史実準拠データ）。開始年より前に没している人物は dead、
  // 開始年より後に生まれる人物は unborn とし、名鑑には全員を載せつつ軍務・人事から除外する。
  // 'genko'(1331年開始)ではほぼ全員が該当しないが、'kanno'(1350年開始)では
  // 後醍醐帝(没1339)・楠木正成(没1336)・北畠顕家(没1338)等が既に鬼籍に入っている）
  for (const g of GENERALS_DEF) {
    state.generals[g.id] = {
      id: g.id, camp: g.camp, jp: g.jp, en: g.en, born: g.born, died: g.died,
      province: g.province, stats: Object.assign({}, g.stats),
      loyalty: g.loyalty, landDesire: g.landDesire, ideology: g.ideology,
      dead: !!(g.died != null && g.died < scenario.startYear),
      unborn: !!(g.born != null && g.born > scenario.startYear),
      pendingContribution: 0, recentRewardValue: 0,
      isEmperor: g.isEmperor || null,
    };
  }

  // 朝廷
  for (const cid of Object.keys(COURTS_DEF)) {
    const def = COURTS_DEF[cid];
    state.courts[cid] = {
      id: cid, jp: def.jp, en: def.en,
      emperor: Object.assign({}, def.emperor),
      legitimacy: def.legitimacy, active: def.active, heldBy: def.heldBy, capital: def.capital,
      kaniRanks: COURT_KANI_RANKS.map((r) => Object.assign({}, r)),
    };
  }
  state.courts.nancho.heldBy = 'nancho'; // 後醍醐帝(または代替わり後の帝)は自陣営(南朝)が身柄を保持した状態で開始
  if (scenario.id === 'genko') {
    Object.assign(state.courts.nancho, { jp: '後醍醐朝廷', en: 'Go-Daigo’s Court' });
  } else if (scenario.id === 'kenmu') {
    Object.assign(state.courts.nancho, { jp: '建武朝廷', en: 'Kenmu Court' });
  }
  if (scenario.lateState) {
    // 南北朝分裂後の朝廷情勢をシナリオ開始年に合わせて簡略補正する（武将データに
    // 後継の天皇を個別武将として持たないため、玉座は特定武将に紐付けない形で継続扱いとし、
    // 討死による正統性崩壊イベントは発生しない。国ごとの領有はbuildKannoProvinceOwnerSeed()で
    // 別途1350年近似へ補正済み）。
    if (scenario.nanchoEmperor) {
      state.courts.nancho.emperor = Object.assign({ generalId: null, alive: true }, scenario.nanchoEmperor);
    }
    state.courts.hokucho.active = true;
    state.courts.hokucho.emperor = Object.assign({ generalId: null, alive: true }, scenario.hokuchoEmperor);
    state.courts.hokucho.legitimacy = 55;
    state.courts.hokucho.heldBy = 'ashikaga';
    // CAMPS.ashikaga.court は既定で'nancho'（建武期は南朝の一員として挙兵した史実を表す、
    // 'genko'では中先代の乱→延元の乱で'hokucho'へ離反するまでの初期値）。'kanno'(1350年開始)は
    // その離反イベント自体をスキップする（minTurn<0ガード）ため、ここで明示的に'hokucho'へ
    // 補正しないとcourtControlledProvinceCount('nancho')が足利方の領国まで誤って合算してしまい、
    // 南朝が瞬時に「統一」判定される（バランス検証スクリプトで実際に検出したバグ）。
    state.camps.ashikaga.court = 'hokucho';
  }

  // 悪党プール（全camp分。未雇用ならcount:0）
  for (const cid of Object.keys(state.camps)) {
    state.akutou[cid] = { campId: cid, count: 0, quality: 0, cooldown: 0 };
  }

  // turn===0 条件のイベント（元弘の乱＝開幕イベント）を拾うため、endTurn()を待たず
  // 初期状態の時点で一度だけ判定する（checkTimelineEventsは通常endTurn内から呼ばれ、
  // その時点ではturnが既に1以上へ進んでいるためturn===0を検出できない）。
  checkTimelineEvents(state);

  return state;
}

function applyOneAction(state, campId, action) {
  switch (action.type) {
    case 'courtKani': return courtPropose(state, campId, action.courtId, 'kani');
    case 'courtOnsho': return courtPropose(state, campId, action.courtId, 'onsho', { generalId: action.generalId, relCost: action.relCost, value: action.value });
    case 'tobatsurei': return issueTobatsurei(state, action.courtId, campId, action.targetCampId);
    case 'hireAkutou': return hireAkutou(state, campId, action.gold);
    case 'akutouCommand': return akutouCommand(state, campId, action.kind, action.targetProvinceId);
    case 'directReward': return grantDirectReward(state, state.generals[action.generalId], action.value);
    case 'recordContribution': return recordContribution(state, action.generalId, action.battleResult);
    default: return { ok: false, reason: 'unknown_action_type:' + action.type };
  }
}
function applyActions(state, campId, actions) {
  const results = [];
  for (const action of actions || []) results.push(applyOneAction(state, campId, action));
  return results;
}

function advanceCalendar(state) {
  state.month = (state.month || 1) + 1;
  if (state.month > 12) { state.month = 1; state.year += 1; }
} // 1ターン=1か月

function aiTurn(state, campId) {
  const camp = state.camps[campId];
  if (!camp || !campAlive(state, campId)) return;
  let actions = 0;
  const maxA = RULE.ai.maxActions;

  // 1) 恩賞配分: landDesireが高い武将から簡易に手当てする
  const gens = campGenerals(state, campId).slice().sort((a, b) => b.landDesire - a.landDesire);
  for (const g of gens) {
    if (actions >= maxA) break;
    if (g.landDesire > 50 && campGold(state, campId) > 20) {
      const value = Math.min(campGold(state, campId), Math.round(20 + g.landDesire * 0.3));
      spendGold(state, campId, value);
      grantDirectReward(state, g, value);
      actions++;
    }
  }

  // 2) 朝廷工作: 所属朝廷があればcourtRel/kaniの引き上げを狙う。
  // ただし足利方がAI操作（プレイヤーが他陣営を選択）でcourt==='nancho'かつ未離反の間はスキップする。
  // このステップは成否に関わらずcourtRelを毎ターン+5前後押し上げるため、史実イベント
  // 「中先代の乱」（nakasendai_no_ran, courtRel<25で発火し足利方が離反する）をturn4より前に
  // 機械的に封じてしまい、「①建武の新政成功がturn17でほぼ自動確定する」不具合があった
  // （2026-08-18 game-balanceエージェント診断。足利方をプレイヤーが選ぶと離反は史実通り発火するが、
    // 今度はAIに侵攻ロジックが無いため他のエンディングにも到達しにくい非対称も判明）。
  if (camp.court && actions < maxA && !ashikagaAwaitingBreak(state, campId, camp)) {
    const rel = courtRelValue(state, campId, camp.court);
    if (rel < 95) { courtPropose(state, campId, camp.court, 'kani'); actions++; }
  }

  // 3) 悪党運用: 保有していれば低頻度で使用
  const pool = state.akutou[campId];
  if (pool && pool.count > 0 && pool.cooldown <= 0 && actions < maxA && srand(state) < 0.3) {
    const kinds = Object.keys(AKUTOU_COMMANDS);
    const kind = kinds[Math.floor(srand(state) * kinds.length)];
    const target = pickAkutouTarget(state, campId);
    if (target) { akutouCommand(state, campId, kind, target); actions++; }
  }
}

function endTurn(state) {
  state.turn += 1;
  advanceCalendar(state);
  updateGeneralLifeCycle(state);

  for (const campId of Object.keys(state.camps)) evaluateReward(state, campId);
  for (const campId of Object.keys(state.camps)) decayLoyalty(state, campId);

  for (const campId of Object.keys(state.camps)) {
    if (campId === state.playerCamp) continue;
    aiTurn(state, campId);
  }

  regenCourtRel(state);

  for (const pool of Object.values(state.akutou)) if (pool.cooldown > 0) pool.cooldown -= 1;

  checkTimelineEvents(state);

  if (!state.ending) {
    const result = checkEndings(state);
    if (result) state.ending = result;
  }
  const scenario = SCENARIOS.filter((s) => s.id === state.scenarioId)[0] || SCENARIOS[0];
  if (!state.ending && state.turn >= scenario.maxTurns) {
    // 2.2節: 上限ターン到達時は暫定の「全国統一」寄りエンドを表示する（本実装はstep9）。
    state.ending = 'scenario_end_fallback';
  }
  return state;
}

/* ---- Rule 名前空間（外部から呼ぶ入口をここに集約） ---- */
const Rule = {
  buildState, applyActions, endTurn, aiTurn,
  courtPropose, issueTobatsurei, grantKani,
  accrueLandDesire, contribution, recordContribution, evaluateReward,
  adjustLoyalty, checkDefection, pickDefectionTarget, defect,
  hireAkutou, akutouCommand,
  checkTimelineEvents, checkEndings, dequeueCutscenes, leadingCamp,
  grantDirectReward, updateGeneralLifeCycle,
  buildFacility, strongestGeneralIn, transferProvinceOwner, recordBattleOccurred,
  // 補助（テスト・後続フェーズから直接使う想定のヘルパー類）
  srand, campAlive, generalAlive, generalLoyalty, campGenerals, campTotalKoku,
  courtRelValue, setCourtRel, adjustCourtRel, adjustLegitimacy, effectiveLegitimacy,
  killGeneral, migrateState, campGold, spendGold, addGold, neighborsOf, pushLog,
  // エンディング判定用の集計ヘルパー（spec 6章 step9）
  totalProvinceCount, campControlledProvinceCount, courtCamps, courtCampsAlive,
  courtControlledProvinceCount, courtTotalKoku, grandTotalKoku,
};

/* ==========================================================================
 * シーン / Scenes — Phase B（spec 6章 step5〜7: 基本シーン・MapScene・BattleScene）
 *
 * 既知の簡略化（spec本文に無いため、Phase B実装にあたり決めた仕様の補完。
 * 完了報告で明記する）:
 *  - シナリオは 'genko'（本編）固定。'kanno'（観応の擾乱・Should要件）の選択UIは
 *    このPhaseでは実装しない
 *  - 出兵は「国の駐留兵＝出せる兵」の1プールとして扱う。出兵元の駐留兵は
 *    出兵中も減らさず、合戦後の生存数で駐留兵を置き換える（別途「遠征中」の
 *    状態を持たない）
 *  - AKUTOU_COMMANDS.cost は仕様書4.5節の疑似コードも参照しておらず、
 *    Phase A の akutouCommand() 実装もコストを消費しない。UIもそれに合わせ、
 *    費用が実行時に引かれるとは示唆しない表記にした
 *  - ヘックス合戦に一騎討ち・潮汐（水軍の間合い変化）は実装しない（Should超）
 *
 * Phase C（spec 6章 step8〜9）で追加した部分:
 *  - checkEndings を2.2節の6エンディング優先度表どおりに実装し、CutsceneScene / EndingScene を
 *    新設した。MapScene._endTurn は「発火したTIMELINE_EVENTSのカットシーン表示 → （あれば）
 *    エンディング画面遷移」の順に処理する
 * ========================================================================== */

/* ---- 汎用描画ヘルパー（genpei.html/sengoku.html の frame/txt/button パターン踏襲） ---- */
function frame(ctx, x, y, w, h, opts) {
  const o = opts || {};
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, o.radius != null ? o.radius : 10);
  ctx.fillStyle = o.fill || 'rgba(255,255,255,0.05)';
  ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = o.stroke || 'rgba(255,255,255,0.16)';
  ctx.stroke();
  ctx.restore();
}
function txt(ctx, str, x, y, o) {
  ctx.save();
  ctx.font = (o && o.font) || '13px "Segoe UI", "Hiragino Sans", sans-serif';
  ctx.fillStyle = (o && o.color) || '#e2e8f0';
  ctx.textAlign = (o && o.align) || 'left';
  ctx.textBaseline = (o && o.baseline) || 'top';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function fitText(ctx, str, max, font) {
  ctx.save(); ctx.font = font;
  let s = str;
  while (s.length > 1 && ctx.measureText(s).width > max) s = s.slice(0, -1);
  ctx.restore();
  return s === str ? s : s.slice(0, -1) + '…';
}
function wrapText(ctx, str, x, y, maxW, lh, opts) {
  ctx.save(); ctx.font = opts.font;
  let line = '', yy = y;
  for (const ch of str) {
    if (ctx.measureText(line + ch).width > maxW) { txt(ctx, line, x, yy, opts); line = ch; yy += lh; }
    else line += ch;
  }
  if (line) txt(ctx, line, x, yy, opts);
  ctx.restore();
  return yy + lh;
}
function button(ctx, b, hover) {
  const active = !!b.active;
  frame(ctx, b.x, b.y, b.w, b.h, {
    fill: b.disabled ? 'rgba(255,255,255,0.025)' : active ? 'rgba(116,58,30,0.72)' : hover ? 'rgba(112,73,38,0.58)' : 'rgba(55,39,25,0.76)',
    stroke: b.disabled ? 'rgba(255,255,255,0.08)' : active ? 'rgba(190,139,70,0.95)' : hover ? 'rgba(181,132,68,0.82)' : 'rgba(120,88,53,0.68)',
    radius: b.radius != null ? b.radius : 3,
  });
  if (!b.disabled && (hover || active)) {
    ctx.fillStyle = active ? '#9f2f24' : '#b38a45';
    ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 3);
  }
  const cx = b.x + b.w / 2;
  txt(ctx, b.jp, cx, b.y + (b.en ? b.h / 2 - 15 : b.h / 2 - 7), {
    font: b.font || '600 15px "Hiragino Mincho ProN", "Yu Mincho", serif',
    color: b.disabled ? '#746957' : '#ead9b5', align: 'center',
  });
  if (b.en) txt(ctx, b.en, cx, b.y + b.h / 2 + 6, { font: '10px sans-serif', color: '#9d896b', align: 'center' });
}
function hit(b, p) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function inRectXY(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ---- 陣営（camp）表示ヘルパー。ashikaga/nancho は CAMPS、地方勢力は CHIHOU_HOUSES、
 * それ以外（分裂勢力等）は state.camps を最終フォールバックとする ---- */
function campColorOf(campId) {
  if (CAMPS[campId]) return CAMPS[campId].color;
  const h = CHIHOU_HOUSES.find((x) => x.id === campId);
  return h ? h.color : '#94a3b8';
}
function campLabelOf(state, campId) {
  const c = state && state.camps[campId];
  if (c) return { jp: c.jp, en: c.en };
  if (CAMPS[campId]) return { jp: CAMPS[campId].jp, en: CAMPS[campId].en };
  const h = CHIHOU_HOUSES.find((x) => x.id === campId);
  return h ? { jp: h.jp, en: h.en } : { jp: campId, en: campId };
}
function campCourtOf(state, campId) { const c = state.camps[campId]; return c ? c.court : null; }
function courtResultNotice(action, result) {
  if (!result.ok) return { jp: '失敗: ' + result.reason, en: 'Failed: ' + result.reason };
  if (action === 'kani') {

function loadArtManifest(defs, cache, pathOf) {
  return Promise.all(Object.entries(defs).map(([id, def]) => new Promise((resolve) => {
    const entry = { image: new Image(), ready: false, missing: false };
    cache.set(id, entry);
    entry.image.decoding = 'async';
    entry.image.onload = () => { entry.ready = true; resolve(true); };
    entry.image.onerror = () => { entry.missing = true; resolve(false); };
    entry.image.src = pathOf(def);

}

function drawImageCover(ctx, image, x, y, w, h) {

  const scale = Math.max(w / image.naturalWidth, h / image.naturalHeight);
  const sw = w / scale, sh = h / scale;
  const sx = (image.naturalWidth - sw) / 2, sy = (image.naturalHeight - sh) / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();

}

function loadBattlefieldImage() {

function mapTransform(rect) {
  const s = Math.min(rect.w / MAP_NATIVE_W, rect.h / MAP_NATIVE_H);
  const dw = MAP_NATIVE_W * s, dh = MAP_NATIVE_H * s;
  return { s, ox: rect.x + (rect.w - dw) / 2, oy: rect.y + (rect.h - dh) / 2, dw, dh };
}
function provScreenXY(rect, prov) {
  const t = mapTransform(rect);
  // prov.x/y は隣接グラフの位相用の論理座標(0..1000 x 0..650)で、絵地図の画素座標とは
  // キャリブレーションされていない。地図上の実位置は mx/my（絵地図に対して0..1正規化、
  // genpei.htmlの拠点データから流用）を使う（2026-08-19: x/yを直接使うと国マーカーが
  // 地図から大きくずれるバグがあった）。
  if (prov.mx != null && prov.my != null) {
    return { x: t.ox + prov.mx * t.dw, y: t.oy + prov.my * t.dh };
  }
  return { x: t.ox + prov.x * t.s, y: t.oy + prov.y * t.s };
}

/* ============================================================================
 * CutsceneScene — 歴史イベント演出（spec 6章 step8）
 * TIMELINE_EVENTS発火時に lines[] をGlassmorphismカードで順に表示する。
 * 同一ターンで複数イベントが連鎖発火した場合（例: 鎌倉幕府滅亡→建武の新政）は
 * events配列に複数積んでキュー表示し、最後まで見終えたら nextSceneFactory() へ遷移する。
 * ========================================================================== */
class CutsceneScene extends GameKit.Scene {
  constructor(state, events, nextSceneFactory) {
    super();
    this.state = state;
    this.events = events;
    this.nextSceneFactory = nextSceneFactory;
    this.idx = 0;
  }
  enter() {
    this.bd = new Backdrop();
    this.t = 0;
    this.next = { x: W / 2 - 150, y: H - 96, w: 300, h: 56, jp: '次へ', en: 'Next' };
  }
  _current() { return this.events[this.idx]; }
  _shownLineCount() {
    const lines = this._current().lines || [];
    return Math.min(lines.length, Math.floor(this.t / 0.35) + 1);
  }
  _advance(g) {
    const ev = this._current();
    const nextIndex = this.idx + 1;
    const continueHistory = () => nextIndex < this.events.length
      ? new CutsceneScene(this.state, this.events.slice(nextIndex), this.nextSceneFactory)
      : this.nextSceneFactory();
    if (ev.battle) {
      const spec = { ...ev.battle, historicalEvent: ev };
      // 1331年の足利高氏はまだ幕府軍。笠置山では後醍醐方ではなく幕府連合の攻撃側を指揮する。
      if (ev.id === 'kasagiyama' && this.state.playerGeneralId === 'ashikaga_takauji') {
        spec.campId = 'ashikaga';
        spec.generalId = 'ashikaga_takauji';
        spec.playerSide = 'atk';
      }
      // プレイヤーの陣営がこの史実合戦の当事者（攻撃側/防御側どちらか）でない場合、
      // 無関係な陣営の合戦を代理操作させない（例: 足利方の土岐を選んでいるのに新田義貞の
      // 関東合戦を操作させられる、等）。史実通りの決着で自動的に進行させる。
      const playerCamp = this.state.playerCamp;
      if (playerCamp === spec.campId) spec.playerSide = 'atk';
      else if (playerCamp === spec.defCampId) spec.playerSide = 'def';
      else {
        Rule.recordBattleOccurred(this.state);
        // 史実通りの決着を自動進行させるだけでなく、攻撃側が勝つ想定の合戦は
        // 国の領有も実際に移す。ここを省くと、プレイヤーが当事者でない限り
        // 「鎌倉幕府滅亡」等の演出だけが流れて相模国・武蔵国の領有はhojoのまま
        // 残り続ける（無言のバグ。北条家が滅んだはずの1350年代以降も
        // 「鎌倉幕府・北条家」表示が残ることで発覚した。2026-08-29修正）。
        if (spec.expectedWinner === 'atk') Rule.transferProvinceOwner(this.state, spec.toProvinceId, spec.campId);
        g.changeScene(continueHistory());
        return;
      }
      g.changeScene(new BattleScene(this.state, spec, (result) => {
        if (result.winner === spec.expectedWinner) {
          Rule.recordBattleOccurred(this.state);
          g.changeScene(continueHistory());
        } else {
          g.changeScene(new HistoricalGameOverScene(this.state, ev, result, spec.expectedWinner));
        }
      }));
      return;
    }
    this.idx = nextIndex;
    if (this.idx >= this.events.length) { g.changeScene(this.nextSceneFactory()); return; }
    this.t = 0;
  }
  update(dt, g) {
    this.t += dt; this.bd.update(dt);
    const p = g.input.pointer;
    if (!p.justPressed) return;
    const lines = this._current().lines || [];
    if (this._shownLineCount() < lines.length) {
      // 1クリック目はテキスト送りを飛ばして全文を即座に表示する（OpeningScene踏襲）
      this.t = lines.length * 0.35;
      return;
    }
    if (!hit(this.next, p)) return;
    g.audio.jingle([{ f: 349, d: 0.08 }, { f: 440, d: 0.12 }]);
    this._advance(g);
  }
  draw(ctx, g) {
    this.bd.draw(ctx);
    const ev = this._current();
    // 年号（算用数字）を含むため毛筆体は使わない: Yuji Bokuは"1"が"7"に見える崩し字形で、
    // 「1331年」が「7337年」と誤読されるバグを2026-08-18に発見した（見出し全般への展開時に検出）。
    txt(ctx, `【${ev.year}年】${ev.jp}`, W / 2, 92, { font: '600 30px "Hiragino Mincho ProN", serif', color: '#22d3ee', align: 'center' });
    txt(ctx, `[${ev.year}] ${ev.en}`, W / 2, 132, { font: '13px sans-serif', color: '#a78bfa', align: 'center' });
    frame(ctx, 180, 170, W - 360, H - 170 - 146, { fill: 'rgba(18,12,8,0.92)', stroke: 'rgba(179,138,69,0.55)', radius: 8 });
    const art = ASSETS_RT.eventArt.get(ev.id);
    if (art && art.ready) {
      drawImageCover(ctx, art.image, 204, 190, W - 408, 342);
      const vignette = ctx.createLinearGradient(0, 422, 0, 532);
      vignette.addColorStop(0, 'rgba(12,8,5,0)'); vignette.addColorStop(1, 'rgba(12,8,5,0.72)');
      ctx.fillStyle = vignette; ctx.fillRect(204, 422, W - 408, 110);
      ctx.strokeStyle = 'rgba(179,138,69,0.72)'; ctx.strokeRect(204.5, 190.5, W - 409, 341);
    }
    const lines = ev.lines || [];
    const shown = this._shownLineCount();
    let y = 558;
    for (let i = 0; i < shown; i++) {
      txt(ctx, lines[i].jp, W / 2, y, { font: '16px "Hiragino Mincho ProN", serif', color: '#e2e8f0', align: 'center' });
      y += 28;
      txt(ctx, lines[i].en, W / 2, y, { font: '11px sans-serif', color: '#8b98ab', align: 'center' });
      y += 30;
    }
    txt(ctx, `${this.idx + 1} / ${this.events.length}`, W / 2, H - 128, { font: '11px sans-serif', color: '#64748b', align: 'center' });
    const p = g.input.pointer;
    button(ctx, this.next, hit(this.next, p));
  }
}

    // provScreenXY基準）での中心。zoom=1が「地図全体を映す」既定倍率で下限に固定する。

  }

    const c = this.cam, m = this._mapCenter();
    return { x: (sx - m.x) / c.zoom + c.cx, y: (sy - m.y) / c.zoom + c.cy };

  _worldToScreen(wx, wy) {
    const c = this.cam, m = this._mapCenter();
    return { x: (wx - c.cx) * c.zoom + m.x, y: (wy - c.cy) * c.zoom + m.y };

    c.cx = clamp(c.cx, ML.map.x + halfW, ML.map.x + ML.map.w - halfW);

    if (this._onTouchMove) canvas.removeEventListener('touchmove', this._onTouchMove);

    if (this._onTouchEnd) canvas.removeEventListener('touchcancel', this._onTouchEnd);
    if (this._onMouseDown) canvas.removeEventListener('mousedown', this._onMouseDown);

  _provAt(px, py) {
    const w = this._screenToWorld(px, py);
    let best = null, bd = 11 / this.cam.zoom;
    for (const prov of DATA.provinces) {
      const p = provScreenXY(ML.map, prov);
      const d = Math.hypot(p.x - w.x, p.y - w.y);
      if (d < bd) { bd = d; best = prov.id; }
    }
    return best;
  }
  update(dt, g) {
    this.bd.update(dt);
    this.t += dt;
    if (this.noticeT > 0) this.noticeT -= dt;
    const p = g.input.pointer;
    this.hoverProv = (!this.panel && !this.actionResult && inRectXY(ML.map, p)) ? this._provAt(p.x, p.y) : null;
    if (!p.justPressed) return;
    if (this.actionResult) {
      this.actionResult = null;
      this.notice = null; this.noticeT = 0;
      g.audio.jingle([{ f: 370, d: 0.05 }, { f: 440, d: 0.08 }]);
      return;
    }
    for (const b of this.buttons) {
      if (!hit(b, p) || b.disabled) continue;
      b.onClick(g);
      return;
    }
    if (this._touchState || this.t < this._suppressClickUntil) return;
    if (!this.panel && this.hoverProv) {
      this.sel = this.hoverProv;

  _endTurn(g) {
    Rule.endTurn(this.state);
    save.set('autosave', this.state);
    g.audio.jingle([{ f: 294, d: 0.08 }, { f: 370, d: 0.08 }, { f: 440, d: 0.14 }]);
    const state = this.state;
    const pending = Rule.dequeueCutscenes(state);
    const nextFactory = () => (state.ending ? new EndingScene(state) : new MapScene(state));
    if (pending.length) { g.changeScene(new CutsceneScene(state, pending, nextFactory)); return; }
    if (state.ending) { g.changeScene(new EndingScene(state)); return; }
    this._notice({ jp: `${state.year}年${state.month || 1}月へ進んだ（第${state.turn}ターン）`, en: `Advanced to ${state.year}/${state.month || 1} (turn ${state.turn}).` });
  }
  _launchAttack(g, fromId, toId) {
    const gen = Rule.strongestGeneralIn(this.state, this.player, fromId);
    const spec = { campId: this.player, fromProvinceId: fromId, toProvinceId: toId, generalId: gen ? gen.id : null };
    Rule.recordBattleOccurred(this.state);
    const mapScene = this;
    g.changeScene(new BattleScene(this.state, spec, (result) => mapScene._afterBattle(g, spec, result)));
  }
  _afterBattle(g, spec, result) {
    const state = this.state;
    const won = result.winner === 'atk';
    if (won) Rule.transferProvinceOwner(state, spec.toProvinceId, spec.campId, result.atkLeft);
    else state.provinces[spec.fromProvinceId].garrison = Math.max(0, Math.round(result.atkLeft));
    if (spec.generalId) Rule.recordContribution(state, spec.generalId, { won, provincesCaptured: won ? 1 : 0 });
    const c = state.camps[spec.campId];
    if (c) { if (won) c.battleWins = (c.battleWins || 0) + 1; else c.battleLosses = (c.battleLosses || 0) + 1; }
    save.set('autosave', state);
    g.changeScene(new MapScene(state));
  }
  _grantReward(g, genId) {
    const state = this.state, cost = 60;
    if (Rule.campGold(state, this.player) < cost) { this._notice({ jp: '金が足りません', en: 'Not enough gold.' }); return; }
    Rule.spendGold(state, this.player, cost);
    const gen = state.generals[genId];
    Rule.grantDirectReward(state, gen, Math.round(cost * 0.6));
    save.set('autosave', state);
    this._notice({ jp: `${gen.jp}に恩賞を与えた`, en: `Granted a reward to ${gen.en}.` });
  }

    save.set('autosave', this.state);
    this._notice(result.ok
      ? { jp: `${FACILITIES[facilityId].jp}を築いた`, en: `Built a ${FACILITIES[facilityId].en}.` }

  _courtAction(g, action) {
    const state = this.state, campId = this.player, courtId = this.courtTab;
    let opts = {};
    if (action === 'onsho') {
      const gens = Rule.campGenerals(state, campId).slice().sort((a, b) => b.landDesire - a.landDesire);
      if (!gens.length) { this._notice({ jp: '対象武将がいません', en: 'No general available.' }); return; }
      opts = { generalId: gens[0].id };
    }
    if (action === 'tobatsurei') {
      if (!this.sel || !state.provinces[this.sel].owner || state.provinces[this.sel].owner === campId) {
        this._notice({ jp: '地図で討伐対象の国（他勢力の国）を選んでください', en: 'Select a target province owned by another power on the map first.' });
        return;
      }
      opts = { targetCampId: state.provinces[this.sel].owner };
    }
    const result = Rule.courtPropose(state, campId, courtId, action, opts);
    save.set('autosave', state);
    this._notice(courtResultNotice(action, result));
  }
  _hireAkutou(g) {

  _akutouCommand(g, kind) {
    const state = this.state, campId = this.player;
    if (!this.sel) { this._notice({ jp: '地図で対象国を選んでください', en: 'Select a target province on the map first.' }); return; }
    const prov = state.provinces[this.sel];
    if (!prov.owner || prov.owner === campId) { this._notice({ jp: '他勢力の国を対象にしてください', en: 'Target must belong to another power.' }); return; }
    const result = Rule.akutouCommand(state, campId, kind, this.sel);
    save.set('autosave', state);
    if (!result.ok) {
      this._notice({ jp: '失敗: ' + result.reason, en: 'Failed: ' + result.reason });
      return;
    }
    this._notice(result.success
      ? { jp: `${AKUTOU_COMMANDS[kind].jp}に成功した`, en: `${AKUTOU_COMMANDS[kind].en} succeeded.` }
      : { jp: `${AKUTOU_COMMANDS[kind].jp}は失敗した（露見）`, en: `${AKUTOU_COMMANDS[kind].en} failed and was exposed.` });
    const target = DATA.provById[this.sel];
    this._showActionResult(`akutou-${kind}`, result.success ? {
      statusJp: '作戦成功', statusEn: 'OPERATION SUCCESS',
      copyJp: `${target ? target.jp : '敵国'}で${AKUTOU_COMMANDS[kind].jp}を敢行。${ACTION_ART_DEFS[`akutou-${kind}`].copy}`,
    } : {
      titleJp: `${AKUTOU_COMMANDS[kind].jp}、露見`, titleEn: `${AKUTOU_COMMANDS[kind].en} Exposed`,
      statusJp: '作戦失敗', statusEn: 'OPERATION FAILED', failed: true,
      copyJp: '企ては敵に察知され、悪党たちは追撃を逃れて散り散りとなった。朝廷との関係も悪化した。',
      copyEn: 'The plot was exposed. The irregulars scattered under pursuit, and relations with the court suffered.',

  _showActionResult(id, opts) {

      titleJp: extra.titleJp || def.jp,
      titleEn: extra.titleEn || def.en,
      statusJp: extra.statusJp || '実行完了',
      statusEn: extra.statusEn || 'ACTION COMPLETE',
      copyJp: extra.copyJp || def.copy,
      copyEn: extra.copyEn || def.copyEn || '',
      failed: !!extra.failed,
    };
    this.panel = null;

  _drawTopBar(ctx) {

    const myCourt = campCourtOf(state, this.player);

  _drawMap(ctx, g) {

    // ctx.scaleで拡大する。線幅・半径はズームで太らないよう毎回 /this.cam.zoom で相殺する。
    ctx.save();
    this._camApply(ctx);
    if (ASSETS_RT.mapReady) {
      const t = mapTransform(ML.map);
      ctx.save(); ctx.globalAlpha = 0.55;
      ctx.drawImage(ASSETS_RT.map, t.ox, t.oy, t.dw, t.dh);
      ctx.restore();
    }
    ctx.save(); ctx.strokeStyle = 'rgba(188,158,111,0.22)'; ctx.lineWidth = 1 / this.cam.zoom;
    const seen = new Set();
    for (const prov of DATA.provinces) {

      for (const nid of prov.adjacency) {
        const key = [prov.id, nid].sort().join('|');
        if (seen.has(key)) continue; seen.add(key);
        const np = DATA.provById[nid]; if (!np) continue;
        const b = provScreenXY(ML.map, np);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.restore();

      const r = (isSel ? 7 : isHover ? 6 : 4.5) / this.cam.zoom;

    }
    const myCourt = campCourtOf(this.state, this.player);

  /* 武将名鑑 / RosterPanel（spec 2.3節Should要件「年代記/史書ビュー」相当）。
   * genpei.htmlのRetsudenSceneと違い独立シーンにはせず、既存の記録パネルと並ぶ
   * コマンドバー項目として追加した（MapScene内の他パネルと実装パターンを揃えるため）。
   * 全200武将データ（GENERALS_DEF、camp不問）を3陣営列とページ送りで一覧し、選択した
   * 1名の詳細（肖像・経歴・現在の状態）を右側に表示する。 */
  _drawRosterPanel(ctx, g) {
    const r = PANEL_RECT, x = r.x + 24, w = r.w - 48;
    const listW = 660, listTop = r.y + 74, rowH = 21, headH = 20, colGap = 12;
    const colW = (listW - colGap * 2) / 3;
    const detailX = x + listW + 24, detailW = w - listW - 24;
    const p = g.input.pointer;
    txt(ctx, `全${GENERALS_DEF.length}名 / ${GENERALS_DEF.length} officers`, r.x + r.w - 78, r.y + 48, { font: '10px sans-serif', color: '#8b98ab', align: 'right' });
    // 3グループを各1列に分け、1ページ最大54名（各列18名）を表示する。
    const groupOf = (campId) => campId === 'ashikaga' ? 0 : campId === 'nancho' ? 1 : 2;
    const ashikagaLabel = factionInfo('ashikaga', this.state.scenarioId);
    const nanchoLabel = factionInfo('nancho', this.state.scenarioId);
    const groupLabel = [
      { jp: ashikagaLabel.jp, en: ashikagaLabel.en },
      { jp: nanchoLabel.jp, en: nanchoLabel.en },
      { jp: '地方勢力', en: 'Regional Houses' },
    ];
    const sorted = GENERALS_DEF.slice().sort((a, b) => {
      const ga = groupOf(a.camp), gb = groupOf(b.camp);
      return ga !== gb ? ga - gb : a.jp.localeCompare(b.jp, 'ja');
    });
    if (!this.rosterSel || !sorted.some((gg) => gg.id === this.rosterSel)) this.rosterSel = sorted[0].id;

    const groups = [0, 1, 2].map((grp) => sorted.filter((gg) => groupOf(gg.camp) === grp));
    const rowsPerPage = 18;
    const totalPages = Math.max(1, ...groups.map((rows) => Math.ceil(rows.length / rowsPerPage)));
    this.rosterPage = clamp(this.rosterPage || 0, 0, totalPages - 1);
    for (let grp = 0; grp < 3; grp++) {
      const colX = x + grp * (colW + colGap);
      txt(ctx, `${groupLabel[grp].jp} (${groups[grp].length})`, colX, listTop, { font: '600 11px "Hiragino Mincho ProN", serif', color: '#aeb9c8' });
      txt(ctx, ` ${groupLabel[grp].en}`, colX + 72, listTop + 1, { font: '9px sans-serif', color: '#64748b' });
      const groupGenerals = groups[grp].slice(this.rosterPage * rowsPerPage, (this.rosterPage + 1) * rowsPerPage);
      groupGenerals.forEach((gg, i) => {
        const y = listTop + headH + i * rowH;
        const liveGen = this.state.generals[gg.id];
        const dead = !!(liveGen && liveGen.dead);
        const unborn = !!(liveGen && liveGen.unborn);
        const row = { x: colX, y, w: colW, h: rowH, onClick: () => { this.rosterSel = gg.id; } };
        this.buttons.push(row);
        const on = this.rosterSel === gg.id;
        if (on || hit(row, p)) frame(ctx, row.x, row.y, row.w, row.h, { fill: on ? 'rgba(34,211,238,0.16)' : 'rgba(255,255,255,0.05)', stroke: 'transparent' });
        drawKamon(ctx, gg.camp, row.x + 9, row.y + rowH / 2, 6);
        const prefix = dead ? '† ' : unborn ? '◇ ' : '';
        txt(ctx, `${prefix}${gg.jp}`, row.x + 20, row.y + 3, {
          font: `${on ? '600 ' : ''}11.5px "Hiragino Mincho ProN", serif`,
          color: dead ? '#64748b' : unborn ? '#7f8aa0' : '#e2e8f0',
        });
      });
    }

    const pagerY = listTop + headH + rowsPerPage * rowH + 10;
    const prev = { x, y: pagerY, w: 112, h: 34, jp: '前の頁', en: 'Previous', disabled: this.rosterPage === 0, onClick: () => { this.rosterPage -= 1; } };
    const next = { x: x + listW - 112, y: pagerY, w: 112, h: 34, jp: '次の頁', en: 'Next', disabled: this.rosterPage >= totalPages - 1, onClick: () => { this.rosterPage += 1; } };
    this.buttons.push(prev, next);
    button(ctx, prev, hit(prev, p) && !prev.disabled);
    button(ctx, next, hit(next, p) && !next.disabled);
    txt(ctx, `${this.rosterPage + 1} / ${totalPages}`, x + listW / 2, pagerY + 9, { font: '12px sans-serif', color: '#b7c1cf', align: 'center' });

    const def = GENERALS_DEF.find((gg) => gg.id === this.rosterSel);
    const live = this.state.generals[this.rosterSel];
    const portSize = 108;
    drawGeneralPortrait(ctx, def, detailX, listTop, portSize);
    const infoX = detailX + portSize + 20;
    let dy = listTop;
    txt(ctx, def.jp, infoX, dy, { font: '600 20px "Hiragino Mincho ProN", serif', color: '#e2e8f0' }); dy += 28;

      frame(ctx, W / 2 - 200, BL.board.y + BL.board.h - 44, 400, 30, { fill: 'rgba(34,211,238,0.16)', stroke: 'rgba(34,211,238,0.5)' });
      txt(ctx, this.notice.jp + ' / ' + this.notice.en, W / 2, BL.board.y + BL.board.h - 36, { font: '12px sans-serif', color: '#e2e8f0', align: 'center' });
    }
    if (this.result) {
      ctx.fillStyle = 'rgba(5,7,11,0.86)'; ctx.fillRect(0, 0, W, H);
      const won = this.result.winner === this.playerSide;
      txt(ctx, won ? '勝  利' : '敗  退', W / 2, H / 2 - 70, { font: '600 46px "Hiragino Mincho ProN", serif', color: won ? '#22d3ee' : '#94a3b8', align: 'center' });
      txt(ctx, this.result.why + ' / ' + this.result.whyEn, W / 2, H / 2 + 4, { font: '15px sans-serif', color: '#94a3b8', align: 'center' });
      txt(ctx, this.spec.historicalEvent ? 'クリックして歴史の結末を確認 / Click to confirm the historical outcome' : 'クリックして全国マップへ戻る / Click to return to the map', W / 2, H / 2 + 40, { font: '12px sans-serif', color: '#6b7787', align: 'center' });
    }
  }
  _drawSide(ctx, g) {
    frame(ctx, BL.side.x, BL.side.y, BL.side.w, BL.side.h, { fill: 'rgba(10,14,22,0.85)' });
    let y = BL.side.y + 14;
    const x = BL.side.x + 14, w = BL.side.w - 28;
    const atkLabel = campLabelOf(this.state, this.b.atkCampId);
    const defLabel = this.b.defCampId ? campLabelOf(this.state, this.b.defCampId) : { jp: '在地勢力', en: 'Local Forces' };
    const atkTotal = this.b.units.filter((u) => u.side === 'atk').reduce((sum, u) => sum + u.troops, 0);
    const defTotal = this.b.units.filter((u) => u.side === 'def').reduce((sum, u) => sum + u.troops, 0);
    frame(ctx, x, y, w, 72, { fill: 'rgba(0,0,0,0.24)', stroke: 'rgba(148,163,184,0.22)', radius: 4 });
    ctx.fillStyle = campColorOf(this.b.atkCampId); ctx.fillRect(x, y, 5, 32);
    txt(ctx, `攻撃側　${atkLabel.jp}`, x + 14, y + 5, { font: '600 12px "Hiragino Mincho ProN", serif', color: campColorOf(this.b.atkCampId) });
    txt(ctx, `兵力 ${atkTotal}`, x + w - 8, y + 5, { font: '600 11px sans-serif', color: '#e2e8f0', align: 'right' });
    txt(ctx, `Attacker: ${atkLabel.en}`, x + 14, y + 21, { font: '9px sans-serif', color: '#94a3b8' });
    ctx.fillStyle = campColorOf(this.b.defCampId || 'independent'); ctx.fillRect(x, y + 38, 5, 32);
    txt(ctx, `守備側　${defLabel.jp}`, x + 14, y + 43, { font: '600 12px "Hiragino Mincho ProN", serif', color: campColorOf(this.b.defCampId || 'independent') });
    txt(ctx, `兵力 ${defTotal}`, x + w - 8, y + 43, { font: '600 11px sans-serif', color: '#e2e8f0', align: 'right' });
    txt(ctx, `Defender: ${defLabel.en}`, x + 14, y + 59, { font: '9px sans-serif', color: '#94a3b8' });
    y += 88;
    txt(ctx, '兵科三すくみ / Unit Triangle', x, y, { font: '600 12px "Hiragino Mincho ProN", serif', color: '#22d3ee' }); y += 20;
    txt(ctx, '騎馬>弓 ／ 弓>徒歩 ／ 徒歩>騎馬 ／ 薙刀は騎馬に特効', x, y, { font: '11px sans-serif', color: '#94a3b8' }); y += 26;
    if (this.sel) {
      txt(ctx, `選択中: ${UNITS[this.sel.type].jp} / ${UNITS[this.sel.type].en}`, x, y, { font: '13px "Hiragino Mincho ProN", serif', color: '#e2e8f0' }); y += 20;
      txt(ctx, `兵 ${this.sel.troops}/${this.sel.max} ・ 士気 ${Math.round(this.sel.morale)}`, x, y, { font: '12px sans-serif', color: '#a78bfa' }); y += 24;
    } else {
      txt(ctx, '自軍の隊をクリックして選択 / Click one of your units to select it', x, y, { font: '12px sans-serif', color: '#64748b' }); y += 24;
    }
    y += 8;
    txt(ctx, '部隊一覧 / Units', x, y, { font: '600 12px "Hiragino Mincho ProN", serif', color: '#22d3ee' }); y += 20;
    for (const u of this.b.units) {
      if (u.troops <= 0) continue;
      const label = `${u.side === 'atk' ? '寄手' : '守備'} ${UNITS[u.type].jp} ${u.troops}`;
      txt(ctx, label, x, y, { font: '11px sans-serif', color: u.side === 'atk' ? '#22d3ee' : '#f59e0b' }); y += 16;
    }
  }
  _drawLog(ctx) {
    frame(ctx, BL.log.x, BL.log.y, BL.log.w, BL.log.h, { fill: 'rgba(10,14,22,0.78)' });
    let y = BL.log.y + 8;
    for (const line of this.b.log.slice(0, 5)) { txt(ctx, line, BL.log.x + 12, y, { font: '11px "Hiragino Mincho ProN", serif', color: '#dbe4ee' }); y += 17; }
  }
}

game.changeScene(new BootScene());
game.start();

  CutsceneScene, EndingScene, ENDING_TEXTS, fallbackEndingText,
